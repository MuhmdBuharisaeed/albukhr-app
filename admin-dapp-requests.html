<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR Admin – dApp Requests</title>
<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  margin-right:6px;
  font-size:12px;
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#eee;color:#333}

.btn.approved{
  background:#0f7a3d;
  color:#fff;
  cursor:default;
}
.btn.rejected{
  background:#b02a37;
  color:#fff;
  cursor:default;
}
.btn.disabled{
  opacity:.6;
  pointer-events:none;
}
.meta{
  font-size:12px;
  color:#555;
  margin-top:6px;
}
.desc{
  margin-top:8px;
  font-size:12px;
  color:#333;
  line-height:1.6;
  background:#f7f9f8;
  padding:8px;
  border-radius:8px;
}
.empty{
  font-size:13px;
  color:#777;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">ALBUKHR • Admin</h1>
</header>

<section class="section">
  <h3>🛠 dApp Requests Review</h3>
  <div id="adminList"></div>
</section>

<script>
const listBox = document.getElementById("adminList");
let list = JSON.parse(
  localStorage.getItem("albukhr_dapp_requests")
) || [];

function render(){
  listBox.innerHTML = "";

  if(list.length === 0){
    listBox.innerHTML =
      `<div class="empty">No dApp requests yet</div>`;
    return;
  }

  list.forEach((r,i)=>{
    listBox.innerHTML += `
      <div class="card">
        <strong>${r.projectName}</strong>

        <div class="meta">
          👤 ${r.piUser} <br>
          🛠 ${r.serviceType}
        </div>

        <div class="desc">
          <strong>Description:</strong><br>
          ${r.description || "—"}
        </div>

        <div style="margin-top:10px">
          ${
            r.status === "pending"
            ? `
              <button class="approve"
                onclick="setStatus(${i}, 'approved')">
                Approve
              </button>
              <button class="reject"
                onclick="setStatus(${i}, 'rejected')">
                Reject
              </button>
            `
            : r.status === "approved"
            ? `
              <button class="btn approved disabled">
                ✓ Approved
              </button>
              <button class="btn disabled">
                Reject
              </button>
            `
            : `
              <button class="btn disabled">
                Approve
              </button>
              <button class="btn rejected disabled">
                ✗ Rejected
              </button>
            `
          }
        </div>
      </div>
    `;
  });
}

function setStatus(index,status){
  if(list[index].status !== "pending") return;

  list[index].status = status;
  list[index].reviewedAt = Date.now();

  localStorage.setItem(
    "albukhr_dapp_requests",
    JSON.stringify(list)
  );

  render();
}

render();
</script>

</body>
</html>
