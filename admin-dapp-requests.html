<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – dApp Requests</title>
<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#eee}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">ALBUKHR • Admin</h1>
</header>

<section class="section">
<h3>🛠 dApp Requests Review</h3>
<div id="adminList"></div>
</section>

<script>
const listBox = document.getElementById("adminList");
let list =
  JSON.parse(localStorage.getItem("albukhr_dapp_requests")) || [];

function render(){
  listBox.innerHTML = "";
  list.forEach((r,i)=>{
    listBox.innerHTML += `
      <div class="card">
        <strong>${r.projectName}</strong><br>
<small>👤 ${r.piUser}</small><br>
<small>🛠 ${r.serviceType}</small>

<div style="margin-top:8px;font-size:12px;color:#444">
  <strong>Description:</strong><br>
  ${r.description || "—"}
</div>

<td>

  ${
    r.status === "pending"
    ? `
      <button class="btn approve"
        onclick="approveRequest('${r.id}')">
        Approve
      </button>

      <button class="btn reject"
        onclick="rejectRequest('${r.id}')">
        Reject
      </button>
    `
    : r.status === "approved"
    ? `
      <button class="btn approved disabled">
        ✓ Approved
      </button>

      <button class="btn disabled">
        Reject
      </button>
    `
    : `
      <button class="btn disabled">
        Approve
      </button>

      <button class="btn rejected disabled">
        ✗ Rejected
      </button>
    `
  }

</td>

function setStatus(i,status){
  list[i].status = status;
  localStorage.setItem(
    "albukhr_dapp_requests",
    JSON.stringify(list)
  );
  render();
}

render();
</script>

</body>
</html>
