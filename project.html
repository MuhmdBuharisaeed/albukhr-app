<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/global-core.css">
<link rel="stylesheet" href="css/global-layout.css">
<link rel="stylesheet" href="css/global-components.css">
<link rel="stylesheet" href="css/global-style.css"><!-- ===============================
PI SDK
=============================== --><script src="https://sdk.minepi.com/pi-sdk.js"></script><script>
Pi.init({
  version:"2.0",
  sandbox:true
});
</script><!-- ===============================
AUTH GUARD
=============================== --><script>
(function(){
  const user = JSON.parse(localStorage.getItem("pi_user") || "null");
  if(!user){
    window.location.href = "login.html";
  }
})();
</script></head><body><header class="header">
  <div class="header-left">
    <span id="projectTitle"></span>
  </div>
  <div class="header-right" onclick="openInfo()">ℹ️</div>
</header><div class="fixed-section"><div class="stats"><div class="stat-card">
<span>Your Stake</span>
<strong id="aStake">0.00 Pi</strong>
<div id="stakeStatus" style="font-size:12px;color:#666;margin-top:4px"></div>
</div><div class="stat-card">
<span>Your Reward</span>
<strong id="aReward">0.00 Pi</strong>
</div></div><div class="short-info" id="projectDescription"></div><div class="btns">
<button class="btn primary" onclick="openModal()">Stake</button>
<button class="btn secondary" onclick="openWithdrawModal()">💸 Withdraw Rewards</button>
</div><div class="capital-wrapper">
<button class="btn capital-btn" onclick="openCapitalModal()">🏦 Withdraw Capital</button>
</div><div class="scroll-area">
<h3 id="txTitle">Transaction History</h3>
<div id="projectHistory"></div>
</div></div><!-- ===============================
MODALS (UNCHANGED CORE)
=============================== --><div class="modal" id="stakeModal">
<div class="modal-box">
<h3 id="stakeTitle"></h3><label>Amount (Pi)</label>
<input type="number" id="amountInput">

<small id="minHint"></small>

<label>Duration</label>
<select id="durationSelect"></select>

<div class="btns">
<button class="btn primary" onclick="confirmStake()">Confirm</button>
<button class="btn secondary" onclick="closeModal()">Cancel</button>
</div>
</div>
</div><div class="modal" id="successModal">
<div class="modal-box success">
<h3>Stake Successful</h3>
<p id="successText"></p>
<button class="btn primary" onclick="closeSuccess()">OK</button>
</div>
</div><div class="modal" id="infoModal">
<div class="modal-box">
<h3 id="infoTitle"></h3>
<p id="infoText"></p>
<button class="btn secondary" onclick="closeInfo()">Close</button>
</div>
</div><!-- ===============================
SCRIPTS
=============================== --><script src="js/project-config.js"></script><script src="js/unified-transactions.js"></script><script src="js/albukhr-transaction-engine.js"></script><script src="smart-liquidity-engine.js"></script><script src="staking.js"></script><script src="wallet-core.js"></script><script>

/* ===============================
CONFIG
=============================== */
const params = new URLSearchParams(window.location.search);
const PROJECT_NAME = params.get("project") || "Azman";
const CONFIG = getProjectConfig(PROJECT_NAME);

document.title = `${CONFIG.title} • ALBUKHR`;
projectTitle.innerText = `${CONFIG.icon} ${CONFIG.title}`;
projectDescription.innerText = CONFIG.desc;
infoTitle.innerText = `About ${CONFIG.title}`;
infoText.innerText = CONFIG.info;
stakeTitle.innerText = `Stake in ${CONFIG.title}`;
txTitle.innerText = `${CONFIG.title} Transactions`;

/* ===============================
MODALS
=============================== */
function openModal(){
  amountInput.value = "";
  minHint.innerText = `Minimum stake: ${getMinStake(PROJECT_NAME)} Pi`;
  durationSelect.innerHTML = "";

  CONFIG.durations.forEach(d=>{
    const opt = document.createElement("option");
    opt.value = d;
    opt.innerText = d + " Days";
    durationSelect.appendChild(opt);
  });

  stakeModal.style.display="flex";
}

function closeModal(){ stakeModal.style.display="none"; }
function closeSuccess(){ successModal.style.display="none"; }
function openInfo(){ infoModal.style.display="flex"; }
function closeInfo(){ infoModal.style.display="none"; }

/* ===============================
SAFE STAKE (PI)
=============================== */
async function confirmStake(){

const user = JSON.parse(localStorage.getItem("pi_user") || "null");
if(!user){
  alert("Login required");
  window.location.href = "login.html";
  return;
}

if(!hasMinimumLiquidity(PROJECT_NAME)){
  alert("Project liquidity not ready");
  return;
}

const amount = Number(amountInput.value);
const duration = Number(durationSelect.value);
const min = getMinStake(PROJECT_NAME);

if(!amount || amount < min){
  alert("Minimum stake is " + min + " Pi");
  return;
}

/* lock button */
const btn = document.querySelector("#stakeModal .primary");
btn.disabled = true;
btn.innerText = "Processing...";

/* call staking engine */
const res = await addStake({
  project: PROJECT_NAME,
  amount,
  duration
});

if(res.success){

successText.innerText =
`You staked ${amount} Pi for ${duration} days`;

closeModal();
successModal.style.display="flex";

load();

}else{
alert(res.error || "Stake failed");
}

btn.disabled = false;
btn.innerText = "Confirm";
}

/* ===============================
LOAD
=============================== */
function load(){

const data = getProjectTotals(PROJECT_NAME);

let totalStake = 0;
let reward = 0;

data.stakes.forEach(s=>{
totalStake += Number(s.amount)||0;

const remaining =
(Number(s.reward)||0) -
(Number(s.withdrawnReward)||0);

reward += Math.max(0, remaining);
});

aStake.innerText = totalStake.toFixed(2)+" Pi";
aReward.innerText = reward.toFixed(2)+" Pi";

renderHistory();
updateStakeStatus();
}

/* ===============================
HISTORY
=============================== */
function renderHistory(){

projectHistory.innerHTML="";

const txs = getTransactions()
.filter(tx=>tx.project===PROJECT_NAME)
.sort((a,b)=>b.timestamp-a.timestamp);

if(!txs.length){
projectHistory.innerHTML="<div>No transactions yet</div>";
return;
}

txs.forEach(tx=>{

const div = document.createElement("div");
div.className="project-tx";

div.innerHTML = `
<div>${tx.type.toUpperCase()}</div>
<div>${Number(tx.amount).toFixed(2)} Pi</div>
`;

projectHistory.appendChild(div);

});
}

/* ===============================
STATUS
=============================== */
function updateStakeStatus(){

const data = getProjectTotals(PROJECT_NAME);

let locked=0, unlocked=0;
const now = Date.now();

data.stakes.forEach(s=>{
if(now >= (s.unlockTime||0)){
unlocked += Number(s.amount)||0;
}else{
locked += Number(s.amount)||0;
}
});

stakeStatus.innerText =
`Locked: ${locked.toFixed(2)} • Unlocked: ${unlocked.toFixed(2)}`;
}

/* ===============================
INIT
=============================== */
load();
setInterval(updateStakeStatus,1000);

</script></body>
</html>
