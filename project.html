<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project | ALBUKHR</title>
<meta name="theme-color" content="#0f7a3d">
<style>
:root{--g:#0f7a3d;--bg:#f4f7f5;--card:#fff;--tx:#173024;--mut:#68776f;--bd:#dce6df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 90px}
a{color:var(--g);font-weight:700;text-decoration:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-top:16px}
.hero{display:flex;gap:16px;align-items:center}
.logo{width:88px;height:88px;border-radius:16px;object-fit:cover;border:1px solid var(--bd);background:#f0f3f1}
h1{margin:0 0 6px;font-size:28px}
.code{color:var(--mut);font-size:13px}
.badge{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#eaf6ee;color:var(--g);font-size:11px;font-weight:800}
.desc{color:var(--mut);line-height:1.6;margin-top:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.metric{background:#f7faf8;border-radius:12px;padding:12px}
.metric span{display:block;color:var(--mut);font-size:11px}
.metric strong{display:block;margin-top:5px}
.note{margin-top:18px;padding:13px;border-radius:12px;background:#eef6f1;color:#29583f;line-height:1.5}
.error{margin-top:16px;padding:14px;border-radius:12px;background:#fff0ee;color:#9c2a1f}
@media(max-width:560px){.hero{align-items:flex-start}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<a href="index.html">Back to ALBUKHR Home</a>
<section class="card">
  <div class="hero">
    <img id="projectLogo" class="logo" alt="" hidden>
    <div>
      <h1 id="projectName">Loading project...</h1>
      <div id="projectCode" class="code"></div>
      <span id="projectStatus" class="badge">CHECKING</span>
    </div>
  </div>
  <p id="projectDescription" class="desc">Loading authoritative project data...</p>
  <div class="grid">
    <div class="metric"><span>Type</span><strong id="projectType">—</strong></div>
    <div class="metric"><span>Network</span><strong id="projectNetwork">—</strong></div>
    <div class="metric"><span>Core Slot</span><strong id="projectSlot">—</strong></div>
    <div class="metric"><span>Liquidity</span><strong id="projectLiquidity">—</strong></div>
    <div class="metric"><span>Investors</span><strong id="projectInvestors">—</strong></div>
  </div>
  <div id="lifecycleNote" class="note">Checking project lifecycle...</div>
  <div id="projectError" class="error" hidden></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core/environment-core.js"></script>
<script src="js/core/supabase-core.js"></script>
<script src="js/project.js"></script>
</body>
</html>
