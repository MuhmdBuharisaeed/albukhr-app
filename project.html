<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/global-core.css">
<link rel="stylesheet" href="css/global-layout.css">
<link rel="stylesheet" href="css/global-components.css">
<link rel="stylesheet" href="css/global-style.css">
</head>

<body>

<header class="header">
  <div class="header-left">
    <span id="projectTitle"></span>
  </div>
  <div class="header-right" onclick="openInfo()">ℹ️</div>
</header>

<div class="fixed-section">

  <div class="stats">

<div class="stat-card">
<span>Your Stake</span>
<strong id="aStake">0.00 Pi</strong>

<div id="stakeStatus"
style="font-size:12px;color:#666;margin-top:4px">
</div>

</div>

<div class="stat-card">
<span>Your Reward</span>
<strong id="aReward">0.00 Pi</strong>
</div>

  </div>

  <div class="short-info" id="projectDescription"></div>

  <div class="btns">
<button class="btn primary" onclick="openModal()">
Stake
</button>

<button class="btn secondary" onclick="openWithdrawModal()">
💸 Withdraw Rewards
</button>
</div>

<div class="capital-wrapper">
<button class="btn capital-btn" onclick="openCapitalModal()">
🏦 Withdraw Capital
</button>
</div>

<div class="scroll-area">

  <div class="scroll-area">
    <h3 id="txTitle" style="margin-bottom:10px;font-size:15px">
Transaction History
    </h3>
    <div id="projectHistory"></div>
  </div>

</div>

<!-- STAKE MODAL -->
<div class="modal" id="stakeModal">
  <div class="modal-box">
    <h3 id="stakeTitle"></h3>

    <label>Amount (Pi)</label>
    <input type="number" id="amountInput">

    <small id="minHint"></small>

    <label>Duration</label>
    <select id="durationSelect"></select>

    <div class="btns">
      <button class="btn primary" onclick="confirmStake()">Confirm</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">
  <div class="modal-box success">
    <h3>Stake Successful</h3>
    <p id="successText"></p>
    <button class="btn primary" onclick="closeSuccess()">OK</button>
  </div>
</div>

<!-- INFO MODAL -->
<div class="modal" id="infoModal">
  <div class="modal-box">
    <h3 id="infoTitle"></h3>
    <p id="infoText"></p>
    <button class="btn secondary" onclick="closeInfo()">Close</button>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div class="modal" id="withdrawModal">
  <div class="modal-box">
    <h3>Withdraw Rewards</h3>

    <label>Amount</label>
    <input type="number" id="withdrawAmount">

    <small id="availableBalance"></small>

    <div style="font-size:12px;color:#666;margin-top:6px">
Fee (1%): 
<strong id="withdrawFee">0.00 Pi</strong>
</div>

<div style="font-size:12px;color:#666">
You Receive: 
<strong id="withdrawReceive">0.00 Pi</strong>
</div>
    
    <label>Wallet Address</label>
    <input type="text" id="walletAddress">

    <div class="btns">
      <button class="btn primary" onclick="confirmWithdraw()">Confirm</button>
      <button class="btn secondary" onclick="closeWithdraw()">Cancel</button>
    </div>
  </div>
</div>

<!-- CAPITAL WITHDRAW MODAL -->
<div class="modal" id="capitalModal">
<div class="modal-box">

<h3>Withdraw Capital</h3>

<label>Amount</label>
<input type="number" id="capitalWithdrawAmount">

<small id="capitalAvailable"></small>

<div style="font-size:12px;color:#666;margin-top:6px">
Fee (1%): 
<strong id="capitalWithdrawFee">0.00 Pi</strong>
</div>

<div style="font-size:12px;color:#666">
You Receive: 
<strong id="capitalWithdrawReceive">0.00 Pi</strong>
</div>

<label>Wallet Address</label>
<input type="text" id="capitalWallet">

<div class="btns">
<button class="btn primary"
onclick="confirmCapitalWithdraw()">
Confirm
</button>

<button class="btn secondary"
onclick="closeCapitalModal()">
Cancel
</button>
</div>

</div>
</div>
  
<!-- SCRIPTS -->
<script src="js/project-config.js"></script>
<script src="js/unified-transactions.js"></script>
<script src="js/albukhr-transaction-engine.js"></script>
<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

/* ===============================
   CONFIG LOAD
=============================== */
const params = new URLSearchParams(window.location.search);
const PROJECT_NAME = params.get("project") || "Azman";
const CONFIG = getProjectConfig(PROJECT_NAME);
txTitle.innerText =
`${CONFIG.title} Transactions`;

/* ===============================
   INIT UI
=============================== */
document.title =
`${CONFIG.title} • ALBUKHR`;

projectTitle.innerText =
  `${CONFIG.icon} ${CONFIG.title}`;

projectDescription.innerText = CONFIG.desc;

infoTitle.innerText = `About ${CONFIG.title}`;
infoText.innerText = CONFIG.info;

stakeTitle.innerText = `Stake in ${CONFIG.title}`;

/* ===============================
   DOM
=============================== */
const projectHistory = document.getElementById("projectHistory");

/* ===============================
   MODALS
=============================== */
function openModal(){

  amountInput.value = "";

  minHint.innerText =
    `Minimum stake: ${getMinStake(PROJECT_NAME)} Pi`;

  durationSelect.innerHTML = "";

  CONFIG.durations.forEach(d=>{
    const opt = document.createElement("option");
    opt.value = d;
    opt.innerText = d + " Days";
    durationSelect.appendChild(opt);
  });

  stakeModal.style.display="flex";
}

function closeModal(){ stakeModal.style.display="none"; }
function closeSuccess(){ successModal.style.display="none"; }
function openInfo(){ infoModal.style.display="flex"; }
function closeInfo(){ infoModal.style.display="none"; }

function openWithdrawModal(){

  const data = getProjectTotals(PROJECT_NAME);

  let total = 0;
  data.stakes.forEach(s=>{
    const remaining =
  (Number(s.reward) || 0) -
  (Number(s.withdrawnReward) || 0);

total += Math.max(0, remaining);
  });

  availableBalance.innerText =
    "Available: " + total.toFixed(2) + " Pi";

  withdrawModal.style.display="flex";
}

function closeWithdraw(){
  withdrawModal.style.display="none";
}

/* ===============================
   STAKE
=============================== */
function confirmStake(){

const amount = Number(amountInput.value);
const duration = Number(durationSelect.value);
const min = getMinStake(PROJECT_NAME);

if(!amount || amount < min){
alert("Minimum stake is " + min + " Pi");
return;
}

/* ===============================
CREATE LOCK TIME
=============================== */

const startTime = Date.now();

const unlockTime =
startTime + (duration * 86400000);

/* ===============================
ADD STAKE
=============================== */

const ok = addStake({
project: PROJECT_NAME,
amount,
duration,
startTime,
unlockTime
});

if(!ok){
alert("Stake failed.");
return;
}

successText.innerText =
`You staked ${amount} Pi for ${duration} days in ${CONFIG.title}.`;

closeModal();
successModal.style.display="flex";

load();

  }

/* ===============================
   LOAD
=============================== */
function load(){

const data = getProjectTotals(PROJECT_NAME);

let reward = 0;
data.stakes.forEach(s=>{
const remaining =
(Number(s.reward) || 0) -
(Number(s.withdrawnReward) || 0);

reward += Math.max(0, remaining);
});

aStake.innerText =
(data.stake || 0).toFixed(2) + " Pi";

aReward.innerText =
reward.toFixed(2) + " Pi";

renderHistory();

/* ADD THIS */
updateStakeStatus();

}

/* ===============================
SHORT WALLET
=============================== */
function shortWallet(address){

if(!address) return "";

return address.slice(0,6)
+ "..."
+ address.slice(-4);

 }

/* ===============================
   HISTORY (UNIFIED)
=============================== */
function renderHistory(){

  projectHistory.innerHTML = "";

  const txs = getTransactions()
    .filter(tx => tx.project === PROJECT_NAME)
    .sort((a,b)=>
      (b.timestamp || 0) - (a.timestamp || 0)
    );

  if(!txs.length){
    projectHistory.innerHTML = `
      <div style="text-align:center;padding:20px;color:#777">
        ${CONFIG.icon}
        <br><br>
        No transactions yet
      </div>
    `;
    return;
  }

  txs.forEach(tx=>{

    let icon = CONFIG.icon;
    let label = "Stake";
    let sign = "+";
    let color = "success-status";

    if(tx.type === "withdraw"){
      icon = "💸";
      label = "Withdraw";
      sign = "-";
      color = "withdraw-status";
    }

    if(tx.type === "reward"){
      icon = "🎁";
      label = "Reward";
    }
    
    if(tx.type === "capital"){
      icon = "🏦";
      label = "Capital";
      sign = "-";
      color = "withdraw-status";
    }

    const div = document.createElement("div");
div.className="project-tx";

div.innerHTML = `
<div class="project-icon">${icon}</div>

<div class="project-body">

<div class="project-title">${label}</div>

${tx.wallet ? `
<div style="font-size:11px;color:#666">
Wallet: ${shortWallet(tx.wallet)}
</div>
` : ""}

<div class="project-date">
${new Date(tx.timestamp).toLocaleString()}
</div>

</div>

<div class="project-right">
<div class="project-amount ${color}">
${sign}${Number(tx.amount).toFixed(2)} Pi
</div>
</div>
`;

projectHistory.appendChild(div);

  });

  }

/* ===============================
   WITHDRAW
=============================== */
function confirmWithdraw(){

  const amount = Number(withdrawAmount.value);
  const wallet = walletAddress.value;

  if(!amount || amount <= 0){
    alert("Invalid amount");
    return;
  }

  if(!wallet){
    alert("Enter wallet address");
    return;
  }

  const data = getProjectTotals(PROJECT_NAME);

  let total = 0;
  data.stakes.forEach(s=>{
    total += Number(s.remainingReward) || 0;
  });

  if(amount > total){
    alert("Insufficient balance");
    return;
  }

  let remaining = amount;

  data.stakes.forEach(s=>{
    if(remaining <= 0) return;

    let r =
  (Number(s.reward) || 0) -
  (Number(s.withdrawnReward) || 0);

    if(r > 0){
      let take = Math.min(r, remaining);
      withdrawStakeReward(s.id, take);
      remaining -= take;
    }
  });

  recordTx({
type:"withdraw",
project:PROJECT_NAME,
amount,
wallet: wallet,
timestamp:Date.now()
});

  /* CLEAR WALLET */
  walletAddress.value = "";

  closeWithdraw();
  load();
  }

/* ===============================
REWARDS WITHDRAW FEE
=============================== */
  const withdrawAmount =
document.getElementById("withdrawAmount");

if(withdrawAmount){

withdrawAmount.addEventListener("input", function(){

const amount =
Number(this.value)||0;

const fee =
amount * 0.01;

const receive =
amount - fee;

document.getElementById("withdrawFee")
.innerText =
fee.toFixed(2) + " Pi";

document.getElementById("withdrawReceive")
.innerText =
receive.toFixed(2) + " Pi";

});

}

/* ===============================
CAPITAL WITHDRAW FEE
=============================== */

const capitalWithdrawAmount =
document.getElementById("capitalWithdrawAmount");

if(capitalWithdrawAmount){

capitalWithdrawAmount.addEventListener("input", function(){

const amount =
Number(this.value)||0;

const fee =
amount * 0.01;

const receive =
amount - fee;

document.getElementById("capitalWithdrawFee")
.innerText =
fee.toFixed(2) + " Pi";

document.getElementById("capitalWithdrawReceive")
.innerText =
receive.toFixed(2) + " Pi";

});

}
  
/* ===============================
CAPITAL WITHDRAW
=============================== */

function withdrawCapital(){

const data =
getProjectTotals(PROJECT_NAME);

const now = Date.now();

/* unlocked stakes only */

const unlocked =
data.stakes.filter(s =>
Number(s.amount) > 0 &&
now >= (s.unlockTime || 0)
);

if(!unlocked.length){

alert("Capital locked until duration ends");
return;

}

let total = 0;

unlocked.forEach(s=>{

const amount =
Number(s.amount) || 0;

total += amount;

/* reduce stake */

s.amount = 0;

});

/* save */

saveProjectStakes(
PROJECT_NAME,
data.stakes
);

recordTx({
type:"capital",
project:PROJECT_NAME,
amount:total,
wallet:"Internal",
timestamp:Date.now()
});

alert(
"Capital Withdrawn: "
+ total.toFixed(2)
+ " Pi"
);

load();

  }

  function saveProjectStakes(project, stakes){

const all =
JSON.parse(
localStorage.getItem("albukhr_stakes")
) || [];

const updated =
all.map(s => {

if(s.project === project){

const found =
stakes.find(
x => x.id === s.id
);

return found || s;

}

return s;

});

localStorage.setItem(
"albukhr_stakes",
JSON.stringify(updated)
);

}

function openCapitalModal(){

const data =
getProjectTotals(PROJECT_NAME);

let total = 0;

data.stakes.forEach(s=>{

if(Date.now() >= (s.unlockTime||0)){
total += Number(s.amount)||0;
}

});

capitalAvailable.innerText =
"Available: " + total.toFixed(2) + " Pi";

capitalModal.style.display="flex";

}

function closeCapitalModal(){

capitalModal.style.display="none";

  }

function confirmCapitalWithdraw(){

const amount =
Number(capitalWithdrawAmount.value);

const wallet =
capitalWallet.value;

if(!amount || amount <= 0){
alert("Invalid amount");
return;
}

if(!wallet){
alert("Enter wallet address");
return;
}

const fee = amount * 0.01;
const receive = amount - fee;

const data =
getProjectTotals(PROJECT_NAME);

let remaining = amount;

data.stakes.forEach(s=>{

if(remaining <= 0) return;

if(Date.now() >= (s.unlockTime||0)){

let available =
Number(s.amount)||0;

let take =
Math.min(available, remaining);

s.amount -= take;

remaining -= take;

}

});

saveProjectStakes(
PROJECT_NAME,
data.stakes
);

recordTx({

type:"capital",
project:PROJECT_NAME,
amount:receive,
fee:fee,
wallet:wallet,
timestamp:Date.now()

});

closeCapitalModal();

load();

  }

function updateStakeStatus(){

const data =
getProjectTotals(PROJECT_NAME);

let locked = 0;
let unlocked = 0;

const now = Date.now();

data.stakes.forEach(s=>{

const amount =
Number(s.amount)||0;

if(now >= (s.unlockTime||0)){
unlocked += amount;
}else{
locked += amount;
}

});

let text = "";

if(locked > 0){

text +=
"Locked: " +
locked.toFixed(2) +
" Pi";

}

if(unlocked > 0){

text +=
" • Unlocked: " +
unlocked.toFixed(2) +
" Pi";

}

document.getElementById("stakeStatus")
.innerText = text;

  }

/* ===============================
   INIT
=============================== */
load();

</script>

</body>
      </html>
