<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR TEST PAYMENT</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box{
  width:320px;
  background:#1e293b;
  padding:24px;
  border-radius:16px;
  text-align:center;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border-radius:10px;
  border:none;
}
</style>
</head>
<body>

<div class="box">
  <h2>ALBUKHR TESTNET</h2>

  <input type="number" id="amount" placeholder="Amount in Pi" value="1">

  <button onclick="pay()">
    Test Payment
  </button>
</div>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>

Pi.init({
  version: "2.0",
  sandbox: true
});

async function pay(){

  try{

    const auth = await Pi.authenticate(
      ["payments"],
      function(payment){
        console.log(payment);
      }
    );

    console.log("AUTH:", auth);

    const amount = Number(document.getElementById("amount").value);

    Pi.createPayment({

      amount: amount,
      memo: "ALBUKHR TEST PAYMENT",
      metadata: {
        type: "test"
      }

    }, {

      onReadyForServerApproval: async function(paymentId){

        console.log("APPROVING:", paymentId);

        const res = await fetch(
          "https://albukhr-api-production.up.railway.app/approve-payment",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ paymentId })
          }
        );

        const data = await res.json();

        console.log("APPROVE RESPONSE:", data);
      },

      onReadyForServerCompletion: async function(paymentId, txid){

        console.log("COMPLETING:", paymentId, txid);

        const res = await fetch(
          "https://albukhr-api-production.up.railway.app/complete-payment",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              paymentId,
              txid
            })
          }
        );

        const data = await res.json();

        console.log("COMPLETE RESPONSE:", data);

        alert("Payment success");
      },

      onCancel: function(){
        alert("Payment cancelled");
      },

      onError: function(error){
        console.error(error);
        alert(JSON.stringify(error));
      }

    });

  }catch(e){

    console.error(e);
    alert("Auth failed");

  }
}

</script>

</body>
</html>
