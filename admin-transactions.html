<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Admin – Transactions</title>
<link rel="stylesheet" href="style.css">

<style>
/* ===== ADMIN TABLE ===== */
.admin-wrap{
  padding:16px;
  max-width:1000px;
  margin:0 auto;
}

.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.admin-header h2{
  font-size:18px;
  color:#0f7a3d;
}

.filter-bar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.filter-bar select,
.filter-bar input{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #cceedd;
  font-size:13px;
}

.tx-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

.tx-table th,
.tx-table td{
  padding:10px;
  font-size:12px;
  text-align:left;
  border-bottom:1px solid #eee;
}

.tx-table th{
  background:#eaf6ee;
  color:#0f7a3d;
  font-weight:600;
}

.badge{
  padding:3px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:600;
}

.badge.internal{background:#e0f3e8;color:#0f7a3d}
.badge.external{background:#fff3cd;color:#856404}
.badge.core{background:#e7f1ff;color:#084298}

.status-ok{color:#0f7a3d;font-weight:600}
.status-frozen{color:#b02a37;font-weight:600}
.status-refunded{color:#6c757d;font-weight:600}

.empty{
  text-align:center;
  font-size:13px;
  color:#777;
  padding:20px;
}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">ALBUKHR • Admin</h1>
</header>

<div class="admin-wrap">

  <div class="admin-header">
    <h2>Unified Transactions</h2>
  </div>

  <!-- FILTERS -->
  <div class="filter-bar">
    <select id="sourceFilter">
      <option value="">All Sources</option>
      <option value="internal">Internal</option>
      <option value="external">External</option>
      <option value="core">Core</option>
    </select>

    <input id="projectFilter" placeholder="Project ID">
  </div>

  <!-- TABLE -->
  <table class="tx-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Source</th>
        <th>Project</th>
        <th>User</th>
        <th>Amount (Pi)</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="txBody"></tbody>
  </table>

</div>

<script>
requireRole([
  "super_admin",
  "finance_admin",
  "review_admin",
  "viewer_admin"
]);
</script>
  
<!-- CORE ENGINES -->
<script src="transactions-unified.js"></script>
<script src="admin-auth.js"></script>

<script>
const body = document.getElementById("txBody");
const sourceFilter = document.getElementById("sourceFilter");
const projectFilter = document.getElementById("projectFilter");

function renderTable(){
  const source = sourceFilter.value;
  const project = projectFilter.value.toLowerCase();

  let txs = getAllTransactionsUnified();

  if(source){
    txs = txs.filter(t => t.source === source);
  }

  if(project){
    txs = txs.filter(t =>
      (t.projectId || "").toLowerCase().includes(project)
    );
  }

  body.innerHTML = "";

  if(txs.length === 0){
    body.innerHTML =
      `<tr><td colspan="6" class="empty">No transactions found</td></tr>`;
    return;
  }

  txs.forEach(t=>{
    const d = new Date(t.timestamp);
    const date =
      d.toLocaleDateString() + " " +
      d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

    body.innerHTML += `
      <tr>
        <td>${date}</td>
        <td><span class="badge ${t.source}">${t.source}</span></td>
        <td>${t.projectId || "-"}</td>
        <td>${t.user || "-"}</td>
        <td>${t.amount}</td>
        <td class="${statusClass(t.status)}">${t.status}</td>
      </tr>
    `;
  });
}

function statusClass(s){
  if(s === "Successful") return "status-ok";
  if(s === "frozen") return "status-frozen";
  if(s === "refunded") return "status-refunded";
  return "";
}

sourceFilter.addEventListener("change", renderTable);
projectFilter.addEventListener("input", renderTable);

renderTable();
</script>

</body>
</html>
