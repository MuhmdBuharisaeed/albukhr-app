<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create External Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
.label{font-size:13px;font-weight:600;margin-bottom:6px}
.input{
  width:100%;padding:12px;
  border-radius:10px;border:1px solid #ddd;
  font-size:14px;
}
textarea.input{min-height:90px}
.btn{
  width:100%;padding:14px;
  border:none;border-radius:12px;
  background:#0f7a3d;color:#fff;
  font-weight:700;font-size:15px
}
.note{
  font-size:12px;color:#666;
  line-height:1.6;margin-top:10px
}
</style>
</head>

<body data-page="external-create">

<header class="header">
  <span>🚀 Create External Project</span>
</header>

<section class="section">

  <!-- PROJECT INFO -->
  <div class="card">
    <div class="label">Project Title</div>
    <input class="input" id="title" placeholder="e.g. Solar Water Pump"/>

    <div class="label" style="margin-top:12px">Category</div>
    <select class="input" id="category">
      <option value="">Select category</option>
      <option>Agro / Farming</option>
      <option>Manufacturing</option>
      <option>Technology</option>
      <option>Energy</option>
      <option>Logistics</option>
      <option>Other</option>
    </select>

    <div class="label" style="margin-top:12px">Project Description</div>
    <textarea class="input" id="description"
      placeholder="Explain what the project does, how funds will be used, and expected outcome"></textarea>
  </div>

  <!-- OWNER INFO -->
  <div class="card">
    <div class="label">Pi Username</div>
    <input class="input" id="owner"
      placeholder="your Pi username"/>

    <div class="label" style="margin-top:12px">
      Invite / Referral Link (optional)
    </div>
    <input class="input" id="invite"
      placeholder="who invited you (optional)"/>
  </div>

  <!-- ESCROW NOTICE -->
  <div class="card">
    <strong>🔒 Escrow Protection</strong>
    <p class="note">
      Funds staked into this project will be locked under
      Albukhr escrow. Release depends on verification,
      milestones and admin approval.
    </p>
  </div>

  <button class="btn" onclick="submitExternalProject()">
    Submit for Review
  </button>

</section>

<script src="staking-external.js"></script>
<script src="external-escrow.js"></script>

<script>
function submitExternalProject(){

  const data = {
    projectId: "EXT-"+Date.now(),
    title: title.value.trim(),
    category: category.value,
    description: description.value.trim(),
    owner: owner.value.trim(),
    invite: invite.value.trim(),
    status: "pending",
    createdAt: Date.now(),
    escrowLocked: false
  };

  if(!data.title || !data.category || !data.description || !data.owner){
    alert("Please fill all required fields");
    return;
  }

  saveExternalProject(data);

  alert("Project submitted for admin review");
  window.location.href = "projects.html";
}
</script>

</body>
</html>
