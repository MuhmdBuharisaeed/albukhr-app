<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Internal Project Review</title>
<link rel="stylesheet" href="style.css">
<script src="internal-registry.js"></script>

<style>
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}
button{
  margin-top:10px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-weight:600
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#c0392b;color:#fff}
</style>
</head>

<body>

<h2 style="padding:16px">Pending Internal Projects</h2>

<div id="list"></div>

<script>
const params = new URLSearchParams(location.search);
if(params.get("admin") !== "ALBUKHR_FOUNDER"){
  document.body.innerHTML = "<p>Access Denied</p>";
}

const listEl = document.getElementById("list");
const projects = getInternalProjects().filter(p=>p.status==="pending");

if(projects.length === 0){
  listEl.innerHTML = "<p style='padding:16px'>No pending projects</p>";
}

projects.forEach(p=>{
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <h4>${p.name}</h4>
    <p><b>Category:</b> ${p.category}</p>
    <p><b>Lead:</b> ${p.lead}</p>
    <p>${p.description || ""}</p>

    <button class="approve">Approve</button>
    <button class="reject">Reject</button>
  `;

  div.querySelector(".approve").onclick = ()=>{
    approveInternalProject(p.id);
    location.reload();
  };

  div.querySelector(".reject").onclick = ()=>{
    rejectInternalProject(p.id);
    location.reload();
  };

  listEl.appendChild(div);
});
</script>

</body>
</html>
