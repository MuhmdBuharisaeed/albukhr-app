<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Admin – External Projects Review</title>

<link rel="stylesheet" href="style.css">

<style>
/* ===== ADMIN TABLE ===== */
.admin-wrap{
  padding:16px;
  max-width:1000px;
  margin:0 auto;
}

.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.admin-header h2{
  font-size:18px;
  color:#0f7a3d;
}

.filter-bar{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.filter-bar select,
.filter-bar input{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #cceedd;
  font-size:13px;
}

.review-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

.review-table th,
.review-table td{
  padding:10px;
  font-size:12px;
  text-align:left;
  border-bottom:1px solid #eee;
}

.review-table th{
  background:#eaf6ee;
  color:#0f7a3d;
  font-weight:600;
}

.badge{
  padding:3px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:600;
}

.badge.pending{background:#fff3cd;color:#856404}
.badge.approved{background:#e0f3e8;color:#0f7a3d}
.badge.rejected{background:#f8d7da;color:#842029}

.btn{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
}

.btn-approve{
  background:#0f7a3d;
  color:#fff;
}

.btn-reject{
  background:#eee;
  color:#333;
}

.empty{
  text-align:center;
  font-size:13px;
  color:#777;
  padding:20px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <h1 class="brand">ALBUKHR • Admin</h1>
</header>

<div class="admin-wrap">

  <div class="admin-header">
    <h2>External Projects Review</h2>
  </div>

  <!-- FILTERS -->
  <div class="filter-bar">
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>

    <input id="projectFilter" placeholder="Project ID / Title">
  </div>

  <!-- TABLE -->
  <table class="review-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Project ID</th>
        <th>Title</th>
        <th>Owner</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="reviewBody"></tbody>
  </table>

</div>

<!-- ENGINES -->
<script src="staking-external.js"></script>
<script src="admin-review.js"></script>

</body>
</html>
