<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Admin – External Reviews</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1 class="brand">ALBUKHR • Admin Review</h1>
</header>

<div class="admin-wrap">

  <div class="admin-header">
    <h2>External Project Reviews</h2>
    <div style="display:flex; gap:10px;">
      <button onclick="location.href='unified-admin-buttons.html'">
        Admin Hub
      </button>
      <button onclick="adminLogout()">Logout</button>
    </div>
  </div>

  <table class="review-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Project</th>
        <th>Owner</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="reviewBody"></tbody>
  </table>

</div>

<script>
requireRole(["super_admin", "review_admin"]);
</script>

<!-- BUSINESS LOGIC -->
<script src="staking-external.js"></script>
<script src="admin-review.js"></script>

</body>
</html>
