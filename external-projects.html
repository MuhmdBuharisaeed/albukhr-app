<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR – External Projects</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{background:#f4f7f5;font-family:system-ui}
.section{
  padding:16px;
  max-width:900px;
  margin:auto
}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  cursor:pointer;
  transition:0.2s
}
.card:hover{
  box-shadow:0 6px 20px rgba(0,0,0,.06);
  transform:translateY(-2px)
}
.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:11px;
  border-radius:20px;
  font-weight:700;
  background:#e6f7ee;
  color:#0f7a3d;
  margin-bottom:6px
}
h3{
  margin:4px 0;
  color:#222
}
small{
  font-size:12px;
  color:#666
}
.empty{
  text-align:center;
  font-size:14px;
  color:#777;
  margin-top:40px
}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">🌍 ALBUKHR External Projects</h1>
</header>

<section class="section">
  <div id="projectList"></div>
</section>

<!-- =============================
     EXTERNAL ENGINE
============================= -->
<script src="staking-external.js"></script>

<script>
const container = document.getElementById("projectList");

/* =============================
   LOAD APPROVED PROJECTS
============================= */
function loadProjects(){
  if(typeof getApprovedExternalProjects !== "function"){
    container.innerHTML = "<p>Engine not loaded.</p>";
    return;
  }

  const list = getApprovedExternalProjects();
  container.innerHTML = "";

  if(!list.length){
    container.innerHTML = `
      <div class="empty">
        No approved external projects yet.
      </div>
    `;
    return;
  }

  list.reverse().forEach(p=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <span class="badge">APPROVED</span>
      <h3>${p.title}</h3>
      <small>${p.category}</small><br>
      <small>Owner: ${p.owner}</small>
    `;

    /* 👉 CLICK → PROJECT DETAILS */
    div.onclick = ()=>{
      window.location.href =
        "external-project.html?id=" + p.projectId;
    };

    container.appendChild(div);
  });
}

loadProjects();
</script>

</body>
</html>
