<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:90px;
  font-family:Arial
}

.section{padding:16px}

/* TRANSACTION CARD */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:flex-start;   /* gyara overflow */
  gap:8px;
  overflow:hidden;          /* kare wucewa waje */
}

/* ICON */
.project-icon{
  font-size:16px;
  width:26px;
  min-width:26px;           /* kar ya matse */
  text-align:center
}

.project-body{
  flex:1;
  min-width:0;              /* VERY IMPORTANT (fix overflow bug) */
}

.project-title{
  font-size:14px;
  font-weight:600;
  word-break:break-word;
}

.project-date{
  font-size:11px;
  color:#777;
}

/* ADDRESS SAFE WRAP */
.project-body div:last-child{
  font-size:11px;
  color:#777;
  word-break:break-all;
  overflow-wrap:anywhere;
}

/* RIGHT SIDE */
.project-right{
  text-align:right;
  min-width:80px;           /* kare yankewar amount */
}

.project-amount{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;       /* kar ya rabu */
}

.project-status{
  font-size:11px;
  color:#0f7a3d;
}

.withdraw-status{
  color:#c0392b;
}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <span>All Transactions</span>
  </div>
</header>

<section class="section">
  <div id="txList"></div>
</section>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const txList = document.getElementById("txList");

/* ICON MAP */
const ICONS = {
  Raheem:   "💊",
  Hauwal:   "🌽",
  Barsh:    "🌾",
  Khairat:  "♻️",
  Azman:    "🧪",
  Urban:    "🚍",
  Labbaika: "🍞"
};

<script>
function loadTransactions(){

  const txList = document.getElementById("txList");
  txList.innerHTML = "";

  if(typeof getStakes !== "function"){
    txList.innerHTML = "No transactions yet";
    return;
  }

  const transactions = getStakes();

  if(!transactions.length){
    txList.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  transactions.forEach(tx=>{

    const div = document.createElement("div");
    div.className = "project-tx";

    const t = formatDateTime({timestamp:tx.timestamp});

    div.innerHTML = `
      <div class="project-icon">📦</div>

      <div class="project-body">
        <div class="project-title">${tx.project} Stake</div>
        <div class="project-date">${t.date} • ${t.time}</div>
      </div>

      <div class="project-right">
        <div class="project-amount">
          ${Number(tx.amount).toFixed(2)} Pi
        </div>
        <div class="project-status">Successful</div>
      </div>
    `;

    txList.appendChild(div);
  });
}

loadTransactions();
</script>

</body>
</html>
