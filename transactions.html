<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:90px;
  font-family:Arial
}

.section{padding:16px}

/* TRANSACTION CARD */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s ease;
}
.project-tx:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

.project-icon{
  font-size:16px;
  width:26px;
  min-width:26px;
  text-align:center
}

.project-body{
  flex:1;
  min-width:0;
}

.project-title{
  font-size:14px;
  font-weight:600;
  word-break:break-word;
}

.project-date{
  font-size:11px;
  color:#777;
}

.project-body div:last-child{
  font-size:11px;
  color:#777;
  word-break:break-all;
  overflow-wrap:anywhere;
}

.project-right{
  text-align:right;
  min-width:80px;
}

.project-amount{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.project-status{
  font-size:11px;
  color:#0f7a3d;
}

.withdraw-status{
  color:#c0392b;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal{
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:14px;
  padding:18px;
}

.modal h3{
  margin:0 0 10px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin:6px 0;
}

.modal-actions{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.btn-primary{
  background:#0f7a3d;
  color:#fff;
}

.btn-light{
  background:#eee;
}
</style>
</head>

<body>

<header class="header">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span>All Transactions</span>
  </div>
</header>

<section class="section">
  <div id="txList"></div>
</section>

<!-- MODAL -->
<div class="modal-overlay" id="txModal">
  <div class="modal">
    <h3>Transaction Details</h3>
    <div id="txDetails"></div>

    <div class="modal-actions">
      <button class="btn btn-primary" onclick="downloadReceipt()">Download</button>
      <button class="btn btn-primary" onclick="shareReceipt()">Share</button>
      <button class="btn btn-light" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const txList = document.getElementById("txList");
const txModal = document.getElementById("txModal");
const txDetails = document.getElementById("txDetails");

let activeTx = null;

const ICONS = {
  Raheem:"💊",
  Hauwal:"🌽",
  Barsh:"🌾",
  Khairat:"♻️",
  Azman:"🧪",
  Urban:"🚍",
  Labbaika:"🍞"
};

/* ===== SAFE HELPERS ===== */

function safeNumber(val){
  const n = Number(val);
  return isNaN(n) ? 0 : n;
}

function safeDate(ts){
  const d = new Date(Number(ts) || Date.now());
  return d;
}

function generateReference(tx){
  return "ALB-" + (Number(tx.timestamp) || Date.now());
}

/* ===== MODAL OPEN ===== */

function openModal(tx){

  if(!tx) return;

  activeTx = tx;

  const ref = generateReference(tx);
  const date = safeDate(tx.timestamp);

  const gross = safeNumber(tx.grossAmount || tx.amount);
  const received = safeNumber(tx.received || gross);
  const fee = tx.type==="reward-withdraw"
      ? (gross - received).toFixed(2)
      : "0.00";

  txDetails.innerHTML = `
    <div class="detail-row"><span>Project</span><span>${tx.project || "-"}</span></div>
    <div class="detail-row"><span>Type</span><span>${tx.type || "-"}</span></div>
    <div class="detail-row"><span>Gross</span><span>${gross.toFixed(2)} Pi</span></div>
    <div class="detail-row"><span>Fee</span><span>${fee} Pi</span></div>
    <div class="detail-row"><span>Net Received</span><span>${received.toFixed(2)} Pi</span></div>
    <div class="detail-row"><span>Date</span><span>${date.toLocaleString()}</span></div>
    <div class="detail-row"><span>Reference</span><span>${ref}</span></div>
    <div class="detail-row"><span>Wallet</span><span>${tx.walletAddress || "Internal Wallet"}</span></div>
  `;

  txModal.style.display="flex";
}

/* ===== CLOSE MODAL ===== */

function closeModal(){
  txModal.style.display="none";
}

/* ===== DOWNLOAD ===== */

function downloadReceipt(){
  if(!activeTx) return;

  const ref = generateReference(activeTx);

  const text = `
Albukhr Transaction Receipt
Reference: ${ref}
Project: ${activeTx.project}
Type: ${activeTx.type}
Amount: ${safeNumber(activeTx.grossAmount||activeTx.amount).toFixed(2)} Pi
Date: ${safeDate(activeTx.timestamp).toLocaleString()}
Wallet: ${activeTx.walletAddress || "Internal Wallet"}
  `;

  const blob = new Blob([text],{type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ref + ".txt";
  a.click();
}

/* ===== SHARE ===== */

function shareReceipt(){
  if(!activeTx) return;

  const ref = generateReference(activeTx);

  const text = `
Albukhr Transaction
Ref: ${ref}
Project: ${activeTx.project}
Amount: ${safeNumber(activeTx.grossAmount||activeTx.amount).toFixed(2)} Pi
  `;

  if(navigator.share){
    navigator.share({
      title:"Albukhr Receipt",
      text
    });
  }else{
    alert("Sharing not supported on this device.");
  }
}

/* ===== LOAD TRANSACTIONS ===== */

function loadTransactions(){

  txList.innerHTML = "";

  const stakeTx = (typeof getStakes === "function")
    ? getStakes()
      .filter(s=>s.status==="Successful")
      .map(s=>({
        type:"stake",
        project:s.project,
        amount:safeNumber(s.amount),
        timestamp:Number(s.timestamp)
      }))
    : [];

  const withdrawTx = (typeof getWithdrawHistory === "function")
    ? getWithdrawHistory().map(w=>({
        type:w.type==="capital"?"capital-withdraw":"reward-withdraw",
        project:w.project,
        grossAmount:safeNumber(w.grossAmount||w.amount),
        received:safeNumber(w.received||w.amount),
        walletAddress:w.walletAddress||"Internal Wallet",
        timestamp:Number(w.timestamp)
      }))
    : [];

  const merged = [...stakeTx,...withdrawTx]
    .sort((a,b)=> (b.timestamp||0)-(a.timestamp||0));

  if(!merged.length){
    txList.innerHTML="<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  merged.forEach(tx=>{

    const div = document.createElement("div");
    div.className="project-tx";
    div.onclick=()=>openModal(tx);

    const d = safeDate(tx.timestamp);
    const amount = safeNumber(tx.grossAmount||tx.amount);

    div.innerHTML = `
      <div class="project-icon">
        ${ICONS[tx.project] || "📦"}
      </div>
      <div class="project-body">
        <div class="project-title">
          ${tx.project} ${tx.type}
        </div>
        <div class="project-date">
          ${d.toLocaleDateString()} • ${d.toLocaleTimeString()}
        </div>
      </div>
      <div class="project-right">
        <div class="project-amount ${(tx.type||'').includes('withdraw')?'withdraw-status':''}">
          ${(tx.type==="stake"?"+":"-")}${amount.toFixed(2)} Pi
        </div>
        <div class="project-status">
          Completed
        </div>
      </div>
    `;

    txList.appendChild(div);
  });
}

window.addEventListener("walletUpdated", loadTransactions);

loadTransactions();
</script>

</body>
</html>
