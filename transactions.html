<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR • Transactions</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:90px;
  font-family:Arial;
  margin:0;
}

/* ===== ALBUKHR STANDARD HEADER ===== */
.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.main-logo{
  height:54px;
  width:auto;
}

.header-title{
  font-size:15px;
  font-weight:700;
  color:#fff;
  letter-spacing:.3px;
}

.section{padding:16px}

/* TRANSACTION CARD */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s ease;
}
.project-tx:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(0,0,0,0.08);
}

.project-icon{
  font-size:16px;
  width:26px;
  min-width:26px;
  text-align:center
}

.project-body{
  flex:1;
  min-width:0;
}

.project-title{
  font-size:14px;
  font-weight:600;
  word-break:break-word;
}

.project-date{
  font-size:11px;
  color:#777;
}

.project-right{
  text-align:right;
  min-width:80px;
}

.project-amount{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

.project-status{
  font-size:11px;
  color:#0f7a3d;
}

.withdraw-status{
  color:#c0392b;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal{
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:14px;
  padding:18px;
}

.modal h3{
  margin:0 0 10px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin:6px 0;
}

.modal-actions{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.btn-primary{
  background:#0f7a3d;
  color:#fff;
}

.btn-light{
  background:#eee;
}
</style>
</head>

<body>

<!-- ===== ALBUKHR HEADER ===== -->
<header class="header">
  <div class="header-left">
    <img src="file_000000007bb062439b275f4bcf52e264.png" class="main-logo">
    <span class="header-title">All Transactions</span>
  </div>
</header>

<section class="section">
  <div id="txList"></div>
</section>

<!-- MODAL -->
<div class="modal-overlay" id="txModal">
  <div class="modal">
    <h3>Transaction Details</h3>
    <div id="txDetails"></div>

    <div class="modal-actions">
      <button class="btn btn-primary" onclick="downloadReceipt()">Download</button>
      <button class="btn btn-primary" onclick="shareReceipt()">Share</button>
      <button class="btn btn-light" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const txList = document.getElementById("txList");
const txModal = document.getElementById("txModal");
const txDetails = document.getElementById("txDetails");

let activeTx = null;

const ICONS = {
  Raheem:"💊",
  Hauwal:"🌽",
  Barsh:"🌾",
  Khairat:"♻️",
  Azman:"🧪",
  Urban:"🚍",
  Labbaika:"🍞"
};

function safeNumber(val){
  const n = Number(val);
  return isNaN(n) ? 0 : n;
}

function safeDate(ts){
  return new Date(Number(ts) || Date.now());
}

function generateReference(tx){
  return "ALB-" + (Number(tx.timestamp) || Date.now());
}

function openModal(tx){
  if(!tx) return;
  activeTx = tx;

  const ref = generateReference(tx);
  const date = safeDate(tx.timestamp);
  const gross = safeNumber(tx.grossAmount || tx.amount);
  const received = safeNumber(tx.received || gross);
  const fee = tx.type==="reward-withdraw"
      ? (gross - received).toFixed(2)
      : "0.00";

  txDetails.innerHTML = `
    <div class="detail-row"><span>Project</span><span>${tx.project || "-"}</span></div>
    <div class="detail-row"><span>Type</span><span>${tx.type || "-"}</span></div>
    <div class="detail-row"><span>Gross</span><span>${gross.toFixed(2)} Pi</span></div>
    <div class="detail-row"><span>Fee</span><span>${fee} Pi</span></div>
    <div class="detail-row"><span>Net</span><span>${received.toFixed(2)} Pi</span></div>
    <div class="detail-row"><span>Date</span><span>${date.toLocaleString()}</span></div>
    <div class="detail-row"><span>Reference</span><span>${ref}</span></div>
    <div class="detail-row"><span>Wallet</span><span>${tx.walletAddress || "Internal Wallet"}</span></div>
  `;

  txModal.style.display="flex";
}

function closeModal(){
  txModal.style.display="none";
}

function loadTransactions(){
  txList.innerHTML="";
  if(typeof getStakes!=="function") return;

  const stakes = getStakes() || [];
  if(!stakes.length){
    txList.innerHTML="<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }
}

loadTransactions();
</script>

</body>
</html>
