<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#f5f7f6;padding-bottom:90px;font-family:Arial}

.section{padding:16px}

.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
}

.project-icon{font-size:16px}

.project-body{flex:1}
.project-title{font-size:14px;font-weight:600}
.project-date{font-size:11px;color:#777}

.project-right{text-align:right}
.project-amount{font-size:14px;font-weight:bold}
.project-status{font-size:11px;color:#0f7a3d}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <span>All Transactions</span>
  </div>
</header>

<section class="section">
  <div id="txList"></div>
</section>

<script src="staking.js"></script>
<script>
const txList = document.getElementById("txList");

const ICONS = {
  Raheem: "💊",
  Hauwal: "🌽",
  Barsh: "🌾",
  Khairat: "🌿"
};

function formatDateTime(s){
  // future-proof: yana karanta sabo ko tsoho
  if(s.date && s.time){
    return `${s.date} • ${s.time}`;
  }
  if(s.date){
    return s.date;
  }
  return "—";
}

function loadTransactions(){
  const stakes = getStakes().slice().reverse();
  txList.innerHTML = "";

  if(stakes.length === 0){
    txList.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  stakes.forEach(s=>{
    if(s.status !== "Successful") return;

    const div = document.createElement("div");
    div.className = "project-tx";

    div.innerHTML = `
      <div class="project-icon">${ICONS[s.project] || "📦"}</div>

      <div class="project-body">
        <div class="project-title">${s.project} Stake</div>
        <div class="project-date">${formatDateTime(s)}</div>
      </div>

      <div class="project-right">
        <div class="project-amount">${s.amount} Pi</div>
        <div class="project-status">Successful</div>
      </div>
    `;

    txList.appendChild(div);
  });
}

loadTransactions();
</script>

</body>
</html>
