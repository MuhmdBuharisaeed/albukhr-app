<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:90px;
  font-family:Arial
}

.section{padding:16px}

/* TRANSACTION CARD */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:flex-start;   /* gyara overflow */
  gap:8px;
  overflow:hidden;          /* kare wucewa waje */
}

/* ICON */
.project-icon{
  font-size:16px;
  width:26px;
  min-width:26px;           /* kar ya matse */
  text-align:center
}

.project-body{
  flex:1;
  min-width:0;              /* VERY IMPORTANT (fix overflow bug) */
}

.project-title{
  font-size:14px;
  font-weight:600;
  word-break:break-word;
}

.project-date{
  font-size:11px;
  color:#777;
}

/* ADDRESS SAFE WRAP */
.project-body div:last-child{
  font-size:11px;
  color:#777;
  word-break:break-all;
  overflow-wrap:anywhere;
}

/* RIGHT SIDE */
.project-right{
  text-align:right;
  min-width:80px;           /* kare yankewar amount */
}

.project-amount{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;       /* kar ya rabu */
}

.project-status{
  font-size:11px;
  color:#0f7a3d;
}

.withdraw-status{
  color:#c0392b;
}
</style>
</head>

<body>

<header class="header">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span>All Transactions</span>
    </div>
</header>

<section class="section">
  <div id="txList"></div>
</section>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const txList = document.getElementById("txList");

/* ICON MAP */
const ICONS = {
  Raheem:   "💊",
  Hauwal:   "🌽",
  Barsh:    "🌾",
  Khairat:  "♻️",
  Azman:    "🧪",
  Urban:    "🚍",
  Labbaika: "🍞"
};
  
function loadTransactions(){

  txList.innerHTML = "";

  /* ===== STAKE TRANSACTIONS ===== */
  const stakeTx = (typeof getStakes === "function")
    ? getStakes()
        .filter(s => s.status === "Successful")
        .map(s => ({
          type: "stake",
          project: s.project,
          amount: Number(s.amount),
          timestamp: s.timestamp
        }))
    : [];

  /* ===== WITHDRAW TRANSACTIONS (FROM WALLET CORE) ===== */
  const withdrawTx = (typeof getWithdrawHistory === "function")
    ? getWithdrawHistory().map(w => ({
        type: w.type === "capital" ? "capital-withdraw" : "reward-withdraw",
        project: w.project,
        grossAmount: Number(w.grossAmount || w.amount),
        received: Number(w.received || w.amount),
        walletAddress: w.walletAddress || "Internal Wallet",
        timestamp: w.timestamp
      }))
    : [];

  /* ===== MERGE + SORT ===== */
  const merged = [...stakeTx, ...withdrawTx]
    .sort((a,b)=> (b.timestamp || 0) - (a.timestamp || 0));

  if(merged.length === 0){
    txList.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  merged.forEach(tx=>{

    const div = document.createElement("div");
    div.className = "project-tx";

    /* ===== STAKE ===== */
    if(tx.type === "stake"){

      const d = new Date(tx.timestamp);

      div.innerHTML = `
        <div class="project-icon">
          ${ICONS[tx.project] || "📦"}
        </div>

        <div class="project-body">
          <div class="project-title">${tx.project} Stake</div>
          <div class="project-date">
            ${d.toLocaleDateString()} • ${d.toLocaleTimeString()}
          </div>
        </div>

        <div class="project-right">
          <div class="project-amount">
            +${tx.amount.toFixed(2)} Pi
          </div>
          <div class="project-status">Successful</div>
        </div>
      `;

    }

    /* ===== REWARD WITHDRAW ===== */
    else if(tx.type === "reward-withdraw"){

      const d = new Date(tx.timestamp);

      div.innerHTML = `
        <div class="project-icon">
          ${ICONS[tx.project] || "💸"}
        </div>

        <div class="project-body">
          <div class="project-title">
            ${tx.project} Reward Withdraw
          </div>
          <div class="project-date">
            ${d.toLocaleDateString()} • ${d.toLocaleTimeString()}
          </div>
          <div>
            Wallet: ${tx.walletAddress}
          </div>
        </div>

        <div class="project-right">
          <div class="project-amount withdraw-status">
            -${tx.grossAmount.toFixed(2)} Pi
          </div>
          <div class="project-status withdraw-status">
            Completed
          </div>
        </div>
      `;
    }

    /* ===== CAPITAL WITHDRAW ===== */
    else if(tx.type === "capital-withdraw"){

      const d = new Date(tx.timestamp);

      div.innerHTML = `
        <div class="project-icon">
          ${ICONS[tx.project] || "🏦"}
        </div>

        <div class="project-body">
          <div class="project-title">
            ${tx.project} Capital Withdraw
          </div>
          <div class="project-date">
            ${d.toLocaleDateString()} • ${d.toLocaleTimeString()}
          </div>
          <div>
            Returned to Internal Wallet
          </div>
        </div>

        <div class="project-right">
          <div class="project-amount withdraw-status">
            -${tx.grossAmount.toFixed(2)} Pi
          </div>
          <div class="project-status withdraw-status">
            Duration Completed
          </div>
        </div>
      `;
    }

    txList.appendChild(div);
  });
}

/* Auto refresh when wallet updates */
window.addEventListener("walletUpdated", loadTransactions);

loadTransactions();
</script>

</body>
</html>
