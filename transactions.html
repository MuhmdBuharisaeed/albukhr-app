<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:90px;
  font-family:Arial
}

.section{padding:16px}

/* TRANSACTION CARD */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px; /* rage spacing */
}

/* ICON – RAGE GIRMA */
.project-icon{
  font-size:16px;
  width:26px;
  text-align:center
}

.project-body{flex:1}
.project-title{font-size:14px;font-weight:600}
.project-date{font-size:11px;color:#777}

.project-right{text-align:right}
.project-amount{font-size:14px;font-weight:bold}
.project-status{font-size:11px;color:#0f7a3d}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <span>All Transactions</span>
  </div>
</header>

<section class="section">
  <div id="txList"></div>
</section>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>
  
<script>
const txList = document.getElementById("txList");

/* ✅ HUKUMA ICON MAP */
const ICONS = {
  Raheem:   "💊",
  Hauwal:   "🌽",
  Barsh:    "🌾",
  Khairat:  "♻️",
  Azman:    "🧪",
  Urban:    "🚍",
  Labbaika: "🍞"
};

function renderTransactions(){

  const container = document.getElementById("txContainer");
  container.innerHTML = "";

  /* ===== STAKES (Tsohon tsarin) ===== */
  const stakes = getStakes()
    .filter(s => s.status === "Successful")
    .map(s => ({
      type: "stake",
      project: s.project,
      amount: s.amount,
      timestamp: s.timestamp
    }));

  /* ===== WITHDRAWALS (Sabon daga wallet) ===== */
  let withdraws = [];
  if(typeof getWithdrawals === "function"){
    withdraws = getWithdrawals();
  }

  const mappedWithdraws = withdraws.map(w => ({
    type: "withdraw",
    amount: w.amount,
    wallet: w.walletAddress,
    timestamp: w.timestamp
  }));

  /* ===== MERGE & SORT ===== */
  const allTx = [...stakes, ...mappedWithdraws]
    .sort((a,b)=>b.timestamp - a.timestamp);

  if(allTx.length === 0){
    container.innerHTML =
      "<p style='font-size:13px;color:#777'>No transactions yet</p>";
    return;
  }

  /* ===== RENDER ===== */
  allTx.forEach(tx=>{

    const div = document.createElement("div");
    div.className = "home-tx"; // muna amfani da existing style

    const date = new Date(tx.timestamp).toLocaleString();

    if(tx.type === "stake"){

      div.innerHTML = `
        <div class="home-icon">📦</div>
        <div class="home-body">
          <div class="home-title">${tx.project} Stake</div>
          <div class="home-date">${date}</div>
        </div>
        <div class="home-right">
          <div class="home-amount">${tx.amount} Pi</div>
          <div class="home-status success">Successful</div>
        </div>
      `;

    } else {

      div.innerHTML = `
        <div class="home-icon">💸</div>
        <div class="home-body">
          <div class="home-title">Reward Withdraw</div>
          <div class="home-date">${date}</div>
          <div style="font-size:11px;color:#777">
            Wallet: ${tx.wallet}
          </div>
        </div>
        <div class="home-right">
          <div class="home-amount">-${tx.amount} Pi</div>
          <div class="home-status success">Completed</div>
        </div>
      `;
    }

    container.appendChild(div);
  });
}

window.addEventListener("DOMContentLoaded", renderTransactions);

loadTransactions();
</script>

</body>
</html>
