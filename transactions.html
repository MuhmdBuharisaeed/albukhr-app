<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:80px;
  font-family:Arial
}

.section{padding:16px}

/* TRANSACTION LIST */
.tx-list{margin-top:12px}

.tx-item{
  background:#fff;
  border-radius:12px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px
}

.tx-icon{
  font-size:22px;
  width:36px;
  text-align:center
}

.tx-body{flex:1}
.tx-title{font-size:14px;font-weight:bold}
.tx-date{font-size:11px;color:#777}

.tx-right{text-align:right}
.tx-amount{font-size:14px;font-weight:bold}

.tx-status{
  font-size:11px;
  margin-top:4px
}

.success{color:#0f7a3d}
.pending{color:#c49100}
.failed{color:#c0392b}
</style>
</head>

<body>

<!-- ✅ HEADER -->
<header class="header">
  <div class="header-left">
    <span>Transaction History</span>
  </div>
</header>

<section class="section">
<div style="display:flex;gap:8px;margin-bottom:12px">
  <button onclick="filterTx('All')">All</button>
  <button onclick="filterTx('Successful')">Successful</button>
  <button onclick="filterTx('Pending')">Pending</button>
  <button onclick="filterTx('Failed')">Failed</button>
</div>
  <div id="txList" class="tx-list"></div>
</section>

<script src="staking.js"></script>
<script>
const txList = document.getElementById("txList");
const stakes = getStakes().slice().reverse();

function icon(project){
  if(project==="Raheem") return "💊";
  if(project==="Hauwal") return "🌾";
  return "📦";
}

if(stakes.length === 0){
  txList.innerHTML =
    "<p style='font-size:13px;color:#777'>No transactions yet</p>";
}

stakes.forEach(s=>{
  const cls =
    s.status === "Pending" ? "pending" :
    s.status === "Failed" ? "failed" :
    "success";

  const div = document.createElement("div");
  div.className = "tx-item";

  div.innerHTML = `
    <div class="tx-icon">${icon(s.project)}</div>

    <div class="tx-body">
      <div class="tx-title">${s.project} Stake</div>
      <div class="tx-date">${s.date}</div>
    </div>

    <div class="tx-right">
      <div class="tx-amount">${s.amount} Pi</div>
      <div class="tx-status ${cls}">${s.status}</div>
    </div>
  `;

  txList.appendChild(div);
});
</script>

</body>
</html>
