<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:90px;
  font-family:Arial
}

.section{padding:16px}

/* TRANSACTION CARD */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}

.project-icon{
  font-size:16px;
  width:26px;
  text-align:center
}

.project-body{flex:1}
.project-title{font-size:14px;font-weight:600}
.project-date{font-size:11px;color:#777}

.project-right{text-align:right}
.project-amount{font-size:14px;font-weight:bold}
.project-status{font-size:11px;color:#0f7a3d}

.withdraw-status{color:#c0392b}
.address{
  font-size:10px;
  color:#999;
  margin-top:2px;
  word-break:break-all
}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <span>All Transactions</span>
  </div>
</header>

<section class="section">
  <div id="txList"></div>
</section>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const txList = document.getElementById("txList");

/* ICON MAP */
const ICONS = {
  Raheem:   "💊",
  Hauwal:   "🌽",
  Barsh:    "🌾",
  Khairat:  "♻️",
  Azman:    "🧪",
  Urban:    "🚍",
  Labbaika: "🍞"
};

function loadTransactions(){

  txList.innerHTML = "";

  /* ===== STAKE TRANSACTIONS ===== */
  const stakeTx = getStakes()
    .filter(s => s.status === "Successful")
    .map(s => ({
      type: "stake",
      project: s.project,
      amount: Number(s.amount),
      timestamp: s.timestamp
    }));

  /* ===== WITHDRAW TRANSACTIONS ===== */
  let withdrawTx = [];

  if(typeof getWithdrawHistory === "function"){
    const raw = getWithdrawHistory() || [];

    withdrawTx = raw.map(w => ({
      type: "withdraw",
      amount: Number(w.amount),
      walletAddress: w.walletAddress || "External Wallet",
      timestamp: w.timestamp || Date.now()
    }));
  }

  /* ===== MERGE + SORT ===== */
  const merged = [...stakeTx, ...withdrawTx]
    .sort((a,b)=>b.timestamp - a.timestamp);

  if(merged.length === 0){
    txList.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  merged.forEach(tx=>{

    const div = document.createElement("div");
    div.className = "project-tx";

    if(tx.type === "stake"){

      const t = formatDateTime({ timestamp:tx.timestamp });

      div.innerHTML = `
        <div class="project-icon">
          ${ICONS[tx.project] || "📦"}
        </div>

        <div class="project-body">
          <div class="project-title">${tx.project} Stake</div>
          <div class="project-date">${t.date} • ${t.time}</div>
        </div>

        <div class="project-right">
          <div class="project-amount">${tx.amount.toFixed(2)} Pi</div>
          <div class="project-status">Successful</div>
        </div>
      `;

    } else {

      const d = new Date(tx.timestamp);

      div.innerHTML = `
        <div class="project-icon">💸</div>

        <div class="project-body">
          <div class="project-title">Reward Withdraw</div>
          <div class="project-date">
            ${d.toLocaleDateString()} • ${d.toLocaleTimeString()}
          </div>
          <div style="font-size:11px;color:#777">
            Wallet: ${tx.walletAddress}
          </div>
        </div>

        <div class="project-right">
          <div class="project-amount">-${tx.amount.toFixed(2)} Pi</div>
          <div class="project-status">Completed</div>
        </div>
      `;
    }

    txList.appendChild(div);
  });
}

loadTransactions();
</script>

</body>
</html>
