<script src="staking.js"></script>
<script>
const PROJECT_NAME = "Raheem";

const modal = document.getElementById("modal");
const amountInput = document.getElementById("amount");
const durationSelect = document.getElementById("duration");
const rStake = document.getElementById("rStake");
const rReward = document.getElementById("rReward");
const raheemHistory = document.getElementById("raheemHistory");
const minHint = document.getElementById("minHint");

function openModal(){
  modal.style.display = "flex";
  const min = getMinStake(PROJECT_NAME);
  minHint.innerText = "Minimum stake: " + min + " Pi";
}

function closeModal(){
  modal.style.display = "none";
}

function stake(){
  const amount = Number(amountInput.value);
  const duration = Number(durationSelect.value);
  const min = getMinStake(PROJECT_NAME);

  if(!amount || amount < min){
    alert("Minimum stake is " + min + " Pi");
    return;
  }

  addStake({
    project: PROJECT_NAME,
    amount,
    duration
  });

  amountInput.value = "";
  closeModal();
  load();
}

function load(){
  const data = getProjectTotals(PROJECT_NAME);

  rStake.innerText = data.stake.toFixed(2) + " Pi";
  rReward.innerText = data.reward.toFixed(2) + " Pi";

  raheemHistory.innerHTML = "";
  data.stakes.forEach(s => {
    const d = document.createElement("div");
    d.className = "tx";
    d.innerText =
      `${s.date} | ${s.amount} Pi | +${s.reward.toFixed(2)} Pi`;
    raheemHistory.appendChild(d);
  });
}

load();
</script>
