<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raheem Pharmacy</title>

<style>
body{
  background:#f5f7f6;
  font-family:system-ui;
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* FIXED HEADER */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

/* FIXED SUMMARY */
.project-summary{
  padding:16px;
  background:#f5f7f6;
  flex-shrink:0;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.stat{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:14px;
}

.stat strong{
  color:#0f7a3d;
}

.btn-group{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#0f7a3d;
  color:#fff;
}

.secondary{
  background:#eaf6ee;
  color:#0f7a3d;
}

/* SCROLL AREA */
.history-container{
  flex:1;
  overflow-y:auto;
  padding:0 16px 16px 16px;
}

.tx{
  border-bottom:1px solid #eee;
  padding:10px 0;
  font-size:13px;
}

.tx small{
  color:#777;
  font-size:11px;
}
</style>
</head>

<body>

<div class="header">💊 Raheem Pharmacy</div>

<div class="project-summary">
  <div class="card">

    <div class="stat">
      <div>Your Stake</div>
      <strong id="rStake">0.00 Pi</strong>
    </div>

    <div class="stat">
      <div>Your Reward</div>
      <strong id="rReward">0.00 Pi</strong>
    </div>

    <div class="btn-group">
      <button class="btn primary" onclick="openStake()">Stake</button>
      <button class="btn secondary" onclick="goToWithdraw()">Withdraw</button>
    </div>

  </div>
</div>

<div class="history-container">
  <div class="card">
    <h4>Transaction History</h4>
    <div id="raheemHistory"></div>
  </div>
</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

function loadProject(){

  const data = getProjectTotals("Raheem");

  rStake.innerText =
    data.stake.toFixed(2) + " Pi";

  rReward.innerText =
    data.reward.toFixed(2) + " Pi";

  raheemHistory.innerHTML="";

  if(!data.stakes.length){
    raheemHistory.innerHTML =
      "<small>No transactions yet</small>";
    return;
  }

  data.stakes.slice().reverse().forEach(s=>{

    const t = formatDateTime(s);

    const div = document.createElement("div");
    div.className="tx";

    div.innerHTML = `
      <div><strong>Stake:</strong> ${s.amount.toFixed(2)} Pi</div>
      <small>${t.date} • ${t.time}</small>
    `;

    raheemHistory.appendChild(div);
  });
}

/* Redirect to wallet withdraw */
function goToWithdraw(){

  const summary = getWalletSummary();

  if(summary.available <= 0){
    alert("No available rewards to withdraw.");
    return;
  }

  window.location.href = "wallet.html";
}

loadProject();

</script>

</body>
</html>
