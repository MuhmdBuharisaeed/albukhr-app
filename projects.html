<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects | ALBUKHR</title>
<meta name="theme-color" content="#0f7a3d">
<style>
:root{--g:#0f7a3d;--gd:#095c30;--bg:#f4f7f5;--card:#fff;--tx:#17231b;--mut:#65736a;--bd:#dce6df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif}
main{max-width:1250px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-weight:900;color:var(--g);font-size:22px}.network{background:#fff;border:1px solid var(--bd);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:bold}
.hero{padding:28px;border-radius:20px;background:linear-gradient(135deg,var(--g),#169953);color:#fff}.hero h1{margin:0 0 8px}.hero p{margin:0;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat,.card,.state{background:#fff;border:1px solid var(--bd);border-radius:16px}.stat{padding:15px}.stat span{color:var(--mut);font-size:12px;display:block}.stat strong{font-size:20px;display:block;margin-top:6px}
.tools{display:grid;grid-template-columns:1fr 180px 120px;gap:10px;margin:20px 0}input,select,button{font:inherit;border-radius:12px;padding:12px}input,select{border:1px solid var(--bd);background:#fff}button{border:0;font-weight:bold;cursor:pointer}.refresh{background:#e8f0eb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:15px}.card{padding:17px}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:850}.code,.desc{color:var(--mut);font-size:13px;margin-top:4px}.badge{background:#eaf6ee;color:var(--g);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:bold;height:max-content}
.logo{width:58px;height:58px;border-radius:12px;object-fit:cover;border:1px solid var(--bd);background:#f1f4f2}.projecttop{display:flex;gap:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.metric{background:#f7faf8;padding:10px;border-radius:10px}.metric span{font-size:11px;color:var(--mut);display:block}.metric strong{display:block;margin-top:4px}.view{background:var(--g);color:#fff;width:100%}.state{padding:35px;text-align:center;color:var(--mut)}.hidden{display:none!important}.error{color:#a52318}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.hero{padding:22px}}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">ALBUKHR</div><div class="network" id="network">NETWORK: …</div></div>
<section class="hero"><h1>ALBUKHR Projects</h1><p>Projects published from the authoritative ALBUKHR project registry.</p></section>

<section class="stats">
<div class="stat"><span>Projects</span><strong id="count">—</strong></div>
<div class="stat"><span>Liquidity</span><strong id="liquidity">—</strong></div>
<div class="stat"><span>Investors</span><strong id="investors">—</strong></div>
<div class="stat"><span>Average ROI</span><strong id="roi">—</strong></div>
</section>

<section class="tools">
<input id="search" placeholder="Search Raheem Pharmacy or another project…">
<select id="sort"><option value="default">Name</option><option value="roi">Highest ROI</option><option value="liquidity">Highest Liquidity</option><option value="investors">Most Investors</option></select>
<button class="refresh" id="refresh">Refresh</button>
</section>

<div id="loading" class="state">Loading projects from ALBUKHR registry…</div>
<div id="error" class="state error hidden"></div>
<div id="empty" class="state hidden">No active projects are available in this network.</div>
<section id="grid" class="grid hidden"></section>
</main>

<script src="js/core/environment-core.js"></script>
<script src="js/core/environment-switcher.js"></script>
<script src="js/core/supabase-core.js"></script>
<script src="js/core/pi-auth-core.js"></script>
<script src="js/core/pi-payment.js"></script>
<script src="js/core/pi-project-treasury-payment.js"></script>
<script src="js/marketplace/marketplace-engine.js"></script>

<script>
"use strict";
(() => {
const $=id=>document.getElementById(id);
let data=[];

function esc(v){return window.AlbukhrMarketplaceUI.escapeHTML(v)}
function net(){
 const e=window.ALBukhrEnvironment;
 return e&&typeof e.getNetwork==="function"?e.getNetwork():null;
}
function state(n,msg){
 $("loading").classList.toggle("hidden",n!=="loading");
 $("error").classList.toggle("hidden",n!=="error");
 $("empty").classList.toggle("hidden",n!=="empty");
 $("grid").classList.toggle("hidden",n!=="ready");
 if(msg)$("error").textContent=msg;
}
function image(p){
 const src=p.logo_url||p.logo_path||"";
 return src?`<img class="logo" src="${esc(src)}" alt="" onerror="this.style.display='none'">`:`<div class="logo"></div>`;
}
function render(list){
 if(!list.length){state("empty");return}
 $("grid").innerHTML=list.map(p=>`<article class="card">
   <div class="projecttop">${image(p)}<div style="flex:1"><div class="head"><div><div class="name">${esc(p.title)}</div><div class="code">${esc(p.code)}</div></div><span class="badge">${esc((p.type||"project").toUpperCase())}</span></div>
   <div class="desc">${esc(p.description||"No description available.")}</div></div></div>
   <div class="metrics"><div class="metric"><span>Liquidity</span><strong>${Number(p.liquidity||0).toLocaleString()} Pi</strong></div>
   <div class="metric"><span>ROI</span><strong>${Number(p.roi||0).toFixed(2)}%</strong></div>
   <div class="metric"><span>Investors</span><strong>${Number(p.investors||0)}</strong></div>
   <div class="metric"><span>Status</span><strong>${esc(p.status||"active")}</strong></div></div>
   <button class="view" data-code="${esc(p.code)}">View Project</button></article>`).join("");
 $("grid").querySelectorAll("[data-code]").forEach(b=>b.onclick=()=>location.href="project.html?project="+encodeURIComponent(b.dataset.code));
 state("ready");
}
async function load(force=false){
 try{
   state("loading");
   const n=net(); $("network").textContent="NETWORK: "+String(n||"UNKNOWN").toUpperCase();
   if(force)await AlbukhrMarketplace.refreshMarketRanking();
   const [s,l]=await Promise.all([AlbukhrMarketplace.getMarketSummary(),AlbukhrMarketplace.getMarketLeaderboard($("sort").value)]);
   data=l;$("count").textContent=s.projects;$("liquidity").textContent=Number(s.liquidity||0).toLocaleString()+" Pi";
   $("investors").textContent=s.investors;$("roi").textContent=Number(s.averageROI||0).toFixed(2)+"%";filter();
 }catch(e){console.error(e);state("error",e.message||"Unable to load projects.")}
}
function filter(){const q=$("search").value.trim().toLowerCase();render(!q?data:data.filter(p=>[p.code,p.title,p.type,p.description].some(x=>String(x||"").toLowerCase().includes(q))))}
$("search").oninput=filter;$("sort").onchange=()=>load(false);$("refresh").onclick=()=>load(true);
document.addEventListener("DOMContentLoaded",()=>load());
})();
</script>
</body>
</html>
