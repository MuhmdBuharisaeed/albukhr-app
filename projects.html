<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects – ALBUKHR</title>

<link rel="stylesheet" href="style.css">

<style>
/* ================= PROJECTS PAGE ================= */

body{
  background:#f5f7f6;
  font-family:Arial, sans-serif;
}

/* PAGE WRAPPER */
.section{
  padding:16px;
  max-width:720px;          /* hana yawaita a manyan screens */
  margin:0 auto;
}

/* HEADER FIX (no overlap issues) */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
}

/* SEARCH BAR */
.project-search{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid #cceedd;
  font-size:15px;
  margin-bottom:16px;
  outline:none;
}

.project-search:focus{
  border-color:#0f7a3d;
}

/* PROJECT LIST ITEM */
.project-item{
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:#ffffff;
  padding:14px 16px;
  border-radius:14px;
  margin-bottom:10px;

  text-decoration:none;
  color:#0f7a3d;

  border-left:4px solid #e0efe7;
  transition:all .15s ease;
}

/* ACTIVE / VERIFIED LOOK */
.project-item:hover{
  background:#eaf6ee;
  border-left-color:#0f7a3d;
}

/* LEFT TEXT */
.project-item span{
  font-size:15px;
  font-weight:600;
}

/* RIGHT STATUS */
.project-item small{
  font-size:12px;
  color:#2f7d4f;
}

/* EMPTY STATE (future use) */
.no-result{
  font-size:13px;
  color:#777;
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body data-page="projects">

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <span>📁 Verified Projects</span>
  </div>
</header>

<section class="section">

  <!-- SEARCH BAR -->
  <input
    type="text"
    id="projectSearch"
    class="project-search"
    placeholder="Search verified projects to stake in…"
  >

  <!-- PROJECTS LIST -->
  <div id="projectsList">

    <a href="raheem.html" class="project-item">
      <span>💊 Raheem Pharmacy</span>
      <small>Verified</small>
    </a>

    <a href="hauwal.html" class="project-item">
      <span>🌽 Hauwal Sumonviter</span>
      <small>Verified</small>
    </a>

    <a href="barsh.html" class="project-item">
      <span>🌾 Barsh Agro</span>
      <small>Verified</small>
    </a>

    <a href="khairat.html" class="project-item">
      <span>♻️ Khairat Organic Fertiliser</span>
      <small>Verified</small>
    </a>

    <a href="azman.html" class="project-item">
      <span>🧪 Azman Futures Makers Lab</span>
      <small>Verified</small>
    </a>

    <a href="urban.html" class="project-item">
      <span>🚍 Urban Mobility</span>
      <small>Verified</small>
    </a>

    <a href="labbaika.html" class="project-item">
      <span>🍞 Labbaika Bakery Center</span>
      <small>Verified</small>
    </a>

  </div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="projects.html"><span>📁</span>Projects</a>
  <a href="wallet.html"><span>💰</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="settings.html"><span>⚙️</span>Settings</a>
</nav>
  
  <p id="noResult" class="no-result" style="display:none">
    No project found.
  </p>

</section>

<script>
const searchInput = document.getElementById("projectSearch");
const projects = document.querySelectorAll(".project-item");
const noResult = document.getElementById("noResult");

searchInput.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase();
  let found = false;

  projects.forEach(p => {
    const text = p.innerText.toLowerCase();
    const match = text.includes(q);
    p.style.display = match ? "flex" : "none";
    if(match) found = true;
  });

  noResult.style.display = found ? "none" : "block";
});
</script>

</body>
  </html>
