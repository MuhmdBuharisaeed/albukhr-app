<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR – Internal Project Dashboard</title>

<style>
body{
  background:#f4f7f5;
  font-family:system-ui;
  margin:0
}
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px
}
.section{padding:16px}

.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px
}

h3,h4{margin:6px 0}

.meta{
  font-size:12px;
  color:#555
}

.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:11px;
  border-radius:20px;
  font-weight:700;
  margin-right:6px
}
.pending{background:#fff4cc;color:#8a6d00}
.approved{background:#e6f7ee;color:#0f7a3d}
.rejected{background:#fdecea;color:#b00020}

.stage{
  background:#eef1f0;
  padding:4px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:700
}

.filter{
  margin-bottom:14px
}
select{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  width:100%;
  font-size:14px
}

.empty{
  font-size:13px;
  color:#777;
  text-align:center;
  padding:20px
}
</style>
</head>

<body>

<div class="header">
  <h3>📊 Internal Project Dashboard</h3>
  <p style="font-size:13px;opacity:.9">
    Read-only overview of ALBUKHR internal projects
  </p>
</div>

<section class="section">

<div class="filter">
  <select onchange="filterProjects(this.value)">
    <option value="">All Projects</option>
    <option value="internal_approved">Approved</option>
    <option value="pending">Pending</option>
    <option value="internal_rejected">Rejected</option>
  </select>
</div>

<div id="dashboard"></div>

</section>

<script src="internal-registry.js"></script>

<script>
const box = document.getElementById("dashboard");
let cached = [];

function render(list){
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = `<div class="empty">No internal projects available</div>`;
    return;
  }

  list.forEach(p=>{
    const div = document.createElement("div");
    div.className = "card";

    const statusClass =
      p.status === "internal_approved" ? "approved" :
      p.status === "internal_rejected" ? "rejected" : "pending";

    div.innerHTML = `
      <h4>${p.projectName}</h4>

      <div class="meta">
        ${p.category} • Owner: ${p.creatorName}
      </div>

      <div style="margin:8px 0">
        <span class="badge ${statusClass}">
          ${p.status.replace("_"," ")}
        </span>
        <span class="stage">${p.stage || "Concept"}</span>
      </div>

      <details>
        <summary style="cursor:pointer;font-size:12px">
          View Summary
        </summary>
        <p style="font-size:13px"><b>Summary:</b><br>${p.summary}</p>
        <p style="font-size:13px"><b>Problem:</b><br>${p.problem}</p>
        <p style="font-size:13px"><b>Solution:</b><br>${p.solution}</p>
        <p style="font-size:13px"><b>Impact:</b><br>${p.impact || "-"}</p>
      </details>

      <div class="meta" style="margin-top:10px">
        Internal ID: <b>${p.internalId}</b><br>
        Created: ${new Date(p.createdAt).toLocaleDateString()}
      </div>
    `;

    box.appendChild(div);
  });
}

function filterProjects(status){
  if(!status){
    render(cached);
  }else{
    render(cached.filter(p=>p.status===status));
  }
}

function init(){
  cached = getInternalProjects();
  cached.sort((a,b)=>b.createdAt - a.createdAt);
  render(cached);
}

init();
</script>

</body>
</html>
