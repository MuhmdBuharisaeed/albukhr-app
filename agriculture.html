<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agriculture Project</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f7f6;padding-bottom:80px}
.header{background:#0f7a3d;color:#fff;padding:16px}
.section{padding:16px}
.stats{display:flex;gap:12px;margin:16px 0}
.stat-card{flex:1;background:#fff;border-radius:12px;padding:16px;text-align:center}
.tx{background:#fff;padding:12px;border-radius:10px;margin-bottom:8px}
.btns{display:flex;gap:12px}
.btn{flex:1;padding:14px;border-radius:10px;border:none;font-weight:bold}
.primary{background:#0f7a3d;color:#fff}
.secondary{background:#fff;border:1px solid #0f7a3d;color:#0f7a3d}

.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.4);display:none;
  align-items:center;justify-content:center
}
.modal-box{
  background:#fff;width:90%;max-width:400px;
  padding:20px;border-radius:12px
}
input,select{width:100%;padding:10px;margin-top:6px}
</style>
</head>

<body>

<header class="header">
  <h2>🌱 Agriculture Project</h2>
</header>

<section class="section">

  <p>Community-driven farming and food production initiative.</p>

  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="aStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="aReward">0.00 Pi</strong>
    </div>
  </div>

  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button class="btn secondary" onclick="history.back()">Back</button>
  </div>

  <h3 style="margin-top:20px">Transaction History</h3>
  <div id="agricHistory"></div>

</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Stake in Agriculture</h3>

    <label>Amount (Pi)</label>
    <input type="number" id="amount">

    <label>Duration</label>
    <select id="duration">
      <option value="30">30 Days</option>
      <option value="60">60 Days</option>
      <option value="90">90 Days</option>
    </select>

    <div class="btns" style="margin-top:16px">
      <button class="btn primary" onclick="stake()">Confirm</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- STAKING ENGINE -->
<script src="js/staking.js"></script>

<script>
function openModal(){
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

function stake(){
  const amount = Number(document.getElementById("amount").value);
  const duration = Number(document.getElementById("duration").value);

  if(!amount || amount<=0){
    alert("Invalid amount");
    return;
  }

  addStake({
    project:"Agriculture",
    amount,
    duration
  });

  closeModal();
  load();
}

function load(){
  const data = getProjectTotals("Agriculture");

  document.getElementById("aStake").innerText =
    data.stake.toFixed(2)+" Pi";
  document.getElementById("aReward").innerText =
    data.reward.toFixed(2)+" Pi";

  const box = document.getElementById("agricHistory");
  box.innerHTML = "";

  data.stakes.forEach(s=>{
    const d=document.createElement("div");
    d.className="tx";
    d.innerText =
      `${s.date} | ${s.amount} Pi | +${s.reward.toFixed(2)} Pi`;
    box.appendChild(d);
  });
}

load();
</script>

</body>
</html>
