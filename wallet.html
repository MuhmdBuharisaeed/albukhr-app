<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  font-family:Arial;
  padding-bottom:90px;
}

.section{padding:16px}

/* SUMMARY CARD */
.wallet-card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.wallet-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  font-size:14px;
}

.wallet-big{
  font-size:20px;
  font-weight:bold;
}

/* BUTTON */
.btn{
  background:#0f7a3d;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  width:100%;
  margin-top:10px;
  cursor:pointer;
}

/* TRANSACTION */
.tx-card{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}

.tx-icon{
  font-size:16px;
  width:26px;
  text-align:center;
}

.tx-body{flex:1}
.tx-title{font-size:14px;font-weight:600}
.tx-date{font-size:11px;color:#777}
.tx-address{font-size:11px;color:#555}

.tx-right{text-align:right}
.tx-amount{font-size:14px;font-weight:bold;color:#c0392b}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <span>Albukhr Wallet</span>
  </div>
</header>

<section class="section">

  <!-- SUMMARY -->
  <div class="wallet-card">
    <div class="wallet-row">
      <span>Locked Staking</span>
      <span id="locked">0.00 PI</span>
    </div>

    <div class="wallet-row">
      <span>Total Rewards</span>
      <span id="rewards">0.00 PI</span>
    </div>

    <div class="wallet-row">
      <span>Total Withdrawn</span>
      <span id="withdrawn">0.00 PI</span>
    </div>

    <hr>

    <div class="wallet-row wallet-big">
      <span>Available</span>
      <span id="available">0.00 PI</span>
    </div>

    <button class="btn" onclick="handleWithdraw()">Withdraw</button>
  </div>

  <!-- WITHDRAW HISTORY -->
  <h4 style="margin-bottom:8px;">Withdraw History</h4>
  <div id="withdrawList"></div>

</section>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const lockedEl = document.getElementById("locked");
const rewardsEl = document.getElementById("rewards");
const withdrawnEl = document.getElementById("withdrawn");
const availableEl = document.getElementById("available");
const withdrawList = document.getElementById("withdrawList");

/* LOAD SUMMARY */
function loadWallet(){

  const summary = getWalletSummary();

  lockedEl.textContent = summary.locked.toFixed(2) + " PI";
  rewardsEl.textContent = summary.rewards.toFixed(2) + " PI";
  withdrawnEl.textContent = summary.withdrawn.toFixed(2) + " PI";
  availableEl.textContent = summary.available.toFixed(2) + " PI";

  loadWithdrawHistory();
}

/* LOAD WITHDRAW HISTORY */
function loadWithdrawHistory(){

  const list = getWithdrawHistory();
  withdrawList.innerHTML = "";

  if(list.length === 0){
    withdrawList.innerHTML =
      "<p style='font-size:12px;color:#777'>No withdraw transactions yet</p>";
    return;
  }

  list.forEach(w=>{

    const d = new Date(w.createdAt);
    const date = d.toLocaleDateString();
    const time = d.toLocaleTimeString();

    const div = document.createElement("div");
    div.className = "tx-card";

    div.innerHTML = `
      <div class="tx-icon">💸</div>

      <div class="tx-body">
        <div class="tx-title">Withdraw</div>
        <div class="tx-date">${date} • ${time}</div>
        <div class="tx-address">To: ${w.walletAddress}</div>
      </div>

      <div class="tx-right">
        <div class="tx-amount">- ${Number(w.amount).toFixed(2)} PI</div>
      </div>
    `;

    withdrawList.appendChild(div);
  });
}

/* WITHDRAW ACTION */
function handleWithdraw(){

  const amount = prompt("Enter amount to withdraw:");
  if(!amount) return;

  const address = prompt("Enter wallet address:");
  if(!address) return;

  const result = requestWithdraw(amount, address);

  if(result.error){
    alert(result.error);
    return;
  }

  alert("Withdraw successful!");
  loadWallet();
}

loadWallet();
</script>

</body>
</html>
