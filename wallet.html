<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

.top-section{
  padding:16px;
  background:#f4f7f6;
  flex-shrink:0;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:13px;
}

.btn{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  width:100%;
  margin-top:14px;
}

.history-section{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.tx{
  border-bottom:1px solid #eee;
  padding:10px 0;
  font-size:13px;
}

.tx small{
  color:#777;
  font-size:11px;
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:90%;
  max-width:400px;
}

.modal input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-bottom:10px;
}

.preview{
  font-size:13px;
  margin-bottom:10px;
  color:#555;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.close-btn{
  background:#ddd;
  color:#333;
}
</style>
</head>

<body>

<div class="header">💰 ALBUKHR WALLET</div>

<div class="top-section">
  <div class="card">
    <div class="balance" id="available">0 PI</div>
    <div class="sub">Available Reward Balance</div>

    <div class="row"><div>Total Staked</div><div id="totalStake">0 PI</div></div>
    <div class="row"><div>Total Rewards</div><div id="totalReward">0 PI</div></div>
    <div class="row"><div>Total Withdrawn</div><div id="withdrawn">0 PI</div></div>

    <div class="sub" style="margin-top:8px;color:#999">
      Daily Limit: 50 Pi • Withdraw Fee: 1%
    </div>

    <button class="btn" onclick="openWithdraw()">Withdraw</button>
  </div>
</div>

<div class="history-section">
  <div class="card">
    <h4>Transaction History</h4>
    <div id="txList"></div>
  </div>
</div>

<div class="modal-overlay" id="withdrawModal">
<div class="modal">
<h3>Withdraw PI</h3>
<input type="number" id="withdrawAmount" placeholder="Amount" oninput="previewWithdraw()">
<input type="text" id="withdrawAddress" placeholder="Pi Wallet Address">

<div class="preview" id="previewBox"></div>

<div class="modal-actions">
<button class="btn" onclick="confirmWithdraw()">Confirm</button>
<button class="btn close-btn" onclick="closeModals()">Cancel</button>
</div>
</div>
</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

function renderWallet(){

  const summary = getWalletSummary();

  totalStake.innerText = Number(summary.totalStake || 0).toFixed(2) + " PI";
  totalReward.innerText = Number(summary.grossRewards || 0).toFixed(2) + " PI";
  withdrawn.innerText = Number(summary.withdrawn || 0).toFixed(2) + " PI";
  available.innerText = Number(summary.available || 0).toFixed(2) + " PI";

  renderHistory();
}

function renderHistory(){

  const list = getWithdrawHistory();
  txList.innerHTML="";

  if(!list.length){
    txList.innerHTML="<small>No withdrawals yet</small>";
    return;
  }

  list.forEach(tx=>{

    const div=document.createElement("div");
    div.className="tx";

    div.innerHTML=`
      <div><strong>- ${Number(tx.amount).toFixed(2)} PI</strong></div>
      <small>
        Fee: ${Number(tx.fee||0).toFixed(2)} PI |
        Received: ${Number(tx.net||0).toFixed(2)} PI
      </small><br>
      <small>${new Date(tx.timestamp).toLocaleString()}</small><br>
      <small>Wallet: ${tx.walletAddress}</small>
    `;

    txList.appendChild(div);
  });
}

function previewWithdraw(){

  const amt = parseFloat(withdrawAmount.value);

  if(!amt || amt<=0){
    previewBox.innerHTML="";
    return;
  }

  const fee = amt * 0.01;
  const net = amt - fee;

  previewBox.innerHTML = `
    Fee (1%): ${fee.toFixed(2)} PI <br>
    You will receive: ${net.toFixed(2)} PI
  `;
}

function openWithdraw(){
  withdrawModal.style.display="flex";
}

function closeModals(){
  withdrawModal.style.display="none";
}

function confirmWithdraw(){

  const amt = parseFloat(withdrawAmount.value);
  const addr = withdrawAddress.value.trim();

  const res = requestWithdraw(amt, addr);

  if(res.error){
    alert(res.error);
    return;
  }

  withdrawAmount.value="";
  withdrawAddress.value="";
  previewBox.innerHTML="";

  closeModals();
  renderWallet();
}

renderWallet();

</script>

</body>
  </html>
