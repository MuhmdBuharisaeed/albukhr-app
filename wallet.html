<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#f4f7f6;font-family:system-ui;margin:0}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
}

.section{padding:16px}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{font-size:12px;color:#666;margin-top:4px}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:13px;
}

.btn-group{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.btn.secondary{
  background:#eaf6ee;
  color:#0f7a3d;
}

.btn:disabled{opacity:.5;cursor:not-allowed}

.tx{
  border-bottom:1px solid #eee;
  padding:8px 0;
  font-size:13px;
}

.tx small{color:#777;font-size:11px}

/* ================= MODAL ================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.modal{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:90%;
  max-width:400px;
}

.modal h3{
  margin-top:0;
  color:#0f7a3d;
}

.modal input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-bottom:10px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.close-btn{
  background:#ddd;
  color:#333;
}
</style>
</head>

<body>

<div class="header">💰 ALBUKHR WALLET</div>

<section class="section">

  <!-- BALANCE -->
  <div class="card">
    <div class="balance" id="walletBalance">0 PI</div>
    <div class="sub">Available Balance</div>

    <div class="row">
      <div>Locked</div>
      <div id="walletLocked">0 PI</div>
    </div>

    <div class="row">
      <div>Rewards</div>
      <div id="walletRewards">0 PI</div>
    </div>

    <div class="btn-group">
      <button class="btn" onclick="openReceive()">Receive</button>
      <button class="btn secondary" onclick="openWithdraw()">Withdraw</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <h4>Transaction History</h4>
    <div id="txList"></div>
  </div>

</section>

<!-- RECEIVE MODAL -->
<div class="modal-overlay" id="receiveModal">
  <div class="modal">
    <h3>Receive PI</h3>
    <input type="number" id="receiveAmount" placeholder="Enter amount">
    <div class="modal-actions">
      <button class="btn" onclick="confirmReceive()">Confirm</button>
      <button class="btn close-btn" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div class="modal-overlay" id="withdrawModal">
  <div class="modal">
    <h3>Withdraw PI</h3>
    <input type="number" id="withdrawAmount" placeholder="Amount">
    <input type="text" id="withdrawAddress" placeholder="Pi Wallet Address">
    <div class="modal-actions">
      <button class="btn" onclick="confirmWithdraw()">Confirm</button>
      <button class="btn close-btn" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<script src="wallet-core.js"></script>

<script>
/* ================= INIT ================= */

function renderWallet(){
  const wallet = getWallet();

  walletBalance.innerText = wallet.balance.toFixed(2)+" PI";
  walletLocked.innerText = wallet.locked.toFixed(2)+" PI";
  walletRewards.innerText = wallet.rewards.toFixed(2)+" PI";

  renderTransactions(wallet.transactions);
}

function renderTransactions(list){
  txList.innerHTML = "";
  if(!list.length){
    txList.innerHTML="<small>No transactions yet</small>";
    return;
  }

  list.slice().reverse().forEach(tx=>{
    const div=document.createElement("div");
    div.className="tx";
    div.innerHTML=`
      <b>${tx.type.toUpperCase()}</b> — ${tx.amount||0} PI<br>
      <small>${new Date(tx.at).toLocaleString()}</small>
    `;
    txList.appendChild(div);
  });
}

/* ================= MODAL CONTROL ================= */

function openReceive(){
  receiveModal.style.display="flex";
}

function openWithdraw(){
  withdrawModal.style.display="flex";
}

function closeModals(){
  receiveModal.style.display="none";
  withdrawModal.style.display="none";
}

/* ================= ACTIONS ================= */

function confirmReceive(){
  const amt=parseFloat(receiveAmount.value);
  if(!amt || amt<=0) return alert("Invalid amount");

  walletReceive(amt,"manual_credit");
  closeModals();
  renderWallet();
}

function confirmWithdraw(){
  const amt=parseFloat(withdrawAmount.value);
  const addr=withdrawAddress.value.trim();

  if(!amt||amt<=0||!addr)
    return alert("Enter valid amount and address");

  walletRequestWithdraw(amt,addr);
  closeModals();
  renderWallet();
}

renderWallet();
</script>

</body>
</html>
