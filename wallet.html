style="display:none;margin:12px 16px;padding:12px;border-radius:10px;background:#e9f9ef;color:#0f7a3d;font-size:13px;font-weight:600;">  
Withdraw Successful  
</div><div class="scroll-area" id="projectContainer"></div><div class="modal-overlay" id="withdrawModal"><div class="modal"><h3 id="modalProject">Withdraw</h3><input id="withdrawAmount" type="number" placeholder="Amount">  
<input id="withdrawAddress" type="text" placeholder="Pi Wallet Address"><div class="modal-actions"><button class="btn" onclick="confirmWithdraw()">

<a href="news.html" class="dock-item">News</a>  </div><script src="staking.js"></script><script src="wallet-core.js"></script><script src="js/notifications.js"></script><script>  let activeProject = null

const withdrawModal =
document.getElementById("withdrawModal")

const withdrawAmount =
document.getElementById("withdrawAmount")

const withdrawAddress =
document.getElementById("withdrawAddress")

const modalProject =
document.getElementById("modalProject")

function toggleBody(el){

const body = el.nextElementSibling

body.style.display =
body.style.display==="block" ?
"none":"block"

}

function openWithdraw(project){

activeProject = project

modalProject.innerText =
"Withdraw from " + project

withdrawModal.style.display="flex"

}

function closeModal(){

withdrawModal.style.display="none"

}

function confirmWithdraw(){

const amt =
withdrawAmount.value.trim()

const addr =
withdrawAddress.value.trim()

if(!amt || Number(amt)<=0){

alert("Enter valid amount")
return

}

if(!addr){

alert("Enter Pi wallet address")
return

}

const res =
requestWithdraw({

project:activeProject,
amount:amt,
walletAddress:addr

})

if(res.error){

alert(res.error)
return

}

withdrawAmount.value=""
withdrawAddress.value=""

closeModal()

renderWallet()

}

function withdrawCapitalAction(project){

const res =
requestCapitalWithdraw(project)

if(res.error){

alert(res.error)
return

}

alert(
"Capital withdrawn: "

res.grossAmount.toFixed(2)

" Pi"
)


renderWallet()

}

renderWallet()

</script></body>
