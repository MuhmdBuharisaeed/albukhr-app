<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet Demo</title>
<link rel="stylesheet" href="style.css">

<style>
body{background:#f4f7f6;font-family:system-ui;margin:0}
.header{background:#0f7a3d;color:#fff;padding:16px;font-weight:700;text-align:center}
.section{padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.balance{font-size:26px;font-weight:800;color:#0f7a3d}
.sub{font-size:12px;color:#666;margin-top:4px}
.row{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
.btn-group{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border:none;border-radius:12px;background:#0f7a3d;color:#fff;font-weight:700;cursor:pointer}
.btn.secondary{background:#eaf6ee;color:#0f7a3d}
.tx{border-bottom:1px solid #eee;padding:8px 0;font-size:13px}
.tx small{color:#777;font-size:11px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:400px}
.modal input{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px}
.modal-actions{display:flex;gap:10px}
.close-btn{background:#ddd;color:#333}
</style>
</head>
<body>

<div class="header">💰 ALBUKHR WALLET DEMO</div>

<section class="section">

<!-- WALLET SUMMARY -->
<div class="card">
<div class="balance" id="available">0 PI</div>
<div class="sub">Available Reward Balance</div>

<div class="row">
<div>Total Staked</div>
<div id="totalStake">0 PI</div>
</div>

<div class="row">
<div>Total Rewards</div>
<div id="totalReward">0 PI</div>
</div>

<div class="row">
<div>Total Withdrawn</div>
<div id="withdrawn">0 PI</div>
</div>

<div class="btn-group">
<button class="btn" onclick="openReceive()">Receive</button>
<button class="btn secondary" onclick="openWithdraw()">Withdraw</button>
</div>
</div>

<!-- TRANSACTION HISTORY -->
<div class="card">
<h4>Transaction History</h4>
<div id="txList"></div>
</div>

</section>

<!-- RECEIVE MODAL -->
<div class="modal-overlay" id="receiveModal">
<div class="modal">
<h3>Receive PI</h3>
<input type="number" id="receiveAmount" placeholder="Enter amount">
<div class="modal-actions">
<button class="btn" onclick="confirmReceive()">Confirm</button>
<button class="btn close-btn" onclick="closeModals()">Cancel</button>
</div>
</div>
</div>

<!-- WITHDRAW MODAL -->
<div class="modal-overlay" id="withdrawModal">
<div class="modal">
<h3>Withdraw PI</h3>
<input type="number" id="withdrawAmount" placeholder="Amount">
<input type="text" id="withdrawAddress" placeholder="Pi Wallet Address">
<div class="modal-actions">
<button class="btn" onclick="confirmWithdraw()">Confirm</button>
<button class="btn close-btn" onclick="closeModals()">Cancel</button>
</div>
</div>
</div>

<script>
/* ===============================
   WALLET LEDGER SYSTEM
================================ */

const LEDGER_KEY = "albukhr_wallet_ledger_demo";

function getLedger(){ return JSON.parse(localStorage.getItem(LEDGER_KEY))||[]; }
function saveLedger(list){ localStorage.setItem(LEDGER_KEY, JSON.stringify(list)); }

function addTransaction({type, source="internal", projectId=null, amount=0, walletAddress=null, status="completed"}){
    if(!type||!amount) return false;
    const tx = { id:"TX-"+Date.now()+"-"+Math.floor(Math.random()*1000), type, source, projectId, amount, walletAddress, status, createdAt:Date.now() };
    const list = getLedger(); list.push(tx); saveLedger(list);
    return tx;
}

function getByType(type){ return getLedger().filter(t=>t.type===type&&t.status==="completed"); }
function getByProject(projectId){ return getLedger().filter(t=>t.projectId===projectId); }

function getTotalStake(){ return getByType("stake").reduce((sum,t)=>sum+t.amount,0); }
function getTotalRewards(){ return getByType("reward").reduce((sum,t)=>sum+t.amount,0); }
function getTotalWithdrawn(){ return getByType("withdraw").reduce((sum,t)=>sum+t.amount,0); }
function getTotalReceived(){ return getByType("receive").reduce((sum,t)=>sum+t.amount,0); }

function getAvailableBalance(){ return getTotalRewards()-getTotalWithdrawn(); }

/* ===============================
   PROJECTS
================================ */

const internalProjects = [
    {projectId:"P1", name:"Azman Features Makers Lab", staked:55, rewards:9.6},
    {projectId:"P2", name:"Laibaika Bakery Center", staked:50, rewards:8.2},
    {projectId:"P3", name:"Bash Agro", staked:40, rewards:5.5},
    {projectId:"P4", name:"Urban Mobility", staked:70, rewards:12.3},
    {projectId:"P5", name:"Khairat Organic Fertilizer", staked:60, rewards:10.0},
    {projectId:"P6", name:"Hauwal Sumonviter", staked:30, rewards:4.8},
    {projectId:"P7", name:"Raheem Pharmacy", staked:45, rewards:7.2}
];

function syncInternalProjects(){
    internalProjects.forEach(p=>{
        if(!getByProject(p.projectId).length){
            if(p.staked>0) addTransaction({type:"stake", projectId:p.projectId, amount:p.staked});
            if(p.rewards>0) addTransaction({type:"reward", projectId:p.projectId, amount:p.rewards});
        }
    });
}

/* ===============================
   WALLET UI
================================ */

function renderWallet(){
    totalStake.innerText=getTotalStake().toFixed(2)+" PI";
    totalReward.innerText=getTotalRewards().toFixed(2)+" PI";
    withdrawn.innerText=getTotalWithdrawn().toFixed(2)+" PI";
    available.innerText=getAvailableBalance().toFixed(2)+" PI";
    renderTransactions();
}

function renderTransactions(){
    const list = getLedger(); txList.innerHTML="";
    if(!list.length){ txList.innerHTML="<small>No transactions yet</small>"; return; }
    list.slice().reverse().forEach(tx=>{
        const div=document.createElement("div");
        div.className="tx";
        div.innerHTML=`<b>${tx.type.toUpperCase()}</b> — ${tx.amount} PI<br>${tx.projectId?"Project: "+tx.projectId+"<br>":""}${tx.walletAddress?"Wallet: "+tx.walletAddress+"<br>":""}<small>${new Date(tx.createdAt).toLocaleString()}</small>`;
        txList.appendChild(div);
    });
}

/* ===============================
   MODALS
================================ */

function openReceive(){ receiveModal.style.display="flex"; }
function openWithdraw(){ withdrawModal.style.display="flex"; }
function closeModals(){ receiveModal.style.display="none"; withdrawModal.style.display="none"; }

/* ===============================
   MODAL ACTIONS
================================ */

function confirmReceive(){
    const amt=parseFloat(receiveAmount.value);
    if(!amt||amt<=0) return alert("Invalid amount");
    addTransaction({type:"receive", amount:amt, source:"system"});
    closeModals(); renderWallet();
}

function confirmWithdraw(){
    const amt=parseFloat(withdrawAmount.value);
    const addr=withdrawAddress.value.trim();
    if(!amt||amt<=0||!addr) return alert("Enter valid amount and wallet address");
    if(amt>getAvailableBalance()) return alert("Insufficient reward balance");
    addTransaction({type:"withdraw", amount:amt, walletAddress:addr});
    closeModals(); renderWallet();
}

/* ===============================
   INIT
================================ */

syncInternalProjects();
renderWallet();
</script>

</body>
</html>
