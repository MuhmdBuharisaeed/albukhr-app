<style>

/* ===============================
   GLOBAL
================================*/

body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  padding-bottom:110px;
}


/* ===============================
   WALLET TABS
================================*/

.wallet-tabs{
  display:flex;
  gap:10px;
  padding:14px 16px;
  background:#f4f7f6;
}

.nav-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border:none;
  transition:.2s ease;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-wallet{
  background:#0f7a3d;
  color:#fff;
  box-shadow:0 4px 12px rgba(15,122,61,0.25);
}

.nav-trans{
  background:#fff;
  color:#0f7a3d;
  border:1px solid #dfeee7;
}


/* ===============================
   WALLET SUMMARY
================================*/

.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
}


/* ===============================
   PROJECT LIST AREA
================================*/

.scroll-area{
  padding:16px;
}


/* ===============================
   PROJECT CARD
================================*/

.project-card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(15,122,61,0.06);
  transition:.25s ease;
}

.project-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(15,122,61,0.12);
}

.project-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.project-title{
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}


/* ===============================
   PROJECT ICON
================================*/

.project-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:16px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:
    0 4px 12px rgba(15,122,61,0.15),
    inset 0 0 6px rgba(255,255,255,0.7);
  transition:.3s ease;
}

.project-card:hover .project-icon{
  transform:scale(1.08);
}

/* ===============================
   BUTTONS
================================*/

.btn{
  padding:9px 14px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:12px;
  transition:.2s ease;
}

.btn:hover{
  background:#0c5f2f;
  transform:scale(1.03);
}


/* ===============================
   WITHDRAW MODAL
================================*/

.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
pointer-events:none;
}

.modal-overlay.active{
display:flex;
pointer-events:auto;
   }

.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:400px;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
}

.modal h3{
  margin-top:0;
}

.modal input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:13px;
}

.modal-actions{
  display:flex;
  gap:10px;
}


/* ===============================
   ALBUKHR HEADER
================================*/

.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
}

.main-logo{
  height:54px;
  width:auto;
}

.withdraw-box{
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.withdraw-box input{
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:12px;
   }
  .project-body{
display:none;
margin-top:12px;
border-top:1px solid #eee;
padding-top:10px;
  }
  </style>
  
<link rel="stylesheet" href="style.css">  
<link rel="stylesheet" href="css/global-header.css">  
<link rel="stylesheet" href="global-buttons.css">
</head>

<script>

const withdrawSuccessBox =
document.getElementById("withdrawSuccessBox");

let lastWithdrawTime = 0;

window.addEventListener("walletUpdated", function(e){

if(!e.detail) return;

const data = e.detail;

/* Capital withdraw only */
if(data.type === "capital-withdraw"){

const now = Date.now();

if(now - lastWithdrawTime < 1000) return;

lastWithdrawTime = now;

showWithdrawSuccess();

}

});

function showWithdrawSuccess(){

withdrawSuccessBox.style.display = "block";

withdrawSuccessBox.textContent =
"Capital Withdraw Successful ✓";

setTimeout(()=>{

withdrawSuccessBox.style.display = "none";

},4000);

}

</script>

<script>
const current = location.pathname.split("/").pop();

document.querySelectorAll(".dock-item").forEach(link=>{
  if(link.getAttribute("href") === current){
    link.classList.add("active");
  }
});
</script>
  
<script>

document.addEventListener("DOMContentLoaded", function(){

let activeProject = null;

/* GET MODAL ELEMENTS */
const withdrawModal = document.getElementById("withdrawModal");
const withdrawAddress = document.getElementById("withdrawAddress");
const modalProject = document.getElementById("modalProject");

/* =========================
   OPEN WITHDRAW
========================= */
window.openWithdraw = function(project){

activeProject = project;

const withdrawModal =
document.getElementById("withdrawModal");

const withdrawAddress =
document.getElementById("withdrawAddress");

const modalProject =
document.getElementById("modalProject");

const capitalAvailable =
document.getElementById("capitalAvailable");

/* Safety check */

if(!withdrawModal || !modalProject || !withdrawAddress){
console.error("Withdraw modal elements missing");
return;
}

const breakdown =
(getProjectWalletBreakdown() || [])
.find(p=>p.project===project) || {};

const capital =
Number(breakdown.withdrawableCapital || 0);

if(capital <= 0){
alert("No capital available for withdraw");
return;
}

capitalAvailable.innerText =
capital.toFixed(2) + " Pi";

modalProject.innerText =
"Withdraw from " + project;

withdrawAddress.value = "";

withdrawModal.classList.add("active");

}

withdrawModal.addEventListener("click", function(e){

if(e.target === withdrawModal){
closeModal();
}

});

/* =========================
   CLOSE MODAL
========================= */

window.closeModal = function(){

withdrawModal.classList.remove("active");

setTimeout(()=>{
withdrawModal.style.display="none";
},100);

activeProject = null;

}

/* =========================
   PROJECT ICON
========================= */

function getProjectIcon(name){

const key =
typeof normalizeProjectName === "function"
? normalizeProjectName(name)
: name;

if(
typeof PROJECT_CONFIG !== "undefined" &&
PROJECT_CONFIG[key]?.icon
){
return PROJECT_CONFIG[key].icon;
}

/* fallback icons */

const n = name.toLowerCase();

if(n.includes("raheem")) return "💊";
if(n.includes("barsh")) return "🌾";
if(n.includes("azman")) return "🧪";
if(n.includes("khairat")) return "♻️";
if(n.includes("urban")) return "🚍";
if(n.includes("hauwal")) return "🌽";
if(n.includes("labbaika")) return "🍞";

return "🏢";

   }

/* =========================
   WALLET SUMMARY
========================= */

function renderWallet(){

const summary = getWalletSummary() || {};

document.getElementById("totalStake").innerText =
Number(summary.totalStake || 0).toFixed(2) + " Pi";

document.getElementById("totalReward").innerText =
Number(summary.grossRewards || 0).toFixed(2) + " Pi";

document.getElementById("withdrawn").innerText =
Number(summary.withdrawn || 0).toFixed(2) + " Pi";

document.getElementById("available").innerText =
Number(summary.withdrawableCapital || 0).toFixed(2) + " Pi";

renderProjects();

}

/* Auto refresh */
window.addEventListener("walletUpdated", renderWallet);

/* =========================
   RENDER PROJECTS
========================= */
function renderProjects(){

const container =
document.getElementById("projectContainer");

container.innerHTML="";

if(typeof getProjectWalletBreakdown !== "function"){
container.innerHTML =
"<small>Wallet engine not ready</small>";
return;
}

const breakdown =
getProjectWalletBreakdown() || [];

if(!breakdown.length){

container.innerHTML=
"<small>No activity yet</small>";

return;
}

breakdown.sort(
(a,b)=>
(b.withdrawableCapital||0)-
(a.withdrawableCapital||0)
);

breakdown.forEach(p=>{

const card =
document.createElement("div");

card.className="project-card";

card.innerHTML = `

<div class="project-header"
onclick="toggleBody(this,event)"
<div class="project-title">

<div class="project-icon">
${getProjectIcon(p.project)}
</div>

${p.project}

</div>

<div>
${(p.withdrawableCapital || 0).toFixed(2)} Pi
</div>

</div>

<div class="project-body">

<div class="row">
<div>Staked</div>
<div>${(p.stake || 0).toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Gross Reward</div>
<div>${(p.grossReward || 0).toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Capital Available</div>
<div>
${(p.withdrawableCapital || 0).toFixed(2)} Pi
</div>
</div>

<div class="row">
<div>Withdrawn Capital</div>
<div>
${(p.withdrawnCapital || 0).toFixed(2)} Pi
</div>
</div>

<div class="withdraw-box">

<button class="btn"
style="width:100%"
onclick="event.stopPropagation(); openWithdraw('${p.project}')">

Withdraw Capital

</button>

</div>

</div>

`;

container.appendChild(card);

});

}

/* =========================
   TOGGLE PROJECT BODY
========================= */

window.toggleBody = function(el,event){

if(event && event.target.closest("button")) return;

const card = el.closest(".project-card");
const body = card.querySelector(".project-body");

body.style.display =
body.style.display === "block"
? "none"
: "block";

   }

/* =========================
   CONFIRM CAPITAL WITHDRAW
========================= */

window.confirmCapitalWithdraw = function(){

if(!activeProject){
alert("No project selected");
return;
}

const address =
withdrawAddress.value.trim();

if(!address){
alert("Enter Pi wallet address");
return;
}

const res =
requestCapitalWithdraw(activeProject);

if(res?.error){
alert(res.error);
return;
}

withdrawAddress.value = "";

closeModal();

renderWallet();

window.dispatchEvent(
new CustomEvent("walletUpdated",{
detail:{type:"capital-withdraw"}
})
);

}

/* START WALLET */

renderWallet();

});

</script>
