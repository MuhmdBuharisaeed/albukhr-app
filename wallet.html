</script>  <script>

let activeProject = null;

function getProjectIcon(name){
if(name.toLowerCase().includes("raheem")) return "💊";
if(name.toLowerCase().includes("barsh")) return "🌾";
if(name.toLowerCase().includes("azman")) return "🧪";
if(name.toLowerCase().includes("khairat")) return "♻️";
if(name.toLowerCase().includes("urban")) return "🚍";
if(name.toLowerCase().includes("hauwal")) return "🌽";
if(name.toLowerCase().includes("labbaika")) return "🍞";
return "🏢";
}

function renderWallet(){
const summary = getWalletSummary();
totalStake.innerText = summary.totalStake.toFixed(2) + " Pi";
totalReward.innerText = summary.grossRewards.toFixed(2) + " Pi";
withdrawn.innerText = summary.withdrawn.toFixed(2) + " Pi";
available.innerText = summary.available.toFixed(2) + " Pi";
renderProjects();
}

function renderProjects(){

const container = document.getElementById("projectContainer");
container.innerHTML="";

const breakdown = getProjectWalletBreakdown();
const history = getWithdrawHistory();

const projectNames = new Set();

breakdown.forEach(p => projectNames.add(p.project));
history.forEach(tx => {
if(tx.project) projectNames.add(tx.project);
});

const projects = Array.from(projectNames).map(name => {

const stakeData = breakdown.find(p => p.project === name);    

return stakeData || {    
  project: name,    
  stake: 0,    
  grossReward: 0,    
  withdrawn: history    
    .filter(tx => tx.project === name)    
    .reduce((sum,tx)=>sum+Number(tx.grossAmount||0),0),    
  netReward: 0    
};

});

if(!projects.length){
container.innerHTML="<small>No activity yet</small>";
return;
}

projects.forEach(p=>{

const card = document.createElement("div");    
card.className="project-card";    

card.innerHTML = `    
  <div class="project-header" onclick="toggleBody(this)">    
    <div class="project-title">    
      <div class="project-icon">    
        ${getProjectIcon(p.project)}    
      </div>    
      ${p.project}    
    </div>    
    <div>${(p.netReward || 0).toFixed(2)} Pi</div>    
  </div>    

  <div class="project-body">    

    <div class="row">    
      <div>Staked</div>    
      <div>${(p.stake || 0).toFixed(2)} Pi</div>    
    </div>    

    <div class="row">    
      <div>Gross Reward</div>    
      <div>${(p.grossReward || 0).toFixed(2)} Pi</div>    
    </div>    

    <div class="row">    
      <div>Withdrawn</div>    
      <div>${(p.withdrawn || 0).toFixed(2)} Pi</div>    
    </div>    

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">    
      <button class="btn"    
        onclick="openWithdraw('${p.project}')">    
        Reward Withdraw    
      </button>    

      <button class="btn"    
        style="background:#333"    
        onclick="withdrawCapitalAction('${p.project}')">    
        Capital Withdraw    
      </button>    
    </div>    

    <div id="history-${p.project}"></div>    

  </div>    
`;    

container.appendChild(card);    
renderProjectHistory(p.project);

});
}

function toggleBody(el){
const body = el.nextElementSibling;
body.style.display =
body.style.display==="block" ? "none":"block";
}

function renderProjectHistory(project){

const div = document.getElementById("history-"+project);
if(!div) return;

const history = getWithdrawHistory()
.filter(tx=>tx.project===project)
.sort((a,b)=>b.timestamp-a.timestamp);

if(!history.length){
div.innerHTML="<small>No withdrawals yet</small>";
return;
}

div.innerHTML="";

history.forEach(tx=>{
div.innerHTML +=     <div class="tx">     <div class="tx-left">     <div class="tx-icon">     ${getProjectIcon(project)}     </div>     <div>     Withdraw     <small>${new Date(tx.timestamp).toLocaleString()}</small>     </div>     </div>     <div class="tx-right">     -${tx.grossAmount.toFixed(2)} Pi     <small>     Fee: ${tx.fee.toFixed(2)} |     Received: ${tx.received.toFixed(2)}     </small>     </div>     </div>    ;
});
}

function openWithdraw(project){
activeProject = project;
modalProject.innerText = "Withdraw from " + project;
withdrawModal.style.display="flex";
}

function closeModal(){
withdrawModal.style.display="none";
}

/* ===============================
SECURITY PIN ENGINE
================================ */

const PIN_KEY = "albukhr_wallet_pin";
const LOCK_KEY = "albukhr_wallet_lock";

function getSecurity(){
try{
return JSON.parse(localStorage.getItem("albukhr_security_settings")) || {};
}catch{
return {};
}
}

function isLocked(){
const lockUntil = Number(localStorage.getItem(LOCK_KEY));
if(!lockUntil) return false;

if(Date.now() > lockUntil){
localStorage.removeItem(LOCK_KEY);
return false;
}

return true;
}

function lockWallet(seconds=30){
localStorage.setItem(LOCK_KEY, Date.now() + (seconds*1000));
}

function setPin(pin){
localStorage.setItem(PIN_KEY, pin);
}

function verifyPin(){
const saved = localStorage.getItem(PIN_KEY);
if(!saved){
alert("No PIN set. Set PIN in Security Settings.");
return false;
}

const input = prompt("Enter Wallet PIN:");
if(!input) return false;

if(input === saved){
return true;
}

// failed attempt logic
let attempts = Number(localStorage.getItem("albukhr_pin_attempts") || 0);
attempts++;
localStorage.setItem("albukhr_pin_attempts", attempts);

if(attempts >= 3){
lockWallet(30);
localStorage.removeItem("albukhr_pin_attempts");
alert("Too many failed attempts. Wallet locked for 30 seconds.");
}else{
alert("Incorrect PIN");
}

return false;
}

function isSecurityEnabled(){
try{
const s = JSON.parse(localStorage.getItem("albukhr_security_settings"));
return s?.enabled === true;
}catch{
return false;
}
}

function isValidPiAddress(addr){
if(!addr) return false;

addr = addr.trim();

if(addr.length < 20) return false;
if(!addr.startsWith("G")) return false;

return true;
}

function confirmWithdraw(){

if(isLocked()){
alert("Wallet temporarily locked. Try again later.");
return;
}

const amt  = withdrawAmount.value.trim();
const addr = withdrawAddress.value.trim();

/* ===== AMOUNT VALIDATION ===== */
if(!amt || Number(amt) <= 0){
alert("Enter valid withdraw amount");
return;
}

/* ===== ADDRESS IS NOW ALWAYS REQUIRED ===== */
if(!isValidPiAddress(addr)){
alert("Valid Pi wallet address required");
return;
}

/* ===== SECURITY PIN CHECK ===== */
const security = getSecurity();

if(security.enabled && security.twofa){
if(!verifyPin()){
return;
}
}

/* ===== PROCESS WITHDRAW ===== */
const res = requestWithdraw({
project: activeProject,
amount: amt,
walletAddress: addr
});

if(res.error){
alert(res.error);
return;
}

withdrawAmount.value="";
withdrawAddress.value="";
closeModal();
renderWallet();
}

function withdrawCapitalAction(project){

const res = requestCapitalWithdraw(project);

if(res?.error){
alert(res.error);
return;
}

alert("Capital withdrawn: " + res.grossAmount.toFixed(2) + " Pi");

renderWallet();
}

function handleCapitalWithdraw(project){

const res = requestCapitalWithdraw(project);

if(res.error){
alert(res.error);
return;
}

alert("Capital returned: " + res.amount.toFixed(2) + " Pi");

renderWallet();
}

renderWallet();

</script>  <script>

const withdrawSuccessBox = document.getElementById("withdrawSuccessBox");

/* Track last withdraw timestamp */
let lastWithdrawTime = 0;

/* Listen for wallet updates */
window.addEventListener("walletUpdated", function(e){

if(!e.detail) return;

const data = e.detail;

/* Idan withdraw ne */
if(data.type === "reward-withdraw" || data.type === "capital-withdraw"){

const now = Date.now();    

/* Kauce wa duplicate show */    
if(now - lastWithdrawTime < 1000) return;    

lastWithdrawTime = now;    

showWithdrawSuccess();

}

});

function showWithdrawSuccess(){

withdrawSuccessBox.style.display = "block";
withdrawSuccessBox.textContent = "Withdraw Successful ✓";

/* Auto hide after 4 seconds */
setTimeout(()=>{
withdrawSuccessBox.style.display = "none";
},4000);
}

</script>  </body>
