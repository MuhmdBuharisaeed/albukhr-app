<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.balance{
  font-size:24px;
  font-weight:800;
  color:#0f7a3d;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-top:6px;
}

.tabs{
  display:flex;
  background:#fff;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.tab{
  flex:1;
  padding:12px;
  text-align:center;
  cursor:pointer;
  font-weight:600;
}

.tab.active{
  border-bottom:3px solid #0f7a3d;
  color:#0f7a3d;
}

.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* PROJECT CARD */
.project-card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.project-header{
  display:flex;
  justify-content:space-between;
  cursor:pointer;
  font-weight:700;
}

.project-body{
  display:none;
  margin-top:10px;
}

.btn{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#0f7a3d;
  color:#fff;
  font-size:12px;
  cursor:pointer;
}

/* TRANSACTIONS */
.tx{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  font-size:13px;
}

.tx small{
  color:#777;
  display:block;
  margin-top:4px;
  font-size:11px;
}

.tx.stake{border-left:4px solid #0f7a3d;}
.tx.withdraw{border-left:4px solid #c0392b;}
</style>
</head>

<body>

<div class="header">ALBUKHR WALLET</div>

<div class="summary">
  <div class="balance" id="available">0.00 Pi</div>
  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0.00</div>
  </div>
  <div class="row">
    <div>Total Rewards</div>
    <div id="totalReward">0.00</div>
  </div>
  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0.00</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('overview',this)">Overview</div>
  <div class="tab" onclick="switchTab('tx',this)">Transactions</div>
</div>

<div class="scroll-area" id="contentArea"></div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

let currentTab = "overview";

function switchTab(tab,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  currentTab = tab;
  renderContent();
}

function renderWalletSummary(){
  const s = getWalletSummary();
  totalStake.innerText = s.totalStake.toFixed(2)+" Pi";
  totalReward.innerText = s.grossRewards.toFixed(2)+" Pi";
  withdrawn.innerText = s.withdrawn.toFixed(2)+" Pi";
  available.innerText = s.available.toFixed(2)+" Pi";
}

function renderContent(){
  const area = document.getElementById("contentArea");
  area.innerHTML="";

  if(currentTab==="overview"){
    renderProjects(area);
  }else{
    renderGlobalTransactions(area);
  }
}

/* ===== PROJECT OVERVIEW ===== */
function renderProjects(area){

  const projects = getProjectWalletBreakdown();

  if(!projects.length){
    area.innerHTML="<small>No staking activity yet</small>";
    return;
  }

  projects.forEach(p=>{
    const card = document.createElement("div");
    card.className="project-card";

    card.innerHTML=`
      <div class="project-header" onclick="toggleBody(this)">
        <div>${p.project}</div>
        <div>${p.netReward.toFixed(2)} Pi</div>
      </div>
      <div class="project-body">
        <div class="row"><div>Stake</div><div>${p.stake.toFixed(2)}</div></div>
        <div class="row"><div>Gross Reward</div><div>${p.grossReward.toFixed(2)}</div></div>
        <div class="row"><div>Withdrawn</div><div>${p.withdrawn.toFixed(2)}</div></div>
      </div>
    `;

    area.appendChild(card);
  });
}

function toggleBody(el){
  const body = el.nextElementSibling;
  body.style.display = body.style.display==="block"?"none":"block";
}

/* ===== GLOBAL LEDGER ===== */
function renderGlobalTransactions(area){

  let stakeHistory = [];
  if(typeof getStakeHistory === "function"){
    stakeHistory = getStakeHistory();
  }

  const withdrawHistory = getWithdrawHistory();

  const merged = [
    ...stakeHistory.map(s=>({
      type:"stake",
      project:s.project,
      amount:s.amount,
      timestamp:s.timestamp
    })),
    ...withdrawHistory.map(w=>({
      type:"withdraw",
      project:w.project,
      gross:w.grossAmount,
      fee:w.fee,
      received:w.received,
      timestamp:w.timestamp
    }))
  ];

  merged.sort((a,b)=> b.timestamp - a.timestamp);

  if(!merged.length){
    area.innerHTML="<small>No transactions yet</small>";
    return;
  }

  merged.forEach(tx=>{
    if(tx.type==="stake"){
      area.innerHTML += `
        <div class="tx stake">
          +${tx.amount.toFixed(2)} Pi Staked
          <small>
          Project: ${tx.project}<br>
          ${new Date(tx.timestamp).toLocaleString()}
          </small>
        </div>
      `;
    }else{
      area.innerHTML += `
        <div class="tx withdraw">
          -${tx.gross.toFixed(2)} Pi Withdraw
          <small>
          Project: ${tx.project}<br>
          Fee: ${tx.fee.toFixed(2)} Pi<br>
          Received: ${tx.received.toFixed(2)} Pi<br>
          ${new Date(tx.timestamp).toLocaleString()}
          </small>
        </div>
      `;
    }
  });
}

renderWalletSummary();
renderContent();

</script>

</body>
</html>
