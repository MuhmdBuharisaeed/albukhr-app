<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.balance{
  font-size:24px;
  font-weight:800;
  color:#0f7a3d;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-top:6px;
}

.withdraw-btn{
  margin-top:12px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.tabs{
  display:flex;
  background:#fff;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.tab{
  flex:1;
  padding:12px;
  text-align:center;
  cursor:pointer;
  font-weight:600;
}

.tab.active{
  border-bottom:3px solid #0f7a3d;
  color:#0f7a3d;
}

.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* Recent style */
.tx-card{
  background:#fff;
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.tx-icon{
  font-size:20px;
}

.tx-body{
  flex:1;
}

.tx-title{
  font-size:14px;
  font-weight:600;
}

.tx-date{
  font-size:11px;
  color:#777;
}

.tx-right{
  text-align:right;
}

.tx-amount{
  font-size:14px;
  font-weight:700;
}

.tx-green{color:#0f7a3d;}
.tx-red{color:#c0392b;}
</style>
</head>

<body>

<div class="header">ALBUKHR WALLET</div>

<div class="summary">
  <div class="balance" id="available">0.00 Pi</div>

  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0.00</div>
  </div>

  <div class="row">
    <div>Total Rewards</div>
    <div id="totalReward">0.00</div>
  </div>

  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0.00</div>
  </div>

  <button class="withdraw-btn" onclick="goWithdraw()">
    Withdraw Rewards
  </button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('overview',this)">Overview</div>
  <div class="tab" onclick="switchTab('tx',this)">Transactions</div>
</div>

<div class="scroll-area" id="contentArea"></div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

let currentTab = "overview";

/* ICON MAP (Expandable for future projects) */
function getProjectIcon(name){
  const icons = {
    "Raheem":"💊",
    "KUK":"🏗️",
    "Default":"🏢"
  };
  return icons[name] || icons["Default"];
}

function switchTab(tab,el){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  currentTab = tab;
  renderContent();
}

function renderSummary(){
  const s = getWalletSummary();

  totalStake.innerText  = s.totalStake.toFixed(2)+" Pi";
  totalReward.innerText = s.grossRewards.toFixed(2)+" Pi";
  withdrawn.innerText   = s.withdrawn.toFixed(2)+" Pi";
  available.innerText   = s.available.toFixed(2)+" Pi";
}

/* WITHDRAW BUTTON */
function goWithdraw(){
  if(typeof openWithdrawModal === "function"){
    openWithdrawModal();
  }else{
    alert("Withdraw system not ready");
  }
}

/* OVERVIEW */
function renderOverview(area){
  const projects = getProjectWalletBreakdown();

  if(!projects.length){
    area.innerHTML="<small>No staking activity yet</small>";
    return;
  }

  projects.forEach(p=>{
    area.innerHTML += `
      <div class="tx-card">
        <div class="tx-icon">${getProjectIcon(p.project)}</div>
        <div class="tx-body">
          <div class="tx-title">${p.project}</div>
          <div class="tx-date">
            Stake: ${p.stake.toFixed(2)} Pi
          </div>
        </div>
        <div class="tx-right">
          <div class="tx-amount tx-green">
            ${p.netReward.toFixed(2)} Pi
          </div>
          <div class="tx-date">Available Reward</div>
        </div>
      </div>
    `;
  });
}

/* GLOBAL TRANSACTIONS */
function renderTransactions(area){

  let stakeHistory = [];
  if(typeof getStakeHistory === "function"){
    stakeHistory = getStakeHistory();
  }

  const withdrawHistory = getWithdrawHistory();

  const merged = [
    ...stakeHistory.map(s=>({
      type:"stake",
      project:s.project,
      amount:s.amount,
      timestamp:s.timestamp
    })),
    ...withdrawHistory.map(w=>({
      type:"withdraw",
      project:w.project,
      gross:w.grossAmount,
      fee:w.fee,
      received:w.received,
      timestamp:w.timestamp
    }))
  ];

  merged.sort((a,b)=> b.timestamp - a.timestamp);

  if(!merged.length){
    area.innerHTML="<small>No transactions yet</small>";
    return;
  }

  merged.forEach(tx=>{

    const icon = getProjectIcon(tx.project);
    const date = new Date(tx.timestamp).toLocaleString();

    if(tx.type==="stake"){
      area.innerHTML += `
        <div class="tx-card">
          <div class="tx-icon">${icon}</div>
          <div class="tx-body">
            <div class="tx-title">${tx.project} Stake</div>
            <div class="tx-date">${date}</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount tx-green">
              +${tx.amount.toFixed(2)} Pi
            </div>
          </div>
        </div>
      `;
    }else{
      area.innerHTML += `
        <div class="tx-card">
          <div class="tx-icon">${icon}</div>
          <div class="tx-body">
            <div class="tx-title">${tx.project} Withdraw</div>
            <div class="tx-date">
              Fee: ${tx.fee.toFixed(2)} Pi<br>
              Received: ${tx.received.toFixed(2)} Pi<br>
              ${date}
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amount tx-red">
              -${tx.gross.toFixed(2)} Pi
            </div>
          </div>
        </div>
      `;
    }

  });
}

function renderContent(){
  const area = document.getElementById("contentArea");
  area.innerHTML="";

  if(currentTab==="overview"){
    renderOverview(area);
  }else{
    renderTransactions(area);
  }
}

renderSummary();
renderContent();

</script>

</body>
</html>
