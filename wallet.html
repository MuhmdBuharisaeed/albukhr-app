<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#f4f7f6;font-family:system-ui;margin:0}
.header{background:#0f7a3d;color:#fff;padding:16px;font-weight:700;text-align:center}
.section{padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.balance{font-size:26px;font-weight:800;color:#0f7a3d}
.sub{font-size:12px;color:#666;margin-top:4px}
.row{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
.btn-group{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border:none;border-radius:12px;background:#0f7a3d;color:#fff;font-weight:700;cursor:pointer}
.btn.secondary{background:#eaf6ee;color:#0f7a3d}
.tx{border-bottom:1px solid #eee;padding:8px 0;font-size:13px}
.tx small{color:#777;font-size:11px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:400px}
.modal input{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px}
.modal-actions{display:flex;gap:10px}
.close-btn{background:#ddd;color:#333}
.type{font-weight:700}
.stake{color:#0f7a3d}
.reward{color:#0a58ca}
.withdraw{color:#c0392b}
.receive{color:#6c757d}
</style>
</head>

<body>

<div class="header">💰 ALBUKHR WALLET</div>

<section class="section">

<div class="card">
<div class="balance" id="available">0 PI</div>
<div class="sub">Available Reward Balance</div>

<div class="row">
<div>Total Staked</div>
<div id="totalStake">0 PI</div>
</div>

<div class="row">
<div>Total Rewards</div>
<div id="totalReward">0 PI</div>
</div>

<div class="row">
<div>Total Withdrawn</div>
<div id="withdrawn">0 PI</div>
</div>

<div class="btn-group">
<button class="btn" onclick="openReceive()">Receive</button>
<button class="btn secondary" onclick="openWithdraw()">Withdraw</button>
</div>
</div>

<div class="card">
<h4>Transaction History</h4>
<div id="txList"></div>
</div>

</section>

<!-- RECEIVE MODAL -->
<div class="modal-overlay" id="receiveModal">
<div class="modal">
<h3>Receive PI (Manual Test)</h3>
<input type="number" id="receiveAmount" placeholder="Enter amount">
<div class="modal-actions">
<button class="btn" onclick="confirmReceive()">Confirm</button>
<button class="btn close-btn" onclick="closeModals()">Cancel</button>
</div>
</div>
</div>

<!-- WITHDRAW MODAL -->
<div class="modal-overlay" id="withdrawModal">
<div class="modal">
<h3>Withdraw Reward</h3>
<input type="number" id="withdrawAmount" placeholder="Amount">
<input type="text" id="withdrawAddress" placeholder="Pi Wallet Address">
<div class="modal-actions">
<button class="btn" onclick="confirmWithdraw()">Confirm</button>
<button class="btn close-btn" onclick="closeModals()">Cancel</button>
</div>
</div>
</div>

<script src="wallet-ledger.js"></script>
<script src="staking-engine.js"></script>
<script src="reward-engine.js"></script>

<script>

/* ================= RENDER ================= */

function renderWallet(){

document.getElementById("totalStake").innerText =
getTotalStake().toFixed(2)+" PI";

document.getElementById("totalReward").innerText =
getTotalRewards().toFixed(2)+" PI";

document.getElementById("withdrawn").innerText =
getTotalWithdrawn().toFixed(2)+" PI";

document.getElementById("available").innerText =
getAvailableReward().toFixed(2)+" PI";

renderHistory();
}

/* ================= HISTORY ================= */

function renderHistory(){

const list = getLedger();
const txList = document.getElementById("txList");
txList.innerHTML="";

if(!list.length){
txList.innerHTML="<small>No transactions yet</small>";
return;
}

list.slice().reverse().forEach(tx=>{

const div=document.createElement("div");
div.className="tx";

let typeClass = tx.type;

div.innerHTML=`
<div class="type ${typeClass}">
${tx.type.toUpperCase()} — ${tx.amount.toFixed(2)} PI
</div>
${tx.project ? "Project: "+tx.project+"<br>" : ""}
${tx.wallet ? "Wallet: "+tx.wallet+"<br>" : ""}
<small>${new Date(tx.createdAt).toLocaleString()}</small>
`;

txList.appendChild(div);
});
}

/* ================= MODAL ================= */

function openReceive(){
document.getElementById("receiveModal").style.display="flex";
}

function openWithdraw(){
document.getElementById("withdrawModal").style.display="flex";
}

function closeModals(){
document.getElementById("receiveModal").style.display="none";
document.getElementById("withdrawModal").style.display="none";
}

/* ================= ACTIONS ================= */

function confirmReceive(){

const amt=parseFloat(document.getElementById("receiveAmount").value);
if(!amt||amt<=0) return alert("Invalid amount");

addTransaction("receive","manual",amt,"internal");

closeModals();
renderWallet();
}

function confirmWithdraw(){

const amt=parseFloat(document.getElementById("withdrawAmount").value);
const addr=document.getElementById("withdrawAddress").value.trim();

if(!amt||amt<=0||!addr)
return alert("Enter valid amount and address");

if(amt>getAvailableReward())
return alert("Insufficient reward balance");

addTransaction("withdraw","reward_pool",amt,addr);

closeModals();
renderWallet();
}

renderWallet();

</script>

</body>
  </html>
