<script>

const withdrawSuccessBox =
document.getElementById("withdrawSuccessBox");

let lastWithdrawTime = 0;

window.addEventListener("walletUpdated", function(e){

if(!e.detail) return;

const data = e.detail;

/* Capital withdraw only */
if(data.type === "capital-withdraw"){

const now = Date.now();

if(now - lastWithdrawTime < 1000) return;

lastWithdrawTime = now;

showWithdrawSuccess();

}

});

function showWithdrawSuccess(){

withdrawSuccessBox.style.display = "block";

withdrawSuccessBox.textContent =
"Capital Withdraw Successful ✓";

setTimeout(()=>{

withdrawSuccessBox.style.display = "none";

},4000);

}

</script>

<script>
const current = location.pathname.split("/").pop();

  }
});
</script>
  
<script>

document.addEventListener("DOMContentLoaded", function(){

/* =========================
   RENDER FEED
========================= */

function renderFeed(){

const feed =
JSON.parse(
localStorage.getItem("albukhr_project_feed")
) || [];

const container =
document.getElementById("projectFeed");

container.innerHTML="";

if(!feed.length){

container.innerHTML=
"<small>No project updates yet</small>";

return;

}

const likes =
JSON.parse(localStorage.getItem("albukhr_likes")) || {};

const dislikes =
JSON.parse(localStorage.getItem("albukhr_dislikes")) || {};

const comments =
JSON.parse(localStorage.getItem("albukhr_comments")) || {};

feed
.sort((a,b)=>b.time-a.time)
.forEach(item=>{

const card =
document.createElement("div");

card.className="timeline-card";

card.innerHTML = `

<div class="timeline-header">

<div class="timeline-project">
${item.project || "Project"}
</div>

<div class="timeline-type">
${item.type || "Update"}
</div>

</div>

${item.image ? `
<img 
src="${item.image}"
class="timeline-image"
/>
` : ""}

<div class="timeline-desc">
${item.description || ""}
</div>

<div class="timeline-actions">

<button onclick="likePost('${item.id}')">
👍 ${likes[item.id] || 0}
</button>

<button onclick="dislikePost('${item.id}')">
👎 ${dislikes[item.id] || 0}
</button>

</div>

<div class="comment-box">

<input
placeholder="Write comment..."
id="comment-${item.id}"
>

<button
onclick="addComment('${item.id}')">
Post
</button>

</div>

<div class="comment-list">

${(comments[item.id] || [])
.map(c=>`<div>💬 ${c.text}</div>`)
.join("")}

</div>

<div class="timeline-time">
${new Date(item.time).toLocaleString()}
</div>

`;

container.appendChild(card);

});

}


/* =========================
   LIKE
========================= */

window.likePost = function(id){

let likes =
JSON.parse(
localStorage.getItem("albukhr_likes")
)||{};

likes[id] =
(likes[id]||0)+1;

localStorage.setItem(
"albukhr_likes",
JSON.stringify(likes)
);

renderFeed();

}


/* =========================
   DISLIKE
========================= */

window.dislikePost = function(id){

let dislikes =
JSON.parse(
localStorage.getItem("albukhr_dislikes")
)||{};

dislikes[id] =
(dislikes[id]||0)+1;

localStorage.setItem(
"albukhr_dislikes",
JSON.stringify(dislikes)
);

renderFeed();

}


/* =========================
   COMMENT
========================= */

window.addComment = function(id){

const input =
document.getElementById(
"comment-"+id
);

const text =
input.value.trim();

if(!text) return;

let comments =
JSON.parse(
localStorage.getItem("albukhr_comments")
)||{};

if(!comments[id])
comments[id]=[];

comments[id].push({
text,
time:Date.now()
});

localStorage.setItem(
"albukhr_comments",
JSON.stringify(comments)
);

input.value="";

renderFeed();

}


/* =========================
   LISTEN EVENTS
========================= */

window.addEventListener(
"projectFeedUpdated",
renderFeed
);

window.addEventListener(
"storage",
renderFeed
);


/* START */

renderFeed();

});

</script>
