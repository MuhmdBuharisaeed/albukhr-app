<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* ===== FIXED HEADER ===== */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

/* ===== FIXED SUMMARY ===== */
.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{font-size:12px;color:#666;margin-top:4px}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
}

/* ===== SCROLL AREA ===== */
.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* ===== PROJECT CARD ===== */
.project-card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(15,122,61,0.06);
  transition:all .25s ease;
}

.project-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(15,122,61,0.12);
}

.project-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.project-title{
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}

/* ===== PREMIUM ICON ===== */
.project-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:16px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:
    0 4px 12px rgba(15,122,61,0.15),
    inset 0 0 6px rgba(255,255,255,0.7);
  transition:all .3s ease;
}

.project-card:hover .project-icon{
  transform:scale(1.08);
}

/* ===== BODY ===== */
.project-body{
  margin-top:12px;
  display:none;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}

.btn{
  padding:9px 14px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:12px;
  transition:all .2s ease;
}

.btn:hover{
  background:#0c5f2f;
  transform:scale(1.03);
}

/* ===== TX STYLE ===== */
.tx{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #f1f1f1;
  font-size:13px;
}

.tx-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.tx-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:14px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:0 3px 10px rgba(15,122,61,0.12);
}

.tx-right{
  text-align:right;
  font-weight:600;
}

.tx small{
  display:block;
  color:#777;
  font-size:11px;
  font-weight:400;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:400px;
}

.modal input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

.modal-actions{
  display:flex;
  gap:10px;
}
</style>
</head>

<body>

<div class="header">💰 ALBUKHR WALLET</div>

<div class="summary">
  <div class="balance" id="available">0.00 Pi</div>
  <div class="sub">Available Reward Balance</div>

  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Rewards (Gross)</div>
    <div id="totalReward">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0.00 Pi</div>
  </div>
</div>

<div class="scroll-area" id="projectContainer"></div>

<!-- WITHDRAW MODAL -->
<div class="modal-overlay" id="withdrawModal">
<div class="modal">
<h3 id="modalProject">Withdraw</h3>

<input type="number" id="withdrawAmount" placeholder="Amount">
<input type="text" id="withdrawAddress" placeholder="Pi Wallet Address">

<div class="modal-actions">
<button class="btn" onclick="confirmWithdraw()">Confirm</button>
<button class="btn" style="background:#ccc;color:#333"
onclick="closeModal()">Cancel</button>
</div>

<p style="font-size:11px;margin-top:10px;color:#777">
Fee: 1% • Daily Limit: 50 Pi
</p>

</div>
</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

"use strict";

/* =========================================
   RUNTIME STATE
========================================= */

let activeProject = null;
let isProcessing = false;

/* =========================================
   SAFE UTILITIES
========================================= */

function safeNumber(n){
  const x = Number(n);
  return isNaN(x) ? 0 : x;
}

function sanitizeText(str){
  return String(str).replace(/[<>]/g,"");
}

function formatPi(n){
  return safeNumber(n).toFixed(2) + " Pi";
}

function validateAddress(addr){
  if(!addr) return false;
  if(addr.length < 20) return false;
  return /^[a-zA-Z0-9]+$/.test(addr);
}

/* =========================================
   ICON MAP (IMMUTABLE)
========================================= */

const PROJECT_ICONS = Object.freeze({
  raheem:"💊",
  barsh:"🌾",
  azman:"🧪",
  khairat:"♻️",
  urban:"🚍",
  hauwal:"🌽",
  labbaika:"🍞"
});

function getProjectIcon(name){
  if(!name) return "🏢";
  const key = name.toLowerCase();
  for(const k in PROJECT_ICONS){
    if(key.includes(k)) return PROJECT_ICONS[k];
  }
  return "🏢";
}

/* =========================================
   WALLET RENDER
========================================= */

function renderWallet(){

  if(typeof getWalletSummary !== "function") return;

  const summary = getWalletSummary();

  document.getElementById("totalStake").innerText =
    formatPi(summary.totalStake);

  document.getElementById("totalReward").innerText =
    formatPi(summary.grossRewards);

  document.getElementById("withdrawn").innerText =
    formatPi(summary.withdrawn);

  document.getElementById("available").innerText =
    formatPi(summary.available);

  renderProjects();
}

/* =========================================
   PROJECT RENDER
========================================= */

function renderProjects(){

  if(typeof getProjectWalletBreakdown !== "function") return;

  const container = document.getElementById("projectContainer");
  container.innerHTML = "";

  const projects = getProjectWalletBreakdown();

  if(!projects || !projects.length){
    container.innerHTML = "<small>No staking activity yet</small>";
    return;
  }

  projects.forEach(p=>{

    const card = document.createElement("div");
    card.className = "project-card";

    const safeProject = sanitizeText(p.project);

    card.innerHTML = `
      <div class="project-header">
        <div class="project-title">
          <div class="project-icon">
            ${getProjectIcon(safeProject)}
          </div>
          ${safeProject}
        </div>
        <div>${formatPi(p.netReward)}</div>
      </div>

      <div class="project-body">

        <div class="row">
          <div>Staked</div>
          <div>${formatPi(p.stake)}</div>
        </div>

        <div class="row">
          <div>Gross Reward</div>
          <div>${formatPi(p.grossReward)}</div>
        </div>

        <div class="row">
          <div>Withdrawn</div>
          <div>${formatPi(p.withdrawn)}</div>
        </div>

        <button class="btn withdraw-btn">
          Withdraw
        </button>

        <div class="history"></div>

      </div>
    `;

    container.appendChild(card);

    const header = card.querySelector(".project-header");
    const body = card.querySelector(".project-body");
    const btn = card.querySelector(".withdraw-btn");

    header.addEventListener("click",()=>{
      body.style.display =
        body.style.display === "block" ? "none" : "block";
    });

    btn.addEventListener("click",()=>{
      openWithdraw(safeProject);
    });

    renderProjectHistory(safeProject, card.querySelector(".history"));
  });
}

/* =========================================
   HISTORY
========================================= */

function renderProjectHistory(project, div){

  if(typeof getWithdrawHistory !== "function") return;

  const history = getWithdrawHistory()
    .filter(tx=>tx.project===project)
    .sort((a,b)=>b.timestamp-a.timestamp);

  if(!history.length){
    div.innerHTML = "<small>No withdrawals yet</small>";
    return;
  }

  div.innerHTML = "";

  history.forEach(tx=>{

    const row = document.createElement("div");
    row.className = "tx";

    row.innerHTML = `
      <div class="tx-left">
        <div class="tx-icon">${getProjectIcon(project)}</div>
        <div>
          Withdraw
          <small>${new Date(tx.timestamp).toLocaleString()}</small>
        </div>
      </div>
      <div class="tx-right">
        -${formatPi(tx.grossAmount)}
        <small>
          Fee: ${formatPi(tx.fee)} |
          Received: ${formatPi(tx.received)}
        </small>
      </div>
    `;

    div.appendChild(row);
  });
}

/* =========================================
   WITHDRAW FLOW (HARDENED)
========================================= */

function openWithdraw(project){
  activeProject = project;
  document.getElementById("modalProject").innerText =
    "Withdraw from " + sanitizeText(project);
  document.getElementById("withdrawModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("withdrawModal").style.display = "none";
}

function confirmWithdraw(){

  if(isProcessing) return;

  const amountInput = document.getElementById("withdrawAmount");
  const addressInput = document.getElementById("withdrawAddress");

  const amount = safeNumber(amountInput.value);
  const address = sanitizeText(addressInput.value.trim());

  if(!activeProject)
    return alert("Project not selected");

  if(amount <= 0)
    return alert("Invalid amount");

  if(!validateAddress(address))
    return alert("Invalid wallet address");

  if(typeof requestWithdraw !== "function")
    return alert("Withdraw engine not available");

  isProcessing = true;

  const res = requestWithdraw({
    project: activeProject,
    amount,
    walletAddress: address
  });

  if(res.error){
    isProcessing = false;
    return alert(res.error);
  }

  amountInput.value = "";
  addressInput.value = "";

  closeModal();
  renderWallet();

  isProcessing = false;
}

/* =========================================
   SAFE INIT
========================================= */

document.addEventListener("DOMContentLoaded",()=>{
  renderWallet();
});

</script>

</body>
</html>
