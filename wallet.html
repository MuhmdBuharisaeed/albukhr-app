<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* HEADER */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

/* SUMMARY */
.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{font-size:12px;color:#666;margin-top:4px}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
}

/* SCROLL AREA */
.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* TRANSACTION STYLE */
.tx{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tx-left{
  display:flex;
  gap:10px;
  align-items:center;
}

.tx-icon{
  font-size:20px;
}

.tx-title{
  font-weight:600;
  font-size:14px;
}

.tx-sub{
  font-size:11px;
  color:#777;
}

.tx-right{
  text-align:right;
}

.tx-amount{
  font-weight:700;
  font-size:14px;
}

.tx-positive{color:#0f7a3d;}
.tx-negative{color:#d22;}

</style>
</head>

<body>

<div class="header">💰 ALBUKHR WALLET</div>

<div class="summary">
  <div class="balance" id="available">0.00 Pi</div>
  <div class="sub">Available Reward Balance</div>

  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Rewards (Gross)</div>
    <div id="totalReward">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0.00 Pi</div>
  </div>
</div>

<div class="scroll-area" id="historyContainer"></div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

/* ICON MAP */
function getProjectIcon(name){
  if(name.toLowerCase().includes("raheem")) return "💊";
  if(name.toLowerCase().includes("farm")) return "🌾";
  if(name.toLowerCase().includes("tech")) return "💻";
  return "🏢";
}

/* LOAD WALLET */
function renderWallet(){

  const summary = getWalletSummary();

  totalStake.innerText =
    summary.totalStake.toFixed(2) + " Pi";

  totalReward.innerText =
    summary.grossRewards.toFixed(2) + " Pi";

  withdrawn.innerText =
    summary.withdrawn.toFixed(2) + " Pi";

  available.innerText =
    summary.available.toFixed(2) + " Pi";

  renderHistory();
}

/* GLOBAL HISTORY */
function renderHistory(){

  const container = document.getElementById("historyContainer");
  container.innerHTML = "";

  const projects = getProjectWalletBreakdown();
  const withdraws = getWithdrawHistory();

  let allTx = [];

  /* STAKES */
  projects.forEach(p=>{
    p.stakes.forEach(s=>{
      allTx.push({
        type:"stake",
        project:p.project,
        amount:s.amount,
        timestamp:s.timestamp
      });
    });
  });

  /* WITHDRAWS */
  withdraws.forEach(w=>{
    allTx.push({
      type:"withdraw",
      project:w.project,
      gross:w.grossAmount,
      fee:w.fee,
      received:w.received,
      timestamp:w.timestamp
    });
  });

  /* SORT NEWEST FIRST */
  allTx.sort((a,b)=>b.timestamp-a.timestamp);

  if(!allTx.length){
    container.innerHTML="<small>No transactions yet</small>";
    return;
  }

  allTx.forEach(tx=>{

    let html="";

    if(tx.type==="stake"){
      html=`
      <div class="tx">
        <div class="tx-left">
          <div class="tx-icon">${getProjectIcon(tx.project)}</div>
          <div>
            <div class="tx-title">${tx.project} Stake</div>
            <div class="tx-sub">
              ${new Date(tx.timestamp).toLocaleString()}
            </div>
          </div>
        </div>
        <div class="tx-right">
          <div class="tx-amount tx-negative">
            -${tx.amount.toFixed(2)} Pi
          </div>
        </div>
      </div>`;
    }

    if(tx.type==="withdraw"){
      html=`
      <div class="tx">
        <div class="tx-left">
          <div class="tx-icon">${getProjectIcon(tx.project)}</div>
          <div>
            <div class="tx-title">${tx.project} Withdraw</div>
            <div class="tx-sub">
              Fee: ${tx.fee.toFixed(2)} |
              Received: ${tx.received.toFixed(2)} <br>
              ${new Date(tx.timestamp).toLocaleString()}
            </div>
          </div>
        </div>
        <div class="tx-right">
          <div class="tx-amount tx-positive">
            -${tx.gross.toFixed(2)} Pi
          </div>
        </div>
      </div>`;
    }

    container.innerHTML += html;
  });
}

renderWallet();

</script>

</body>
</html>
