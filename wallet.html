<!DOCTYPE html>
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Albukhr Wallet</title>

<style>

/* ===============================
   GLOBAL
================================*/

body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  padding-bottom:110px;
}


/* ===============================
   WALLET TABS
================================*/

.wallet-tabs{
  display:flex;
  gap:10px;
  padding:14px 16px;
  background:#f4f7f6;
}

.nav-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border:none;
  transition:.2s ease;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-wallet{
  background:#0f7a3d;
  color:#fff;
  box-shadow:0 4px 12px rgba(15,122,61,0.25);
}

.nav-trans{
  background:#fff;
  color:#0f7a3d;
  border:1px solid #dfeee7;
}


/* ===============================
   WALLET SUMMARY
================================*/

.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
}


/* ===============================
   PROJECT LIST AREA
================================*/

.scroll-area{
  padding:16px;
}


/* ===============================
   PROJECT CARD
================================*/

.project-card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(15,122,61,0.06);
  transition:.25s ease;
}

.project-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(15,122,61,0.12);
}

.project-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.project-title{
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}


/* ===============================
   PROJECT ICON
================================*/

.project-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:16px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:
    0 4px 12px rgba(15,122,61,0.15),
    inset 0 0 6px rgba(255,255,255,0.7);
  transition:.3s ease;
}

.project-card:hover .project-icon{
  transform:scale(1.08);
}


/* ===============================
   PROJECT BODY
================================*/

.project-body{
  margin-top:12px;
  display:block;
  border-top:1px solid #eee;
  padding-top:10px;
}


/* ===============================
   BUTTONS
================================*/

.btn{
  padding:9px 14px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:12px;
  transition:.2s ease;
}

.btn:hover{
  background:#0c5f2f;
  transform:scale(1.03);
}


/* ===============================
   WITHDRAW MODAL
================================*/

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:400px;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
}

.modal h3{
  margin-top:0;
}

.modal input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:13px;
}

.modal-actions{
  display:flex;
  gap:10px;
}


/* ===============================
   ALBUKHR HEADER
================================*/

.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
}

.main-logo{
  height:54px;
  width:auto;
}

.withdraw-box{
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.withdraw-box input{
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:12px;
   }   
  </style>
  
<link rel="stylesheet" href="style.css">  
<link rel="stylesheet" href="css/global-header.css">  
<link rel="stylesheet" href="global-buttons.css">
</head>
  
<body>

    <img src="IMG_20260125_183804.png" class="main-logo">  
    <span class="brand">ALBUKHR</span>  
    
  </div>
  <div class="header-right">  
    
    <div class="header-btn notification-btn" onclick="openNotifications()">

🔔

<span id="notifBadge" class="notification-badge"></span>

</div>  

</div>
</header>
  
  <div class="summary">  
  <div class="balance" id="available">0.00 Pi</div>  
  <div class="sub">Available Reward Balance</div>
    
    <div class="row">  
    <div>Total Staked</div>  
    <div id="totalStake">0.00 Pi</div>  
  </div>    <div class="row">  
    <div>Total Rewards (Gross)</div>  
    <div id="totalReward">0.00 Pi</div>  
  </div>    <div class="row">  
    <div>Total Withdrawn</div>  
    <div id="withdrawn">0.00 Pi</div>  
  </div>  
  </div>
  
<div class="wallet-tabs">

  <button class="nav-btn nav-wallet">
    Wallet
  </button>

  <button class="nav-btn nav-trans"
    onclick="window.location.href='transactions.html'">
    Transactions
  </button>

</div>
  
<div id="withdrawSuccessBox" style="

<!-- =========================

<div class="modal-overlay" id="withdrawModal">

    </p>

</div>

<script>  
const current = location.pathname.split("/").pop();  
  
document.querySelectorAll(".dock-item").forEach(link=>{  
  if(link.getAttribute("href") === current){  
    link.classList.add("active");  
  }  
});  
</script>
  
<script>

document.addEventListener("DOMContentLoaded", function(){

let activeProject = null;

/* GET MODAL ELEMENTS */
const withdrawModal = document.getElementById("withdrawModal");
const withdrawAmount = document.getElementById("withdrawAmount");
const withdrawAddress = document.getElementById("withdrawAddress");
const modalProject = document.getElementById("modalProject");

/* =========================
   OPEN WITHDRAW
========================= */

window.openWithdraw = function(project){

  activeProject = project;

  if(!withdrawModal){
    console.error("Withdraw modal not found");
    return;
  }

  modalProject.innerText = "Withdraw from " + project;

  withdrawAmount.value = "";
  withdrawAddress.value = "";

  withdrawModal.style.display = "flex";
}

/* =========================
   CLOSE MODAL
========================= */

window.closeModal = function(){
  if(withdrawModal){
    withdrawModal.style.display = "none";
  }
}

/* =========================
   PROJECT ICON
========================= */

function getProjectIcon(name){

  if(name.toLowerCase().includes("raheem")) return "💊";
  if(name.toLowerCase().includes("barsh")) return "🌾";
  if(name.toLowerCase().includes("azman")) return "🧪";
  if(name.toLowerCase().includes("khairat")) return "♻️";
  if(name.toLowerCase().includes("urban")) return "🚍";
  if(name.toLowerCase().includes("hauwal")) return "🌽";
  if(name.toLowerCase().includes("labbaika")) return "🍞";

  return "🏢";
}

/* =========================
   WALLET SUMMARY
========================= */

function renderWallet(){

  const summary = getWalletSummary();

  document.getElementById("totalStake").innerText =
  summary.totalStake.toFixed(2) + " Pi";

  document.getElementById("totalReward").innerText =
  summary.grossRewards.toFixed(2) + " Pi";

  document.getElementById("withdrawn").innerText =
  summary.withdrawn.toFixed(2) + " Pi";

  document.getElementById("available").innerText =
  summary.available.toFixed(2) + " Pi";

  renderProjects();
}

/* =========================
   RENDER PROJECTS
========================= */

function renderProjects(){

  const container = document.getElementById("projectContainer");
  container.innerHTML="";

  const breakdown = getProjectWalletBreakdown();
  const history = getWithdrawHistory();

  const projectNames = new Set();

  breakdown.forEach(p => projectNames.add(p.project));
  history.forEach(tx=>{
    if(tx.project) projectNames.add(tx.project);
  });

  const projects = Array.from(projectNames).map(name=>{

    const stakeData = breakdown.find(p => p.project === name);

    return stakeData || {

      project:name,
      stake:0,
      grossReward:0,
      withdrawn:history
        .filter(tx=>tx.project===name)
        .reduce((sum,tx)=>sum+Number(tx.grossAmount||0),0),

      netReward:0
    }

  });

  if(!projects.length){
    container.innerHTML="<small>No activity yet</small>";
    return;
  }

  projects.forEach(p=>{

    const card = document.createElement("div");
    card.className="project-card";

    card.innerHTML = `

      <div class="project-header"
           onclick="toggleBody(this)">

        <div class="project-title">

          <div class="project-icon">
            ${getProjectIcon(p.project)}
          </div>

          ${p.project}

        </div>

        <div>${(p.netReward || 0).toFixed(2)} Pi</div>

      </div>

      <div class="project-body">

        <div class="row">
          <div>Staked</div>
          <div>${(p.stake || 0).toFixed(2)} Pi</div>
        </div>

        <div class="row">
          <div>Gross Reward</div>
          <div>${(p.grossReward || 0).toFixed(2)} Pi</div>
        </div>

        <div class="row">
          <div>Withdrawn</div>
          <div>${(p.withdrawn || 0).toFixed(2)} Pi</div>
        </div>

        <div class="withdraw-box">

  <input
    type="number"
    placeholder="Amount"
    id="amount-${p.project}"
  >

  <input
    type="text"
    placeholder="Pi Wallet Address"
    id="address-${p.project}"
  >

  <div style="display:flex;gap:8px;margin-top:8px">

    <button class="btn"
      onclick="withdrawReward('${p.project}')">
      Reward Withdraw
    </button>

    <button class="btn"
      style="background:#333"
      onclick="withdrawCapitalAction('${p.project}')">
      Capital Withdraw
    </button>

  </div>

</div>
    `;

    container.appendChild(card);

  });

}

/* =========================
   TOGGLE PROJECT BODY
========================= */

window.toggleBody = function(el){

  const card = el.closest(".project-card");
  const body = card.querySelector(".project-body");

  if(!body) return;

  body.style.display =
    body.style.display === "block"
      ? "none"
      : "block";

}

/* =========================
   CONFIRM WITHDRAW
========================= */

window.confirmWithdraw = function(){

  const amt = withdrawAmount.value.trim();
  const addr = withdrawAddress.value.trim();

  if(!amt || Number(amt) <= 0){
    alert("Enter valid withdraw amount");
    return;
  }

  if(!addr){
    alert("Enter Pi wallet address");
    return;
  }

  const res = requestWithdraw({

    project: activeProject,
    amount: amt,
    walletAddress: addr

  });

  if(res.error){
    alert(res.error);
    return;
  }

  withdrawAmount.value="";
  withdrawAddress.value="";

  closeModal();
  renderWallet();
}

function withdrawReward(project){

  const amount =
  document.getElementById("amount-"+project).value;

  const address =
  document.getElementById("address-"+project).value;

  if(!amount || Number(amount) <= 0){
    alert("Enter valid amount");
    return;
  }

  if(!address){
    alert("Enter Pi wallet address");
    return;
  }

  const res = requestWithdraw({
    project: project,
    amount: amount,
    walletAddress: address
  });

  if(res.error){
    alert(res.error);
    return;
  }

  renderWallet();
}   
/* =========================
   CAPITAL WITHDRAW
========================= */

window.withdrawCapitalAction = function(project){

  const res = requestCapitalWithdraw(project);

  if(res?.error){
    alert(res.error);
    return;
  }

  alert(
    "Capital withdrawn: " +
    res.grossAmount.toFixed(2) +
    " Pi"
  );

  renderWallet();

}

/* START WALLET */

renderWallet();

});

</script>
  
<script>  
  
const withdrawSuccessBox = document.getElementById("withdrawSuccessBox");  
  
/* Track last withdraw timestamp */  
let lastWithdrawTime = 0;  
  
/* Listen for wallet updates */  
window.addEventListener("walletUpdated", function(e){  
  
  if(!e.detail) return;  
  
  const data = e.detail;  
  
  /* Idan withdraw ne */  
  if(data.type === "reward-withdraw" || data.type === "capital-withdraw"){  
  
    const now = Date.now();  
  
    /* Kauce wa duplicate show */  
    if(now - lastWithdrawTime < 1000) return;  
  
    lastWithdrawTime = now;  
  
    showWithdrawSuccess();  
  }  
  
});  
  
function showWithdrawSuccess(){  
  
  withdrawSuccessBox.style.display = "block";  
  withdrawSuccessBox.textContent = "Withdraw Successful ✓";  
  
  /* Auto hide after 4 seconds */  
  setTimeout(()=>{  
    withdrawSuccessBox.style.display = "none";  
  },4000);  
}  
</script>
  
</body>
