<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  background:#f4f7f6;
  font-family:system-ui;
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* FIXED HEADER */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

/* MAIN CONTAINER */
.section{
  padding:16px;
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* SUMMARY CARD (FIXED AREA) */
.summary-card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  flex-shrink:0;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:13px;
}

.btn-group{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.btn.secondary{
  background:#eaf6ee;
  color:#0f7a3d;
}

/* SCROLLABLE HISTORY ONLY */
.history-card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.history-scroll{
  overflow-y:auto;
  margin-top:10px;
  padding-right:4px;
}

.tx{
  border-bottom:1px solid #eee;
  padding:8px 0;
  font-size:13px;
}

.tx small{
  color:#777;
  font-size:11px;
}

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:90%;
  max-width:400px;
}

.modal input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-bottom:10px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.close-btn{
  background:#ddd;
  color:#333;
}
</style>
</head>

<body>

<div class="header">💰 ALBUKHR WALLET</div>

<section class="section">

<!-- FIXED SUMMARY -->
<div class="summary-card">

  <div class="balance" id="available">0 PI</div>
  <div class="sub">Available Reward Balance</div>

  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0 PI</div>
  </div>

  <div class="row">
    <div>Total Rewards</div>
    <div id="totalReward">0 PI</div>
  </div>

  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0 PI</div>
  </div>

  <div class="btn-group">
    <button class="btn secondary" onclick="openWithdraw()">Withdraw</button>
  </div>

</div>

<!-- SCROLLABLE HISTORY -->
<div class="history-card">
  <h4>Transaction History</h4>
  <div class="history-scroll" id="txList"></div>
</div>

</section>

<!-- MODAL -->
<div class="modal-overlay" id="withdrawModal">
  <div class="modal">
    <h3>Withdraw PI</h3>
    <input type="number" id="withdrawAmount" placeholder="Amount">
    <input type="text" id="withdrawAddress" placeholder="Pi Wallet Address">
    <div class="modal-actions">
      <button class="btn" onclick="confirmWithdraw()">Confirm</button>
      <button class="btn close-btn" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<script src="staking.js"></script>
<script src="staking-external.js"></script>
<script src="wallet-core.js"></script>

<script>

function renderWallet(){

  const summary = getWalletSummary();

  totalStake.innerText =
    Number(summary.locked || 0).toFixed(2) + " PI";

  totalReward.innerText =
  Number(summary.rewards || 0).toFixed(2) + " PI";

  withdrawn.innerText =
    Number(summary.withdrawn || 0).toFixed(2) + " PI";

  available.innerText =
    Number(summary.available || 0).toFixed(2) + " PI";

  renderHistory();
}

function renderHistory(){

  const list = getWithdrawHistory();
  txList.innerHTML="";

  if(!list.length){
    txList.innerHTML="<small>No withdrawals yet</small>";
    return;
  }

  list.forEach(tx=>{

    const div = document.createElement("div");
    div.className="tx";

    div.innerHTML = `
      <div><strong>Reward Withdraw</strong></div>
      <div>- ${Number(tx.amount).toFixed(2)} PI</div>
      <small>${new Date(tx.createdAt).toLocaleString()}</small>
      <br>
      <small>Wallet: ${tx.walletAddress}</small>
    `;

    txList.appendChild(div);
  });
}

function openWithdraw(){
  withdrawModal.style.display="flex";
}

function closeModals(){
  withdrawModal.style.display="none";
}

function confirmWithdraw(){

  const amt = parseFloat(withdrawAmount.value);
  const addr = withdrawAddress.value.trim();

  const res = requestWithdraw(amt, addr);

  if(res.error){
    alert(res.error);
    return;
  }

  withdrawAmount.value="";
  withdrawAddress.value="";

  closeModals();
  renderWallet();
}

renderWallet();

</script>

</body>
</html>
