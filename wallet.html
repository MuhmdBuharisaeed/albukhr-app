<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* ===== HEADER ===== */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}

.header-title{
  font-weight:800;
  font-size:16px;
  letter-spacing:.4px;
}

/* ===== NAV BUTTONS ===== */
.header-nav{
  display:flex;
  gap:10px;
  padding:12px 16px;
  background:#0f7a3d;
}

.nav-btn{
  flex:1;
  padding:12px 14px;
  border-radius:14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  border:none;
  transition:all .25s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  letter-spacing:.3px;
}

.nav-wallet{
  background:#ffffff;
  color:#0f7a3d;
  box-shadow:0 4px 14px rgba(0,0,0,0.15);
}

.nav-trans{
  background:rgba(255,255,255,.15);
  color:#fff;
  border:1px solid rgba(255,255,255,.25);
}

.nav-trans:hover{
  background:#ffffff;
  color:#0f7a3d;
  transform:translateY(-2px);
}

/* ===== SUMMARY ===== */
.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.balance{
  font-size:28px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{
  font-size:12px;
  color:#666;
  margin-top:4px
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:13px;
}

/* ===== SCROLL AREA ===== */
.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* ===== PROJECT CARD ===== */
.project-card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 8px 22px rgba(15,122,61,0.07);
  transition:all .25s ease;
}

.project-card:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 30px rgba(15,122,61,0.15);
}

.project-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.project-title{
  font-weight:700;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:15px;
}

/* ===== ICON ===== */
.project-icon{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:18px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:
    0 6px 16px rgba(15,122,61,0.18),
    inset 0 0 8px rgba(255,255,255,0.8);
  transition:all .3s ease;
}

.project-card:hover .project-icon{
  transform:scale(1.1);
}

/* ===== BODY ===== */
.project-body{
  margin-top:14px;
  display:none;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:translateY(0)}
}

/* ===== ACTION BUTTONS ===== */
.btn{
  padding:13px 16px;
  border:none;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
  transition:all .25s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:150px;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-reward{
  background:#0f7a3d;
  color:#fff;
  box-shadow:0 8px 20px rgba(15,122,61,0.28);
}

.btn-reward:hover{
  background:#0c5f2f;
}

.btn-capital{
  background:#222;
  color:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.btn-capital:hover{
  background:#000;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  background:#fff;
  padding:22px;
  border-radius:18px;
  width:90%;
  max-width:400px;
}

.modal input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="header">
  <div class="header-title">ALBUKHR WALLET</div>
</div>

<div class="header-nav">
  <button class="nav-btn nav-wallet">
    💼 Wallet
  </button>

  <button class="nav-btn nav-trans"
    onclick="window.location.href='transactions.html'">
    📜 Transactions
  </button>
</div>

<div class="summary">
  <div class="balance" id="available">0.00 Pi</div>
  <div class="sub">Available Reward Balance</div>

  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Rewards (Gross)</div>
    <div id="totalReward">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0.00 Pi</div>
  </div>
</div>

<div class="scroll-area" id="projectContainer"></div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
let activeProject = null;

function getProjectIcon(name){
  if(name.toLowerCase().includes("raheem")) return "💊";
  if(name.toLowerCase().includes("barsh")) return "🌾";
  if(name.toLowerCase().includes("azman")) return "🧪";
  if(name.toLowerCase().includes("khairat")) return "♻️";
  if(name.toLowerCase().includes("urban")) return "🚍";
  if(name.toLowerCase().includes("hauwal")) return "🌽";
  if(name.toLowerCase().includes("labbaika")) return "🍞";
  return "🏢";
}

function renderWallet(){
  const summary = getWalletSummary();
  totalStake.innerText = summary.totalStake.toFixed(2) + " Pi";
  totalReward.innerText = summary.grossRewards.toFixed(2) + " Pi";
  withdrawn.innerText = summary.withdrawn.toFixed(2) + " Pi";
  available.innerText = summary.available.toFixed(2) + " Pi";
  renderProjects();
}

function renderProjects(){
  const container = document.getElementById("projectContainer");
  container.innerHTML="";
  const projects = getProjectWalletBreakdown();

  if(!projects.length){
    container.innerHTML="<small>No staking activity yet</small>";
    return;
  }

  projects.forEach(p=>{
    const card = document.createElement("div");
    card.className="project-card";

    card.innerHTML = `
      <div class="project-header" onclick="toggleBody(this)">
        <div class="project-title">
          <div class="project-icon">${getProjectIcon(p.project)}</div>
          ${p.project}
        </div>
        <div>${p.netReward.toFixed(2)} Pi</div>
      </div>

      <div class="project-body">
        <div class="row"><div>Staked</div><div>${p.stake.toFixed(2)} Pi</div></div>
        <div class="row"><div>Gross Reward</div><div>${p.grossReward.toFixed(2)} Pi</div></div>
        <div class="row"><div>Withdrawn</div><div>${p.withdrawn.toFixed(2)} Pi</div></div>

        <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
          <button class="btn btn-reward"
            onclick="openWithdraw('${p.project}')">
            💸 Reward Withdraw
          </button>

          <button class="btn btn-capital"
            onclick="withdrawCapitalAction('${p.project}')">
            🏦 Capital Withdraw
          </button>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

function toggleBody(el){
  const body = el.nextElementSibling;
  body.style.display = body.style.display==="block" ? "none":"block";
}

renderWallet();
</script>

</body>
</html>
