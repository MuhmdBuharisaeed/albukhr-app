<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR Wallet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
.header{
  padding:16px;
  background:#0f7a3d;
  color:#fff;
  font-weight:bold;
  text-align:center
}
.card{
  background:#fff;
  margin:16px;
  padding:16px;
  border-radius:16px
}
.balance{
  font-size:26px;
  font-weight:bold;
  color:#0f7a3d
}
.btn{
  display:block;
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:15px;
  font-weight:bold
}
.send{background:#0f7a3d;color:#fff}
.receive{background:#eaf7ef;color:#0f7a3d}
.tx{
  font-size:13px;
  border-bottom:1px solid #eee;
  padding:8px 0
}
small{color:#777}
</style>
</head>

<body>

<div class="header">💼 ALBUKHR Wallet</div>

<div class="card">
  <small>Available Balance</small>
  <div class="balance" id="walletBalance">--</div>

  <button class="btn receive" id="receiveBtn">Receive</button>
  <button class="btn send" id="sendBtn">Send</button>
</div>

<div class="card">
  <h4>Transactions</h4>
  <div id="txList"></div>
</div>

<!-- LOAD ORDER -->
<script src="/js/settings/settings-core.js"></script>
<script src="/js/core/albukhr-core.js"></script>

<script src="/js/wallet/wallet-core.js"></script>
<script src="/js/wallet/wallet-ui.js"></script>

</body>
</html>
