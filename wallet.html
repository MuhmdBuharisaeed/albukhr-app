<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albukhr Wallet</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:120px;
}

/* SUMMARY */

.summary{
background:#fff;
padding:16px;
border-bottom:1px solid #eee;
}

.balance{
font-size:28px;
font-weight:800;
color:#0f7a3d;
}

.sub{
font-size:12px;
color:#666;
margin-top:4px;
}

.row{
display:flex;
justify-content:space-between;
margin-top:6px;
font-size:13px;
}

/* TABS */

.wallet-tabs{
display:flex;
gap:10px;
padding:14px 16px;
}

.nav-btn{
flex:1;
padding:10px;
border-radius:12px;
border:none;
font-weight:600;
cursor:pointer;
}

.nav-wallet{
background:#0f7a3d;
color:#fff;
}

.nav-trans{
background:#fff;
border:1px solid #dfeee7;
color:#0f7a3d;
}

/* PROJECT */

.scroll-area{
padding:16px;
}

.project-card{
background:#fff;
border-radius:16px;
padding:14px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.project-header{
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
}

.project-title{
display:flex;
align-items:center;
gap:10px;
font-weight:700;
}

.project-icon{
width:34px;
height:34px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#eaf7ef;
}

.expand-arrow{
font-size:18px;
color:#777;
transition:transform .25s ease;
}

.project-progress{
height:6px;
background:#e5efe8;
border-radius:10px;
margin-top:8px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:linear-gradient(90deg,#0f7a3d,#1ec777);
}

.project-body{
margin-top:12px;
display:none;
}

.btn{
padding:8px 14px;
border:none;
border-radius:10px;
font-size:12px;
cursor:pointer;
background:#0f7a3d;
color:#fff;
}

.btn.secondary{
background:#333;
}

/* HISTORY */

.tx{
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:12px;
border-top:1px dashed #eee;
padding-top:8px;
}

.tx small{
display:block;
color:#888;
}

/* MODAL */

.modal-overlay{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.4);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.modal{
background:#fff;
padding:20px;
border-radius:14px;
width:90%;
max-width:420px;
}

.modal input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ddd;
}

.modal-actions{
display:flex;
gap:10px;
}

</style>

</head>

<body>

<header class="header">

<div class="header-left">
<img src="IMG_20260125_183804.png" class="main-logo">
<span class="brand">ALBUKHR</span>
</div>

<div class="header-right">

<div class="header-btn notification-btn" onclick="openNotifications()">
🔔
<span id="notifBadge" class="notification-badge"></span>
</div>

</div>

</header>

<div class="summary">

<div class="balance" id="available">0.00 Pi</div>
<div class="sub">Available Reward Balance</div>

<div class="row">
<div>Total Staked</div>
<div id="totalStake">0.00 Pi</div>
</div>

<div class="row">
<div>Total Rewards</div>
<div id="totalReward">0.00 Pi</div>
</div>

<div class="row">
<div>Total Withdrawn</div>
<div id="withdrawn">0.00 Pi</div>
</div>

</div>

<div class="wallet-tabs">

<button class="nav-btn nav-wallet">
Wallet
</button>

<button class="nav-btn nav-trans"
onclick="window.location.href='transactions.html'">
Transactions
</button>

</div>

<div class="scroll-area" id="projectContainer"></div>

<!-- WITHDRAW MODAL -->

<div class="modal-overlay" id="withdrawModal">

<div class="modal">

<h3 id="modalProject">Withdraw</h3>

<input id="withdrawAmount" type="number" placeholder="Amount">

<input id="withdrawAddress" type="text" placeholder="Pi Wallet Address">

<div class="modal-actions">

<button class="btn" onclick="confirmWithdraw()">
Confirm
</button>

<button class="btn secondary" onclick="closeModal()">
Cancel
</button>

</div>

<p style="font-size:11px;margin-top:10px;color:#777">
Fee 1% • Daily Limit 50 Pi
</p>

</div>

</div>

<!-- DOCK NAV -->

<div class="dock-nav">

<a href="index.html" class="dock-item">
<span>Home</span>
</a>

<a href="wallet.html" class="dock-item active">
<span>Wallet</span>
</a>

<a href="services.html" class="dock-item">
<span>Services</span>
</a>

<a href="news.html" class="dock-item">
<span>News</span>
</a>

</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>
<script src="js/notifications.js"></script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

let activeProject=null

const withdrawModal=document.getElementById("withdrawModal")
const withdrawAmount=document.getElementById("withdrawAmount")
const withdrawAddress=document.getElementById("withdrawAddress")
const modalProject=document.getElementById("modalProject")

function renderWallet(){

const summary=getWalletSummary()

totalStake.innerText=summary.totalStake.toFixed(2)+" Pi"
totalReward.innerText=summary.grossRewards.toFixed(2)+" Pi"
withdrawn.innerText=summary.withdrawn.toFixed(2)+" Pi"
available.innerText=summary.available.toFixed(2)+" Pi"

renderProjects()

}

function renderProjects(){

const container=document.getElementById("projectContainer")
container.innerHTML=""

const projects=getProjectWalletBreakdown()

projects.forEach(p=>{

const progress=Math.min((p.netReward/(p.stake||1))*100,100)

const card=document.createElement("div")
card.className="project-card"

card.innerHTML=`

<div class="project-header">

<div class="project-title">

<div class="project-icon">🏢</div>

${p.project}

</div>

<div style="display:flex;gap:8px;align-items:center">

<div>${p.netReward.toFixed(2)} Pi</div>

<span class="expand-arrow">⌄</span>

</div>

</div>

<div class="project-progress">
<div class="progress-bar" style="width:${progress}%"></div>
</div>

<div class="project-body">

<div class="row">
<div>Staked</div>
<div>${p.stake.toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Gross Reward</div>
<div>${p.grossReward.toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Withdrawn</div>
<div>${p.withdrawn.toFixed(2)} Pi</div>
</div>

<div style="display:flex;gap:8px;margin-top:10px">

<button class="btn" onclick="event.stopPropagation();openWithdraw('${p.project}')">
Reward Withdraw
</button>

<button class="btn secondary" onclick="event.stopPropagation();withdrawCapital('${p.project}')">
Capital Withdraw
</button>

</div>

<div id="history-${p.project}"></div>

</div>
`

container.appendChild(card)

})

}

function openWithdraw(project){

activeProject=project

modalProject.innerText="Withdraw from "+project

withdrawModal.style.display="flex"

}

function closeModal(){
withdrawModal.style.display="none"
}

function confirmWithdraw(){

const amt=withdrawAmount.value.trim()
const addr=withdrawAddress.value.trim()

if(!amt||Number(amt)<=0){
alert("Enter valid amount")
return
}

if(!addr){
alert("Enter Pi wallet address")
return
}

const res=requestWithdraw({
project:activeProject,
amount:amt,
walletAddress:addr
})

if(res.error){
alert(res.error)
return
}

withdrawAmount.value=""
withdrawAddress.value=""

closeModal()
renderWallet()

}

function withdrawCapital(project){

const res=requestCapitalWithdraw(project)

if(res.error){
alert(res.error)
return
}

alert("Capital withdrawn: "+res.grossAmount.toFixed(2)+" Pi")

renderWallet()

}

renderWallet()

})

</script>

</body>
  </html>
