<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f5f7f6;
}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:18px;
  text-align:center;
  font-weight:700;
  font-size:18px;
}

.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
}

.balance{
  font-size:28px;
  font-weight:800;
  color:#0f7a3d;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
}

.container{
  padding:16px;
}

.card{
  background:#fff;
  padding:14px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 4px 14px rgba(0,0,0,0.05);
}

.card h4{
  margin:0 0 8px 0;
}

.btn{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#0f7a3d;
  color:#fff;
  cursor:pointer;
  font-size:12px;
  margin-top:8px;
}

.btn.secondary{
  background:#ccc;
  color:#333;
}

.tx{
  border-top:1px solid #eee;
  padding:8px 0;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  padding:18px;
  width:90%;
  max-width:380px;
  border-radius:12px;
}

.modal input{
  width:100%;
  padding:8px;
  margin-bottom:8px;
}
</style>
</head>
<body>

<div class="header">💰 ALBUKHR WALLET</div>

<div class="summary">
  <div class="balance" id="available">0.00 Pi</div>
  <div style="font-size:12px;color:#666">Available Reward</div>

  <div class="row">
    <div>Total Stake</div>
    <div id="totalStake">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0.00 Pi</div>
  </div>
</div>

<div class="container" id="projects"></div>

<!-- Withdraw Modal -->
<div class="modal" id="withdrawModal">
<div class="modal-box">
  <h3 id="modalTitle">Withdraw</h3>
  <input type="number" id="withdrawAmount" placeholder="Amount">
  <input type="text" id="withdrawAddress" placeholder="Wallet Address">
  <button class="btn" onclick="confirmWithdraw()">Confirm</button>
  <button class="btn secondary" onclick="closeModal()">Cancel</button>
</div>
</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

let activeProject = null;

/* ===============================
   MAIN RENDER
================================ */

function renderWallet(){

  const summary = getWalletSummary();

  document.getElementById("available").innerText =
    summary.available.toFixed(2) + " Pi";

  document.getElementById("totalStake").innerText =
    summary.totalStake.toFixed(2) + " Pi";

  document.getElementById("withdrawn").innerText =
    summary.withdrawn.toFixed(2) + " Pi";

  renderProjects();
}

/* ===============================
   PROJECT RENDER
================================ */

function renderProjects(){

  const container = document.getElementById("projects");
  container.innerHTML = "";

  const projects = getProjectWalletBreakdown();

  if(!projects.length){
    container.innerHTML =
      "<small>No staking activity yet</small>";
    return;
  }

  projects.forEach(p=>{

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h4>${p.project}</h4>

      <div class="row">
        <div>Staked</div>
        <div>${p.stake.toFixed(2)} Pi</div>
      </div>

      <div class="row">
        <div>Available Reward</div>
        <div>${p.netReward.toFixed(2)} Pi</div>
      </div>

      <div class="row">
        <div>Total Withdrawn</div>
        <div>${p.withdrawn.toFixed(2)} Pi</div>
      </div>

      <button class="btn"
        onclick="openWithdraw('${p.project}')">
        Withdraw Reward
      </button>

      <button class="btn secondary"
        onclick="withdrawCapital('${p.project}')">
        Withdraw Capital
      </button>

      <div id="history-${p.project}"></div>
    `;

    container.appendChild(card);
    renderHistory(p.project);
  });
}

/* ===============================
   HISTORY
================================ */

function renderHistory(project){

  const div = document.getElementById("history-"+project);
  const history = getWithdrawHistory()
    .filter(tx=>tx.project===project);

  if(!history.length){
    div.innerHTML="<small>No transactions</small>";
    return;
  }

  div.innerHTML = "";

  history.forEach(tx=>{
    div.innerHTML += `
      <div class="tx">
        <div>${tx.type}</div>
        <div>- ${tx.grossAmount.toFixed(2)} Pi</div>
      </div>
    `;
  });
}

/* ===============================
   WITHDRAW REWARD
================================ */

function openWithdraw(project){
  activeProject = project;
  document.getElementById("modalTitle").innerText =
    "Withdraw from " + project;
  document.getElementById("withdrawModal").style.display="flex";
}

function closeModal(){
  document.getElementById("withdrawModal").style.display="none";
}

function confirmWithdraw(){

  const amount =
    document.getElementById("withdrawAmount").value;

  const address =
    document.getElementById("withdrawAddress").value;

  const res = requestWithdraw({
    project:activeProject,
    amount,
    walletAddress:address
  });

  if(res.error){
    alert(res.error);
    return;
  }

  closeModal();
  renderWallet();
}

/* ===============================
   CAPITAL WITHDRAW
================================ */

function withdrawCapital(project){

  const res = requestCapitalWithdraw(project);

  if(res.error){
    alert(res.error);
    return;
  }

  renderWallet();
}

/* ===============================
   AUTO REFRESH ON STAKING CHANGE
================================ */

window.addEventListener("walletUpdated",renderWallet);

/* ===============================
   INIT
================================ */

renderWallet();

</script>

</body>
</html>
