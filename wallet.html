<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{font-size:12px;color:#666;margin-top:4px}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
}

.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.project-card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(15,122,61,0.06);
  transition:all .25s ease;
}

.project-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(15,122,61,0.12);
}

.project-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.project-title{
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}

.project-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:16px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:0 4px 12px rgba(15,122,61,0.15);
}

.project-body{
  margin-top:12px;
  display:none;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}

.btn{
  padding:9px 14px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:12px;
}

.tx{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #f1f1f1;
  font-size:13px;
}

.tx-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.tx-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:14px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
}

.tx-right{
  text-align:right;
  font-weight:600;
}

.tx small{
  display:block;
  color:#777;
  font-size:11px;
  font-weight:400;
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:400px;
}

.modal input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.hidden-amount{
  filter:blur(6px);
  user-select:none;
}

.visibility-toggle{
  cursor:pointer;
  margin-left:8px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="header">💰 ALBUKHR WALLET</div>

<div class="summary">
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="balance" id="available">0.00 Pi</div>
    <span id="toggleWalletVisibility" class="visibility-toggle">👁</span>
  </div>
  <div class="sub">Available Reward Balance</div>

  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Rewards (Gross)</div>
    <div id="totalReward">0.00 Pi</div>
  </div>

  <div class="row">
    <div>Total Withdrawn</div>
    <div id="withdrawn">0.00 Pi</div>
  </div>
</div>

<div class="scroll-area" id="projectContainer"></div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

let activeProject = null;
const VISIBILITY_KEY = "albukhr_assets_visibility";

/* ======================
   ICONS
====================== */
function getProjectIcon(name){
  if(name.toLowerCase().includes("raheem")) return "💊";
  if(name.toLowerCase().includes("barsh")) return "🌾";
  if(name.toLowerCase().includes("azman")) return "🧪";
  if(name.toLowerCase().includes("khairat")) return "♻️";
  if(name.toLowerCase().includes("urban")) return "🚍";
  if(name.toLowerCase().includes("hauwal")) return "🌽";
  if(name.toLowerCase().includes("labbaika")) return "🍞";
  return "🏢";
}

/* ======================
   VISIBILITY SYSTEM
====================== */
function isHidden(){
  return localStorage.getItem(VISIBILITY_KEY) === "hidden";
}

function setHidden(state){
  localStorage.setItem(VISIBILITY_KEY, state ? "hidden":"visible");
}

function vibrate(){
  if(navigator.vibrate){
    navigator.vibrate(30);
  }
}

function applyWalletVisibility(){

  const hidden = isHidden();

  document.querySelectorAll(
    "#available, #totalStake, #totalReward, #withdrawn, .project-header div:last-child, .row div:last-child"
  ).forEach(el=>{
    el.classList.toggle("hidden-amount", hidden);
  });

  const toggle = document.getElementById("toggleWalletVisibility");
  if(toggle){
    toggle.textContent = hidden ? "🙈" : "👁";
  }
}

/* ======================
   RENDER
====================== */
function renderWallet(){
  const summary = getWalletSummary();

  totalStake.innerText = summary.totalStake.toFixed(2) + " Pi";
  totalReward.innerText = summary.grossRewards.toFixed(2) + " Pi";
  withdrawn.innerText = summary.withdrawn.toFixed(2) + " Pi";
  available.innerText = summary.available.toFixed(2) + " Pi";

  renderProjects();
  applyWalletVisibility();
}

function renderProjects(){

  const container = document.getElementById("projectContainer");
  container.innerHTML="";

  const projects = getProjectWalletBreakdown();

  if(!projects.length){
    container.innerHTML="<small>No staking activity yet</small>";
    return;
  }

  projects.forEach(p=>{

    const card = document.createElement("div");
    card.className="project-card";

    card.innerHTML = `
      <div class="project-header" onclick="toggleBody(this)">
        <div class="project-title">
          <div class="project-icon">${getProjectIcon(p.project)}</div>
          ${p.project}
        </div>
        <div>${p.netReward.toFixed(2)} Pi</div>
      </div>

      <div class="project-body">
        <div class="row">
          <div>Staked</div>
          <div>${p.stake.toFixed(2)} Pi</div>
        </div>

        <div class="row">
          <div>Gross Reward</div>
          <div>${p.grossReward.toFixed(2)} Pi</div>
        </div>

        <div class="row">
          <div>Withdrawn</div>
          <div>${p.withdrawn.toFixed(2)} Pi</div>
        </div>

        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn" onclick="openWithdraw('${p.project}')">
            Reward Withdraw
          </button>

          <button class="btn" style="background:#333"
            onclick="withdrawCapitalAction('${p.project}')">
            Capital Withdraw
          </button>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

/* ======================
   TOGGLE
====================== */
document.addEventListener("DOMContentLoaded",()=>{
  const toggle = document.getElementById("toggleWalletVisibility");

  if(toggle){
    toggle.addEventListener("click",()=>{
      const newState = !isHidden();
      setHidden(newState);
      applyWalletVisibility();
      vibrate();
    });
  }

  renderWallet();
});
</script>

</body>
</html>
