<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Wallet</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding-bottom:90px; /* space for floating nav */
}

/* ===== WALLET TOP TABS (OUTSIDE HEADER) ===== */
.wallet-tabs{
  display:flex;
  gap:10px;
  padding:14px 16px;
  background:#f4f7f6; /* same as body */
}

/* Smaller refined buttons */
.nav-btn{
  flex:1;
  padding:8px 10px;
  border-radius:12px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  border:none;
  transition:.2s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

/* Active Wallet */
.nav-wallet{
  background:#0f7a3d;
  color:#fff;
  box-shadow:0 4px 12px rgba(15,122,61,0.25);
}

/* Secondary */
.nav-trans{
  background:#fff;
  color:#0f7a3d;
  border:1px solid #dfeee7;
}

/* ===== FIXED SUMMARY ===== */
.summary{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.balance{
  font-size:26px;
  font-weight:800;
  color:#0f7a3d;
}

.sub{font-size:12px;color:#666;margin-top:4px}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:13px;
}

/* ===== SCROLL AREA ===== */
.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* ===== PROJECT CARD ===== */
.project-card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(15,122,61,0.06);
  transition:all .25s ease;
}

.project-card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(15,122,61,0.12);
}

.project-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.project-title{
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}

/* ===== PREMIUM ICON ===== */
.project-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:16px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:
    0 4px 12px rgba(15,122,61,0.15),
    inset 0 0 6px rgba(255,255,255,0.7);
  transition:all .3s ease;
}

.project-card:hover .project-icon{
  transform:scale(1.08);
}

/* ===== BODY ===== */
.project-body{
  margin-top:12px;
  display:none;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}

.btn{
  padding:9px 14px;
  border:none;
  border-radius:12px;
  background:#0f7a3d;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  font-size:12px;
  transition:all .2s ease;
}

.btn:hover{
  background:#0c5f2f;
  transform:scale(1.03);
}

/* ===== TX STYLE ===== */
.tx{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #f1f1f1;
  font-size:13px;
}

.tx-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.tx-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:14px;
  background:linear-gradient(135deg,#e6f7ee,#f3fff8);
  box-shadow:0 3px 10px rgba(15,122,61,0.12);
}

.tx-right{
  text-align:right;
  font-weight:600;
}

.tx small{
  display:block;
  color:#777;
  font-size:11px;
  font-weight:400;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:400px;
}

.modal input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

.modal-actions{
  display:flex;
  gap:10px;
}

/* ===== ECOSYSTEM HEADER (LIKE INDEX) ===== */
.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
}

.main-logo{
  height:54px;
  width:auto;
  }

/* ===============================
   ALBUKHR TELEGRAM-STYLE NAV
================================ */

.bottom-nav{
  position:fixed;
  bottom:20px;                 /* lifted from bottom */
  left:50%;
  transform:translateX(-50%);

  width:92%;                   /* space left & right */
  max-width:480px;

  display:flex;
  justify-content:space-around;
  align-items:center;

  padding:10px 0;

  background:rgba(15,122,61,0.75);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-radius:40px;          /* capsule shape */
  box-shadow:
    0 12px 40px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.15);

  z-index:1000;
}

/* NAV LINKS */
.bottom-nav a{
  flex:1;
  text-align:center;
  text-decoration:none;
  font-size:11px;
  font-weight:500;
  color:rgba(255,255,255,0.75);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;

  transition:.25s ease;
  position:relative;
}

/* ICON */
.bottom-nav a span{
  font-size:19px;
  transition:.25s ease;
}

/* ACTIVE */
.bottom-nav a.active{
  color:#fff;
  font-weight:600;
}

.bottom-nav a.active span{
  transform:translateY(-3px) scale(1.1);
}

/* Subtle glow */
.bottom-nav a.active::after{
  content:"";
  position:absolute;
  bottom:-6px;
  width:6px;
  height:6px;
  background:#ffffff;
  border-radius:50%;
}

/* Hover */
.bottom-nav a:hover span{
  transform:translateY(-2px);
}

.bottom-nav{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:94%;
  max-width:540px;
  background:#111;
  padding:14px 10px;
  border-radius:28px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}

.nav-item{
  flex:1;
  text-align:center;
  text-decoration:none;
  font-size:13px;
  font-weight:500;
  color:#aaa;
  position:relative;
  transition:.3s ease;
}

.nav-icon{
  width:26px;
  height:26px;
  fill:none;
  stroke:#3fa9f5;
  stroke-width:1.6;
  margin-bottom:4px;
  transition:.3s ease;
}

/* Gradient look */
.home{ stroke:#1da1f2; }
.wallet{ stroke:#0ea5e9; }
.globe{ stroke:#1e90ff; }
.services{ stroke:#3b82f6; }

/* Active */
.nav-item.active{
  color:#fff;
}

.nav-item.active .nav-icon{
  stroke:#00c3ff;
  transform:scale(1.1);
}

/* Active dot */
.nav-item.active::after{
  content:"";
  width:6px;
  height:6px;
  background:#00c3ff;
  border-radius:50%;
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
}

/* Hover */
.nav-item:hover .nav-icon{
  transform:translateY(-3px);
}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <img src="file_000000007bb062439b275f4bcf52e264.png" class="main-logo">
  </div>
</header>

<div class="summary">
  <div class="balance" id="available">0.00 Pi</div>
  <div class="sub">Available Reward Balance</div>

  <div class="row">
    <div>Total Staked</div>
    <div id="totalStake">0.00 Pi</div>

<div class="wallet-tabs">
  <button class="nav-btn nav-wallet">

  </button>

  <button class="nav-btn nav-trans"
    onclick="window.location.href='transactions.html'">

  </button>

<div id="withdrawSuccessBox" style="

<div class="scroll-area" id="projectContainer"></div>

<h3 id="modalProject">Withdraw</h3>

onclick="closeModal()">Cancel</button>

<p style="font-size:11px;margin-top:10px;color:#777">
Fee: 1% • Daily Limit: 50 Pi
</p>

</div>
</div>

<div class="bottom-nav">

  <!-- NEWS -->
  <a href="news.html" class="nav-item">
    <svg viewBox="0 0 24 24" class="nav-icon globe">

  <!-- SERVICES -->

<script>

document.querySelectorAll(".nav-item").forEach(link=>{

  }

<script>

let activeProject = null;

function getProjectIcon(name){
  if(name.toLowerCase().includes("raheem")) return "💊";
  if(name.toLowerCase().includes("barsh")) return "🌾";
  if(name.toLowerCase().includes("azman")) return "🧪";
  if(name.toLowerCase().includes("khairat")) return "♻️";
  if(name.toLowerCase().includes("urban")) return "🚍";
  if(name.toLowerCase().includes("hauwal")) return "🌽";
  if(name.toLowerCase().includes("labbaika")) return "🍞";
  return "🏢";
}

function renderWallet(){
  const summary = getWalletSummary();
  totalStake.innerText = summary.totalStake.toFixed(2) + " Pi";
  totalReward.innerText = summary.grossRewards.toFixed(2) + " Pi";
  withdrawn.innerText = summary.withdrawn.toFixed(2) + " Pi";
  available.innerText = summary.available.toFixed(2) + " Pi";
  renderProjects();
}

function renderProjects(){

  const container = document.getElementById("projectContainer");
  container.innerHTML="";

  const projects = getProjectWalletBreakdown();

  if(!projects.length){
    container.innerHTML="<small>No staking activity yet</small>";
    return;
  }

  projects.forEach(p=>{

    const card = document.createElement("div");
    card.className="project-card";

    card.innerHTML = `
      <div class="project-header" onclick="toggleBody(this)">
        <div class="project-title">
          <div class="project-icon">
            ${getProjectIcon(p.project)}
          </div>
          ${p.project}
        </div>
        <div>${p.netReward.toFixed(2)} Pi</div>
      </div>

      <div class="project-body">

        <div class="row">
          <div>Staked</div>
          <div>${p.stake.toFixed(2)} Pi</div>
        </div>

        <div class="row">
          <div>Gross Reward</div>
          <div>${p.grossReward.toFixed(2)} Pi</div>
        </div>

        <div class="row">
          <div>Withdrawn</div>
          <div>${p.withdrawn.toFixed(2)} Pi</div>
        </div>

        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">

  <button class="btn"
    onclick="openWithdraw('${p.project}')">
    Reward Withdraw
  </button>

  <button class="btn"
    style="background:#333"
    onclick="withdrawCapitalAction('${p.project}')">
    Capital Withdraw
  </button>

</div>

        <div id="history-${p.project}"></div>
      </div>
    `;

    container.appendChild(card);
    renderProjectHistory(p.project);
  });
}

function toggleBody(el){
  const body = el.nextElementSibling;
  body.style.display =
    body.style.display==="block" ? "none":"block";
}

function renderProjectHistory(project){

  const div = document.getElementById("history-"+project);
  if(!div) return;

  const history = getWithdrawHistory()
    .filter(tx=>tx.project===project)
    .sort((a,b)=>b.timestamp-a.timestamp);

  if(!history.length){
    div.innerHTML="<small>No withdrawals yet</small>";
    return;
  }

  div.innerHTML="";

  history.forEach(tx=>{
    div.innerHTML += `
      <div class="tx">
        <div class="tx-left">
          <div class="tx-icon">
            ${getProjectIcon(project)}
          </div>
          <div>
            Withdraw
            <small>${new Date(tx.timestamp).toLocaleString()}</small>
          </div>
        </div>
        <div class="tx-right">
          -${tx.grossAmount.toFixed(2)} Pi
          <small>
            Fee: ${tx.fee.toFixed(2)} |
            Received: ${tx.received.toFixed(2)}
          </small>
        </div>
      </div>
    `;
  });
}

function openWithdraw(project){
  activeProject = project;
  modalProject.innerText = "Withdraw from " + project;
  withdrawModal.style.display="flex";
}

function closeModal(){
  withdrawModal.style.display="none";
}

/* ===============================
   SECURITY PIN ENGINE
================================ */

const PIN_KEY = "albukhr_wallet_pin";
const LOCK_KEY = "albukhr_wallet_lock";

function getSecurity(){
  try{
    return JSON.parse(localStorage.getItem("albukhr_security_settings")) || {};
  }catch{
    return {};
  }
}

function isLocked(){
  const lockUntil = Number(localStorage.getItem(LOCK_KEY));
  if(!lockUntil) return false;

  if(Date.now() > lockUntil){
    localStorage.removeItem(LOCK_KEY);
    return false;
  }

  return true;
}

function lockWallet(seconds=30){
  localStorage.setItem(LOCK_KEY, Date.now() + (seconds*1000));
}

function setPin(pin){
  localStorage.setItem(PIN_KEY, pin);
}

function verifyPin(){
  const saved = localStorage.getItem(PIN_KEY);
  if(!saved){
    alert("No PIN set. Set PIN in Security Settings.");
    return false;
  }

  const input = prompt("Enter Wallet PIN:");
  if(!input) return false;

  if(input === saved){
    return true;
  }

  // failed attempt logic
  let attempts = Number(localStorage.getItem("albukhr_pin_attempts") || 0);
  attempts++;
  localStorage.setItem("albukhr_pin_attempts", attempts);

  if(attempts >= 3){
    lockWallet(30);
    localStorage.removeItem("albukhr_pin_attempts");
    alert("Too many failed attempts. Wallet locked for 30 seconds.");
  }else{
    alert("Incorrect PIN");
  }

  return false;
    }
  
function isSecurityEnabled(){
  try{
    const s = JSON.parse(localStorage.getItem("albukhr_security_settings"));
    return s?.enabled === true;
  }catch{
    return false;
  }
}

function isValidPiAddress(addr){
  if(!addr) return false;

  addr = addr.trim();

  if(addr.length < 20) return false;
  if(!addr.startsWith("G")) return false;

  return true;
}

function confirmWithdraw(){

  if(isLocked()){
    alert("Wallet temporarily locked. Try again later.");
    return;
  }

  const amt  = withdrawAmount.value.trim();
  const addr = withdrawAddress.value.trim();

  /* ===== AMOUNT VALIDATION ===== */
  if(!amt || Number(amt) <= 0){
    alert("Enter valid withdraw amount");
    return;
  }

  /* ===== ADDRESS IS NOW ALWAYS REQUIRED ===== */
  if(!isValidPiAddress(addr)){
    alert("Valid Pi wallet address required");
    return;
  }

  /* ===== SECURITY PIN CHECK ===== */
  const security = getSecurity();

  if(security.enabled && security.twofa){
    if(!verifyPin()){
      return;
    }
  }

  /* ===== PROCESS WITHDRAW ===== */
  const res = requestWithdraw({
    project: activeProject,
    amount: amt,
    walletAddress: addr
  });

  if(res.error){
    alert(res.error);
    return;
  }

  withdrawAmount.value="";
  withdrawAddress.value="";
  closeModal();
  renderWallet();
}
  
function withdrawCapitalAction(project){

  const res = requestCapitalWithdraw(project);

  if(res?.error){
    alert(res.error);
    return;
  }

  alert("Capital withdrawn: " + res.grossAmount.toFixed(2) + " Pi");

  renderWallet();
  }

function handleCapitalWithdraw(project){

  const res = requestCapitalWithdraw(project);

  if(res.error){
    alert(res.error);
    return;
  }

  alert("Capital returned: " + res.amount.toFixed(2) + " Pi");

  renderWallet();
}
  
renderWallet();

</script>

<script>

const withdrawSuccessBox = document.getElementById("withdrawSuccessBox");

/* Track last withdraw timestamp */
let lastWithdrawTime = 0;

/* Listen for wallet updates */
window.addEventListener("walletUpdated", function(e){

  if(!e.detail) return;

  const data = e.detail;

  /* Idan withdraw ne */
  if(data.type === "reward-withdraw" || data.type === "capital-withdraw"){

    const now = Date.now();

    /* Kauce wa duplicate show */
    if(now - lastWithdrawTime < 1000) return;

    lastWithdrawTime = now;

    showWithdrawSuccess();
  }

});

function showWithdrawSuccess(){

  withdrawSuccessBox.style.display = "block";
  withdrawSuccessBox.textContent = "Withdraw Successful ✓";

  /* Auto hide after 4 seconds */
  setTimeout(()=>{
    withdrawSuccessBox.style.display = "none";
  },4000);
}

</script>
