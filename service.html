<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Services</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#f5f7f6;padding-bottom:90px;font-family:Arial}

/* SERVICE GRID */
.service-section{padding:16px}
.service-grid{display:grid;grid-template-columns:1fr;gap:14px}

.service-card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  cursor:pointer;
  transition:.2s;
  border:1px solid #eee
}
.service-card:hover{transform:scale(1.01)}
.service-card h3{margin:0 0 6px;font-size:16px}
.service-card p{margin:0;font-size:13px;color:#666}

.service-card.disabled{
  opacity:.5;
  cursor:not-allowed
}

/* SERVICE VIEW */
#serviceView{
  margin-top:18px;
  background:#fff;
  border-radius:16px;
  padding:16px;
}

/* FORM */
label{display:block;margin-top:14px;font-size:14px}
input,textarea,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:15px
}
textarea{min-height:80px}

.btn{
  margin-top:16px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  width:100%
}
.primary{background:#0f7a3d;color:#fff}
.secondary{background:#fff;border:1px solid #0f7a3d;color:#0f7a3d}

.notice{
  background:#f1f8f4;
  border-left:4px solid #0f7a3d;
  padding:10px;
  margin-top:14px;
  font-size:13px;
  color:#333
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <h1 class="brand">Services</h1>
</header>

<!-- SERVICE DASHBOARD -->
<section class="service-section">

  <h3 style="font-size:15px;margin-bottom:10px">
    Albukhr Services
  </h3>

  <div class="service-grid">

    <!-- CREATE EXTERNAL PROJECT -->
    <div class="service-card" onclick="openService('create-project')">
      <h3>🚀 Create External Project</h3>
      <p>Submit your project for Albukhr verification and staking</p>
    </div>

    <!-- FUTURE SERVICES -->
    <div class="service-card disabled">
      <h3>🤖 AI Project Verification</h3>
      <p>Coming soon</p>
    </div>

    <div class="service-card disabled">
      <h3>📊 Project Analytics</h3>
      <p>Coming soon</p>
    </div>

  </div>

  <!-- DYNAMIC SERVICE VIEW -->
  <div id="serviceView"></div>

</section>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="projects.html"><span>📁</span>Projects</a>
  <a href="wallet.html"><span>💰</span>Wallet</a>
  <a href="service.html" class="active"><span>🛠️</span>Services</a>
  <a href="settings.html"><span>⚙️</span>Settings</a>
</nav>

<script src="staking-external.js"></script>

<script>
/* =========================
   SERVICE ROUTER
========================= */
function openService(service){

  if(service === "create-project"){
    loadCreateProject();
  }

}

/* =========================
   CREATE EXTERNAL PROJECT
========================= */
function loadCreateProject(){

  const box = document.getElementById("serviceView");

  box.innerHTML = `
    <h3>Create External Project</h3>

    <div class="notice">
      Only verified projects will be approved and given a public project link.
      Albukhr reserves the right to freeze or reject any project.
    </div>

    <label>Project Name</label>
    <input id="pName" placeholder="Project name">

    <label>Category</label>
    <select id="pCategory">
      <option>Agriculture</option>
      <option>Health</option>
      <option>Technology</option>
      <option>Education</option>
      <option>Other</option>
    </select>

    <label>Description</label>
    <textarea id="pDesc" placeholder="Describe your project"></textarea>

    <label>Owner Pi UID</label>
    <input id="pOwner" placeholder="Your Pi UID">

    <button class="btn primary" onclick="submitProject()">Submit Project</button>
    <button class="btn secondary" onclick="closeService()">Close</button>
  `;
}

function closeService(){
  document.getElementById("serviceView").innerHTML = "";
}

/* =========================
   SUBMIT PROJECT (PENDING)
========================= */
function submitProject(){

  const project = {
    projectId: "EXT-" + Date.now(),
    name: pName.value.trim(),
    category: pCategory.value,
    description: pDesc.value.trim(),
    owner: pOwner.value.trim(),
    status: "pending",
    totalStaked: 0,
    milestones: [],
    createdAt: Date.now()
  };

  if(!project.name || !project.description || !project.owner){
    alert("Please complete all required fields");
    return;
  }

  saveExternalProject(project);

  alert(
    "Project submitted successfully.\n\n" +
    "Status: Pending Verification"
  );

  closeService();
}
</script>

</body>
</html>
