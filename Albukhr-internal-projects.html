<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Albukhr Internal Projects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>ALBUKHR • Internal Projects</h1>
</header>

<section style="padding:16px">
  <div id="projectList"></div>
</section>

<script src="internal-project-engine.js"></script>

<script>
const container = document.getElementById("projectList");

function renderInternalProjects(){

  const list = getInternalLiveProjects();

  if(!list.length){
    container.innerHTML = "<p>No active internal projects yet.</p>";
    return;
  }

  container.innerHTML = "";

  list.forEach(p=>{

    const div = document.createElement("div");
    div.style.background="#fff";
    div.style.padding="14px";
    div.style.marginBottom="12px";
    div.style.borderRadius="12px";

    div.innerHTML = `
      <h3>${p.name}</h3>
      <small>${p.category}</small><br><br>

      Duration: ${p.durationDays} days<br>
      Reward Rate: ${p.rewardRate * 100}%<br>
      Total Staked: ${p.totalStaked} Pi<br>
      Status: ${p.status}
    `;

    container.appendChild(div);
  });
}

renderInternalProjects();
</script>

<script src="internal-core-seed.js"></script>
<script src="staking-engine.js"></script>
<script src="reward-engine.js"></script>
<script src="wallet-core.js"></script>

<script>

seedInternalCoreProjects();

function renderInternalProjects(){

  const list = getAllInternalProjects();
  const container = document.getElementById("projectList");
  container.innerHTML = "";

  list.forEach(p=>{

    const div = document.createElement("div");
    div.className="card";
    div.innerHTML = `
      <h3>${p.name}</h3>
      <small>${p.category}</small>
      <div>Reward Rate: ${p.rewardRate * 100}%</div>
      <div>Duration: ${p.durationDays} days</div>
      <button onclick="stakeNow('${p.id}')">Stake</button>
    `;

    container.appendChild(div);
  });
}

function stakeNow(projectId){

  const amount = prompt("Enter amount to stake:");
  if(!amount || amount<=0) return;

  addStake(projectId, parseFloat(amount));

  alert("Stake successful");
}

renderInternalProjects();

initInternalProjects();

function renderInternalProjects(){
  const list = getAllInternalProjects();
  const container = document.getElementById("internalProjectsList");

  container.innerHTML="";

  list.forEach(p=>{
    const div=document.createElement("div");
    div.innerHTML=`
      <h4>${p.name}</h4>
      <small>${p.category}</small><br>
      Duration: ${p.durationDays} days<br>
      Reward Rate: ${(p.rewardRate*100)}%<br>
      Status: ${p.status}
      <hr>
    `;
    container.appendChild(div);
  });
}

renderInternalProjects();  
  
</script>
  
</body>
</html>
