<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR – External Project</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#f4f7f5;font-family:system-ui}
.section{padding:16px;max-width:900px;margin:auto}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px
}
.badge{
  display:inline-block;
  padding:4px 12px;
  font-size:11px;
  border-radius:20px;
  font-weight:700;
  background:#e6f7ee;
  color:#0f7a3d;
  margin-bottom:8px
}
h2{margin:6px 0}
small{color:#666;font-size:13px}
hr{border:none;border-top:1px solid #eee;margin:12px 0}
.label{
  font-size:12px;
  color:#555;
  margin-bottom:4px;
  font-weight:700
}
.value{
  font-size:14px;
  margin-bottom:10px
}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#9ac9b0;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:not-allowed
}
.note{
  font-size:12px;
  color:#666;
  margin-top:10px;
  line-height:1.6
}
.back{
  margin-bottom:12px;
  font-size:13px;
  cursor:pointer;
  color:#0f7a3d;
  font-weight:700
}
</style>
</head>

<body>

<section class="section">

  <div class="back" onclick="history.back()">← Back</div>

  <div id="content"></div>

</section>

<!-- ENGINE -->
<script src="staking-external.js"></script>

<script>
const wrap = document.getElementById("content");

/* ===============================
   LOAD PROJECT BY URL ID
================================ */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(!id){
  wrap.innerHTML = "<p>Invalid project link.</p>";
}else{
  const project = getExternalProjectById(id);

  if(!project){
    wrap.innerHTML = "<p>Project not found.</p>";
  }else{
    render(project);
  }
}

/* ===============================
   RENDER
================================ */
function render(p){
  wrap.innerHTML = `
    <div class="card">
      <span class="badge">${p.status.toUpperCase()}</span>
      <h2>${p.title}</h2>
      <small>${p.category}</small>

      <hr>

      <div class="label">Project Description</div>
      <div class="value">${p.description}</div>

      <div class="label">Project Owner</div>
      <div class="value">${p.owner}</div>

      <div class="label">Escrow Status</div>
      <div class="value">
        ${p.escrowLocked ? "🔒 Funds Locked in Albukhr Escrow" : "Unlocked"}
      </div>

      <div class="label">Created</div>
      <div class="value">${new Date(p.createdAt).toLocaleString()}</div>

      <button class="btn">
        Staking Locked
      </button>

      <div class="note">
        ⚠️ Staking is disabled until full verification and escrow release.<br>
        This protects investors and project owners.
      </div>
    </div>
  `;
}
</script>

</body>
</html>
