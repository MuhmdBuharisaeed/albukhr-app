<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>External Project</title>

<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.project-header{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}
.project-title{
  font-size:18px;
  font-weight:700
}
.project-desc{
  font-size:13px;
  color:#555;
  margin-top:6px;
  line-height:1.5
}
.meta{
  font-size:12px;
  color:#0f7a3d;
  margin-top:10px
}
.stat-box{
  display:flex;
  gap:12px;
  margin:16px 0
}
.stat{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:14px;
  text-align:center
}
.stat span{
  font-size:12px;
  color:#666
}
.stat strong{
  display:block;
  margin-top:6px;
  font-size:16px
}
.notice{
  background:#fff7e6;
  border-radius:12px;
  padding:12px;
  font-size:13px;
  color:#8a5a00;
  line-height:1.5
}
</style>
</head>

<body data-page="external-project">

<!-- HEADER -->
<header class="header">
  <div class="header-left">🌍 External Project</div>
</header>

<section class="section">

  <!-- PROJECT INFO -->
  <div class="project-header">
    <div class="project-title" id="pTitle">Loading...</div>
    <div class="project-desc" id="pDesc"></div>
    <div class="meta" id="pMeta"></div>
  </div>

  <!-- STATS -->
  <div class="stat-box">
    <div class="stat">
      <span>Total Staked</span>
      <strong id="pStake">0 Pi</strong>
    </div>
    <div class="stat">
      <span>Total Reward</span>
      <strong id="pReward">0 Pi</strong>
    </div>
  </div>

  <!-- NOTICE -->
  <div class="notice">
    🔒 This is a verified external project under Albukhr escrow supervision.
    Direct staking is currently unavailable.
  </div>

</section>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="projects.html"><span>📁</span>Projects</a>
  <a href="wallet.html"><span>💰</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="settings.html"><span>⚙️</span>Settings</a>
</nav>

<!-- EXTERNAL ENGINE ONLY -->
<script src="staking-external.js"></script>

<script>
/* ===============================
   LOAD EXTERNAL PROJECT
================================ */

function getQueryParam(key){
  return new URLSearchParams(window.location.search).get(key);
}

function loadExternalProject(){
  const id = getQueryParam("id");
  if(!id){
    alert("Invalid project");
    return;
  }

  const projects = getExternalProjects
    ? getExternalProjects()
    : [];

  const project = projects.find(p => p.projectId === id);

  if(!project){
    alert("Project not found");
    return;
  }

  pTitle.innerText = project.title;
  pDesc.innerText =
    project.description || "Verified external project on Albukhr.";
  pMeta.innerText =
    "Owner: " + (project.owner || "Verified partner");

  const totals = getExternalProjectTotals
    ? getExternalProjectTotals(id)
    : { stake:0, reward:0 };

  pStake.innerText = (totals.stake || 0) + " Pi";
  pReward.innerText = (totals.reward || 0) + " Pi";
}

window.addEventListener("DOMContentLoaded", loadExternalProject);
</script>

</body>
</html>
