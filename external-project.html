<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>External Project</title>

<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.project-box{
  background:#fff;
  border-radius:16px;
  padding:18px;
}
.project-title{
  font-size:18px;
  font-weight:700;
}
.project-desc{
  font-size:13px;
  color:#666;
  margin-top:6px;
  line-height:1.6;
}
.project-meta{
  margin-top:12px;
  font-size:13px;
  color:#0f7a3d;
}
.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:11px;
  border-radius:20px;
  background:#e6f5ec;
  color:#0f7a3d;
  margin-top:8px;
}
.stake-box{
  margin-top:18px;
  background:#f9f9f9;
  padding:14px;
  border-radius:14px;
}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:8px;
}
button{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:600;
  background:#0f7a3d;
  color:#fff;
}
.disabled{
  background:#aaa !important;
}
.notice{
  font-size:12px;
  color:#777;
  margin-top:8px;
}
</style>
</head>

<body data-page="external-project">

<header class="header">
  <div class="header-left">
    <span>🌍 External Project</span>
  </div>
</header>

<section class="section">

  <div class="project-box" id="projectBox">
    Loading project...
  </div>

</section>

<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="projects.html" class="active"><span>📁</span>Projects</a>
  <a href="wallet.html"><span>💰</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="settings.html"><span>⚙️</span>Settings</a>
</nav>

<script src="staking-external.js"></script>

<script>
const box = document.getElementById("projectBox");

const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");

if(!projectId || typeof getExternalProjects !== "function"){
  box.innerHTML = "<div class='notice'>Project not found</div>";
} else {

  const project = getExternalProjects()
    .find(p => p.projectId === projectId);

  if(!project){
    box.innerHTML = "<div class='notice'>Project not available</div>";
  } else {
    renderProject(project);
  }
}

function renderProject(p){
  const verified = p.status === "verified" || p.status === "active";

  box.innerHTML = `
    <div class="project-title">${p.title}</div>
    <div class="project-desc">${p.description || ""}</div>

    <div class="project-meta">
      Total Staked: ${p.totalStaked || 0} Pi
    </div>

    <span class="badge">
      Status: ${p.status || "pending"}
    </span>

    <div class="stake-box">
      <strong>Stake Pi</strong>

      <input id="stakeAmount"
        type="number"
        min="1"
        placeholder="Amount in Pi">

      <button
        ${verified ? "" : "disabled"}
        class="${verified ? "" : "disabled"}"
        onclick="stake('${p.projectId}')">
        Stake Now
      </button>

      <div class="notice">
        ${verified
          ? "Funds go to escrow wallet"
          : "Project must be verified before staking"}
      </div>
    </div>
  `;
}

function stake(id){
  const amount = Number(stakeAmount.value);

  if(!amount || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  if(typeof stakeExternalProject !== "function"){
    alert("Staking system not available");
    return;
  }

  stakeExternalProject(id, amount);
  alert("Stake successful");

  location.reload();
}
</script>

</body>
</html>
