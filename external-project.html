<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>External Project</title>

<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}
.title{font-size:18px;font-weight:700}
.desc{font-size:14px;color:#555;margin-top:6px;line-height:1.6}
.meta{font-size:13px;color:#777;margin-top:10px}
.stat{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-top:8px
}
.badge{
  display:inline-block;
  margin-top:10px;
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  background:#e6f5ec;
  color:#0f7a3d
}
.notice{
  background:#fff3cd;
  color:#856404;
  font-size:13px;
  padding:12px;
  border-radius:12px;
  margin-top:14px
}
.btn{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:700;
  background:#ccc;
  color:#555
}
</style>
</head>

<body data-page="external-project">

<header class="header">
  <div class="header-left">
    <span>🌍 External Project</span>
  </div>
</header>

<section class="section">
  <div id="projectBox"></div>
</section>

<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="projects.html"><span>📁</span>Projects</a>
  <a href="wallet.html"><span>💰</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="settings.html"><span>⚙️</span>Settings</a>
</nav>

<script>
const KEY = "albukhr_external_projects";

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function loadProject(){
  const id = getParam("id");
  const box = document.getElementById("projectBox");

  if(!id){
    box.innerHTML = "<p>Invalid project</p>";
    return;
  }

  const projects = JSON.parse(localStorage.getItem(KEY) || "[]");
  const project = projects.find(p => p.projectId === id);

  if(!project || project.status !== "approved"){
    box.innerHTML =
      "<p style='font-size:14px;color:#777'>Project not available</p>";
    return;
  }

  box.innerHTML = `
    <div class="card">
      <div class="title">${project.title}</div>
      <div class="desc">${project.description}</div>

      <div class="meta">
        Category: ${project.category || "—"}<br>
        Owner Wallet: ${project.wallet}
      </div>

      <div class="stat">
        <span>Target</span>
        <strong>${project.target} Pi</strong>
      </div>

      <div class="stat">
        <span>Total Staked</span>
        <strong>${project.totalStaked || 0} Pi</strong>
      </div>

      <span class="badge">Verified External Project</span>

      <div class="notice">
        🔒 External staking is currently locked.<br>
        Funds will be held in escrow once enabled.
      </div>

      <button class="btn" disabled>
        Staking Coming Soon
      </button>
    </div>
  `;
}

loadProject();
</script>

</body>
</html>
