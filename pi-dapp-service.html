<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR – Submit dApp Request</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:sans-serif;background:#f2f5f3;margin:0}
.header{padding:14px;background:#0f7a3d;color:#fff}
.section{padding:16px}
.card{background:#fff;border-radius:14px;padding:14px}
input,select,textarea,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px
}
button{
  background:#0f7a3d;
  color:#fff;
  font-weight:600;
  border:none;
  margin-top:14px
}
.note{font-size:12px;color:#666;margin-top:6px}
</style>
</head>

<body>

<div class="header">
  <h3>Submit dApp Request</h3>
</div>

<div class="section">
  <div class="card">

    <input id="piUser" placeholder="Pi username" required>

    <input id="projectName" placeholder="Project name" required>

    <select id="serviceType">
      <option value="">Select service</option>
      <option>DApp Development</option>
      <option>Smart Contract</option>
      <option>UI / UX</option>
      <option>Audit</option>
    </select>

    <textarea id="description" placeholder="Describe your request"></textarea>

    <label class="note">Upload payment receipt</label>
    <input type="file" id="receipt" accept="image/*" required>

    <input id="receiptRef" placeholder="Transaction reference (optional)">

    <button onclick="submitRequest()">Submit for Review</button>

  </div>
</div>

<script>
const KEY = "albukhr_dapp_requests";

function submitRequest(){
  const piUser = document.getElementById("piUser").value.trim();
  const projectName = document.getElementById("projectName").value.trim();
  const serviceType = document.getElementById("serviceType").value;
  const description = document.getElementById("description").value.trim();
  const receiptInput = document.getElementById("receipt");
  const receiptRef = document.getElementById("receiptRef").value.trim();

  if(!piUser || !projectName || !serviceType){
    alert("Please fill all required fields");
    return;
  }

  if(!receiptInput.files.length){
    alert("Please upload payment receipt");
    return;
  }

  const file = receiptInput.files[0];

  // size limit (2MB)
  if(file.size > 2 * 1024 * 1024){
    alert("Receipt image too large (max 2MB)");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(){
    const request = {
      id: Date.now(),
      piUser,
      projectName,
      serviceType,
      description,
      receiptRef,
      receiptImage: reader.result, // ✅ image base64
      status: "pending",
      createdAt: Date.now()
    };

    const list = JSON.parse(localStorage.getItem(KEY)) || [];
    list.push(request);
    localStorage.setItem(KEY, JSON.stringify(list));

    alert("Request submitted successfully");
    window.location.href = "admin.html"; // ko my-requests.html
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
