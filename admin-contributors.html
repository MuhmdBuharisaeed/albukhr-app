<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR Admin – Contributors</title>
<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}
.meta{
  font-size:12px;
  color:#555;
  margin-top:6px;
  line-height:1.6
}
.photo{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ddd;
  margin-top:8px
}
.desc{
  margin-top:10px;
  font-size:12px;
  background:#f7f9f8;
  padding:10px;
  border-radius:10px;
  line-height:1.6
}
button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  margin-right:6px
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#eee;color:#333}
.btn.approved{background:#0f7a3d;color:#fff;cursor:default}
.btn.rejected{background:#b02a37;color:#fff;cursor:default}
.btn.disabled{opacity:.6;pointer-events:none}
.telegram{
  margin-top:10px;
  display:inline-block;
  background:#229ED9;
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  text-decoration:none
}
.empty{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:20px
}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">ALBUKHR • Admin</h1>
</header>

<section class="section">
  <h3>🧩 Contributor Review Panel</h3>
  <div id="list"></div>
</section>

<script>
const KEY = "albukhr_contributors";
const box = document.getElementById("list");

let list = JSON.parse(localStorage.getItem(KEY)) || [];

function render(){
  box.innerHTML = "";

  if(list.length === 0){
    box.innerHTML = `<div class="empty">No contributors yet</div>`;
    return;
  }

  list.forEach((c,i)=>{
    box.innerHTML += `
      <div class="card">

        <strong>${c.fullName}</strong>

        <div class="meta">
          📞 ${c.phone}<br>
          ✉️ ${c.email}<br>
          🌍 ${c.country || "-"}<br>
          📍 ${c.address}
        </div>

        <img src="${c.photo}" class="photo">

        <div class="desc">
          <strong>Skills / Role</strong><br>
          ${c.skills}<br><br>

          <strong>Web3 Experience</strong><br>
          ${c.experience || "-"}<br><br>

          <strong>Contribution</strong><br>
          ${c.contribution}
        </div>

        <div style="margin-top:12px">
          ${
            c.status === "pending"
            ? `
              <button class="approve" onclick="setStatus(${i}, 'approved')">
                Approve
              </button>
              <button class="reject" onclick="setStatus(${i}, 'rejected')">
                Reject
              </button>
            `
            : c.status === "approved"
            ? `
              <button class="btn approved disabled">✓ Approved</button>
              <button class="btn disabled">Reject</button>
              <br>
              <a class="telegram"
                 href="https://t.me/ALBUKHR_ECOSYSTEM_GROUP"
                 target="_blank">
                Join Telegram Group
              </a>
            `
            : `
              <button class="btn disabled">Approve</button>
              <button class="btn rejected disabled">✗ Rejected</button>
            `
          }
        </div>

      </div>
    `;
  });
}

function setStatus(index,status){
  if(list[index].status !== "pending") return;

  list[index].status = status;
  list[index].telegramUnlocked = (status === "approved");
  list[index].reviewedAt = Date.now();

  localStorage.setItem(KEY, JSON.stringify(list));
  render();
}

render();
</script>

</body>
</html>
