<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Admin – Contributor Panel</title>

<style>
body{font-family:sans-serif;background:#f3f7f4;margin:0}
.section{padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}
h2{margin:0 0 10px}
.label{font-size:13px;font-weight:700;margin-top:8px}
.value{font-size:13px;margin-bottom:6px}
img{max-width:100%;border-radius:12px;margin-top:8px}

.btn{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  margin-right:6px
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#c0392b;color:#fff}
.badge{
  display:inline-block;
  font-size:11px;
  padding:4px 8px;
  border-radius:8px;
  margin-bottom:6px
}
.pending{background:#f1c40f}
.approved{background:#0f7a3d;color:#fff}
.rejected{background:#c0392b;color:#fff}
</style>
</head>

<body>

<section class="section">
<h2>🛡️ Albukhr Admin – Contributors</h2>

<div id="list"></div>
</section>

<script>
const KEY = "albukhr_contributors";
const TG_LINK = "https://t.me/ALBUKHR_ECOSYSTEM_GROUP";

function getList(){
  return JSON.parse(localStorage.getItem(KEY)) || [];
}
function saveList(l){
  localStorage.setItem(KEY, JSON.stringify(l));
}

function render(){
  const list = getList();
  const box = document.getElementById("list");
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = "<p>No contributors yet.</p>";
    return;
  }

  list.forEach((c,i)=>{
    const card = document.createElement("div");
    card.className = "card";

    const badge =
      c.status === "pending" ? "pending" :
      c.status === "approved" ? "approved" : "rejected";

    card.innerHTML = `
      <span class="badge ${badge}">${c.status.toUpperCase()}</span>

      <div class="label">Full Name</div>
      <div class="value">${c.fullName}</div>

      <div class="label">Email</div>
      <div class="value">${c.email}</div>

      <div class="label">Phone</div>
      <div class="value">${c.phone}</div>

      <div class="label">Country</div>
      <div class="value">${c.country}</div>

      <div class="label">Skills</div>
      <div class="value">${c.skills}</div>

      <div class="label">Contribution</div>
      <div class="value">${c.contribution}</div>

      <div class="label">Photo</div>
      <img src="${c.photo}">

      <br><br>

      ${
        c.status === "pending"
        ? `
          <button class="btn approve" onclick="approve(${i})">
            Approve
          </button>
          <button class="btn reject" onclick="reject(${i})">
            Reject
          </button>
        `
        : ""
      }

      ${
        c.status === "approved"
        ? `<p style="font-size:12px">
            🔓 Telegram unlocked:
            <strong>${TG_LINK}</strong>
           </p>`
        : ""
      }
    `;

    box.appendChild(card);
  });
}

function approve(i){
  const list = getList();
  list[i].status = "approved";
  list[i].telegramUnlocked = true;
  list[i].telegramLink = TG_LINK;
  saveList(list);
  render();
  alert("✅ Contributor approved & Telegram unlocked");
}

function reject(i){
  const list = getList();
  list[i].status = "rejected";
  list[i].telegramUnlocked = false;
  saveList(list);
  render();
  alert("❌ Contributor rejected");
}

render();
</script>

</body>
</html>
