<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barsh Agro</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  background:#f5f7f6;
  font-family:Arial;
  padding-bottom:90px;
}

/* HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:#0f7a3d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  font-weight:bold;
  z-index:1000;
}

/* FIXED TOP CONTENT */
.fixed-top{
  position:fixed;
  top:60px;
  left:0;
  right:0;
  background:#f5f7f6;
  padding:16px;
  z-index:999;
}

/* STATS */
.stats{
  display:flex;
  gap:12px;
  margin-bottom:14px;
}

.stat-card{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat-card span{
  display:block;
  color:#666;
  font-size:14px;
}

.stat-card strong{
  font-size:18px;
  margin-top:6px;
  display:block;
}

/* INFO */
.short-info{
  background:#fff;
  border-radius:12px;
  padding:12px;
  font-size:13px;
  color:#444;
  line-height:1.5;
  margin-bottom:14px;
}

/* BUTTONS */
.btns{
  display:flex;
  gap:12px;
}

.btn{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  font-size:16px;
}

.primary{
  background:#0f7a3d;
  color:#fff;
}

.secondary{
  background:#fff;
  border:1px solid #0f7a3d;
  color:#0f7a3d;
}

/* SCROLL AREA */
.scroll-area{
  position:fixed;
  top:340px;
  bottom:0;
  left:0;
  right:0;
  overflow-y:auto;
  padding:16px;
}

/* TRANSACTION CARD */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
}

.project-icon{
  font-size:18px;
}

.project-body{
  flex:1;
}

.project-title{
  font-size:14px;
  font-weight:600;
}

.project-date{
  font-size:11px;
  color:#777;
}

.project-right{
  text-align:right;
}

.project-amount{
  font-size:14px;
  font-weight:bold;
}

.project-status{
  font-size:11px;
  color:#0f7a3d;
}
</style>
</head>

<body>

<header class="header">
  <div>🌾 Barsh Agro</div>
  <div style="cursor:pointer" onclick="openInfo()">ℹ️</div>
</header>

<div class="fixed-top">

  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="bStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="bReward">0.00 Pi</strong>
    </div>
  </div>

  <div class="short-info">
    <strong>Barsh Agro</strong> is an ALBUKHR mechanized farming and livestock
    project focused on large-scale crop production and sustainable agriculture.
  </div>

  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button onclick="goToWithdraw()" class="btn secondary">
      💸 Withdraw Rewards
    </button>
  </div>

</div>

<div class="scroll-area">
  <h3 style="font-size:15px;margin-bottom:10px">Transaction History</h3>
  <div id="barshHistory"></div>
</div>

<!-- MODALS remain unchanged -->
<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
function load(){
  const data = getProjectTotals("Barsh");

  bStake.innerText = data.stake.toFixed(2) + " Pi";
  bReward.innerText = data.reward.toFixed(2) + " Pi";

  barshHistory.innerHTML = "";

  if(data.stakes.length === 0){
    barshHistory.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  data.stakes.slice().reverse().forEach(s=>{
    const t = formatDateTime(s);

    const div = document.createElement("div");
    div.className="project-tx";
    div.innerHTML=`
      <div class="project-icon">🌾</div>
      <div class="project-body">
        <div class="project-title">Barsh Stake</div>
        <div class="project-date">${t.date} • ${t.time}</div>
      </div>
      <div class="project-right">
        <div class="project-amount">${s.amount} Pi</div>
        <div class="project-status">Successful</div>
      </div>
    `;
    barshHistory.appendChild(div);
  });
}

function goToWithdraw(){
  if(typeof getTotals !== "function"){
    alert("Wallet system not ready");
    return;
  }

  const totals = getTotals();
  const withdrawn = typeof getTotalWithdrawn === "function"
    ? getTotalWithdrawn()
    : 0;

  const available = totals.totalReward - withdrawn;

  if(available <= 0){
    alert("No available rewards to withdraw.");
    return;
  }

  window.location.href = "wallet.html";
}

load();
</script>

</body>
</html>
