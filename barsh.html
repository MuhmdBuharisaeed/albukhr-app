<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barsh Agro</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f7f6;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER FIXED */
.header{
  flex-shrink:0;
}

/* TOP FIXED AREA */
.fixed-top{
  padding:16px;
  flex-shrink:0;
  background:#f5f7f6;
}

/* STATS */
.stats{display:flex;gap:12px;margin:16px 0}
.stat-card{flex:1;background:#fff;border-radius:14px;padding:16px;text-align:center}
.stat-card span{display:block;color:#666;font-size:14px}
.stat-card strong{font-size:18px;margin-top:6px;display:block}

/* INFO */
.short-info{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  font-size:14px;
  color:#444;
  line-height:1.6
}

/* BUTTONS */
.btns{display:flex;gap:12px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:bold;font-size:16px}
.primary{background:#0f7a3d;color:#fff}
.secondary{background:#fff;border:1px solid #0f7a3d;color:#0f7a3d}

/* SCROLL AREA */
.scroll-area{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

/* TRANSACTIONS */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px
}
.project-icon{font-size:18px}
.project-body{flex:1}
.project-title{font-size:14px;font-weight:600}
.project-date{font-size:11px;color:#777}
.project-right{text-align:right}
.project-amount{font-size:14px;font-weight:bold}
.project-status{font-size:11px;color:#0f7a3d}

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000
}
.modal-box{
  background:#fff;
  width:90%;
  max-width:420px;
  padding:20px;
  border-radius:16px
}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px
}
label{margin-top:12px;display:block}
.success{text-align:center}
.success h3{color:#0f7a3d;margin-bottom:8px}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <span>🌾 Barsh Agro</span>
  </div>
  <div class="header-right" onclick="openInfo()">ℹ️</div>
</header>

<div class="fixed-top">

  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="bStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="bReward">0.00 Pi</strong>
    </div>
  </div>

  <div class="short-info">
    <strong>Barsh Agro</strong> is an ALBUKHR mechanized farming and livestock
    project focused on large-scale crop production and sustainable agriculture.
  </div>

  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button onclick="goToWithdraw()" class="btn secondary">
      💸 Withdraw Rewards
    </button>
  </div>

  <h3 style="margin-top:20px;font-size:15px">Transaction History</h3>

</div>

<div class="scroll-area">
  <div id="barshHistory"></div>
</div>

<!-- MODALS UNCHANGED -->

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const stakeModal = document.getElementById("stakeModal");
const successModal = document.getElementById("successModal");
const infoModal = document.getElementById("infoModal");

function openModal(){
  stakeModal.style.display="flex";
  minHint.innerText = "Minimum stake: " + getMinStake("Barsh") + " Pi";
}
function closeModal(){ stakeModal.style.display="none"; }
function closeSuccess(){ successModal.style.display="none"; }
function openInfo(){ infoModal.style.display="flex"; }
function closeInfo(){ infoModal.style.display="none"; }

function confirmStake(){
  const amount = Number(amountInput.value);
  const duration = Number(durationSelect.value);
  const min = getMinStake("Barsh");

  if(isNaN(amount) || amount <= 0){
    alert("Please enter a valid amount");
    return;
  }

  if(amount < min){
    alert("Minimum stake is " + min + " Pi");
    return;
  }

  addStake({ project:"Barsh", amount, duration });

  successText.innerText =
    `You staked ${amount} Pi for ${duration} days in Barsh Agro.`;

  closeModal();
  successModal.style.display="flex";
  load();
}

function load(){
  const data = getProjectTotals("Barsh");

  bStake.innerText = data.stake.toFixed(2) + " Pi";
  bReward.innerText = data.reward.toFixed(2) + " Pi";

  barshHistory.innerHTML = "";

  if(!data.stakes || data.stakes.length === 0){
    barshHistory.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  /* REAL LATEST FIRST SORT */
  data.stakes
    .slice()
    .sort((a,b)=>(b.timestamp||0)-(a.timestamp||0))
    .forEach(s=>{
      const t = formatDateTime(s);
      const div = document.createElement("div");
      div.className="project-tx";
      div.innerHTML=`
        <div class="project-icon">🌾</div>
        <div class="project-body">
          <div class="project-title">Barsh Stake</div>
          <div class="project-date">${t.date} • ${t.time}</div>
        </div>
        <div class="project-right">
          <div class="project-amount">${Number(s.amount).toFixed(2)} Pi</div>
          <div class="project-status">Successful</div>
        </div>
      `;
      barshHistory.appendChild(div);
    });
}

function goToWithdraw(){
  if(typeof getTotals !== "function"){
    alert("Wallet system not ready");
    return;
  }
  window.location.href = "wallet.html";
}

load();
</script>

</body>
</html>
