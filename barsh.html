<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barsh Agro</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/global-core.css">
<link rel="stylesheet" href="css/global-layout.css">
<link rel="stylesheet" href="css/global-components.css">
<link rel="stylesheet" href="css/global-style.css">

</head>

<body>

<header class="header">
  <div class="header-left">
    <span>🌾 Barsh Agro</span>
  </div>
  <div class="header-right" onclick="openInfo()">ℹ️</div>
</header>

<div class="fixed-section">

  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="lStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="lReward">0.00 Pi</strong>
    </div>
  </div>

  <div class="short-info">
    <strong>Barsh Agro</strong> is an ALBUKHR mechanized farming and livestock
    project focused on large-scale crop production and sustainable agriculture.
  </div>

  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button onclick="openWithdrawModal()" class="btn secondary">
      💸 Withdraw Rewards
    </button>
  </div>

  <h3 style="margin-top:20px;font-size:15px">Transaction History</h3>
</div>

<div class="scroll-area">
  <div id="barshHistory"></div>
</div>

<!-- STAKE MODAL -->
<div class="modal" id="stakeModal">
  <div class="modal-box">
    <h3>Stake in Barsh</h3>

    <label>Amount (Pi)</label>
    <input type="number" id="amountInput">

    <small id="minHint"></small>

    <label>Duration</label>
    <select id="durationSelect">
      <option value="180">180 Days</option>
      <option value="365">365 Days</option>
      <option value="430">430 Days</option>
    </select>

    <div class="btns">
      <button class="btn primary" onclick="confirmStake()">Confirm</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div class="modal" id="withdrawModal">
  <div class="modal-box">
    <h3>Withdraw Rewards</h3>

    <label>Amount</label>
    <input type="number" id="withdrawAmount">

    <small id="availableBalance"></small>

    <label>Wallet Address</label>
    <input type="text" id="walletAddress">

    <div class="btns">
      <button class="btn primary" onclick="confirmWithdraw()">Confirm</button>
      <button class="btn secondary" onclick="closeWithdraw()">Cancel</button>
    </div>
  </div>
</div>

<script src="js/albukhr-transaction-engine.js"></script>
<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

/* ===============================
   MODALS
================================ */

function openModal(){
  amountInput.value = "";
  durationSelect.value = "30";
  stakeModal.style.display="flex";

  minHint.innerText =
    "Minimum stake: " + getMinStake("Barsh") + " Pi";
}

function closeModal(){
  stakeModal.style.display="none";
}

function openWithdrawModal(){

  const data = getProjectTotals("Barsh");

  let total = 0;
  data.stakes.forEach(s=>{
    total += Number(s.remainingReward) || 0;
  });

  availableBalance.innerText =
    "Available: " + total.toFixed(2) + " Pi";

  const saved =
    localStorage.getItem("user_wallet") || "";

  walletAddress.value = saved;

  withdrawAmount.value = "";

  withdrawModal.style.display="flex";
}

function closeWithdraw(){
  withdrawModal.style.display="none";
}

/* ===============================
   STAKE
================================ */

function confirmStake(){

  const amount = Number(amountInput.value);
  const duration = Number(durationSelect.value);
  const min = getMinStake("Barsh");

  if(!amount || amount < min){
    alert("Minimum stake is " + min + " Pi");
    return;
  }

  const ok = addStake({
    project:"Barsh",
    amount,
    duration
  });

  if(!ok){
    alert("Stake failed");
    return;
  }

  /* RECORD TX */
  recordTx({
    type:"stake",
    project:"Barsh",
    amount
  });

  amountInput.value = "";

  closeModal();
  load();
}

/* ===============================
   WITHDRAW
================================ */

function confirmWithdraw(){

  const amount = Number(withdrawAmount.value);
  const wallet = walletAddress.value;

  if(!amount || amount <= 0){
    alert("Invalid amount");
    return;
  }

  if(!wallet){
    alert("Enter wallet");
    return;
  }

  const data = getProjectTotals("Barsh");

  let total = 0;
  data.stakes.forEach(s=>{
    total += Number(s.remainingReward) || 0;
  });

  if(amount > total){
    alert("Insufficient balance");
    return;
  }

  let remaining = amount;

  data.stakes.forEach(s=>{

    if(remaining <= 0) return;

    let r = Number(s.remainingReward) || 0;

    if(r > 0){

      let take = Math.min(r, remaining);

      withdrawStakeReward(s.id, take);

      remaining -= take;

    }

  });

  /* SAVE WALLET */
  localStorage.setItem("user_wallet", wallet);

  /* RECORD TX */
  recordTx({
    type:"withdraw",
    project:"Barsh",
    amount
  });

  withdrawAmount.value = "";

  closeWithdraw();
  load();
}

/* ===============================
   HISTORY (UNIFIED ENGINE)
================================ */

function load(){

  const data = getProjectTotals("Barsh");

  let reward = 0;
  data.stakes.forEach(s=>{
    reward += Number(s.remainingReward || 0);
  });

  lStake.innerText =
    (data.stake || 0).toFixed(2) + " Pi";

  lReward.innerText =
    reward.toFixed(2) + " Pi";

  labbaikaHistory.innerHTML = "";

  const txs = getTransactions()
    .filter(t => t.project === "Labbaika");

  if(!txs.length){
    labbaikaHistory.innerHTML =
      "<p style='color:#777'>No transactions yet</p>";
    return;
  }

  txs
  .sort((a,b)=>b.timestamp - a.timestamp)
  .forEach(tx=>{

    let icon="🌾";
    let sign="+";
    let color="#0f7a3d";
    let label="Stake";

    if(tx.type==="withdraw"){
      sign="-";
      color="#c0392b";
      label="Withdraw";
    }

    const div = document.createElement("div");
    div.className="project-tx";

    div.innerHTML = `
      <div>${icon}</div>
      <div style="flex:1">
        <div>${label}</div>
        <div style="font-size:11px;color:#777">
          ${new Date(tx.timestamp).toLocaleString()}
        </div>
      </div>
      <div style="color:${color}">
        ${sign}${tx.amount.toFixed(2)} Pi
      </div>
    `;

    labbaikaHistory.appendChild(div);

  });

}

load();

</script>

</body>
</html>
