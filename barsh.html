<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barsh Agro</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/global-core.css">
<link rel="stylesheet" href="css/global-layout.css">
<link rel="stylesheet" href="css/global-components.css">
<link rel="stylesheet" href="css/global-style.css">

</head>

<body>

<header class="header">
  <div class="header-left">
    <span>🌾 Barsh Agro</span>
  </div>
  <div class="header-right" onclick="openInfo()">ℹ️</div>
</header>

<div class="fixed-section">

  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="lStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="lReward">0.00 Pi</strong>
    </div>
  </div>

  <div class="short-info">
    <strong>Barsh Agro</strong> is an ALBUKHR mechanized farming and livestock
    project focused on large-scale crop production and sustainable agriculture.
  </div>

  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button onclick="openWithdrawModal()" class="btn secondary">
      💸 Withdraw Rewards
    </button>
  </div>

  <h3 style="margin-top:20px;font-size:15px">Transaction History</h3>
</div>

<div class="scroll-area">
  <div id="barshHistory"></div>
</div>

<!-- STAKE MODAL -->
<div class="modal" id="stakeModal">
  <div class="modal-box">
    <h3>Stake in Barsh</h3>

    <label>Amount (Pi)</label>
    <input type="number" id="amountInput">

    <small id="minHint"></small>

    <label>Duration</label>
    <select id="durationSelect">
      <option value="180">180 Days</option>
      <option value="365">365 Days</option>
      <option value="430">430 Days</option>
    </select>

    <div class="btns">
      <button class="btn primary" onclick="confirmStake()">Confirm</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- WITHDRAW MODAL -->
<div class="modal" id="withdrawModal">
  <div class="modal-box">
    <h3>Withdraw Rewards</h3>

    <label>Amount</label>
    <input type="number" id="withdrawAmount">

    <small id="availableBalance"></small>

    <label>Wallet Address</label>
    <input type="text" id="walletAddress">

    <div class="btns">
      <button class="btn primary" onclick="confirmWithdraw()">Confirm</button>
      <button class="btn secondary" onclick="closeWithdraw()">Cancel</button>
    </div>
  </div>
</div>

<script src="js/albukhr-transaction-engine.js"></script>
<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

<script>
const stakeModal = document.getElementById("stakeModal");
const successModal = document.getElementById("successModal");
const infoModal = document.getElementById("infoModal");

function openModal(){
  stakeModal.style.display="flex";
  minHint.innerText = "Minimum stake: " + getMinStake("Barsh") + " Pi";
}
function closeModal(){ stakeModal.style.display="none"; }
function closeSuccess(){ successModal.style.display="none"; }
function openInfo(){ infoModal.style.display="flex"; }
function closeInfo(){ infoModal.style.display="none"; }

function confirmStake(){

  const amount = Number(amountInput.value);
  const duration = Number(durationSelect.value);
  const min = getMinStake("Barsh");

  if(!amount || amount < min){
    alert("Minimum stake is " + min + " Pi");
    return;
  }

  const ok = addStake({
    project:"Barsh",
    amount,
    duration
  });

  if(!ok){
    alert("Stake failed.");
    return;
  }

  /* ✅ IMPORTANT: RECORD TRANSACTION */
  recordTx({
    type:"stake",
    project:"Barsh",
    amount
  });

  successText.innerText =
    `You staked ${amount} Pi for ${duration} days in Barsh Agro.`;

  /* ✅ RESET FORM (prevents old values bug) */
  amountInput.value = "";
  durationSelect.value = "180";

  closeModal();
  successModal.style.display="flex";
  load();
}

/* =========================
   CAPITAL WITHDRAW
========================= */
function withdrawCapital(stakeId){

  if(typeof withdrawStakeCapital !== "function"){
    alert("Capital withdraw not available.");
    return;
  }

  const res = withdrawStakeCapital(stakeId);

  if(res?.error){
    alert(res.error);
    return;
  }

  load();
}

function safe(n){ return Number(n || 0).toFixed(2); }

/* =========================
   MERGED HISTORY
========================= */
function load(){

  const data = getProjectTotals("Barsh");

  /* ===== LIVE REWARD ===== */
  let reward = 0;
  data.stakes.forEach(s=>{
    reward += Number(s.remainingReward ?? s.reward) || 0;
  });

  bStake.innerText  = safe(data.stake) + " Pi";
  bReward.innerText = safe(reward) + " Pi";

  barshHistory.innerHTML = "";

  const merged = [];

  /* STAKES */
  data.stakes.forEach(s=>{
    merged.push({
      type:"stake",
      data:s,
      timestamp:s.timestamp
    });
  });

  /* WITHDRAWALS */
  getWithdrawHistory()
    .filter(tx=>tx.project==="Barsh")
    .forEach(tx=>{
      merged.push({
        type:"withdraw",
        data:tx,
        timestamp:tx.timestamp
      });
    });

  if(merged.length === 0){
    barshHistory.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  merged
    .sort((a,b)=>b.timestamp - a.timestamp)
    .forEach(item=>{

      if(item.type==="stake"){

        const s = item.data;
        const t = formatDateTime(s);

        let capitalBtn = "";

        if(s.matured && !s.capitalWithdrawn){
          capitalBtn = `
            <button 
              onclick="withdrawCapital('${s.id}')"
              style="margin-top:4px;font-size:10px;padding:4px 6px">
              Withdraw Capital
            </button>
          `;
        }

        const div = document.createElement("div");
        div.className="project-tx";
        div.innerHTML=`
          <div class="project-icon">🌾</div>
          <div class="project-body">
            <div class="project-title">Stake</div>
            <div class="project-date">${t.date} • ${t.time}</div>
            ${capitalBtn}
          </div>
          <div class="project-right">
            <div class="project-amount">
              +${safe(s.amount)} Pi
            </div>
            <div class="project-status">
              ${s.capitalWithdrawn ? "Capital Withdrawn" : "Staked"}
            </div>
          </div>
        `;
        barshHistory.appendChild(div);
      }

      if(item.type==="withdraw"){

        const tx = item.data;

        const div = document.createElement("div");
        div.className="project-tx";
        div.innerHTML=`
          <div class="project-icon">🌾</div>
          <div class="project-body">
            <div class="project-title">Reward Withdrawal</div>
            <div class="project-date">
              ${new Date(tx.timestamp).toLocaleString()}
            </div>
          </div>
          <div class="project-right">
            <div class="project-amount" style="color:#c0392b">
              -${safe(tx.grossAmount)} Pi
            </div>
            <div class="project-status">Withdrawn</div>
          </div>
        `;
        barshHistory.appendChild(div);
      }

    });
}

/* =========================
   WALLET NAVIGATION
========================= */
function goToWithdraw(){

  const summary = getWalletSummary();

  if(summary.available <= 0){
    alert("No available rewards to withdraw.");
    return;
  }

  window.location.href = "wallet.html";
}

load();
</script>

</body>
      </html>
