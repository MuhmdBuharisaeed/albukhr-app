<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Admin Login</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f4faf6;
  font-family:system-ui;
}
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.login-card{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.brand{
  text-align:center;
  font-size:18px;
  font-weight:700;
  color:#0f7a3d;
  margin-bottom:6px;
}
.subtitle{
  text-align:center;
  font-size:12px;
  color:#666;
  margin-bottom:20px;
}
.form-group{
  margin-bottom:14px;
}
.form-group label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
}
.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #cceedd;
  font-size:14px;
  outline:none;
}
.form-group input:focus,
.form-group select:focus{
  border-color:#0f7a3d;
}
.login-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#0f7a3d;
  color:#fff;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
.note{
  margin-top:14px;
  font-size:11px;
  color:#777;
  text-align:center;
}
</style>
</head>

<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="brand">ALBUKHR • Admin</div>
    <div class="subtitle">Secure role-based access</div>

    <div class="form-group">
      <label>Admin Role</label>
      <select id="role">
        <option value="super_admin">Super Admin</option>
        <option value="finance_admin">Finance Admin</option>
        <option value="review_admin">Review Admin</option>
        <option value="viewer_admin">Viewer Admin</option>
      </select>
    </div>

    <div class="form-group">
      <label>Access Key</label>
      <input id="key" type="password" placeholder="Enter access key">
    </div>

    <button class="login-btn" onclick="login()">Login</button>

    <div class="note">
      Unauthorized access is prohibited.
    </div>

  </div>
</div>

<script src="admin-auth.js"></script>
<script>
/* KEYS – demo only, replace with backend validation later */
const KEYS = {
  super_admin: "5194Bhr@",
  finance_admin: "5194Bhr@",
  review_admin: "5194Bhr@",
  viewer_admin: "5194Bhr@"
};

function login(){
  const role = document.getElementById("role").value;
  const key = document.getElementById("key").value.trim();

  if(KEYS[role] !== key){
    alert("❌ Invalid admin credentials");
    return;
  }

  // Login using new session engine
  const success = adminLogin("admin", role, "ALBUKHR_CORE_2026");

  if(!success){
    alert("❌ Unable to login. Invalid core key.");
    return;
  }

  // Redirect based on role
  switch(role){
    case "super_admin":
      window.location.href = "unified-admin-buttons.html";
      break;
    case "finance_admin":
      window.location.href = "admin-transactions.html";
      break;
    case "review_admin":
      window.location.href = "admin-review.html";
      break;
    case "viewer_admin":
      window.location.href = "unified-admin-buttons.html";
      break;
    default:
      window.location.href = "unified-admin-buttons.html";
  }
}
</script>

</body>
</html>
