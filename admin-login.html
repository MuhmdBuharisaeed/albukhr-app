<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR – Admin Access</title>
<link rel="stylesheet" href="style.css">
<style>
body{
  background:#f4faf6;
}
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.login-card{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.brand{
  text-align:center;
  font-size:18px;
  font-weight:700;
  color:#0f7a3d;
  margin-bottom:6px;
}
.subtitle{
  text-align:center;
  font-size:12px;
  color:#666;
  margin-bottom:20px;
}
.form-group{
  margin-bottom:14px;
}
.form-group label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
}
.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #cceedd;
  font-size:14px;
}
.login-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#0f7a3d;
  color:#fff;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
.error{
  margin-top:12px;
  font-size:12px;
  color:#b00020;
  display:none;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="brand">ALBUKHR • Admin</div>
    <div class="subtitle">Role-based secured access</div>

    <div class="form-group">
      <label>Admin Role</label>
      <select id="role">
        <option value="super_admin">Super Admin</option>
        <option value="finance_admin">Finance Admin</option>
        <option value="review_admin">Review Admin</option>
        <option value="viewer_admin">Viewer Admin</option>
      </select>
    </div>

    <div class="form-group">
      <label>Access Key</label>
      <input id="key" type="password" placeholder="Enter access key">
    </div>

    <button class="login-btn" onclick="login()">Login</button>

    <div class="error" id="errorBox">
      Invalid credentials
    </div>

  </div>
</div>

<script>
/* SIMPLE HASH CHECK (not raw key exposure) */
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h = Math.imul(31,h) + str.charCodeAt(i) | 0;
  }
  return h;
}

/* Store only hash */
const ROLE_HASH = {
  super_admin:  hash("5194Bhr@"),
  finance_admin:hash("5194Bhr@"),
  review_admin: hash("5194Bhr@"),
  viewer_admin: hash("5194Bhr@")
};

function login(){

  const role = document.getElementById("role").value;
  const key  = document.getElementById("key").value;
  const error = document.getElementById("errorBox");

  if(hash(key) !== ROLE_HASH[role]){
    error.style.display="block";
    return;
  }

  /* Use sessionStorage (safer than localStorage) */
  sessionStorage.setItem("albukhr_admin_role", role);
  sessionStorage.setItem("albukhr_admin_auth", "true");

  /* Redirect to unified admin hub */
  window.location.href = "unified-admin-buttoms.html";
}
</script>

</body>
</html>
