<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internal Projects | ALBUKHR</title>

<style>
body{font-family:system-ui;background:#f4f7f6;margin:0}
.header{background:#0f7a3d;color:#fff;padding:14px;font-weight:800}
.section{padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}
.status{
  font-size:12px;
  font-weight:800;
  margin-top:6px
}
.draft{color:#856404}
.active{color:#0f7a3d}
.paused{color:#842029}
.completed{color:#084298}
</style>
</head>

<body>

<div class="header">ALBUKHR • Internal Projects</div>

<section class="section" id="box"></section>

<script src="internal-registry.js"></script>
<script>
const box = document.getElementById("box");
const list = getInternalProjects();

if(list.length === 0){
  box.innerHTML = "<p>No internal projects yet.</p>";
}else{
  list.reverse().forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <strong>${p.title}</strong><br>
        <small>${p.category}</small>

        <div class="status ${p.status}">
          Status: ${p.status.toUpperCase()}
        </div>
      </div>
    `;
  });
}
</script>

</body>
</html>
