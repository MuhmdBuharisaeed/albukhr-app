<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Verified Pi News</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  padding-bottom:90px;
}

/* HEADER */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  font-size:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  font-size:10px;
  background:#fff;
  color:#0f7a3d;
  padding:4px 8px;
  border-radius:20px;
  font-weight:700;
}

/* SECTION */
.section{
  padding:16px;
}

/* NEWS CARD */
.news-card{
  background:#fff;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(15,122,61,0.06);
  overflow:hidden;
  transition:.25s ease;
  cursor:pointer;
}

.news-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 24px rgba(15,122,61,0.12);
}

.news-image{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.news-body{
  padding:14px;
}

.news-title{
  font-weight:700;
  font-size:15px;
  margin-bottom:6px;
}

.news-summary{
  font-size:12px;
  color:#555;
  margin-bottom:8px;
}

.news-meta{
  font-size:11px;
  color:#777;
  display:flex;
  justify-content:space-between;
}

.news-source{
  font-weight:600;
  color:#0f7a3d;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #cceedd;
  z-index:100;
}

.bottom-nav a{
  text-decoration:none;
  color:#0f7a3d;
  font-weight:bold;
  font-size:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.bottom-nav a span{
  font-size:18px;
}

.bottom-nav a.active{
  color:#0f7a3d;
}
</style>
</head>

<body>

<div class="header">
  <span>Verified Pi News</span>
  <span class="badge">Albukhr Verified</span>
</div>

<section class="section">
  <div id="newsContainer"></div>
</section>

<!-- ===== ALBUKHR BOTTOM NAV ===== -->
<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="wallet.html"><span>💼</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="news.html" class="active"><span>📰</span>News</a>
</nav>

<script>
const container = document.getElementById("newsContainer");

/* BLOCK CLICKBAIT */
const BLOCKED = ["rumor","leaked","unconfirmed","fake"];

/* FALLBACK VERIFIED NEWS */
const FALLBACK_NEWS = [
  {
    title:"Pi Core Team Publishes Official Ecosystem Update",
    summary:"Latest roadmap update from Pi Core Team regarding ecosystem growth.",
    image:"https://via.placeholder.com/800x400",
    source:"Pi Core Team",
    date:new Date().toISOString(),
    link:"https://minepi.com/blog"
  }
];

function renderNews(newsArray){

  container.innerHTML="";

  const cleanNews = newsArray.filter(item=>{
    return !BLOCKED.some(word =>
      item.title.toLowerCase().includes(word)
    );
  });

  if(!cleanNews.length){
    container.innerHTML =
      "<p style='font-size:12px;color:#777'>No verified news available.</p>";
    return;
  }

  cleanNews
    .sort((a,b)=> new Date(b.date)-new Date(a.date))
    .forEach(news=>{

      const card = document.createElement("div");
      card.className = "news-card";
      card.onclick = ()=> window.open(news.link,"_blank");

      card.innerHTML = `
        <img src="${news.image || 'https://via.placeholder.com/800x400'}"
             class="news-image">

        <div class="news-body">
          <div class="news-title">${news.title}</div>
          <div class="news-summary">
            ${news.summary || ""}
          </div>
          <div class="news-meta">
            <span class="news-source">${news.source}</span>
            <span>${new Date(news.date).toLocaleDateString()}</span>
          </div>
        </div>
      `;

      container.appendChild(card);
    });
}

/* AUTO FETCH SYSTEM */
async function loadNews(){

  try{
    const res = await fetch("/api/news");
    if(!res.ok) throw new Error("API not available");

    const data = await res.json();
    renderNews(data);

  }catch(e){
    /* fallback if api fails */
    renderNews(FALLBACK_NEWS);
  }
}

loadNews();
</script>

</body>
</html>
