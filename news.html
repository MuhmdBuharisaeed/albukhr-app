<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Verified Pi News</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  padding-bottom:90px;
}

/* HEADER */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  font-size:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  font-size:10px;
  background:#fff;
  color:#0f7a3d;
  padding:4px 8px;
  border-radius:20px;
  font-weight:700;
}

/* SECTION */
.section{
  padding:16px;
}

/* NEWS CARD */
.news-card{
  background:#fff;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(15,122,61,0.06);
  overflow:hidden;
  transition:.25s ease;
  cursor:pointer;
}

.news-card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(15,122,61,0.12);
}

.news-image{
  width:100%;
  height:190px;
  object-fit:cover;
}

.news-body{
  padding:14px;
}

.news-title{
  font-weight:700;
  font-size:15px;
  margin-bottom:6px;
  line-height:1.4;
}

.news-summary{
  font-size:12px;
  color:#555;
  margin-bottom:10px;
}

.news-meta{
  font-size:11px;
  color:#777;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.news-source{
  font-weight:600;
  color:#0f7a3d;
}

.new-badge{
  background:#ff3b30;
  color:#fff;
  font-size:9px;
  padding:3px 6px;
  border-radius:20px;
  margin-left:6px;
  font-weight:700;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #cceedd;
  z-index:100;
}

.bottom-nav a{
  text-decoration:none;
  color:#0f7a3d;
  font-weight:bold;
  font-size:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.bottom-nav a span{
  font-size:18px;
}

.bottom-nav a.active{
  color:#0f7a3d;
}
</style>
</head>

<body>

<div class="header">
  <span>Verified Pi News</span>
  <span class="badge">Albukhr Verified</span>
</div>

<section class="section">
  <div id="newsContainer"></div>
</section>

<!-- ===== BOTTOM NAV (UNCHANGED) ===== -->
<nav class="bottom-nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="wallet.html"><span>💼</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="news.html" class="active"><span>📰</span>News</a>
</nav>

<script>
const container = document.getElementById("newsContainer");

let LAST_TIMESTAMP = 0;
let REFRESH_TIMER = null;

const BLOCKED_WORDS = [
  "rumor","leaked","unconfirmed","prediction","price target"
];

function shouldBlock(title){
  return BLOCKED_WORDS.some(w =>
    title.toLowerCase().includes(w)
  );
}

async function loadNews(auto=false){

  try{

    const res = await fetch("/api/news");
    const news = await res.json();

    if(!Array.isArray(news) || !news.length){
      container.innerHTML =
        "<p style='font-size:12px;color:#777'>No verified news available.</p>";
      return;
    }

    const sorted = news
      .filter(n => !shouldBlock(n.title))
      .sort((a,b)=> new Date(b.date) - new Date(a.date));

    const latestTime =
      new Date(sorted[0]?.date || 0).getTime();

    if(auto && latestTime <= LAST_TIMESTAMP){
      return;
    }

    if(auto && latestTime > LAST_TIMESTAMP){
      if(navigator.vibrate){
        navigator.vibrate(100);
      }
    }

    LAST_TIMESTAMP = latestTime;

    container.innerHTML = "";

    sorted.forEach(item=>{

      const div = document.createElement("div");
      div.className = "news-card";

      const isNew =
        new Date(item.date).getTime() >= LAST_TIMESTAMP;

      div.onclick = ()=>{
        window.open(item.link,"_blank");
      };

      div.innerHTML = `
        ${item.image ?
          `<img src="${item.image}" class="news-image">`
          : ""
        }

        <div class="news-body">

          <div class="news-title">
            ${item.title}
            ${auto && isNew ?
              `<span class="new-badge">NEW</span>`
              : ""}
          </div>

          <div class="news-summary">
            ${item.summary || ""}
          </div>

          <div class="news-meta">
            <span class="news-source">
              ${item.source}
            </span>
            <span>
              ${new Date(item.date).toLocaleDateString()}
            </span>
          </div>

        </div>
      `;

      container.appendChild(div);
    });

  }catch(err){
    console.log("News error:", err);
  }
}

function startAutoRefresh(){

  if(REFRESH_TIMER){
    clearInterval(REFRESH_TIMER);
  }

  REFRESH_TIMER = setInterval(()=>{
    loadNews(true);
  },60000);
}

loadNews();
startAutoRefresh();
</script>

</body>
</html>
