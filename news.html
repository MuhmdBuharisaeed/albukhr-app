<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr News</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
  padding-bottom:110px;
}

/* ===== HEADER MATCH INDEX ===== */
.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.main-logo{
  height:54px;
  width:auto;
}

.menu-icon{
  width:18px;
  height:13px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}
.menu-icon div{
  height:2px;
  background:#fff;
  border-radius:2px;
}

/* ===== NEWS SECTION ===== */
.section{
  padding:16px;
}

/* Skeleton */
.skeleton{
  height:180px;
  border-radius:16px;
  margin-bottom:14px;
  background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}

/* ===== NEWS CARD ===== */
.news-card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  transition:.25s ease;
}
.news-card:hover{
  transform:translateY(-3px);
}

.news-media{
  width:100%;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:10px;
}
.news-media img,
.news-media video{
  width:100%;
  display:block;
  border-radius:14px;
}

.news-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:6px;
}

.news-summary{
  font-size:13px;
  color:#444;
  margin-bottom:8px;
}

.news-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:#777;
}

.source-badge{
  background:#e6f6ec;
  padding:4px 8px;
  border-radius:20px;
  font-weight:600;
  color:#0f7a3d;
}

.verified-badge{
  background:#0f7a3d;
  color:#fff;
  padding:3px 8px;
  border-radius:20px;
  font-size:10px;
  margin-left:6px;
}

/* ===== SIDE DRAWER ===== */
.side-drawer{
  position: fixed;
  top:0;
  right:-280px;
  width:280px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 18px rgba(0,0,0,0.12);
  transition:right .3s ease;
  z-index:1001;
  display:flex;
  flex-direction:column;
}
.side-drawer.open{ right:0; }

.drawer-overlay{
  position: fixed;
  inset:0;
  background: rgba(0,0,0,0.2);
  opacity:0;
  visibility:hidden;
  transition:.3s ease;
  z-index:1000;
}
.drawer-overlay.show{
  opacity:1;
  visibility:visible;
}


.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#ffffff;
  border-top:1px solid #e5e7eb;
  padding:8px 0 6px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

/* Nav Item */
.nav-item{
  flex:1;
  text-align:center;
  text-decoration:none;
  font-size:12px;
  font-weight:500;
  color:#8e8e93;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:.2s ease;
}

/* SVG Icons */
.nav-icon{
  width:24px;
  height:24px;
  fill:none;
  stroke:#8e8e93;
  stroke-width:1.8;
  margin-bottom:2px;
  transition:.2s ease;
}

/* Active State */
.nav-item.active{
  color:#0f7a3d; /* Albukhr green */
}

.nav-item.active .nav-icon{
  stroke:#0f7a3d;
  transform:scale(1.05);
}

/* Slight tap animation */
.nav-item:active .nav-icon{
  transform:scale(0.95);
    }
</style>
</head>

<body data-page="news">

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-left">
    <img src="file_000000007bb062439b275f4bcf52e264.png" class="main-logo">
  </div>
</header>

<!-- ===== NEWS CONTENT ===== -->
<section class="section">
  <div id="newsContainer">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</section>

<!-- ===== TELEGRAM STYLE BOTTOM NAV ===== -->
<div class="bottom-nav">

  <!-- HOME -->
  <a href="home.html" class="nav-item">
    <svg viewBox="0 0 24 24" class="nav-icon">
      <path d="M3 10L12 3l9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>
    </svg>
    <span>Home</span>
  </a>

  <!-- WALLET -->
  <a href="wallet.html" class="nav-item">
    <svg viewBox="0 0 24 24" class="nav-icon">
      <path d="M3 7h15a2 2 0 012 2v8a2 2 0 01-2 2H3z"/>
      <circle cx="17" cy="12" r="1.2"/>
    </svg>
    <span>Wallet</span>
  </a>

  <!-- SERVICES -->
  <a href="services.html" class="nav-item">
    <svg viewBox="0 0 24 24" class="nav-icon">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1 1 0 000-6l2-1-2-3-2 1a7 7 0 00-4-2V1H10v3a7 7 0 00-4 2l-2-1-2 3 2 1a7 7 0 000 6l-2 1 2 3 2-1a7 7 0 004 2v3h4v-3a7 7 0 004-2l2 1 2-3z"/>
    </svg>
    <span>Services</span>
  </a>

  <!-- NEWS -->
  <a href="news.html" class="nav-item">
    <svg viewBox="0 0 24 24" class="nav-icon">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/>
    </svg>
    <span>News</span>
  </a>

</div>

<script>
const currentPage = location.pathname.split("/").pop();

document.querySelectorAll(".nav-item").forEach(link=>{
  if(link.getAttribute("href") === currentPage){
    link.classList.add("active");
  }
});
</script>
  
<script src="news-data.js"></script>

<script>
async function renderNews(){

  const container = document.getElementById("newsContainer");
  container.innerHTML = "";

  const news = await getAllNews();

  if(!news.length){
    container.innerHTML = "<p>No news available</p>";
    return;
  }

  news.forEach(item=>{

    const div = document.createElement("div");
    div.className = "news-card";

    div.innerHTML = `
      ${
        item.image || item.video
        ? `
        <div class="news-media">
          ${
            item.video
            ? `<video controls src="${item.video}"></video>`
            : `<img src="${item.image}" alt="news image">`
          }
        </div>`
        : ""
      }

      <div class="news-title">
        ${item.title}
        ${
          item.verified
          ? `<span class="verified-badge">Verified</span>`
          : ""
        }
      </div>

      <div class="news-summary">
        ${item.summary || ""}
      </div>

      <div class="news-meta">
        <div class="source-badge">${item.source}</div>
        <div>${new Date(item.date).toLocaleDateString()}</div>
      </div>
    `;

    div.onclick = ()=> window.open(item.link,"_blank");

    container.appendChild(div);
  });
}

renderNews();

</script>

</body>
  </html>
