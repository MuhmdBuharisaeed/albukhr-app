<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Withdraw Pi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f5f7fa}
.header{background:#0f7a3d;color:#fff;padding:14px;text-align:center}
.card{background:#fff;margin:14px;padding:14px;border-radius:12px}
input,button{width:100%;padding:10px;margin-top:10px}
button{background:#0f7a3d;color:#fff;border:none;border-radius:8px;font-weight:bold}
.row{border-bottom:1px solid #eee;padding:8px 0;font-size:13px}
.badge{padding:4px 8px;border-radius:6px;font-size:12px}
.pending{background:#f1c40f}
.approved{background:#3498db;color:#fff}
.sent{background:#2ecc71;color:#fff}
.failed{background:#e74c3c;color:#fff}
</style>
</head>

<body>
<div class="header">💸 Withdraw to Pi Wallet</div>

<div class="card">
  <label>Amount (PI)</label>
  <input type="number" id="wdAmount" placeholder="Enter amount">

  <label>Pi Wallet Address</label>
  <input type="text" id="piAddress" placeholder="Your Pi wallet address">

  <button id="withdrawBtn">Request Withdrawal</button>
</div>

<div class="card">
  <h4>My Withdrawals</h4>
  <div id="withdrawList"></div>
</div>

<!-- LOAD ORDER -->
<script src="/js/settings/settings-core.js"></script>
<script src="/js/core/albukhr-core.js"></script>
<script src="/js/wallet/wallet-core.js"></script>
<script src="/js/wallet/wallet-withdrawal.js"></script>
<script src="/withdraw/withdraw-user-ui.js"></script>
</body>
</html>
