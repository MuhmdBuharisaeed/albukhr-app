<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khairat Organic Fertiliser</title>

<link rel="stylesheet" href="style.css">

<style>
body{background:#f5f7f6;padding-bottom:90px;font-family:Arial}

.section{padding:16px}

.stats{
  display:flex;
  gap:12px;
  margin:16px 0
}

.stat-card{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:16px;
  text-align:center
}

.stat-card span{display:block;color:#666;font-size:14px}
.stat-card strong{font-size:18px;margin-top:6px;display:block}

.btns{display:flex;gap:12px;margin-top:12px}

.btn{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  font-size:16px
}

.primary{background:#0f7a3d;color:#fff}
.secondary{background:#fff;border:1px solid #0f7a3d;color:#0f7a3d}

/* TRANSACTIONS */
.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
}

.project-icon{font-size:18px}

.project-body{flex:1}

.project-title{font-size:14px;font-weight:600}
.project-date{font-size:11px;color:#777}

.project-right{text-align:right}
.project-amount{font-size:14px;font-weight:bold}
.project-status{font-size:11px;color:#0f7a3d}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000
}

.modal-box{
  background:#fff;
  width:90%;
  max-width:420px;
  padding:20px;
  border-radius:16px
}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px
}

label{margin-top:12px;display:block}

/* SUCCESS */
.success{text-align:center}
.success h3{color:#0f7a3d;margin-bottom:8px}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <span>♻️ Khairat Organic Fertiliser</span>
  </div>
</header>

<section class="section">

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="kStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="kReward">0.00 Pi</strong>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button class="btn secondary" onclick="history.back()">Back</button>
  </div>

  <!-- HISTORY -->
  <h3 style="margin-top:20px;font-size:15px">Transaction History</h3>
  <div id="khairatHistory"></div>

</section>

<!-- STAKE MODAL -->
<div class="modal" id="stakeModal">
  <div class="modal-box">
    <h3>Stake in Khairat</h3>

    <label>Amount (Pi)</label>
    <input type="number" id="amountInput">

    <small id="minHint" style="color:#0f7a3d;display:block;margin-top:6px">
      Minimum stake: --
    </small>

    <label>Duration</label>
    <select id="durationSelect">
      <option value="30">30 Days</option>
      <option value="60">60 Days</option>
      <option value="90">90 Days</option>
    </select>

    <div class="btns" style="margin-top:16px">
      <button class="btn primary" onclick="confirmStake()">Confirm</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">
  <div class="modal-box success">
    <h3>Stake Successful</h3>
    <p id="successText"></p>
    <button class="btn primary" style="margin-top:16px" onclick="closeSuccess()">OK</button>
  </div>
</div>

<script src="staking.js"></script>
<script>
const stakeModal   = document.getElementById("stakeModal");
const successModal = document.getElementById("successModal");

function openModal(){
  stakeModal.style.display = "flex";
  minHint.innerText =
    "Minimum stake: " + getMinStake("Khairat") + " Pi";
}

function closeModal(){ stakeModal.style.display = "none"; }
function closeSuccess(){ successModal.style.display = "none"; }

function confirmStake(){

  const amount   = Number(amountInput.value);
  const duration = Number(durationSelect.value);
  const min      = getMinStake("Khairat");

  if(amount < min){
    alert("Minimum stake is " + min + " Pi");
    return;
  }

  addStake({
    project: "Khairat",
    amount,
    duration
  });

  const reward = amount * getRate("Khairat", duration);

  successText.innerText =
    `You staked ${amount} Pi for ${duration} days and earned ${reward.toFixed(2)} Pi`;

  closeModal();
  successModal.style.display = "flex";
  load();
}

function load(){

  const data = getProjectTotals("Khairat");

  kStake.innerText  = data.stake.toFixed(2)  + " Pi";
  kReward.innerText = data.reward.toFixed(2) + " Pi";

  khairatHistory.innerHTML = "";

  if(data.stakes.length === 0){
    khairatHistory.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  data.stakes.slice().reverse().forEach(s=>{

    const t = formatDateTime(s);

    const div = document.createElement("div");
    div.className = "project-tx";

    div.innerHTML = `
      <div class="project-icon">♻️</div>

      <div class="project-body">
        <div class="project-title">Khairat Stake</div>
        <div class="project-date">${t.date} • ${t.time}</div>
      </div>

      <div class="project-right">
        <div class="project-amount">${s.amount} Pi</div>
        <div class="project-status">Successful</div>
      </div>
    `;

    khairatHistory.appendChild(div);
  });
}

load();
</script>

</body>
</html>
