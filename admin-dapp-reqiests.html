<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – dApp Requests</title>
<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#eee}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">ALBUKHR • Admin</h1>
</header>

<section class="section">
<h3>🛠 dApp Requests Review</h3>
<div id="adminList"></div>
</section>

<script>
const listBox = document.getElementById("adminList");
let list =
  JSON.parse(localStorage.getItem("albukhr_dapp_requests")) || [];

function render(){
  listBox.innerHTML = "";
  list.forEach((r,i)=>{
    listBox.innerHTML += `
      <div class="card">
        <strong>${r.projectName}</strong><br>
        <small>${r.piUser}</small><br>
        <small>${r.serviceType}</small><br><br>

        <button class="approve" onclick="setStatus(${i},'approved')">
          Approve
        </button>
        <button class="reject" onclick="setStatus(${i},'rejected')">
          Reject
        </button>
      </div>
    `;
  });
}

function setStatus(i,status){
  list[i].status = status;
  localStorage.setItem(
    "albukhr_dapp_requests",
    JSON.stringify(list)
  );
  render();
}

render();
</script>

</body>
</html>
