<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My dApp Requests | ALBUKHR</title>
<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}
.status{
  font-size:12px;
  font-weight:700;
  margin-top:6px
}
.pending{color:#856404}
.approved{color:#0f7a3d}
.rejected{color:#b02a37}
.notice{
  font-size:12px;
  background:#f6fbf8;
  border-left:4px solid #0f7a3d;
  padding:10px;
  margin-top:10px
}
a.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 14px;
  background:#0f7a3d;
  color:#fff;
  border-radius:10px;
  font-size:13px;
  text-decoration:none
}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">ALBUKHR</h1>
</header>

<section class="section">
  <h3>📂 My dApp Requests</h3>
  <div id="list"></div>
</section>

<script>
const box = document.getElementById("list");
const data =
  JSON.parse(localStorage.getItem("albukhr_dapp_requests")) || [];

if(data.length === 0){
  box.innerHTML = "<p class='muted'>No requests found.</p>";
}

data.reverse().forEach(r=>{
  let statusClass = r.status;
  let telegram = "";

  if(r.status === "approved"){
    telegram = `
      <a class="btn" href="https://t.me/ALBUKHR_DAPP_CHANNEL" target="_blank">
        Join Private Telegram Channel
      </a>
    `;
  }

  box.innerHTML += `
    <div class="card">
      <strong>${r.projectName}</strong><br>
      <small>${r.serviceType.replace("_"," ")}</small>
      <div class="status ${statusClass}">
        Status: ${r.status.toUpperCase()}
      </div>
      ${telegram}
    </div>
  `;
});
</script>

</body>
</html>
