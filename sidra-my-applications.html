<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Sidra Applications</title>

<style>

body{
margin:0;
background:#f4f7f6;
font-family:system-ui;
}

.header{
background:#0f7a3d;
color:#fff;
padding:16px;
font-weight:700;
}

.container{
padding:16px;
}

.card{
background:#fff;
padding:14px;
border-radius:14px;
margin-bottom:12px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.status{
font-size:12px;
padding:4px 8px;
border-radius:20px;
display:inline-block;
margin-top:6px;
}

.pending{
background:#fff3cd;
color:#856404;
}

.approved{
background:#e6f5ec;
color:#0f7a3d;
}

.rejected{
background:#f8d7da;
color:#842029;
}

</style>

</head>

<body>

<div class="header">
My Sidra Applications
</div>

<div 
class="container"
id="apps"
></div>

<script>

const apps =
JSON.parse(
localStorage.getItem(
"albukhr_sidra_applications"
)
) || [];

const container =
document.getElementById("apps");

apps.reverse().forEach(app=>{

const div =
document.createElement("div");

div.className="card";

div.innerHTML = `

<div>
<b>${app.name}</b>
</div>

<div style="font-size:12px;color:#666">
${app.id}
</div>

<div 
class="status ${app.status.toLowerCase()}"
>
${app.status}
</div>

<div style="font-size:11px;margin-top:6px;color:#888">
${app.date}
</div>

`;

container.appendChild(div);

});

</script>

</body>
</html>
