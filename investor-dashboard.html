<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Investor Dashboard</title>

<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:120px;
}

.header{
background:#0f7a3d;
height:60px;
padding:0 16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:10px;
}

.header-right{
display:flex;
align-items:center;
}

.main-logo{
height:48px;
width:auto;
}

.brand{
color:white;
font-weight:700;
font-size:18px;
letter-spacing:1px;
}

/* HEADER SPACE */
.page{
padding:16px;
}

/* SUMMARY CARDS */

.summary-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:16px;
}

.summary-card{
background:#fff;
border-radius:16px;
padding:16px;
box-shadow:0 6px 16px rgba(0,0,0,0.06);
}

.summary-title{
font-size:13px;
color:#777;
margin-bottom:6px;
}

.summary-value{
font-size:22px;
font-weight:800;
color:#0f7a3d;
}

/* QUICK ACTIONS */

.quick-actions{
display:flex;
gap:10px;
margin-bottom:16px;
}

.action-btn{
flex:1;
background:#fff;
border-radius:14px;
padding:12px;
text-align:center;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
font-size:12px;
font-weight:600;
cursor:pointer;
}

/* INVESTMENTS */

.section-title{
font-weight:700;
margin-bottom:10px;
}

.invest-card{
background:#fff;
border-radius:16px;
padding:14px;
margin-bottom:12px;
box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

.invest-header{
display:flex;
justify-content:space-between;
font-weight:700;
margin-bottom:6px;
}

.row{
display:flex;
justify-content:space-between;
font-size:13px;
margin-top:4px;
}

/* WALLET BUTTON */

.wallet-btn{
margin-top:18px;
width:100%;
background:#0f7a3d;
color:#fff;
border:none;
border-radius:14px;
padding:14px;
font-weight:700;
font-size:15px;
cursor:pointer;
}

</style>

</head>

<body>

<header class="header">

<div class="header-left">

<img src="IMG_20260125_183804.png" class="main-logo">

<span class="brand">ALBUKHR</span>

</div>

<div class="header-right">

<div class="header-btn notification-btn" onclick="openNotifications()">
🔔
<span id="notifBadge"></span>
</div>

</div>

</header>

<div class="page">

<!-- SUMMARY -->

<div class="summary-grid">

<div class="summary-card">

<div class="summary-title">
Total Investment
</div>

<div class="summary-value" id="totalInvest">
0.00 Pi
</div>

</div>


<div class="summary-card">

<div class="summary-title">
Total Earnings
</div>

<div class="summary-value" id="totalEarn">
0.00 Pi
</div>

</div>

</div>


<!-- QUICK ACTIONS -->

<div class="quick-actions">

<div class="action-btn"
onclick="location.href='services.html'">
Explore Projects
</div>

<div class="action-btn"
onclick="location.href='wallet.html'">
Open Wallet
</div>

</div>


<!-- INVESTMENTS -->

<div class="section-title">
My Investments
</div>

<div id="investments"></div>


<button class="wallet-btn"
onclick="location.href='wallet.html'">

Open Wallet

</button>

</div>


<!-- DOCK NAV -->

<div class="dock-nav">

<a href="index.html" class="dock-item">
🏠
<span>Home</span>
</a>

<a href="investor-dashboard.html" class="dock-item active">
👥
<span>Investors</span>
</a>

<a href="wallet.html" class="dock-item">
💳
<span>Wallet</span>
</a>

<a href="services.html" class="dock-item">
⚙
<span>Services</span>
</a>

</div>

<script src="staking.js"></script>
<script src="js/notifications.js"></script>
  
<script>

function renderInvestorDashboard(){

if(typeof getAllStakesMerged !== "function") return;

const stakes = getAllStakesMerged();

let totalInvest = 0;
let totalEarn = 0;

const map = {};

stakes.forEach(s=>{

totalInvest += Number(s.amount)||0;

const reward = Number(s.remainingReward ?? s.reward)||0;

totalEarn += reward;

if(!map[s.project]){

map[s.project]={
invest:0,
earn:0
};

}

map[s.project].invest += Number(s.amount)||0;

map[s.project].earn += reward;

});

document.getElementById("totalInvest").innerText =
totalInvest.toFixed(2)+" Pi";

document.getElementById("totalEarn").innerText =
totalEarn.toFixed(2)+" Pi";

const container = document.getElementById("investments");

container.innerHTML="";

Object.keys(map).forEach(project=>{

const card = document.createElement("div");

card.className="invest-card";

card.innerHTML = `

<div class="invest-header">

<div>${project}</div>

<div>${map[project].earn.toFixed(2)} Pi</div>

</div>

<div class="row">
<div>Invested</div>
<div>${map[project].invest.toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Earnings</div>
<div>${map[project].earn.toFixed(2)} Pi</div>
</div>

`;

container.appendChild(card);

});

}

renderInvestorDashboard();

</script>

</body>

</html>
