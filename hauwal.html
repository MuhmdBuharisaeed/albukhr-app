<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hauwal Sumonviter</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  font-family:Arial;
  margin:0;
  padding:0;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  background:#fff;
  z-index:1000;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

/* CONTENT AREA */
.content{
  padding:16px;
}

/* STATS */
.stats{
  display:flex;
  gap:12px;
  margin:16px 0;
}
.stat-card{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:16px;
  text-align:center;
}
.stat-card span{
  display:block;
  color:#666;
  font-size:14px;
}
.stat-card strong{
  font-size:18px;
  margin-top:6px;
  display:block;
}

/* BUTTONS */
.btns{
  display:flex;
  gap:12px;
  margin-top:12px;
}
.btn{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  font-size:16px;
}
.primary{background:#0f7a3d;color:#fff}
.secondary{background:#fff;border:1px solid #0f7a3d;color:#0f7a3d}

/* INFO */
.short-info{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  font-size:14px;
  color:#444;
  line-height:1.6
}

/* HISTORY */
.history-area{
  margin-top:20px;
}

.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
}

.project-icon{font-size:18px}
.project-body{flex:1}
.project-title{font-size:14px;font-weight:600}
.project-date{font-size:11px;color:#777}
.project-right{text-align:right}
.project-amount{font-size:14px;font-weight:bold}
.project-status{font-size:11px}
.success-status{color:#0f7a3d}
.withdraw-status{color:#c0392b}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000
}

.modal-box{
  background:#fff;
  width:90%;
  max-width:420px;
  padding:20px;
  border-radius:16px
}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px
}

label{margin-top:12px;display:block}
.success{text-align:center}
.success h3{color:#0f7a3d;margin-bottom:8px}
</style>
</head>

<body>

<header class="header">
  <span>🌽 Hauwal Sumonviter</span>
  <span style="cursor:pointer" onclick="openInfo()">ℹ️</span>
</header>

<div class="content">

  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="hStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="hReward">0.00 Pi</strong>
    </div>
  </div>

  <div class="short-info">
    <strong>Hauwal Sumonviter</strong> is an ALBUKHR agro-processing project
    focused on transforming traditional maize processing into a modern,
    hygienic, and scalable production system.
  </div>

  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button onclick="goToWithdraw()" class="btn secondary">
      💸 Withdraw Rewards
    </button>
  </div>

  <h3 style="margin-top:24px;font-size:15px">Transaction History</h3>

  <div class="history-area" id="hauwalHistory"></div>

</div>

<!-- MODALS remain unchanged -->

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const stakeModal = document.getElementById("stakeModal");
const successModal = document.getElementById("successModal");
const infoModal = document.getElementById("infoModal");

function safe(n){ return Number(n || 0).toFixed(2); }

function load(){
  const data = getProjectTotals("Hauwal");

  hStake.innerText = safe(data.stake) + " Pi";
  hReward.innerText = safe(data.reward) + " Pi";

  hauwalHistory.innerHTML = "";

  if(!data.stakes || data.stakes.length === 0){
    hauwalHistory.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  data.stakes
    .slice()
    .sort((a,b)=>(b.timestamp||0)-(a.timestamp||0))
    .forEach(s=>{
      const t = formatDateTime(s);
      const isWithdraw = s.type === "withdraw";

      const div = document.createElement("div");
      div.className="project-tx";
      div.innerHTML=`
        <div class="project-icon">${isWithdraw ? "💸" : "🌽"}</div>
        <div class="project-body">
          <div class="project-title">
            ${isWithdraw ? "Hauwal Withdrawal" : "Hauwal Stake"}
          </div>
          <div class="project-date">${t.date} • ${t.time}</div>
        </div>
        <div class="project-right">
          <div class="project-amount">
            ${isWithdraw ? "-" : ""}${Number(s.amount).toFixed(2)} Pi
          </div>
          <div class="project-status ${isWithdraw ? "withdraw-status" : "success-status"}">
            ${isWithdraw ? "Withdrawn" : "Successful"}
          </div>
        </div>
      `;
      hauwalHistory.appendChild(div);
    });
}

load();
window.addEventListener("walletUpdated", load);
</script>

</body>
</html>
