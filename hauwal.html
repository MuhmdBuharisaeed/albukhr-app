<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hauwal Sumonviter</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f5f7f6;
  padding-bottom:90px;
  font-family:Arial
}

.section{padding:16px}

/* STATS */
.stats{
  display:flex;
  gap:12px;
  margin:16px 0
}

.stat-card{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:16px;
  text-align:center
}

.stat-card span{
  display:block;
  color:#666;
  font-size:13px
}

.stat-card strong{
  font-size:18px;
  margin-top:6px;
  display:block
}

/* BUTTONS */
.btns{
  display:flex;
  gap:12px;
  margin-top:12px
}

.btn{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  font-size:16px
}

.primary{background:#0f7a3d;color:#fff}
.secondary{background:#fff;border:1px solid #0f7a3d;color:#0f7a3d}

/* TRANSACTIONS */
.project-tx-list{margin-top:10px}

.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px
}

.project-icon{
  font-size:20px;
  width:32px;
  text-align:center
}

.project-body{flex:1}
.project-title{font-size:13px;font-weight:bold}
.project-date{font-size:11px;color:#777}

.project-right{text-align:right}
.project-amount{font-size:13px;font-weight:bold}
.project-status{font-size:11px;color:#0f7a3d}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000
}

.modal-box{
  background:#fff;
  width:90%;
  max-width:420px;
  padding:20px;
  border-radius:16px
}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px
}

label{margin-top:12px;display:block}

/* SUCCESS */
.success{text-align:center}
.success h3{color:#0f7a3d;margin-bottom:8px}
</style>
</head>

<body>

<!-- ✅ HEADER (BA A CIRE BA) -->
<header class="header">
  <div class="header-left">
    <span>🌾 Hauwal Sumonviter</span>
  </div>
</header>

<section class="section">

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="hStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="hReward">0.00 Pi</strong>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button class="btn secondary" onclick="history.back()">Back</button>
  </div>

  <!-- TRANSACTION HISTORY -->
  <h3 style="margin-top:20px;font-size:14px">Transaction History</h3>
  <div id="hauwalHistory" class="project-tx-list"></div>

</section>

<!-- STAKE MODAL -->
<div class="modal" id="stakeModal">
  <div class="modal-box">
    <h3>Stake in Hauwal</h3>

    <label>Amount (Pi)</label>
    <input type="number" id="amountInput" placeholder="Enter amount">

    <small id="minHint" style="color:#0f7a3d;margin-top:6px;display:block">
      Minimum stake: --
    </small>

    <label>Duration</label>
    <select id="durationSelect">
      <option value="30">30 Days</option>
      <option value="60">60 Days</option>
      <option value="90">90 Days</option>
    </select>

    <div class="btns" style="margin-top:16px">
      <button class="btn primary" onclick="confirmStake()">Confirm</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">
  <div class="modal-box success">
    <h3>Stake Successful</h3>
    <p id="successText"></p>
    <button class="btn primary" style="margin-top:16px" onclick="closeSuccess()">OK</button>
  </div>
</div>

<script src="staking.js"></script>
<script>
const stakeModal = document.getElementById("stakeModal");
const successModal = document.getElementById("successModal");

function openModal(){
  stakeModal.style.display="flex";
  minHint.innerText =
    "Minimum stake: " + getMinStake("Hauwal") + " Pi";
}

function closeModal(){ stakeModal.style.display="none"; }
function closeSuccess(){ successModal.style.display="none"; }

function confirmStake(){
  const amount = Number(amountInput.value);
  const duration = Number(durationSelect.value);
  const min = getMinStake("Hauwal");

  if(amount < min){
    alert("Minimum stake is " + min + " Pi");
    return;
  }

  addStake({ project:"Hauwal", amount, duration });

  const reward = amount * getRate("Hauwal", duration);
  successText.innerText =
    `You staked ${amount} Pi for ${duration} days and earned ${reward.toFixed(2)} Pi`;

  closeModal();
  successModal.style.display="flex";
  load();
}

function load(){
  updatePendingStakes();

  const data = getProjectTotals("Hauwal");

  hStake.innerText = data.stake.toFixed(2) + " Pi";
  hReward.innerText = data.reward.toFixed(2) + " Pi";

  hauwalHistory.innerHTML = "";

  if(data.stakes.length === 0){
    hauwalHistory.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  data.stakes.forEach(s=>{
    const div = document.createElement("div");
    div.className = "project-tx";

    div.innerHTML = `
      <div class="project-icon">🌾</div>
      <div class="project-body">
        <div class="project-title">Hauwal Stake</div>
        <div class="project-date">${s.date}</div>
      </div>
      <div class="project-right">
        <div class="project-amount">${s.amount} Pi</div>
        <div class="project-status">${s.status}</div>
      </div>
    `;
    hauwalHistory.appendChild(div);
  });
}

load();
</script>

</body>
</html>
