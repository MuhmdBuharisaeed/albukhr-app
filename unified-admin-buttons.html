<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR – Admin Control Center</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f5;
}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h2{
  margin:0;
  font-size:16px;
}

.role-badge{
  background:#ffffff22;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
}

.container{
  padding:16px;
  max-width:500px;
  margin:auto;
}

.admin-btn{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:none;
  border-radius:14px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  background:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,.06);
  transition:.2s ease;
}

.admin-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.logout-btn{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:14px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  background:#c0392b;
  color:#fff;
}
</style>
</head>

<body>

<header class="header">
  <h2>ALBUKHR • Admin Center</h2>
  <div class="role-badge" id="adminRoleBadge"></div>
</header>

<div class="container" id="adminContainer" style="display:none">

  <button class="admin-btn super-only" onclick="go('admin-dapp-requests.html')">
    📥 DApp Requests
  </button>

  <button class="admin-btn super-only" onclick="go('admin-contributors.html')">
    👥 Contributors Management
  </button>

  <button class="admin-btn finance-only" onclick="go('admin-transactions.html')">
    💳 Transactions Monitor
  </button>

  <button class="admin-btn super-only" onclick="go('internal-admin-panel.html')">
    🏢 Internal Admin Panel
  </button>

  <button class="admin-btn super-only" onclick="go('external-admin-panel.html')">
    🌍 External Admin Panel
  </button>

  <button class="admin-btn super-only" onclick="go('external-admin-dashboard.html')">
    📊 External Dashboard
  </button>

  <button class="admin-btn review-only" onclick="go('admin-review.html')">
    🔍 External Project Reviews
  </button>

  <button class="admin-btn super-only" onclick="go('escrow-admin.html')">
    🔐 Escrow Admin
  </button>

  <button 
    class="admin-btn super-only"
    onclick="go('super-admin-dashboard.html')"
    style="background:#0f7a3d; color:#fff; font-weight:700;"
  >
    👑 Super Admin Dashboard
  </button>

  <button class="logout-btn" onclick="adminLogout()">
    🚪 Logout
  </button>

</div>

<script src="admin-auth.js"></script>

<script>

/* ===== SESSION GUARD ===== */

const admin = getAdmin();

if(!admin){
  window.location.href = "admin-login.html";
}

/* Show container after validation */
document.getElementById("adminContainer").style.display = "block";

/* Role badge */
document.getElementById("adminRoleBadge").innerText =
  admin.role.replace("_"," ").toUpperCase();

/* ===== ROLE VISIBILITY CONTROL ===== */

const role = admin.role;

function show(selector){
  document.querySelectorAll(selector).forEach(el=>{
    el.style.display = "block";
  });
}

/* Hide all restricted buttons first */
document.querySelectorAll(".super-only, .finance-only, .review-only")
  .forEach(el=> el.style.display="none");

switch(role){

  case "super_admin":
    show(".super-only");
    show(".finance-only");
    show(".review-only");
    break;

  case "finance_admin":
    show(".finance-only");
    break;

  case "review_admin":
    show(".review-only");
    break;

  case "viewer_admin":
    // read-only access (no action buttons)
    break;
}

/* Navigation */
function go(page){
  window.location.href = page;
}

</script>

</body>
</html>
