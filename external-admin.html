<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>External Projects Admin</title>

<link rel="stylesheet" href="style.css">

<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}
.title{font-weight:700;font-size:15px}
.desc{font-size:13px;color:#555;margin-top:4px}
.meta{font-size:12px;color:#777;margin-top:6px}
.badge{
  font-size:11px;
  padding:3px 8px;
  border-radius:20px;
  display:inline-block;
  margin-top:6px;
}
.pending{background:#fff3cd;color:#856404}
.approved{background:#e6f5ec;color:#0f7a3d}
.rejected{background:#fdecea;color:#b71c1c}
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}
.btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#c62828;color:#fff}
</style>
</head>

<body data-page="external-admin">

<header class="header">
  <div class="header-left">
    <span>🛡️ External Project Review</span>
  </div>
</header>

<section class="section">
  <div id="adminList"></div>
</section>

<script>
const KEY = "albukhr_external_projects";

function loadAdmin(){
  const box = document.getElementById("adminList");
  box.innerHTML = "";

  const projects = JSON.parse(localStorage.getItem(KEY) || "[]");

  if(projects.length === 0){
    box.innerHTML =
      "<p style='font-size:13px;color:#777;text-align:center'>No submissions</p>";
    return;
  }

  projects.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="title">${p.title}</div>
      <div class="desc">${p.description}</div>
      <div class="meta">
        Category: ${p.category || "—"}<br>
        Target: ${p.target} Pi<br>
        Wallet: ${p.wallet}
      </div>
      <span class="badge ${p.status}">
        ${p.status.toUpperCase()}
      </span>

      ${p.status === "pending" ? `
        <div class="actions">
          <button class="btn approve" onclick="approve(${i})">
            Approve
          </button>
          <button class="btn reject" onclick="reject(${i})">
            Reject
          </button>
        </div>
      ` : ""}
    `;

    box.appendChild(div);
  });
}

function approve(index){
  const data = JSON.parse(localStorage.getItem(KEY) || "[]");
  data[index].status = "approved";
  data[index].approvedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(data));
  loadAdmin();
}

function reject(index){
  const data = JSON.parse(localStorage.getItem(KEY) || "[]");
  data[index].status = "rejected";
  data[index].rejectedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(data));
  loadAdmin();
}

loadAdmin();
</script>

</body>
</html>
