<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Login</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:linear-gradient(135deg,#f4fff8,#ffffff);
  font-family:sans-serif;
}

.login-box{
  background:#fff;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  text-align:center;
  width:90%;
  max-width:320px;
}

.login-title{
  font-size:18px;
  font-weight:700;
  color:#0f7a3d;
  margin-bottom:10px;
}

.login-desc{
  font-size:13px;
  color:#666;
  margin-bottom:20px;
}

.login-btn{
  background:#0f7a3d;
  color:#fff;
  padding:12px;
  border:none;
  border-radius:10px;
  width:100%;
  font-weight:600;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
}
</style>

</head>

<body>

<div class="login-box">

  <div class="login-title">ALBUKHR</div>

  <div class="login-desc">
    Login with Pi Network to continue
  </div>

  <button class="login-btn" id="loginBtn" onclick="loginWithPi()">
    Login with Pi
  </button>

</div>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>

/* ===============================
   SAFE INIT
=============================== */
function initPi(){

  if(!window.Pi){
    alert("Open inside Pi Browser");
    throw new Error("Pi not available");
  }

  Pi.init({
    version:"2.0",
    sandbox:false // ✅ PRODUCTION
  });

}

/* ===============================
   NORMALIZE USER
=============================== */
function normalizeUser(raw){

  return {
    uid: raw.uid || raw?.user?.uid,
    username: raw.username || raw?.user?.username
  };

}

/* ===============================
   VALIDATE USER
=============================== */
function isValidUser(user){
  return user && user.uid && user.username;
}

/* ===============================
   AUTO REDIRECT (SAFE)
=============================== */
(function(){

  try{

    const saved = JSON.parse(localStorage.getItem("pi_user"));

    if(isValidUser(saved)){
      window.location.href = "index.html";
    }

  }catch{}

})();

/* ===============================
   LOGIN FUNCTION
=============================== */
async function loginWithPi(){

  const btn = document.getElementById("loginBtn");

  btn.disabled = true;
  btn.innerText = "Connecting...";

  try{

    const raw = await Pi.authenticate(['username'], ()=>{});

    const user = normalizeUser(raw);

    if(!isValidUser(user)){
      throw new Error("Invalid user data");
    }

    localStorage.setItem("pi_user", JSON.stringify(user));

    await new Promise(r => setTimeout(r, 100));

    btn.innerText = "Success...";

    window.location.href = "index.html";

  }catch(err){

    console.error(err);

    alert("Login failed");

    btn.disabled = false;
    btn.innerText = "Login with Pi";

  }

}

</script>

</body>
</html>
