<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR – External Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>
body{background:#f3f6f4;font-family:system-ui}
.section{
  max-width:1000px;
  margin:auto;
  padding:16px
}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px
}
.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:11px;
  border-radius:20px;
  font-weight:700;
  background:#fff3cd;
  color:#856404
}
h3{margin:6px 0}
small{color:#666;font-size:12px}
.actions{
  display:flex;
  gap:10px;
  margin-top:14px
}
.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer
}
.approve{
  background:#0f7a3d;
  color:#fff
}
.reject{
  background:#c0392b;
  color:#fff
}
.empty{
  text-align:center;
  color:#777;
  margin-top:40px
}
</style>
</head>

<body>

<header class="header">
  <h1 class="brand">🛡️ External Admin Panel</h1>
</header>

<section class="section">
  <div id="pendingList"></div>
</section>

<!-- =============================
     EXTERNAL ENGINE
============================= -->
<script src="staking-external.js"></script>
<script src="staking-external.js"></script>
<script src="external-project-engine.js"></script>

<script>
const box = document.getElementById("pendingList");

/* =============================
   LOAD PENDING PROJECTS
============================= */
function loadPending(){
  if(typeof getPendingExternalProjects !== "function"){
    box.innerHTML = "<p>Engine not loaded.</p>";
    return;
  }

  const list = getPendingExternalProjects();
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = `
      <div class="empty">
        No pending external projects.
      </div>
    `;
    return;
  }

  list.forEach(p=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <span class="badge">PENDING REVIEW</span>
      <h3>${p.title}</h3>
      <small><b>Category:</b> ${p.category}</small><br>
      <small><b>Owner:</b> ${p.owner}</small><br><br>
      <small>${p.description}</small>

      <div class="actions">
        <button class="btn approve"
          onclick="approveProject('${p.projectId}')">
          Approve
        </button>

        <button class="btn reject"
          onclick="rejectProject('${p.projectId}')">
          Reject
        </button>
      </div>
    `;

    box.appendChild(div);
  });
}

/* =============================
   ACTIONS
============================= */
function approveProject(id){
  if(!confirm("Approve this project?")) return;
  updateExternalStatus(id,"approved");
  alert("✅ Project approved");
  loadPending();
}

function rejectProject(id){
  if(!confirm("Reject this project?")) return;
  updateExternalStatus(id,"rejected");
  alert("❌ Project rejected");
  loadPending();
}

function approveExternal(projectId){

  updateExternalStatus(projectId,"approved");

  const registryList = getExternalProjects();
  const registryProject = registryList.find(p => p.projectId === projectId);

  if(registryProject){
     createExternalLiveProject(registryProject);
  }

  renderExternalAdmin();
  }
  
loadPending();
</script>

</body>
</html>
