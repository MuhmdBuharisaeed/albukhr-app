<button onclick="testAPI()">Test API</button>

<script>
function testAPI(){
  alert(JSON.stringify(getCurrentUser()));
  
  fetch("https://albukhr-api.onrender.com/stake",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      userId:"test123",
      project:"Labbaika",
      amount:10,
      duration:30,
      txid:"test-"+Date.now()
    })
  })
  .then(res=>res.json())
  .then(data=>{
    alert(JSON.stringify(data));
  })
  .catch(err=>{
    alert("Error: " + err);
  });

}
</script>
