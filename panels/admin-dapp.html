<h3>🧩 Admin DApp Requests</h3>
<p style="font-size:13px">
Review SDK, DApp & platform access requests
</p>

<div id="dappRequestList"></div>

<script>
function renderDappAdmin(){
  const list = getDappRequests();
  const box = document.getElementById("dappRequestList");
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = "<p>No DApp requests found.</p>";
    return;
  }

  list.reverse().forEach(r=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h4>${r.projectName || "Unnamed DApp"}</h4>
      <small>${r.requestType || "General"} • ${r.createdAt.split("T")[0]}</small><br>

      <span class="badge ${
        r.status==="approved" ? "approved" :
        r.status==="rejected" ? "rejected" : "pending"
      }">
        ${r.status}
      </span>

      <p style="font-size:13px;margin-top:8px">
        <b>Requester:</b> ${r.name}<br>
        <b>Email:</b> ${r.email || "-"}<br>
        <b>Role:</b> ${r.role || "External"}
      </p>

      <details>
        <summary>View Request Details</summary>
        <p><b>Description:</b><br>${r.description || "-"}</p>
        <p><b>Use Case:</b><br>${r.useCase || "-"}</p>
      </details>

      <div style="margin-top:10px">
        <button class="btn approve"
          onclick="approveDapp('${r.id}')">Approve</button>

        <button class="btn reject"
          onclick="rejectDapp('${r.id}')">Reject</button>
      </div>
    `;
    box.appendChild(div);
  });
}

function approveDapp(id){
  updateDappStatus(id,"approved");
  renderDappAdmin();
}

function rejectDapp(id){
  if(confirm("Reject this DApp request?")){
    updateDappStatus(id,"rejected");
    renderDappAdmin();
  }
}

renderDappAdmin();
</script>
