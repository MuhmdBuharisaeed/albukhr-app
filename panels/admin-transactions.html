<h3>💰 Transactions Management</h3>
<p style="font-size:13px">
All financial activities across Albukhr ecosystem
</p>

<div id="txList"></div>

<script>
function renderTransactions(){
  const list = getTransactions();
  const box = document.getElementById("txList");
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = "<p>No transactions recorded.</p>";
    return;
  }

  list.reverse().forEach(tx=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h4>${tx.title || "Transaction"}</h4>
      <small>
        ${tx.user || "System"} • ${new Date(tx.createdAt).toLocaleString()}
      </small><br>

      <b>Amount:</b> ${tx.amount || "-"}<br>
      <b>Reference:</b> ${tx.reference || "-"}<br>

      <span class="badge ${
        tx.status==="confirmed" ? "approved" :
        tx.status==="failed" ? "rejected" : "pending"
      }">
        ${tx.status}
      </span>

      <div style="margin-top:10px">
        <button class="btn approve"
          onclick="setTxStatus('${tx.id}','confirmed')">
          Confirm
        </button>

        <button class="btn reject"
          onclick="setTxStatus('${tx.id}','failed')">
          Mark Failed
        </button>
      </div>
    `;
    box.appendChild(div);
  });
}

function setTxStatus(id,status){
  updateTransactionStatus(id,status);
  renderTransactions();
}

renderTransactions();
</script>
