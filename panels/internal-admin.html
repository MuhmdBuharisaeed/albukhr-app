<style>
.section{padding:16px}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px
}
.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:11px;
  border-radius:20px;
  font-weight:700
}
.pending{background:#fff4cc;color:#8a6d00}
.approved{background:#e6f7ee;color:#0f7a3d}
.rejected{background:#fdecea;color:#b00020}
.btn{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  margin-right:6px;
  cursor:pointer
}
.approve{background:#0f7a3d;color:#fff}
.reject{background:#b00020;color:#fff}
</style>

<section class="section">
<h3>🛂 Internal Project Admin Panel</h3>
<p style="font-size:13px">Manage all ALBUKHR internal projects</p>

<div id="projectList"></div>
</section>

<script>
const container = document.getElementById("projectList");

function renderAdmin(){
  const list = getInternalProjects();
  container.innerHTML = "";

  if(!list.length){
    container.innerHTML = "<p>No internal projects found.</p>";
    return;
  }

  list.slice().reverse().forEach(p=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h4>${p.projectName}</h4>
      <small>${p.category} • ${p.stage || "Concept"}</small><br>

      <span class="badge ${
        p.status === "internal_approved" ? "approved" :
        p.status === "internal_rejected" ? "rejected" : "pending"
      }">
        ${p.status.replace("_"," ")}
      </span>

      <p style="font-size:13px;margin-top:8px">
        <b>Owner:</b> ${p.creatorName} (${p.role})<br>
        <b>Internal ID:</b> ${p.internalId}
      </p>

      <details>
        <summary style="cursor:pointer;font-size:12px">View Details</summary>
        <p><b>Summary:</b><br>${p.summary}</p>
        <p><b>Problem:</b><br>${p.problem}</p>
        <p><b>Solution:</b><br>${p.solution}</p>
      </details>

      <div style="margin-top:10px">
        <button class="btn approve" onclick="approve('${p.id}')">Approve</button>
        <button class="btn reject" onclick="reject('${p.id}')">Reject</button>
      </div>
    `;

    container.appendChild(div);
  });
}

function approve(id){
  updateInternalStatus(Number(id),"internal_approved");
  renderAdmin();
}

function reject(id){
  if(confirm("Reject this internal project?")){
    updateInternalStatus(Number(id),"internal_rejected");
    renderAdmin();
  }
}

renderAdmin();
</script>
