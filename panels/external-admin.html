<h3>🌐 External Admin Panel</h3>
<p style="font-size:13px">
Manage external contributors & ecosystem submissions
</p>

<div id="externalProjectList"></div>

<script>
function renderExternalAdmin(){
  const list = getExternalProjects(); // daga external-registry.js
  const box = document.getElementById("externalProjectList");
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = "<p>No external submissions found.</p>";
    return;
  }

  list.reverse().forEach(p=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h4>${p.projectName}</h4>
      <small>${p.category || "External"} • ${p.stage || "-"}</small><br>

      <span class="badge ${
        p.status === "approved" ? "approved" :
        p.status === "rejected" ? "rejected" : "pending"
      }">
        ${p.status}
      </span>

      <p style="font-size:13px">
        <b>Contributor:</b> ${p.name}<br>
        <b>Email:</b> ${p.email || "-"}
      </p>

      <details>
        <summary>View Details</summary>
        <p>${p.description || "-"}</p>
      </details>

      <div style="margin-top:10px">
        <button class="btn approve"
          onclick="approveExternal('${p.id}')">Approve</button>

        <button class="btn reject"
          onclick="rejectExternal('${p.id}')">Reject</button>
      </div>
    `;
    box.appendChild(div);
  });
}

function approveExternal(id){
  updateExternalStatus(id,"approved");
  renderExternalAdmin();
}

function rejectExternal(id){
  if(confirm("Reject this submission?")){
    updateExternalStatus(id,"rejected");
    renderExternalAdmin();
  }
}

renderExternalAdmin();
</script>
