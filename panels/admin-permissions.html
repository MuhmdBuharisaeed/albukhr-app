<h3>🔐 Admin Permissions & Roles</h3>
<p style="font-size:13px">
Manage admin roles and access rights
</p>

<button class="btn" onclick="openAddAdmin()">➕ Add Admin</button>

<div id="adminList"></div>

<!-- ADD ADMIN MODAL -->
<div id="addAdminBox" class="modal" style="display:none">
  <h4>Add New Admin</h4>
  <input id="adminName" placeholder="Admin name">
  <input id="adminEmail" placeholder="Email">
  
  <select id="adminRole">
    <option value="super">Super Admin</option>
    <option value="internal">Internal Admin</option>
    <option value="external">External Admin</option>
    <option value="finance">Finance Admin</option>
    <option value="review">Review Admin</option>
  </select>

  <button onclick="saveNewAdmin()">Save</button>
  <button onclick="closeAddAdmin()">Cancel</button>
</div>

<script>
function renderAdmins(){
  const list = getAdmins();
  const box = document.getElementById("adminList");
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = "<p>No admins added.</p>";
    return;
  }

  list.forEach(a=>{
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h4>${a.name}</h4>
      <small>${a.email}</small><br>

      <span class="badge">${a.role}</span>
      <span class="badge ${a.status==='active'?'approved':'rejected'}">
        ${a.status}
      </span>

      <div style="margin-top:10px">
        <select onchange="changeRole(${a.id},this.value)">
          <option ${a.role==='super'?'selected':''}>super</option>
          <option ${a.role==='internal'?'selected':''}>internal</option>
          <option ${a.role==='external'?'selected':''}>external</option>
          <option ${a.role==='finance'?'selected':''}>finance</option>
          <option ${a.role==='review'?'selected':''}>review</option>
        </select>

        <button onclick="toggleStatus(${a.id})">
          ${a.status==='active'?'Suspend':'Activate'}
        </button>
      </div>
    `;
    box.appendChild(div);
  });
}

function openAddAdmin(){
  document.getElementById("addAdminBox").style.display="block";
}
function closeAddAdmin(){
  document.getElementById("addAdminBox").style.display="none";
}

function saveNewAdmin(){
  addAdmin({
    name: adminName.value,
    email: adminEmail.value,
    role: adminRole.value
  });
  closeAddAdmin();
  renderAdmins();
}

function changeRole(id,role){
  updateAdminRole(id,role);
  renderAdmins();
}

function toggleStatus(id){
  toggleAdminStatus(id);
  renderAdmins();
}

renderAdmins();
</script>
