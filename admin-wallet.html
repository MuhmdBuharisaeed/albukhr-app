<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR – Admin Wallet Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:system-ui;background:#f4f6f8;margin:0}
.header{background:#111;color:#fff;padding:14px;font-weight:700;text-align:center}
.card{
  background:#fff;
  margin:16px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.06)
}
.stat{font-size:22px;font-weight:800}
.btn{
  padding:10px;border:none;border-radius:10px;
  font-weight:700;margin-top:10px;width:100%;cursor:pointer
}
.lock{background:#c0392b;color:#fff}
.unlock{background:#27ae60;color:#fff}
.tx{font-size:13px;border-bottom:1px solid #eee;padding:10px 0}
.tx-large{
  background:#fff5f5;
  border-left:4px solid #c0392b;
  padding-left:8px
}
small{color:#666}
.threshold-box{margin-top:10px}
.threshold-box input{
  width:100%;padding:8px;border-radius:8px;border:1px solid #ddd
}
.tx{
  font-size:13px;
  border-bottom:1px solid #eee;
  padding:10px 0;
  word-break:break-all;
  overflow-wrap:anywhere;
}
</style>

<!-- LOAD ORDER IMPORTANT -->
<script src="admin-auth.js"></script>
<script src="wallet-core.js"></script>

</head>

<body>

<div class="header">
  🔐 ALBUKHR – Admin Wallet Monitor
</div>

<div class="card">
  <small>Total Available Balance</small>
  <div class="stat" id="adminBalance">0.00 Pi</div>

  <small>Status</small>
  <div id="walletStatus">ACTIVE</div>

  <button class="btn lock" onclick="lockWalletAdmin()">Lock Wallet</button>
  <button class="btn unlock" onclick="unlockWalletAdmin()">Unlock Wallet</button>

  <div class="threshold-box">
    <small>Large Withdrawal Alert Threshold (Pi)</small>
    <input type="number" id="thresholdInput" placeholder="Default: 100">
  </div>
</div>

<div class="card">
<h4>Admin Wallet Control</h4>

<select id="adminProject">
<option value="">Select Project</option>
</select>

<input 
type="number" 
id="adminAmount"
placeholder="Amount (Pi)"
style="width:100%;padding:10px;margin-top:8px;border-radius:10px;border:1px solid #ddd">

<select id="adminType" style="width:100%;padding:10px;margin-top:8px;border-radius:10px">
<option value="reward">Add Reward</option>
<option value="capital">Add Capital</option>
<option value="stake">Add Stake</option>
</select>

<button class="btn unlock" onclick="adminAddWallet()">
Add to Wallet
</button>

</div>

<div class="card">
  <h4>Recent Withdrawals</h4>
  <div id="adminTxList"></div>
</div>

<audio id="alertSound">
  <source src="alert.mp3" type="audio/mpeg">
</audio>

<script>

/* ===============================
   AUTH GUARD (SAFE)
================================ */
document.addEventListener("DOMContentLoaded", function(){

  if(typeof requireRole === "function"){
    requireRole(["super_admin","finance_admin"]);
  }

  if(typeof getAdmin === "function" && !getAdmin()){
    window.location.href = "admin-login.html";
    return;
  }

  if(typeof getWithdrawHistory !== "function"){
    document.getElementById("adminTxList").innerHTML =
      "<small style='color:red'>Wallet engine not loaded</small>";
    return;
  }

  initAdminWallet();
});

/* ===============================
   CONFIG
================================ */
const DEFAULT_THRESHOLD = 100;
let lastAlertedTxId = null;

/* ===============================
   INIT
================================ */
function initAdminWallet(){
refreshAdminWallet();
loadProjectsAdmin();
window.addEventListener("walletUpdated", refreshAdminWallet);
setInterval(refreshAdminWallet, 5000);
  }

/* ===============================
   SUMMARY
================================ */
function renderSummary(){

const summary = getWalletSummary() || {};
const projects = getProjectWalletBreakdown() || [];
const history = getWithdrawHistory() || [];

let totalFees = 0;
let rewardWithdrawals = 0;
let capitalWithdrawals = 0;
let totalStake = 0;
let grossRewards = 0;
let available = 0;

projects.forEach(p=>{

totalStake += Number(p.stake)||0;
grossRewards += Number(p.grossReward)||0;
rewardWithdrawals += Number(p.withdrawnReward)||0;
capitalWithdrawals += Number(p.withdrawnCapital)||0;
available += Number(p.withdrawableCapital)||0;

});

history.forEach(tx=>{
totalFees += Number(tx.fee)||0;
});

const totalWithdrawn =
rewardWithdrawals + capitalWithdrawals;

document.getElementById("adminBalance").innerHTML = `

<div style="margin-bottom:14px;">
<div style="font-size:13px;color:#666;">
Available Capital
</div>

<div style="
font-size:28px;
font-weight:800;
color:#0f7a3d;
">
${available.toFixed(2)} Pi
</div>
</div>

<div style="
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
font-size:12px;
">

<div>
<div style="color:#666;">
Gross Rewards
</div>
<b>${grossRewards.toFixed(2)} Pi</b>
</div>

<div>
<div style="color:#666;">
Total Stake
</div>
<b>${totalStake.toFixed(2)} Pi</b>
</div>

<div>
<div style="color:#666;">
Reward Withdrawals
</div>
<b>${rewardWithdrawals.toFixed(2)} Pi</b>
</div>

<div>
<div style="color:#666;">
Capital Withdrawals
</div>
<b>${capitalWithdrawals.toFixed(2)} Pi</b>
</div>

<div>
<div style="color:#666;">
Fees Collected
</div>
<b>${totalFees.toFixed(2)} Pi</b>
</div>

<div>
<div style="color:#666;">
Total Withdrawn
</div>
<b>${totalWithdrawn.toFixed(2)} Pi</b>
</div>

</div>
`;

document.getElementById("walletStatus").innerText =
localStorage.getItem("albukhr_wallet_locked") === "true"
? "LOCKED"
: "ACTIVE";

}

/* ===============================
   LOCK SYSTEM
================================ */
function lockWalletAdmin(){
  localStorage.setItem("albukhr_wallet_locked","true");
  alert("Wallet locked by Admin");
  refreshAdminWallet();
}

function unlockWalletAdmin(){
  localStorage.removeItem("albukhr_wallet_locked");
  alert("Wallet unlocked");
  refreshAdminWallet();
}

/* ===============================
   TRANSACTIONS
================================ */
function renderTransactions(){

  const txList = document.getElementById("adminTxList");
  txList.innerHTML="";

  if(typeof getWithdrawHistory !== "function"){
    txList.innerHTML="<small>Wallet engine not ready</small>";
    return;
  }

  const history = getWithdrawHistory();

  if(!history || !history.length){
    txList.innerHTML="<small>No withdrawals yet</small>";
    return;
  }

  const threshold =
    Number(document.getElementById("thresholdInput").value)
    || DEFAULT_THRESHOLD;

  history.forEach(tx=>{

    const isLarge =
      Number(tx.grossAmount || 0) >= threshold;

    if(isLarge && lastAlertedTxId !== tx.id){
      playAlert();
      lastAlertedTxId = tx.id;
    }

    txList.innerHTML += `
      <div class="tx ${isLarge ? "tx-large" : ""}">
        <strong>${tx.project || "Unknown Project"}</strong><br>
        Type: ${tx.type}<br>
        Amount: -${Number(tx.grossAmount || 0).toFixed(2)} Pi<br>
        Fee: ${Number(tx.fee || 0).toFixed(2)} Pi<br>
        Received: ${Number(tx.received || 0).toFixed(2)} Pi<br>
        Wallet Address: ${tx.walletAddress || "internal"}<br>
        <small>${new Date(tx.timestamp).toLocaleString()}</small>
      </div>
    `;
  });
}

/* ===============================
   ALERT
================================ */
function playAlert(){
  const audio = document.getElementById("alertSound");
  if(audio){
    audio.play().catch(()=>{});
  }
}

/* ===============================
   MASTER REFRESH
================================ */
function refreshAdminWallet(){
  renderSummary();
  renderTransactions();
}

/* ===============================
   ADMIN ADD WALLET
================================ */

function loadProjectsAdmin(){

if(typeof getProjectWalletBreakdown !== "function") return;

const select =
document.getElementById("adminProject");

select.innerHTML =
'<option value="">Select Project</option>';

const projects =
getProjectWalletBreakdown();

projects.forEach(p=>{

select.innerHTML +=
`<option value="${p.project}">
${p.project}
</option>`;

});

}

function adminAddWallet(){

const project =
document.getElementById("adminProject").value;

const amount =
Number(document.getElementById("adminAmount").value);

const type =
document.getElementById("adminType").value;

if(!project){
alert("Select project");
return;
}

if(!amount || amount <= 0){
alert("Invalid amount");
return;
}

/* Load Stakes */

const stakes =
getAllStakesMerged();

if(type === "reward"){

stakes.forEach(s=>{
if(s.project === project){
s.reward = (Number(s.reward)||0) + amount;
}
});

}

if(type === "capital"){

stakes.push({
id:"ADM-"+Date.now(),
project,
amount,
reward:0,
timestamp:Date.now(),
admin:true
});

}

if(type === "stake"){

stakes.push({
id:"ADM-"+Date.now(),
project,
amount,
reward:0,
timestamp:Date.now(),
admin:true
});

}

_saveMergedStakes(stakes);

recordTx({
type:"admin-credit",
project,
amount
});

window.dispatchEvent(
new CustomEvent("walletUpdated")
);

alert("Wallet updated successfully");

refreshAdminWallet();

  }

</script>

</body>
</html>
