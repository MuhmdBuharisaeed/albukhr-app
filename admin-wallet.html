<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALBUKHR – Admin Wallet Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:system-ui;
  background:#f4f6f8;
  margin:0;
}

.header{
  background:#111;
  color:#fff;
  padding:14px;
  font-weight:700;
  text-align:center;
}

.card{
  background:#fff;
  margin:16px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}

.stat{
  font-size:22px;
  font-weight:800;
}

.btn{
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
  width:100%;
  cursor:pointer;
}

.lock{background:#c0392b;color:#fff}
.unlock{background:#27ae60;color:#fff}

.tx{
  font-size:13px;
  border-bottom:1px solid #eee;
  padding:10px 0;
}

.tx-large{
  background:#fff5f5;
  border-left:4px solid #c0392b;
  padding-left:8px;
}

small{color:#666}

.threshold-box{
  margin-top:10px;
}

.threshold-box input{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ddd;
}
</style>

<script src="/js/settings/settings-core.js"></script>
<script src="/js/core/albukhr-core.js"></script>
<script src="/js/wallet/wallet-core.js"></script>
<script src="/js/admin/admin-core.js"></script>
<script src="/js/admin/admin-wallet.js"></script>

</head>

<body>

<div class="header">
  🔐 ALBUKHR – Admin Wallet Monitor
</div>

<div class="card">
  <small>Total Available Balance</small>
  <div class="stat" id="adminBalance">--</div>

  <small>Status</small>
  <div id="walletStatus">--</div>

  <button class="btn lock" onclick="lockWalletAdmin()">Lock Wallet</button>
  <button class="btn unlock" onclick="unlockWalletAdmin()">Unlock Wallet</button>

  <div class="threshold-box">
    <small>Large Withdrawal Alert Threshold (Pi)</small>
    <input type="number" id="thresholdInput" placeholder="Default: 100">
  </div>
</div>

<div class="card">
  <h4>Recent Transactions</h4>
  <div id="adminTxList"></div>
</div>

<!-- 🔔 ALERT SOUND -->
<audio id="alertSound">
  <source src="alert.mp3" type="audio/mpeg">
</audio>

<script>

/* ===============================
   ADMIN AUTH GUARD
================================ */

requireRole(["super_admin","finance_admin"]);
if(!getAdmin()){
  window.location.href="admin-login.html";
}

/* ===============================
   CONFIG
================================ */

const DEFAULT_THRESHOLD = 100;
let lastAlertedTxId = null;

/* ===============================
   WALLET SUMMARY
================================ */

function renderSummary(){

  const summary = getWalletSummary();
  document.getElementById("adminBalance").innerText =
    summary.available.toFixed(2) + " Pi";

  document.getElementById("walletStatus").innerText =
    localStorage.getItem("albukhr_wallet_locked") === "true"
    ? "LOCKED"
    : "ACTIVE";
}

/* ===============================
   LOCK SYSTEM
================================ */

function lockWalletAdmin(){
  localStorage.setItem("albukhr_wallet_locked","true");
  alert("Wallet locked by Admin");
  renderSummary();
}

function unlockWalletAdmin(){
  localStorage.removeItem("albukhr_wallet_locked");
  alert("Wallet unlocked");
  renderSummary();
}

/* ===============================
   TRANSACTIONS
================================ */

function renderTransactions(){

  const txList = document.getElementById("adminTxList");
  txList.innerHTML="";

  const history = getWithdrawHistory();

  if(!history.length){
    txList.innerHTML="<small>No transactions yet</small>";
    return;
  }

  const threshold =
    Number(document.getElementById("thresholdInput").value)
    || DEFAULT_THRESHOLD;

  history.forEach(tx=>{

    const isLarge = Number(tx.grossAmount) >= threshold;

    if(isLarge && lastAlertedTxId !== tx.id){
      playAlert();
      lastAlertedTxId = tx.id;
    }

    txList.innerHTML += `
      <div class="tx ${isLarge ? "tx-large" : ""}">
        <strong>${tx.project}</strong><br>
        Type: ${tx.type}<br>
        Amount: -${Number(tx.grossAmount).toFixed(2)} Pi<br>
        Fee: ${Number(tx.fee).toFixed(2)} Pi<br>
        Received: ${Number(tx.received).toFixed(2)} Pi<br>
        Wallet: ${tx.walletAddress || "N/A"}<br>
        <small>${new Date(tx.timestamp).toLocaleString()}</small>
      </div>
    `;
  });
}

/* ===============================
   ALERT SOUND
================================ */

function playAlert(){
  const audio = document.getElementById("alertSound");
  if(audio){
    audio.play().catch(()=>{});
  }
}

/* ===============================
   AUTO REFRESH
================================ */

function refreshAdminWallet(){
  renderSummary();
  renderTransactions();
}

window.addEventListener("walletUpdated", refreshAdminWallet);

setInterval(refreshAdminWallet, 5000);

/* INIT */
refreshAdminWallet();

</script>

</body>
</html>
