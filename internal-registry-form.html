<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Internal Project | ALBUKHR</title>

<style>
body{font-family:system-ui;background:#f4f7f6;margin:0}
.section{padding:16px}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}
.label{font-size:13px;font-weight:700;margin-top:12px}
.input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd
}
textarea.input{min-height:90px}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#0f7a3d;
  color:#fff;
  font-size:15px;
  font-weight:700;
  margin-top:16px
}
</style>
</head>

<body>

<section class="section">

<h3>🏗️ Create Internal Project</h3>
<p style="font-size:13px">
Restricted to Albukhr Core Team only.
</p>

<div class="card">

<div class="label">Project Title</div>
<input class="input" id="title">

<div class="label">Category</div>
<input class="input" id="category"
 placeholder="Infrastructure, Agro, Tech, Finance">

<div class="label">Project Description</div>
<textarea class="input" id="description"></textarea>

<div class="label">Objective</div>
<textarea class="input" id="objective"></textarea>

</div>

<button class="btn" onclick="submitInternal()">
Create Project
</button>

</section>

<script src="internal-registry.js"></script>
<script>
function submitInternal(){
  const f = id => document.getElementById(id);

  if(!f("title").value || !f("category").value){
    alert("Fill all required fields");
    return;
  }

  const data = {
    id: "INT-PROJ-" + Date.now(),
    title: f("title").value.trim(),
    category: f("category").value.trim(),
    description: f("description").value.trim(),
    objective: f("objective").value.trim(),
    owner: "Albukhr Core",
    status: "draft",
    visibility: "internal",
    createdBy: "admin",
    createdAt: Date.now()
  };

  createInternalProject(data);

  alert("✅ Internal project created");
  window.location.href = "internal-project-dashboard.html";
}
</script>

</body>
</html>
