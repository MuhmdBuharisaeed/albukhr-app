<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f7f6;
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* ===== FIXED HEADER ===== */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px;
  font-weight:700;
  text-align:center;
  flex-shrink:0;
}

/* ===== FIXED TOP SECTION ===== */
.fixed-top{
  background:#f5f7f6;
  padding:16px;
  flex-shrink:0;
}

/* STATS */
.stats{
  display:flex;
  gap:12px;
  margin-bottom:14px;
}

.stat-card{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:14px;
  text-align:center;
}

.stat-card span{
  font-size:13px;
  color:#666;
}

.stat-card strong{
  display:block;
  margin-top:6px;
  font-size:16px;
}

/* INFO */
.short-info{
  background:#fff;
  border-radius:14px;
  padding:14px;
  font-size:13px;
  color:#444;
  margin-bottom:14px;
}

/* BUTTONS */
.btns{
  display:flex;
  gap:10px;
}

.btn{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

.primary{background:#0f7a3d;color:#fff;}
.secondary{background:#fff;border:1px solid #0f7a3d;color:#0f7a3d;}

/* ===== SCROLL HISTORY ONLY ===== */
.history-section{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.project-tx{
  background:#fff;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
}

.project-icon{font-size:18px;}
.project-body{flex:1;}
.project-title{font-size:14px;font-weight:600;}
.project-date{font-size:11px;color:#777;}
.project-right{text-align:right;}
.project-amount{font-size:14px;font-weight:bold;}
.project-status{font-size:11px;color:#0f7a3d;}

</style>
</head>

<body>

<div class="header" id="projectHeader"></div>

<div class="fixed-top">

  <div class="stats">
    <div class="stat-card">
      <span>Your Stake</span>
      <strong id="pStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Your Reward</span>
      <strong id="pReward">0.00 Pi</strong>
    </div>
  </div>

  <div class="short-info" id="projectInfo"></div>

  <div class="btns">
    <button class="btn primary" onclick="openModal()">Stake</button>
    <button class="btn secondary" onclick="goToWithdraw()">
      💸 Withdraw Rewards
    </button>
  </div>

</div>

<div class="history-section">
  <h3 style="font-size:14px;margin-bottom:10px">
    Transaction History
  </h3>
  <div id="projectHistory"></div>
</div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>

/* ===== CHANGE ONLY THESE TWO ===== */
const PROJECT_NAME = "Azman Futures Makaers Lab";
const PROJECT_ICON = "🧪";

/* SET HEADER + INFO */
projectHeader.innerText = PROJECT_ICON + " " + PROJECT_NAME;
projectInfo.innerText =
  PROJECT_NAME + " is an official ALBUKHR ecosystem project.";

/* LOAD DATA */
function loadProject(){

  const data = getProjectTotals(PROJECT_NAME);

  pStake.innerText  = data.stake.toFixed(2) + " Pi";
  pReward.innerText = data.reward.toFixed(2) + " Pi";

  projectHistory.innerHTML = "";

  if(!data.stakes.length){
    projectHistory.innerHTML =
      "<p style='font-size:12px;color:#777'>No transactions yet</p>";
    return;
  }

  /* NEWEST FIRST */
  data.stakes
    .slice()
    .sort((a,b)=>b.timestamp-a.timestamp)
    .forEach(s=>{

      const date = new Date(s.timestamp).toLocaleString();

      projectHistory.innerHTML += `
        <div class="project-tx">
          <div class="project-icon">${PROJECT_ICON}</div>
          <div class="project-body">
            <div class="project-title">
              ${PROJECT_NAME} Stake
            </div>
            <div class="project-date">
              ${date}
            </div>
          </div>
          <div class="project-right">
            <div class="project-amount">
              ${s.amount.toFixed(2)} Pi
            </div>
            <div class="project-status">
              Successful
            </div>
          </div>
        </div>
      `;
    });
}

function goToWithdraw(){

  const totals = getTotals();
  const withdrawn = getTotalWithdrawn();
  const available = totals.totalReward - withdrawn;

  if(available <= 0){
    alert("No available rewards to withdraw.");
    return;
  }

  window.location.href="wallet.html";
}

loadProject();

</script>

</body>
</html>
