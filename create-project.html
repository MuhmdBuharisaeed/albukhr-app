<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albukhr Project Builder</title>

<style>

body{
font-family:system-ui;
background:#f4f7f6;
margin:0;
padding:16px;
}

.card{
background:#fff;
padding:16px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.title{
font-size:18px;
font-weight:700;
margin-bottom:10px;
}

.label{
font-size:13px;
font-weight:600;
margin-top:10px;
}

input, textarea{
width:100%;
padding:10px;
margin-top:6px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
}

button{
margin-top:14px;
padding:12px;
border:none;
background:#0f7a3d;
color:#fff;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.notice{
margin-top:12px;
font-size:13px;
color:#0f7a3d;
}

</style>

</head>

<body>

<div class="card">

<div class="title">📈 Project Investment Setup</div>

<div class="label">Project Name</div>
<input id="projectName">

<div class="label">Description</div>
<textarea id="projectDescription"></textarea>

<div class="label">Expected ROI (%)</div>
<input type="number" id="projectROI">

<div class="label">Initial Liquidity (Pi)</div>
<input type="number" id="initialLiquidity">

<div class="label">Minimum Investment (Pi)</div>
<input type="number" id="minimumInvestment">

<div class="label">Target Funding (Pi)</div>
<input type="number" id="targetFunding">

<button onclick="createProject()">
Launch Project
</button>

<div id="done" class="notice" style="display:none">
✅ Project successfully created
</div>

</div>

<script src="project-creation-engine.js"></script>

<script>

function createProject(){

const project = {

name:
document.getElementById("projectName").value,

description:
document.getElementById("projectDescription").value,

roi:
Number(document.getElementById("projectROI").value),

liquidity:
Number(document.getElementById("initialLiquidity").value),

minimum:
Number(document.getElementById("minimumInvestment").value),

target:
Number(document.getElementById("targetFunding").value)

};

if(typeof registerProject !== "function"){
alert("Project engine missing");
return;
}

registerProject(project);

document.getElementById("done").style.display="block";

}

</script>

</body>
  </html>
