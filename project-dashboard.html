<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Dashboard</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:100px;
}

/* ===== ALBUKHR GLOBAL HEADER ===== */

.header{
background:#0f7a3d;
height:60px;
padding:0 16px;

display:flex;
align-items:center;
justify-content:space-between;

box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

/* LEFT SIDE */

.header-left{
display:flex;
align-items:center;
gap:10px;
}

/* LOGO */

.main-logo{
height:46px;
width:auto;
}

/* BRAND */

.brand{
color:#fff;
font-size:18px;
font-weight:700;
letter-spacing:1px;
}

/* RIGHT SIDE */

.header-right{
display:flex;
align-items:center;
gap:12px;
}

/* HEADER BUTTON */

.header-btn{
width:36px;
height:36px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;
cursor:pointer;
}

/* NOTIFICATION */

.notification-btn{
font-size:22px;
}

/* BADGE */

.notification-badge{
position:absolute;
top:3px;
right:3px;

background:red;
color:#fff;

font-size:10px;
padding:2px 5px;

border-radius:10px;
display:none;
}

.dashboard{
padding:16px;
}

.card{
background:#fff;
padding:16px;
border-radius:14px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.title{
font-weight:700;
margin-bottom:10px;
}

.big{
font-size:24px;
font-weight:800;
color:#0f7a3d;
}

input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ddd;
margin-top:8px;
}

button{
margin-top:8px;
padding:10px 14px;
border:none;
border-radius:10px;
background:#0f7a3d;
color:#fff;
font-weight:600;
cursor:pointer;
}

</style>

</head>

<body>

<header class="header">

<div class="header-left">
<img src="IMG_20260125_183804.png" class="main-logo">
<span class="brand">ALBUKHR</span>
</div>

</header>

<div class="dashboard">

<!-- PROJECT INFO -->

<div class="card">

<div class="title">Project</div>

<div id="projectName">Barsh Agro</div>

</div>

<!-- LIQUIDITY -->

<div class="card">

<div class="title">Project Liquidity</div>

<div class="big" id="liquidityBalance">0 Pi</div>

</div>

<!-- ADD LIQUIDITY -->

<div class="card">

<div class="title">Add Liquidity</div>

<input
type="number"
id="addLiquidityAmount"
placeholder="Amount">

<button onclick="addLiquidity()">
Add Liquidity
</button>

</div>

<!-- INTERNAL WITHDRAW -->

<div class="card">

<div class="title">Internal Withdraw</div>

<input
type="number"
id="withdrawAmount"
placeholder="Amount">

<button onclick="internalWithdraw()">
Withdraw
</button>

</div>

<!-- ROI -->

<div class="card">

<div class="title">Project ROI</div>

<div id="roiValue">0%</div>

</div>

<!-- INVESTORS -->

<div class="card">

<div class="title">Total Investors</div>

<div id="investorCount">0</div>

</div>

</div>

<script src="wallet-core.js"></script>
<script src="project-treasury.js"></script>
<script src="staking.js"></script>

<script>

const currentProject = "Barsh Agro";

function updateDashboard(){

const liquidity =
getProjectLiquidity(currentProject);

document.getElementById("liquidityBalance").innerText =
liquidity.toFixed(2) + " Pi";

const roi =
calculateROI(currentProject);

document.getElementById("roiValue").innerText =
roi.toFixed(2) + "%";

const stakes =
getAllStakesMerged()
.filter(s => s.project === currentProject);

document.getElementById("investorCount").innerText =
stakes.length;

}

function addLiquidity(){

const amount =
document.getElementById("addLiquidityAmount").value;

const res =
addProjectLiquidity(currentProject, amount);

if(res.error){
alert(res.error);
return;
}

updateDashboard();

}

function internalWithdraw(){

const amount =
document.getElementById("withdrawAmount").value;

const res =
projectInternalWithdraw(currentProject, amount);

if(res.error){
alert(res.error);
return;
}

updateDashboard();

}

updateDashboard();

</script>

</body>
  </html>
