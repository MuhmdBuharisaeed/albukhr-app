<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albukhr Marketplace</title><link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css"><style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:110px;
}

.header{
background:#0f7a3d;
height:60px;
padding:0 16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:10px;
}

.main-logo{
height:56px;
object-fit:contain;
}

.brand{
color:white;
font-weight:700;
font-size:18px;
}

.market-controls{
padding:16px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.market-controls input{
flex:1;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
}

.market-controls select{
padding:12px;
border-radius:12px;
border:1px solid #ddd;
}

.marketplace{
padding:16px;
}

.project-card{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.project-header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.project-icon{
width:38px;
height:38px;
border-radius:50%;
background:#eaf7ef;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
}

.project-title{
font-weight:700;
font-size:15px;
}

.project-desc{
font-size:13px;
color:#666;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
font-size:13px;
margin-top:5px;
}

.progress{
height:6px;
background:#e5efe8;
border-radius:10px;
margin-top:8px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:linear-gradient(90deg,#0f7a3d,#1ec777);
}

.roi-box{
margin-top:10px;
background:#f4f7f6;
padding:10px;
border-radius:10px;
font-size:13px;
}

.roi-box input{
width:100%;
padding:8px;
border-radius:6px;
border:1px solid #ddd;
margin-top:4px;
}

.invest-btn{
margin-top:12px;
padding:10px;
border:none;
border-radius:10px;
background:#0f7a3d;
color:#fff;
font-weight:600;
cursor:pointer;
width:100%;
}

.empty{
text-align:center;
color:#777;
padding:20px;
}

.trend{
background:#fff4e5;
color:#cc8500;
font-size:11px;
padding:2px 6px;
border-radius:6px;
margin-left:6px;
}

</style></head><body><header class="header"><div class="header-left">
<img src="file_000000007c187246b1c01967ee086dc4.png" class="main-logo">
<span class="brand">ALBUKHR</span>
</div></header><div class="market-controls"><input
type="text"
id="projectSearch"
placeholder="🔎 Search projects..."
oninput="renderMarketplace()">

<select id="sortProjects" onchange="renderMarketplace()">
<option value="">Sort</option>
<option value="roi">Highest ROI</option>
<option value="liquidity">Highest Liquidity</option>
<option value="risk">Lowest Risk</option>
</select></div><div id="marketInsights" style="padding:16px"></div><div class="marketplace" id="projectList"></div><script src="project-registry.js"></script><script src="staking.js"></script><script src="smart-liquidity-engine.js"></script><script src="risk-engine.js"></script><script src="js/core-liquidity-engine.js"></script><script src="marketplace-engine.js"></script><script src="project-discovery-engine.js"></script><script src="liquidity-pool-engine.js"></script><script src="capital-protection-engine.js"></script><script src="js/notifications.js"></script><script src="js/ownership-engine.js"></script><script src="js/marketplace-pro-engine.js"></script><script>

/* ICON SYSTEM */

function getProjectIcon(name){

name = name.toLowerCase();

if(name.includes("agro")) return "🌾";
if(name.includes("bakery")) return "🍞";
if(name.includes("pharma")) return "💊";
if(name.includes("transport")) return "🚍";
if(name.includes("recycling")) return "♻️";
if(name.includes("chemical")) return "🧪";
if(name.includes("maize")) return "🌽";

return "🏢";

}

/* ROI CALCULATOR */

function calculateROI(amount, roi){

return (amount * roi / 100).toFixed(2);

}


/* MAIN RENDER */

function renderMarketplace(){

const container = document.getElementById("projectList");
container.innerHTML="";

const allProjects =
typeof getProjects==="function"
? getProjects()
: [];

const search =
document.getElementById("projectSearch").value.toLowerCase();

let projects =
allProjects.filter(p =>
p.name.toLowerCase().includes(search) ||
(p.description||"").toLowerCase().includes(search)
);


/* SORT */

const sort =
document.getElementById("sortProjects").value;

if(sort==="roi"){
projects.sort((a,b)=>(b.roi||0)-(a.roi||0));
}

if(sort==="liquidity" && typeof getProjectTreasuryStatus==="function"){
projects.sort((a,b)=>
(getProjectTreasuryStatus(b.name).liquidity||0) -
(getProjectTreasuryStatus(a.name).liquidity||0)
);
}


/* EMPTY */

if(!projects.length){

container.innerHTML =
'<div class="empty">No projects available</div>';

return;

}


/* CARDS */

projects.forEach(project=>{

const treasury =
typeof getProjectTreasuryStatus==="function"
? getProjectTreasuryStatus(project.name)
: {liquidity:0};

const liquidity =
Number(treasury.liquidity)||0;

const investors =
typeof getAllStakesMerged==="function"
? getAllStakesMerged().filter(s=>s.project===project.name).length
: 0;

const funded =
Math.min((liquidity/(project.target||1000))*100,100);


const card=document.createElement("div");
card.className="project-card";

card.innerHTML=`

<div class="project-header">

<div class="project-icon">
${getProjectIcon(project.name)}
</div>

<div class="project-title">
${project.name}
${investors>20?'<span class="trend">🔥 Trending</span>':''}
</div>

</div>

<div class="project-desc">
${project.description||""}
</div>

<div class="row">
<div>ROI</div>
<div>${project.roi||0}%</div>
</div>

<div class="row">
<div>Liquidity</div>
<div>${liquidity.toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Investors</div>
<div>${investors}</div>
</div>

<div class="row">
<div>Minimum</div>
<div>${project.minimum||1} Pi</div>
</div>

<div class="progress">
<div class="progress-bar" style="width:${funded}%"></div>
</div>

<div class="roi-box">

ROI Calculator

<input
type="number"
placeholder="Enter amount"
oninput="this.nextElementSibling.innerText =
calculateROI(this.value,${project.roi||0})+' Pi'">

<div style="margin-top:4px;font-weight:600">
0 Pi
</div>

</div>

<button
class="invest-btn"
onclick="invest('${project.name}')">

Invest

</button>

`;

container.appendChild(card);

});

}


/* MARKET INSIGHTS */

function renderMarketInsights(){

const box=document.getElementById("marketInsights");

if(!box) return;

if(typeof getHotProjects!=="function") return;

const hot=getHotProjects();
const investors=getTopInvestors();
const liquidity=getLiquidityLeaderboard();

box.innerHTML=`

<div style="background:#fff;padding:16px;border-radius:14px;margin-bottom:16px">

<b>🔥 Hot Projects</b><br>
${hot.map(p=>p.name).join("<br>")}

</div>

<div style="background:#fff;padding:16px;border-radius:14px;margin-bottom:16px">

<b>🏆 Top Investors</b><br>
${investors.map(i=>i.user+" — "+i.amount.toFixed(2)+" Pi").join("<br>")}

</div>

<div style="background:#fff;padding:16px;border-radius:14px;margin-bottom:16px">

<b>💧 Liquidity Leaders</b><br>
${liquidity.map(p=>p.name+" — "+p.liquidity.toFixed(2)+" Pi").join("<br>")}

</div>

`;

}


/* INVEST */

function invest(project){

const amount=prompt("Enter investment amount (Pi)");

if(!amount||Number(amount)<=0){
alert("Invalid amount");
return;
}

createStake({
project:project,
amount:Number(amount)
});

alert("Investment successful");

}


/* INITIAL LOAD */

renderMarketplace();
renderMarketInsights();


/* AUTO REFRESH */

setInterval(()=>{

renderMarketplace();
renderMarketInsights();

},5000);

</script></body>
</html>
