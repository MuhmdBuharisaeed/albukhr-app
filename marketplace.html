<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albukhr Marketplace</title>

<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:110px;
}

/* PAGE */

.marketplace{
padding:16px;
}

/* PROJECT CARD */

.project-card{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
transition:.25s ease;
}

.project-card:hover{
transform:translateY(-2px);
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.project-title{
font-weight:700;
font-size:16px;
margin-bottom:6px;
}

.project-desc{
font-size:13px;
color:#666;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
font-size:13px;
margin-top:4px;
}

/* BUTTON */

.invest-btn{
margin-top:12px;
padding:10px;
border:none;
border-radius:10px;
background:#0f7a3d;
color:#fff;
font-weight:600;
cursor:pointer;
width:100%;
transition:.2s ease;
}

.invest-btn:hover{
background:#0c5f2f;
}

.empty{
text-align:center;
color:#777;
font-size:13px;
padding:20px;
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="header-left">

<img src="IMG_20260125_183804.png" class="main-logo">

<span class="brand">ALBUKHR</span>

</div>

<div class="header-right">

<div class="header-btn notification-btn" onclick="openNotifications()">
🔔
<span id="notifBadge" class="notification-badge"></span>
</div>

</div>

</header>


<!-- PAGE -->

<div class="marketplace" id="projectList"></div>


<!-- DOCK NAV -->

<div class="dock-nav">

<a href="index.html" class="dock-item">

<svg viewBox="0 0 24 24" class="dock-icon">
<path d="M3 10L12 3l9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>
</svg>

<span>Home</span>

</a>


<a href="investor-dashboard.html" class="dock-item">

<svg viewBox="0 0 24 24" class="dock-icon">
<path d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/>
<path d="M8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z"/>
<path d="M2 20v-1c0-2.21 3.58-4 6-4s6 1.79 6 4v1z"/>
</svg>

<span>Investors</span>

</a>


<a href="wallet.html" class="dock-item">

<svg viewBox="0 0 24 24" class="dock-icon">
<path d="M3 7h15a2 2 0 012 2v8a2 2 0 01-2 2H3z"/>
<circle cx="17" cy="12" r="1.2"/>
</svg>

<span>Wallet</span>

</a>


<a href="services.html" class="dock-item">

<svg viewBox="0 0 24 24" class="dock-icon">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1 1 0 000-6l2-1-2-3-2 1a7 7 0 00-4-2V1H10v3a7 7 0 00-4 2l-2-1-2 3 2 1a7 7 0 000 6l-2 1 2 3 2-1a7 7 0 004 2v3h4v-3a7 7 0 004-2l2 1 2-3z"/>
</svg>

<span>Services</span>

</a>

</div>


<!-- ENGINES -->

<script src="project-creation-engine.js"></script>
<script src="staking.js"></script>
<script src="smart-liquidity-engine.js"></script>


<!-- ACTIVE NAV -->

<script>

const current = location.pathname.split("/").pop();

document.querySelectorAll(".dock-item").forEach(link=>{

if(link.getAttribute("href") === current){

link.classList.add("active");

}

});

</script>


<!-- MARKETPLACE ENGINE -->

<script>

function renderMarketplace(){

const container =
document.getElementById("projectList");

container.innerHTML = "";

const projects =
typeof getProjects === "function" ? getProjects() : [];

if(!projects.length){

container.innerHTML =
'<div class="empty">No projects available</div>';

return;

}

projects.forEach(project => {

const card =
document.createElement("div");

card.className = "project-card";

const treasury =
typeof getProjectTreasuryStatus === "function"
? getProjectTreasuryStatus(project.name)
: {liquidity:0};

const liquidity =
Number(treasury.liquidity) || 0;

card.innerHTML = `

<div class="project-title">
${project.name}
</div>

<div class="project-desc">
${project.description || ""}
</div>

<div class="row">
<div>ROI</div>
<div>${project.roi || 0}%</div>
</div>

<div class="row">
<div>Liquidity</div>
<div>${liquidity.toFixed(2)} Pi</div>
</div>

<button
class="invest-btn"
onclick="invest('${project.name}')">

Invest

</button>

`;

container.appendChild(card);

});

}


function invest(project){

const amount =
prompt("Enter investment amount (Pi)");

if(!amount || Number(amount) <= 0){

alert("Invalid amount");
return;

}

if(typeof createStake !== "function"){

alert("Staking engine missing");
return;

}

createStake({

project: project,
amount: Number(amount)

});

alert("Investment successful");

}


renderMarketplace();

</script>

</body>
  </html>
