<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albukhr Marketplace</title>

<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:110px;
}
.header{
background:#0f7a3d;
height:60px;
padding:0 16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:10px;
}

.header-right{
display:flex;
align-items:center;
}

.main-logo{
height:48px;
width:auto;
}

.brand{
color:white;
font-weight:700;
font-size:18px;
letter-spacing:1px;
}

.marketplace{
padding:16px;
}

/* PROJECT CARD */

.project-card{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
transition:.25s ease;
}

.project-card:hover{
transform:translateY(-2px);
box-shadow:0 10px 24px rgba(0,0,0,0.08);
}

.project-header{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.project-icon{
width:38px;
height:38px;
border-radius:50%;
background:#eaf7ef;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
}

.project-title{
font-weight:700;
font-size:15px;
}

/* DESC */

.project-desc{
font-size:13px;
color:#666;
margin-bottom:10px;
}

/* ROW */

.row{
display:flex;
justify-content:space-between;
font-size:13px;
margin-top:5px;
}

/* RISK */

.risk{
font-size:12px;
font-weight:600;
padding:2px 6px;
border-radius:6px;
}

.risk.low{
background:#e6f7ee;
color:#0f7a3d;
}

.risk.medium{
background:#fff4e5;
color:#cc8500;
}

.risk.high{
background:#fdecea;
color:#c0392b;
}

/* PROGRESS */

.progress{
height:6px;
background:#e5efe8;
border-radius:10px;
margin-top:8px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:linear-gradient(90deg,#0f7a3d,#1ec777);
}

/* ROI CALCULATOR */

.roi-box{
margin-top:10px;
background:#f4f7f6;
padding:10px;
border-radius:10px;
font-size:13px;
}

.roi-box input{
width:100%;
padding:8px;
border-radius:6px;
border:1px solid #ddd;
margin-top:4px;
}

/* BUTTON */

.invest-btn{
margin-top:12px;
padding:10px;
border:none;
border-radius:10px;
background:#0f7a3d;
color:#fff;
font-weight:600;
cursor:pointer;
width:100%;
}

.empty{
text-align:center;
color:#777;
font-size:13px;
padding:20px;
}

</style>

</head>

<body>

<header class="header">

<div class="header-left">
<img src="IMG_20260125_183804.png" class="main-logo">
<span class="brand">ALBUKHR</span>
</div>

<div class="header-right">
<div class="header-btn notification-btn">
🔔
<span id="notifBadge" class="notification-badge"></span>
</div>
</div>

</header>

<div class="marketplace" id="projectList"></div>

<script src="project-creation-engine.js"></script>
<script src="project-registry.js"></script>
<script src="staking.js"></script>
<script src="smart-liquidity-engine.js"></script>
<script src="risk-engine.js"></script>
<script src="marketplace-engine.js"></script>
<script src="liquidity-pool-engine.js"></script>
<script src="js/notifications.js"></script>

<script>

function getProjectIcon(name){

if(name.toLowerCase().includes("agro")) return "🌾";
if(name.toLowerCase().includes("bakery")) return "🍞";
if(name.toLowerCase().includes("lab")) return "🧪";
if(name.toLowerCase().includes("transport")) return "🚍";

return "🏢";

}

function calculateROI(amount, roi){

return (amount * roi / 100).toFixed(2);

}

function renderMarketplace(){

const container =
document.getElementById("projectList");

container.innerHTML = "";

const projects =
typeof getMarketplaceProjects === "function"
? getMarketplaceProjects()
: [];

if(!projects.length){

container.innerHTML =
'<div class="empty">No projects available</div>';

return;

}

projects.forEach(project => {

const card =
document.createElement("div");

card.className = "project-card";

const treasury =
getProjectTreasuryStatus(project.name);

const liquidity =
Number(treasury.liquidity) || 0;

const funded =
Math.min((liquidity / (project.target || 1000))*100,100);

const investors =
typeof getAllStakesMerged === "function"
? getAllStakesMerged().filter(s => s.project === project.name).length
: 0;

const riskData =
typeof getProjectRisk === "function"
? getProjectRisk(project.name)
: {risk:"LOW"};

card.innerHTML = `

<div class="project-header">

<div class="project-icon">
${getProjectIcon(project.name)}
</div>

<div class="project-title">
${project.name}
</div>

</div>

<div class="project-desc">
${project.description || ""}
</div>

<div class="row">
<div>ROI</div>
<div>${project.roi || 0}%</div>
</div>

<div class="row">
<div>Liquidity</div>
<div>${liquidity.toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Investors</div>
<div>${investors}</div>
</div>

<div class="row">
<div>Minimum</div>
<div>${project.minimum || 1} Pi</div>
</div>

<div class="row">
<div>Risk</div>
<div class="risk ${riskData.risk.toLowerCase()}">
${riskData.risk}
</div>
</div>

<div class="row">
<div>Pool Liquidity</div>
<div>${getPoolStatus(project.name).liquidity.toFixed(2)} Pi</div>
</div>

<div class="progress">
<div class="progress-bar" style="width:${funded}%"></div>
</div>

<div class="roi-box">

ROI Calculator

<input
type="number"
placeholder="Enter amount"
oninput="this.nextElementSibling.innerText =
calculateROI(this.value, ${project.roi || 0}) + ' Pi'
">

<div style="margin-top:4px;font-weight:600">
0 Pi
</div>

</div>

<button
class="invest-btn"
onclick="invest('${project.name}')">

Invest

</button>

`;

container.appendChild(card);

});

}

function invest(project){

const amount =
prompt("Enter investment amount (Pi)");

if(!amount || Number(amount)<=0){

alert("Invalid amount");
return;

}

createStake({
project: project,
amount: Number(amount)
});

alert("Investment successful");

}

renderMarketplace();

</script>

</body>
</html>
