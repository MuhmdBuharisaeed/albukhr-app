<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albukhr Admin Control Center</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:100px;
}

.header{
background:#0f7a3d;
color:#fff;
padding:14px;
font-weight:700;
}

.container{
padding:16px;
}

.card{
background:#fff;
padding:16px;
border-radius:14px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.row{
display:flex;
justify-content:space-between;
margin-top:6px;
font-size:13px;
}

.project-title{
font-weight:700;
margin-bottom:6px;
}

button{
margin-top:8px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#0f7a3d;
color:#fff;
cursor:pointer;
}

.pause{
background:#b83232;
}

.small{
font-size:12px;
color:#666;
}

</style>

</head>

<body>

<div class="header">
Albukhr Admin Control Center
</div>

<div class="container">

<!-- STATS -->

<div class="card">
<div class="project-title">Total Projects</div>
<div id="projectCount">0</div>
</div>

<div class="card">
<div class="project-title">Total Investors</div>
<div id="investorCount">0</div>
</div>

<!-- PENDING PROJECT REQUESTS -->

<div class="card">

<div class="project-title">
Pending Project Requests
</div>

<div id="pendingProjects"></div>

</div>

<!-- ACTIVE PROJECTS -->

<div class="card">

<div class="project-title">
Active Projects
</div>

<div id="projectList"></div>

</div>

</div>

<!-- ENGINES -->

<script src="project-creation-engine.js"></script>
<script src="project-registry.js"></script>
<script src="staking.js"></script>
<script src="smart-liquidity-engine.js"></script>
<script src="project-treasury.js"></script>

<!-- MODERATION ENGINE -->

<script>

/* =========================================
   PROJECT MODERATION ENGINE
========================================= */

function evaluateProject(project){

let roiScore = 100;
let liquidityScore = 100;
let risk = "LOW";

if(project.roi > 50) roiScore = 40;
else if(project.roi > 30) roiScore = 60;
else if(project.roi > 20) roiScore = 80;

if(project.liquidity < 100) liquidityScore = 40;
else if(project.liquidity < 300) liquidityScore = 70;

const score =
(roiScore * 0.5) +
(liquidityScore * 0.5);

if(score < 50) risk = "HIGH";
else if(score < 75) risk = "MEDIUM";

return{
score:score,
risk:risk
};

}

/* =========================================
   PENDING PROJECTS
========================================= */

function renderPendingProjects(){

const container =
document.getElementById("pendingProjects");

container.innerHTML="";

const pending =
typeof getPendingProjects === "function"
? getPendingProjects()
: [];

if(!pending.length){

container.innerHTML =
"<div class='small'>No pending project requests</div>";

return;

}

pending.forEach(p=>{

const riskData = evaluateProject(p);

const card = document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="project-title">
${p.name}
</div>

<div class="row">
<div>ROI</div>
<div>${p.roi}%</div>
</div>

<div class="row">
<div>Initial Liquidity</div>
<div>${p.liquidity} Pi</div>
</div>

<div class="row">
<div>Risk Level</div>
<div>${riskData.risk}</div>
</div>

<div class="row">
<div>Safety Score</div>
<div>${riskData.score.toFixed(0)}</div>
</div>

<button onclick="approveProject('${p.id}')">
Approve
</button>

<button class="pause"
onclick="rejectProject('${p.id}')">

Reject

</button>

`;

container.appendChild(card);

});

}

/* =========================================
   APPROVE PROJECT
========================================= */

function approveProject(id){

if(typeof approvePendingProject !== "function"){
alert("Project engine missing");
return;
}

approvePendingProject(id);

alert("Project approved");

renderPendingProjects();
renderAdmin();

}

/* =========================================
   REJECT PROJECT
========================================= */

function rejectProject(id){

if(typeof rejectPendingProject !== "function"){
alert("Project engine missing");
return;
}

rejectPendingProject(id);

alert("Project rejected");

renderPendingProjects();

}

/* =========================================
   ACTIVE PROJECTS
========================================= */

function renderAdmin(){

const projects =
typeof getProjects === "function"
? getProjects()
: [];

document.getElementById("projectCount").innerText =
projects.length;

const stakes =
typeof getAllStakesMerged === "function"
? getAllStakesMerged()
: [];

document.getElementById("investorCount").innerText =
stakes.length;

const container =
document.getElementById("projectList");

container.innerHTML="";

projects.forEach(project=>{

const liquidity =
getProjectTreasuryStatus(project.name).liquidity;

const investors =
stakes.filter(s=>s.project===project.name).length;

const card = document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="project-title">
${project.name}
</div>

<div class="row">
<div>ROI</div>
<div>${project.roi}%</div>
</div>

<div class="row">
<div>Liquidity</div>
<div>${liquidity.toFixed(2)} Pi</div>
</div>

<div class="row">
<div>Investors</div>
<div>${investors}</div>
</div>

<button onclick="openProject('${project.name}')">
Open Dashboard
</button>

<button class="pause"
onclick="pauseProject('${project.name}')">

Pause Project

</button>

`;

container.appendChild(card);

});

}

/* =========================================
   PROJECT ACTIONS
========================================= */

function openProject(name){

localStorage.setItem(
"albukhr_current_project",
name
);

window.location.href =
"Albukhr-internal-project-dashboard.html";

}

function pauseProject(name){

alert("Project paused: " + name);

}

/* =========================================
   INIT
========================================= */

renderPendingProjects();
renderAdmin();

</script>

</body>
</html>
