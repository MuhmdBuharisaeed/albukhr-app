<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pi Test</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>
<body>

<h2>Pi Login Test</h2>

<button onclick="login()">Login with Pi</button>

<script>
let currentUser = null;

// INIT
document.addEventListener("DOMContentLoaded", () => {
  if(window.Pi){
    Pi.init({
      version: "2.0",
      sandbox: false
    });
    console.log("✅ Pi Initialized");
  }else{
    console.log("❌ Pi not available");
  }
});

// LOGIN FUNCTION
async function login(){

  try{

    const user = await Pi.authenticate(
      ['username'],
      () => {}
    );

    console.log("USER:", user);

    if(user){
      currentUser = user;
      alert("Logged in as @" + user.username);
    }

  }catch(err){
    console.error(err);
    alert("Login failed");
  }

}
</script>

</body>
</html>
