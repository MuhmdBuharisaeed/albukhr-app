<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALBUKHR</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
}

.header{
  background:#0f7a3d;
  color:#fff;
  display:flex;
  justify-content:space-between;
  padding:12px;
}

</style>

</head>

<body>

<header class="header">
  <div>ALBUKHR</div>
  <div id="user">...</div>
</header>

<div style="padding:20px;text-align:center;">
  <h2>Loading...</h2>
</div>

<script>
async function init(){

  try{

    if(!window.Pi){
      document.body.innerHTML = "❌ Open in Pi Browser";
      return;
    }

    Pi.init({
      version:"2.0",
      sandbox:false
    });

    const auth = await Pi.authenticate(['username']);

    const username = auth.user?.username || auth.username;

    document.getElementById("user").innerText =
      "👤 " + username;

  }catch(e){

    document.body.innerHTML = "❌ Login Failed";

  }

}

init();
</script>

</body>
</html>
