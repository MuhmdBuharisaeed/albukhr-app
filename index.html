<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Projects</title>
<link rel="stylesheet" href="style.css">
</head>

<body data-page="home">

<header class="header">
  <h1 class="brand">ALBUKHR</h1>
</header>

<div class="welcome-bar">
  <div class="welcome-track">
    Welcome to Albukhr Investment Limited — Building sustainable industries.
  </div>
</div>

<section class="stats">
  <div class="stat-card">
    <span>Total Staking</span>
    <strong id="homeStake">0.00 Pi</strong>
  </div>
  <div class="stat-card">
    <span>Total Rewards</span>
    <strong id="homeReward">0.00 Pi</strong>
  </div>
</section>

<section class="section">
  <h3>Transaction History</h3>
  <div id="homeHistory"></div>
</section>

<nav class="bottom-nav">
  <a href="index.html">Home</a>
  <a href="projects.html">Projects</a>
  <a href="wallet.html">Wallet</a>
  <a href="services.html">Services</a>
  <a href="settings.html">Settings</a>
</nav>

<script src="js/staking.js"></script>
<script>
  const totals = getTotals();
  document.getElementById("homeStake").innerText =
    totals.totalStake.toFixed(2) + " Pi";
  document.getElementById("homeReward").innerText =
    totals.totalReward.toFixed(2) + " Pi";

  const history = document.getElementById("homeHistory");
  getStakes().forEach(s => {
    const div = document.createElement("div");
    div.className = "tx";
    div.innerText =
      `${s.date} | ${s.project} | ${s.amount} Pi | +${s.reward.toFixed(2)} Pi`;
    history.appendChild(div);
  });
</script>

</body>
</html>
