<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR</title>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>


<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="css/albukhr-ui.css">
<link rel="stylesheet" href="global-buttons.css">
</head>

<body>

<!-- LOGIN MODAL -->
<div id="loginBox" class="login-modal">
  <div class="login-card">
    <h3>Login Required</h3>
    <button onclick="startLogin()">Login with Pi</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">

  <div class="brand">ALBUKHR</div>

  <div class="header-right">

    <div class="header-btn notification-btn">
      🔔
      <span id="notifBadge" class="notification-badge"></span>
    </div>

    <div class="header-btn menu-icon">☰</div>

    <div class="user" onclick="handleAuth()">
      <div class="avatar" id="avatar">👤</div>
      <div class="meta">
        <div id="username">Guest</div>
        <div id="status">Offline</div>
      </div>
    </div>

  </div>

</div>




<!-- CONTENT -->
<div class="container">
  <h3>Dashboard</h3>
  <p id="welcomeText">Welcome Guest</p>
</div>

<!-- ===== ALBUKHR DOCK NAV ===== -->

<div class="dock-nav">

  <!-- HOME -->
  <a href="index.html" class="dock-item">
    <svg viewBox="0 0 24 24" class="dock-icon">
      <path d="M3 10L12 3l9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>
    </svg>
    <span>Home</span>
  </a>


  <!-- INVESTORS -->
  <a href="investor-dashboard.html" class="dock-item">
    <svg viewBox="0 0 24 24" class="dock-icon">
      <path d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/>
      <path d="M8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z"/>
      <path d="M2 20v-1c0-2.21 3.58-4 6-4s6 1.79 6 4v1z"/>
      <path d="M14 20v-1c0-1.5 1.5-2.8 3.5-3.5 2 .7 3.5 2 3.5 3.5v1z"/>
    </svg>
    <span>Investors</span>
  </a>


  <!-- TRANSPARENCY HUB -->
  <a href="wallet.html" class="dock-item">
    <svg viewBox="0 0 24 24" class="dock-icon">
      
      <!-- Document -->
      <path d="M6 3h8l4 4v14H6z"/>
      
      <!-- Fold -->
      <path d="M14 3v4h4"/>
      
      <!-- Lines -->
      <path d="M8 11h8"/>
      <path d="M8 14h8"/>
      
      <!-- Eye -->
      <ellipse cx="12" cy="18" rx="4" ry="2"/>
      <circle cx="12" cy="18" r="0.8"/>
      
    </svg>
    <span>Transparency</span>
  </a>


  <!-- SERVICES -->
  <a href="services.html" class="dock-item">
    <svg viewBox="0 0 24 24" class="dock-icon">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1 1 0 000-6l2-1-2-3-2 1a7 7 0 00-4-2V1H10v3a7 7 0 00-4 2l-2-1-2 3 2 1a7 7 0 000 6l-2 1 2 3 2-1a7 7 0 004 2v3h4v-3a7 7 0 004-2l2 1 2-3z"/>
    </svg>
    <span>Services</span>
  </a>

</div>

<script>

// ================= INIT =================
window.addEventListener("DOMContentLoaded", ()=>{

  if(window.Pi){
    Pi.init({ version:"2.0", sandbox:false });
  }

  // load saved user
  const saved = localStorage.getItem("pi_user");

  if(saved){
    window.CURRENT_USER = JSON.parse(saved);
  }

  updateUI();

});

// ================= NORMALIZE =================
function normalize(raw){
  return {
    uid: raw.uid || raw?.user?.uid,
    username: raw.username || raw?.user?.username
  };
}

// ================= LOGIN =================
async function startLogin(){

  const raw = await Pi.authenticate(['username'], ()=>{});

  const user = normalize(raw);

  if(!user || !user.uid){
    alert("Login failed");
    return;
  }

  localStorage.setItem("pi_user", JSON.stringify(user));
  window.CURRENT_USER = user;

  document.getElementById("loginBox").style.display="none";

  updateUI();

}

// ================= UI =================
function updateUI(){

  const user = window.CURRENT_USER;

  const name = document.getElementById("username");
  const status = document.getElementById("status");
  const avatar = document.getElementById("avatar");
  const welcome = document.getElementById("welcomeText");

  if(user){
    name.innerText = "@" + user.username;
    status.innerText = "Online";
    status.style.color = "#0f7a3d";
    avatar.innerText = user.username[0].toUpperCase();
    welcome.innerText = "Welcome " + user.username;
  }else{
    name.innerText = "Guest";
    status.innerText = "Tap to login";
    avatar.innerText = "👤";
    welcome.innerText = "Welcome Guest";
  }

}

// ================= HANDLE =================
function handleAuth(){

  const user = window.CURRENT_USER;

  if(!user){
    document.getElementById("loginBox").style.display="flex";
    return;
  }

  if(confirm("Logout?")){
    localStorage.removeItem("pi_user");
    location.reload();
  }

}

</script>

</body>
</html>
