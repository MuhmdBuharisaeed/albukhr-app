<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ALBUKHR Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 16px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0f9d58;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }
    .welcome {
      margin-bottom: 20px;
    }
    .welcome h2 {
      margin: 0 0 4px;
    }
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      flex: 1;
      background: #ffffff;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .card h3 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #6b7280;
    }
    .card p {
      margin: 0;
      font-size: 20px;
      font-weight: bold;
    }
    .projects h3 {
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .project {
      background: #ffffff;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .active {
      border: 2px solid #0f9d58;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header>
      <div class="logo">A</div>
      <strong>ALBUKHR Investment Limited</strong>
    </header>

    <!-- Welcome -->
    <section class="welcome">
      <h2>Welcome to ALBUKHR</h2>
      <p>Building sustainable industries and empowering communities.</p>
    </section>

    <!-- Stats -->
    <section class="stats">
      <div class="card">
        <h3>Total Staked</h3>
        <p>0 Pi</p>
      </div>
      <div class="card">
        <h3>Rewards</h3>
        <p>0 Pi</p>
      </div>
    </section>

    <!-- Projects -->
    <section class="projects">
      <h3>ALBUKHR Projects</h3>
      <div class="grid">
        <div class="project">Agriculture</div>
        <div class="project">Livestock</div>
        <div class="project">Bakery</div>
        <div class="project">Water / Utility</div>
        <div class="project">Knowledge</div>
        <div class="project">Transportation</div>
        <div class="project active">Raheem Pharmacy</div>
      </div>
    </section>

  </div>
</body>
</html>
