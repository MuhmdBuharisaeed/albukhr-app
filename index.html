<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR</title>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4fff8;
}

/* HEADER */
.header{
  background:#0f7a3d;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
}

.brand{
  font-weight:700;
}

/* USER */
.user{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#e6f6ec;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#0f7a3d;
  font-weight:700;
}

.meta{
  font-size:12px;
  line-height:1;
}

/* DASHBOARD */
.container{
  padding:20px;
}

/* LOGIN MODAL */
.login-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  align-items:center;
  justify-content:center;
}

.login-card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

button{
  padding:10px;
  border:none;
  background:#0f7a3d;
  color:white;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN MODAL -->
<div id="loginBox" class="login-modal">
  <div class="login-card">
    <h3>Login Required</h3>
    <button onclick="startLogin()">Login with Pi</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="brand">ALBUKHR</div>

  <div class="user" onclick="handleAuth()">
    <div class="avatar" id="avatar">👤</div>
    <div class="meta">
      <div id="username">Guest</div>
      <div id="status">Offline</div>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="container">
  <h3>Dashboard</h3>
  <p id="welcomeText">Welcome Guest</p>
</div>

<script>

// ================= INIT =================
window.addEventListener("DOMContentLoaded", ()=>{

  if(window.Pi){
    Pi.init({ version:"2.0", sandbox:false });
  }

  // load saved user
  const saved = localStorage.getItem("pi_user");

  if(saved){
    window.CURRENT_USER = JSON.parse(saved);
  }

  updateUI();

});

// ================= NORMALIZE =================
function normalize(raw){
  return {
    uid: raw.uid || raw?.user?.uid,
    username: raw.username || raw?.user?.username
  };
}

// ================= LOGIN =================
async function startLogin(){

  const raw = await Pi.authenticate(['username'], ()=>{});

  const user = normalize(raw);

  if(!user || !user.uid){
    alert("Login failed");
    return;
  }

  localStorage.setItem("pi_user", JSON.stringify(user));
  window.CURRENT_USER = user;

  document.getElementById("loginBox").style.display="none";

  updateUI();

}

// ================= UI =================
function updateUI(){

  const user = window.CURRENT_USER;

  const name = document.getElementById("username");
  const status = document.getElementById("status");
  const avatar = document.getElementById("avatar");
  const welcome = document.getElementById("welcomeText");

  if(user){
    name.innerText = "@" + user.username;
    status.innerText = "Online";
    status.style.color = "#0f7a3d";
    avatar.innerText = user.username[0].toUpperCase();
    welcome.innerText = "Welcome " + user.username;
  }else{
    name.innerText = "Guest";
    status.innerText = "Tap to login";
    avatar.innerText = "👤";
    welcome.innerText = "Welcome Guest";
  }

}

// ================= HANDLE =================
function handleAuth(){

  const user = window.CURRENT_USER;

  if(!user){
    document.getElementById("loginBox").style.display="flex";
    return;
  }

  if(confirm("Logout?")){
    localStorage.removeItem("pi_user");
    location.reload();
  }

}

</script>

</body>
</html>
