<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albukhr App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="app-header">
  <h1>ALBUKHR</h1>
  </div>

  <!-- Welcome Text -->
  <section class="welcome">
    <p>Welcome to Albukhr — Building sustainable industries and empowering communities</p>
  </section>

  <!-- Core Dashboard -->
  <section class="dashboard">
    <!-- Total Staking & Rewards -->
    <div class="stats">
      <div>Total Staking: 0.00 Pi</div>
      <div>Rewards: 0.00 Pi</div>
    </div>

    <!-- Projects Grid -->
    <div class="projects">
      <div class="project">A 🌱 Agriculture</div>
      <div class="project">L 🐄 Livestock</div>
      <div class="project">B 🍞 Bakery</div>
      <div class="project">U ⚙️ Utilities</div>
      <div class="project">K 📘 Knowledge</div>
      <div class="project">H 🏥 Health</div>
      <div class="project">R 💊 Raheem Pharmacy</div>
    </div>
  </section>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button>Home</button>
    <button>Projects</button>
    <button>Wallet</button>
    <button>Services</button>
    <button>Settings</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
