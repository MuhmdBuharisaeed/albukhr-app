<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Projects</title>
<link rel="stylesheet" href="style.css">

<style>
/* ===== POPULAR PROJECTS (COMPACT) ===== */
.popular-section{
  padding:12px 14px 0 14px;
}

.popular-title{
  font-weight:700;
  margin-bottom:8px;
}

.popular-scroll{
  display:flex;
  overflow-x:auto;
  gap:10px;
  scroll-snap-type:x mandatory;
  padding-bottom:4px;
}

.popular-card{
  min-width:30%;
  flex:0 0 30%;
  background:#fff;
  border-radius:10px;
  padding:6px 6px;
  box-shadow:0 2px 8px rgba(15,122,61,0.05);
  text-align:center;
  scroll-snap-align:start;
  cursor:pointer;
}

.popular-icon{
  font-size:18px;
  margin-bottom:3px;
}

.popular-name{
  font-weight:600;
  font-size:11px;
  line-height:1.2;
}

.popular-amount{
  font-size:10px;
  color:#0f7a3d;
  margin-top:2px;
}

/* ===== ASSETS SECTION ===== */

.assets-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.assets-search{
  font-size:18px;
  cursor:pointer;
}

.asset-item{
  background:#fff;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 10px rgba(15,122,61,0.05);
  cursor:pointer;
}

.asset-left{
  display:flex;
  flex-direction:column;
}

.asset-name{
  font-weight:600;
  font-size:13px;
}

.asset-stake{
  font-size:11px;
  color:#777;
}

.asset-right{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:600;
  color:#0f7a3d;
}

body{
  background: linear-gradient(135deg,#f6fff9,#ffffff);
}

/* subtle floating light */
body::before{
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  background: radial-gradient(circle,#0f7a3d22,transparent 70%);
  top:-100px;
  right:-100px;
  z-index:-1;
}
</style>
</head>

<body data-page="home">

<header class="header">
  <h1 class="brand">ALBUKHR</h1>
</header>

<div class="welcome-bar">
  <div id="welcomeScroll" class="welcome-track">
    Welcome to Albukhr Investment Limited — Building sustainable industries & empowering communities through investment.
  </div>
</div>

<section class="stats">
  <div class="stat-card">
    <span>Total Staking</span>
    <strong id="homeStake">0.00 Pi</strong>
  </div>
  <div class="stat-card">
    <span>Total Rewards</span>
    <strong id="homeReward">0.00 Pi</strong>
  </div>
</section>

<!-- ===== POPULAR PROJECTS ===== -->
<div class="popular-section">
  <div class="popular-title">🔥 Popular Projects</div>
  <div class="popular-scroll" id="popularProjects"></div>
</div>

<!-- ===== ASSETS ===== -->
<section class="section">
  <div class="assets-header">
    <h3>Assets</h3>
    <span class="assets-search" onclick="location.href='projects.html'">🔍</span>
  </div>
  <div id="assetsContainer"></div>
</section>

<nav class="bottom-nav">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="projects.html"><span>🔎</span>Projects</a>
  <a href="wallet.html"><span>💼</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="settings.html"><span>⚙️</span>Settings</a>
</nav>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const ICONS = {
  Raheem:"💊",
  Hauwal:"🌽",
  Barsh:"🌾",
  Khairat:"♻️",
  Azman:"🧪",
  Urban:"🚍",
  Labbaika:"🍞"
};

function loadHome(){

  if(typeof getAllStakesMerged !== "function") return;

  const stakes = getAllStakesMerged();

  let userMap = {};
  let globalMap = {};

  let totalStake = 0;
  let totalReward = 0;

  stakes.forEach(s=>{

    if(s.capitalWithdrawn) return;

    const amount = Number(s.amount)||0;
    const reward = Number(s.remainingReward ?? s.reward)||0;

    totalStake += amount;
    totalReward += reward;

    /* USER ASSETS */
    if(!userMap[s.project]){
      userMap[s.project] = 0;
    }
    userMap[s.project] += amount;

    /* GLOBAL POPULAR */
    if(!globalMap[s.project]){
      globalMap[s.project] = {
        total:0,
        investors:0
      };
    }

    globalMap[s.project].total += amount;
  });

  /* count investors */
  Object.keys(globalMap).forEach(project=>{
    const investors = stakes.filter(s=> 
      s.project===project && !s.capitalWithdrawn
    ).length;

    globalMap[project].investors = investors;
  });

  homeStake.innerText = totalStake.toFixed(2)+" Pi";
  homeReward.innerText = totalReward.toFixed(2)+" Pi";

  renderPopular(globalMap);
  renderAssets(userMap);
}

/* =========================
   POPULAR (GLOBAL RANK)
========================= */
function renderPopular(globalMap){

  const container = document.getElementById("popularProjects");
  container.innerHTML = "";

  const sorted = Object.entries(globalMap)
    .sort((a,b)=> b[1].total - a[1].total)
    .slice(0,10);

  sorted.forEach(([project,data],index)=>{

    const file = project.toLowerCase()+".html";

    const div = document.createElement("div");
    div.className = "popular-card";
    div.onclick = ()=> location.href = file;

    div.innerHTML = `
      <div class="popular-icon">
        ${ICONS[project] || "📦"}
      </div>
      <div class="popular-name">
        #${index+1} ${project}
      </div>
      <div class="popular-amount">
        ${data.total.toFixed(2)} Pi
      </div>
    `;

    container.appendChild(div);
  });
}

/* =========================
   USER ASSETS
========================= */
function renderAssets(userMap){

  const container = document.getElementById("assetsContainer");
  container.innerHTML = "";

  const sorted = Object.entries(userMap)
    .sort((a,b)=>b[1]-a[1]);

  if(sorted.length === 0){
    container.innerHTML =
      "<p style='font-size:12px;color:#777'>No assets yet</p>";
    return;
  }

  sorted.forEach(([project,amount])=>{

    const file = project.toLowerCase()+".html";

    const div = document.createElement("div");
    div.className = "asset-item";
    div.onclick = ()=> location.href = file;

    div.innerHTML = `
      <div class="asset-left">
        <div class="asset-name">${project}</div>
        <div class="asset-stake">${amount.toFixed(2)} Pi Staked</div>
      </div>
      <div class="asset-right">
        ${ICONS[project] || "📦"}
        ${amount.toFixed(2)}
      </div>
    `;

    container.appendChild(div);
  });
}

window.addEventListener("DOMContentLoaded", loadHome);
</script>

<script>
/* ======================================
   ALBUKHR – SMART LIVE REFRESH
====================================== */

(function(){

  const REFRESH_INTERVAL = 30000; // 30s
  let refreshTimer = null;

  function softRefresh(){
    if(typeof loadHome === "function"){
      loadHome();
    }
  }

  function startRefresh(){
    if(refreshTimer) return;
    refreshTimer = setInterval(softRefresh, REFRESH_INTERVAL);
  }

  function stopRefresh(){
    if(refreshTimer){
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
  }

  /* Start after page loads */
  window.addEventListener("DOMContentLoaded", startRefresh);

  /* Stop when tab inactive */
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){
      stopRefresh();
    } else {
      startRefresh();
    }
  });

})();
</script>
  
</body>
  </html>
