<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Projects</title>
<link rel="stylesheet" href="style.css">

<style>
/* ===============================
   GLOBAL BACKGROUND POLISH
================================ */
body{
  background: linear-gradient(135deg,#f4fff8,#ffffff);
  font-family: system-ui,-apple-system,sans-serif;
}

body::before{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  background: radial-gradient(circle,#0f7a3d22,transparent 70%);
  top:-120px;
  right:-120px;
  z-index:-1;
}

/* ===============================
   WELCOME BAR SLOW SCROLL
================================ */
.welcome-bar{
  overflow:hidden;
  background:#f0fff7;
  padding:8px 16px;
  margin-bottom:12px;
  border-radius:10px;
  font-size:13px;
  font-weight:500;
  color:#0f7a3d;
}

.welcome-track{
  display:inline-block;
  white-space:nowrap;
  animation:scrollText 40s linear infinite; /* slower scroll */
}

@keyframes scrollText{
  0% { transform:translateX(100%);}
  100% { transform:translateX(-100%);}
}

/* ===============================
   POPULAR PROJECTS – PREMIUM
================================ */
.popular-section{
  padding:14px;
}

.popular-title{
  font-weight:700;
  margin-bottom:10px;
  font-size:15px;
}

.popular-scroll{
  display:flex;
  overflow-x:auto;
  gap:12px;
  scroll-snap-type:x mandatory;
  padding-bottom:6px;
}

.popular-card{
  min-width:30%;
  flex:0 0 30%;
  background: linear-gradient(145deg,#ffffff,#f2fff7);
  border-radius:14px;
  padding:10px 8px;
  box-shadow:0 6px 18px rgba(15,122,61,0.08);
  text-align:center;
  scroll-snap-align:start;
  cursor:pointer;
  transition:all .25s ease;
  position:relative;
}

.popular-card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 24px rgba(15,122,61,0.15);
}

.popular-icon{
  font-size:22px;
  margin-bottom:6px;
}

.popular-name{
  font-weight:600;
  font-size:12px;
  line-height:1.2;
}

.popular-amount{
  font-size:11px;
  color:#0f7a3d;
  margin-top:4px;
  font-weight:600;
}

/* Rank badge */
.popular-card::after{
  content:attr(data-rank);
  position:absolute;
  top:6px;
  right:8px;
  font-size:9px;
  background:#0f7a3d;
  color:#fff;
  padding:2px 6px;
  border-radius:20px;
}

/* ===============================
   ASSETS – RECENT TRANSACTIONS STYLE
================================ */
.assets-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.assets-search{
  font-size:18px;
  cursor:pointer;
  transition:.2s ease;
}

.assets-search:hover{
  transform:scale(1.1);
}

.asset-item{
  background:#ffffff;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  box-shadow:0 6px 16px rgba(0,0,0,0.05);
  cursor:pointer;
  transition:all .25s ease;
  position:relative;
}

.asset-left{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
}

.asset-icon{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#e6f6ec;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

.asset-name{
  font-weight:600;
  font-size:14px;
}

.asset-stake{
  font-size:12px;
  color:#666;
  margin-top:2px;
}

.asset-right{
  font-weight:700;
  color:#0f7a3d;
  font-size:14px;
}

/* hover effect similar to popular cards */
.asset-item:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 22px rgba(15,122,61,0.12);
  background: linear-gradient(145deg,#f0fff7,#ffffff);
}

/* subtle fade in */
.asset-item,
.popular-card{
  animation:fadeIn .4s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px);}
  to{opacity:1;transform:translateY(0);}
}

/* ===== PREMIUM FLAT HEADER ===== */
.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.main-logo{
  height:54px;
  width:auto;
  object-fit:contain;
}

.brand{
  font-size:15px;
  font-weight:700;
  letter-spacing:.5px;
}

.menu-icon{
  width:18px;
  height:13px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}

.menu-icon div{
  height:2px;
  background:#fff;
  border-radius:2px;
}
</style>
</head>

<body data-page="home">

<header class="header">
  <div class="header-left">
    <img src="file_000000007bb062439b275f4bcf52e264.png" class="main-logo">
    <span class="brand"></span>
  </div>

  <div class="menu-icon" onclick="goToSettings()">
    <div></div>
    <div></div>
    <div></div>
  </div>
</header>

<div class="welcome-bar">
  <div id="welcomeScroll" class="welcome-track">
    Welcome to Albukhr Investment Limited — Building sustainable industries & empowering communities through investment.
  </div>
</div>

<section class="stats">
  <div class="stat-card">
    <span>Total Staking</span>
    <strong id="homeStake">0.00 Pi</strong>
  </div>
  <div class="stat-card">
    <span>Total Rewards</span>
    <strong id="homeReward">0.00 Pi</strong>
  </div>
</section>

<!-- ===== POPULAR PROJECTS ===== -->
<div class="popular-section">
  <div class="popular-title">🔥 Popular Projects</div>
  <div class="popular-scroll" id="popularProjects"></div>
</div>

<!-- ===== ASSETS ===== -->
<section class="section">
  <div class="assets-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <h3 style="margin:0;">Assets</h3>
      <span id="toggleAssets" style="cursor:pointer;font-size:16px;">👁</span>
    </div>
    <span class="assets-search" onclick="location.href='projects.html'">🔍</span>
  </div>

  <div id="assetsContainer"></div>
</section>

<!-- ===== ALBUKHR BOTTOM NAV ===== -->
<nav class="bottom-nav">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="wallet.html"><span>💼</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="news.html"><span>📰</span>News</a>
</nav>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const ICONS = {
  Raheem:"💊",
  Hauwal:"🌽",
  Barsh:"🌾",
  Khairat:"♻️",
  Azman:"🧪",
  Urban:"🚍",
  Labbaika:"🍞"
};

function loadHome(){

  if(typeof getAllStakesMerged !== "function") return;

  const stakes = getAllStakesMerged();

  let userMap = {};
  let globalMap = {};

  let totalStake = 0;
  let totalReward = 0;

  stakes.forEach(s=>{
    if(s.capitalWithdrawn) return;
    const amount = Number(s.amount)||0;
    const reward = Number(s.remainingReward ?? s.reward)||0;
    totalStake += amount;
    totalReward += reward;

    if(!userMap[s.project]) userMap[s.project] = 0;
    userMap[s.project] += amount;

    if(!globalMap[s.project]) globalMap[s.project]={total:0, investors:0};
    globalMap[s.project].total += amount;
  });

  Object.keys(globalMap).forEach(project=>{
    const investors = stakes.filter(s=> s.project===project && !s.capitalWithdrawn).length;
    globalMap[project].investors = investors;
  });

  homeStake.innerText = totalStake.toFixed(2)+" Pi";
  homeReward.innerText = totalReward.toFixed(2)+" Pi";

  renderPopular(globalMap);
  renderAssets(userMap, globalMap);
}

/* ========================= POPULAR ========================= */
function renderPopular(globalMap){
  const container = document.getElementById("popularProjects");
  container.innerHTML = "";
  Object.entries(globalMap)
    .sort((a,b)=>b[1].total - a[1].total)
    .slice(0,10)
    .forEach(([project,data],index)=>{
      const div=document.createElement("div");
      div.className="popular-card";
      div.setAttribute("data-rank","#"+(index+1));
      div.onclick=()=>location.href=project.toLowerCase()+".html";
      div.innerHTML=`<div class="popular-icon">${ICONS[project]||"📦"}</div>
        <div class="popular-name">${project}</div>
        <div class="popular-amount">${data.total.toFixed(2)} Pi</div>`;
      container.appendChild(div);
    });
}

/* ========================= ASSETS ========================= */
function renderAssets(userMap, globalMap){
  const container = document.getElementById("assetsContainer");
  container.innerHTML = "";

  const projects = Object.keys(globalMap);
  if(projects.length===0){
    container.innerHTML="<p style='font-size:12px;color:#777'>No projects available</p>";
    return;
  }

  const merged = projects.map(project=>({
    name: project,
    globalTotal: globalMap[project].total,
    userAmount: userMap[project]||0
  }));

  merged.sort((a,b)=>{
    if(a.userAmount>0 && b.userAmount===0) return -1;
    if(a.userAmount===0 && b.userAmount>0) return 1;
    if(a.userAmount!==b.userAmount) return b.userAmount-a.userAmount;
    return b.globalTotal-a.globalTotal;
  }).slice(0,10).forEach(item=>{
    const div=document.createElement("div");
    div.className="asset-item";
    div.onclick=()=>location.href=item.name.toLowerCase()+".html";
    div.innerHTML=`<div class="asset-left">
      <div class="asset-icon">${ICONS[item.name]||"📦"}</div>
      <div>
        <div class="asset-name">${item.name}</div>
        <div class="asset-stake">
          ${item.userAmount>0?item.userAmount.toFixed(2)+" Staked":"Not Staked"}
        </div>
      </div>
    </div>
    <div class="asset-right">
      ${item.userAmount>0?item.userAmount.toFixed(2):""}
    </div>`;
    container.appendChild(div);
  });
}

/* ========================= ASSET VISIBILITY ========================= */
const VISIBILITY_KEY="albukhr_assets_visibility";
function isAssetsHidden(){ return localStorage.getItem(VISIBILITY_KEY)==="hidden";}
function setAssetsHidden(hidden){ localStorage.setItem(VISIBILITY_KEY, hidden?"hidden":"visible");}
function applyVisibility(){
  const hidden=isAssetsHidden();
  document.getElementById("homeStake")?.classList.toggle("hidden-amount", hidden);
  document.getElementById("homeReward")?.classList.toggle("hidden-amount", hidden);
  document.querySelectorAll(".asset-right, .asset-stake").forEach(el=>{
    el.classList.toggle("hidden-amount", hidden);
  });
  const toggle=document.getElementById("toggleAssets");
  if(toggle){toggle.textContent=hidden?"🙈":"👁";}
}

document.addEventListener("DOMContentLoaded", ()=>{
  const toggle=document.getElementById("toggleAssets");
  if(toggle){
    toggle.addEventListener("click", ()=>{
      const newState=!isAssetsHidden();
      setAssetsHidden(newState);
      applyVisibility();
    });
  }
  applyVisibility();
});

function goToSettings(){ window.location.href="settings.html";}
window.addEventListener("DOMContentLoaded", loadHome);

/* ========================= SMART LIVE REFRESH ========================= */
(function(){
  const REFRESH_INTERVAL=30000;
  let refreshTimer=null;
  function softRefresh(){ if(typeof loadHome==="function") loadHome();}
  function startRefresh(){ if(refreshTimer)return; refreshTimer=setInterval(softRefresh, REFRESH_INTERVAL);}
  function stopRefresh(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null;}}
  window.addEventListener("DOMContentLoaded", startRefresh);
  document.addEventListener("visibilitychange", ()=>{ document.hidden?stopRefresh():startRefresh(); });
})();
</script>

<script src="js/core/header.js"></script>
<script>
  renderAlbukhrHeader({ hamburger:true });
</script>
</body>
</html>
