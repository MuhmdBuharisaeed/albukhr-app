<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Projects</title>

<!-- PI SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/albukhr-ui.css">
<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>
.header-user{
  font-size:12px;
  color:#0f7a3d;
  font-weight:600;
  margin-right:6px;
}
</style>
</head>

<body>

<header class="header">

  <div class="header-left">
    <span class="brand">ALBUKHR</span>
  </div>

  <div class="header-right">

    <!-- USER -->
    <div id="piUserIndicator" class="header-user">⏳</div>

    <!-- NOTIF -->
    <div class="header-btn">🔔</div>

    <!-- MENU -->
    <div class="header-btn">☰</div>

  </div>

</header>

<section class="stats">
  <div class="stat-card">
    <span>Total Staking</span>
    <strong id="homeStake">0.00 Pi</strong>
  </div>
  <div class="stat-card">
    <span>Total Rewards</span>
    <strong id="homeReward">0.00 Pi</strong>
  </div>
</section>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://qexmnghilahsvethlxem.supabase.co",
  "sb_publishable_mSbWlhVKdmSjasKJC50QYw_5wzgRMe2"
);
</script>

<!-- ===============================
   PI AUTH SYSTEM
================================ -->

<script>

function initPi(){

  if(!window.Pi){
    console.warn("Not in Pi Browser");
    return false;
  }

  Pi.init({
    version:"2.0",
    sandbox:false
  });

  return true;
}

async function ensureAuth(){

  try{

    const saved = JSON.parse(localStorage.getItem("pi_user"));

    if(saved && saved.uid){
      window.currentUser = saved;
      return saved;
    }

    if(!initPi()){
      window.location.href = "login.html";
      return null;
    }

    const raw = await Pi.authenticate(['username']);

    const user = {
      uid: raw.uid,
      username: raw.username
    };

    localStorage.setItem("pi_user", JSON.stringify(user));
    window.currentUser = user;

    return user;

  }catch(e){
    console.error(e);
    window.location.href = "login.html";
    return null;
  }

}

/* ===============================
   UI USER
================================ */

function updateUserUI(user){

  const el = document.getElementById("piUserIndicator");

  if(!el) return;

  if(user){
    el.innerText = "👤 " + user.username + " ✓";
  }else{
    el.innerText = "❌";
  }

}

/* ===============================
   DATA LOAD
================================ */

async function loadHome(){

  const { data, error } = await supabase
    .from("stakes")
    .select("*");

  if(error){
    console.error(error);
    return;
  }

  let totalStake = 0;
  let totalReward = 0;

  data.forEach(s=>{
    totalStake += Number(s.amount)||0;
    totalReward += Number(s.reward)||0;
  });

  document.getElementById("homeStake").innerText =
    totalStake.toFixed(2) + " Pi";

  document.getElementById("homeReward").innerText =
    totalReward.toFixed(2) + " Pi";

}

/* ===============================
   INIT APP
================================ */

document.addEventListener("DOMContentLoaded", async ()=>{

  const user = await ensureAuth();

  updateUserUI(user);

  if(!user) return;

  loadHome();

});

</script>

</body>
</html>
