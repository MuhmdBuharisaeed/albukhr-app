<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Albukhr App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <!-- 1️⃣ HEADER -->
  <header id="app-header">
    <div class="logo">
      <!-- Logo zai zo nan -->
      <img src="assets/logo/albukhr-logo.png" alt="Albukhr Logo">
    </div>
    <div class="app-name">
      <h1>Albukhr</h1>
    </div>
  </header>


  <!-- 2️⃣ WELCOME TEXT (motion daga baya) -->
  <section id="welcome-section">
    <p>
      Welcome to Albukhr — Building sustainable industries and empowering communities
    </p>
  </section>


  <!-- 3️⃣ STATS SUMMARY -->
  <section id="stats-section">

    <div class="stat-card" id="total-staking">
      <h3>Total Staking</h3>
      <p>0.00 Pi</p>
    </div>

    <div class="stat-card" id="rewards">
      <h3>Rewards</h3>
      <p>0.00 Pi</p>
    </div>

  </section>


  <!-- 4️⃣ CORE PROJECTS (ALBUKHR = 7) -->
  <section id="projects-section">

    <div class="project-item">
      <span class="project-letter">A</span>
      <span class="project-name">Agriculture</span>
    </div>

    <div class="project-item">
      <span class="project-letter">L</span>
      <span class="project-name">Livestock</span>
    </div>

    <div class="project-item">
      <span class="project-letter">B</span>
      <span class="project-name">Bakery</span>
    </div>

    <div class="project-item">
      <span class="project-letter">U</span>
      <span class="project-name">Water & Utilities</span>
    </div>

    <div class="project-item">
      <span class="project-letter">K</span>
      <span class="project-name">Fertilizer</span>
    </div>

    <div class="project-item">
      <span class="project-letter">H</span>
      <span class="project-name">Transportation</span>
    </div>

    <div class="project-item">
      <span class="project-letter">R</span>
      <span class="project-name">Raheem Pharmacy</span>
    </div>

  </section>


  <!-- 5️⃣ BOTTOM NAVIGATION -->
  <nav id="bottom-nav">
    <ul>
      <li>Home</li>
      <li>Projects</li>
      <li>Wallet</li>
      <li>Services</li>
      <li>Settings</li>
    </ul>
  </nav>

</body>
</html>
