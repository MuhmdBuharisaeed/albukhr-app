<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR – Home</title>
<link rel="stylesheet" href="style.css">

<style>

/* ===============================
   GLOBAL
================================ */
body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  background:linear-gradient(135deg,#f4fff8,#ffffff);
}

/* ===============================
   HEADER (Albukhr Architecture)
================================ */
.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.main-logo{
  height:54px;
  width:auto;
}

.menu-icon{
  width:18px;
  height:13px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}

.menu-icon div{
  height:2px;
  background:#fff;
  border-radius:2px;
}

/* ===============================
   STATS
================================ */
.stats{
  padding:14px;
  display:flex;
  gap:10px;
}

.stat-card{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.05);
}

.stat-card span{
  font-size:12px;
  color:#777;
}

.stat-card strong{
  display:block;
  margin-top:4px;
  font-size:16px;
  color:#0f7a3d;
}

/* ===============================
   POPULAR
================================ */
.popular-section{
  padding:14px;
}

.popular-title{
  font-weight:700;
  margin-bottom:10px;
}

.popular-scroll{
  display:flex;
  overflow-x:auto;
  gap:12px;
}

.popular-card{
  min-width:120px;
  background:#fff;
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 6px 18px rgba(15,122,61,.08);
  cursor:pointer;
  position:relative;
}

.popular-card::after{
  content:attr(data-rank);
  position:absolute;
  top:6px;
  right:8px;
  font-size:9px;
  background:#0f7a3d;
  color:#fff;
  padding:2px 6px;
  border-radius:20px;
}

/* ===============================
   ASSETS
================================ */
.section{
  padding:14px;
}

.assets-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.asset-item{
  background:#fff;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 6px 16px rgba(0,0,0,.05);
  cursor:pointer;
}

.asset-name{
  font-weight:600;
  font-size:14px;
}

.asset-stake{
  font-size:12px;
  color:#666;
  margin-top:2px;
}

.asset-progress{
  margin-top:6px;
  height:5px;
  background:#e9f5ef;
  border-radius:10px;
  overflow:hidden;
}

.asset-progress-fill{
  height:100%;
  background:#0f7a3d;
  width:0%;
  transition:width .4s ease;
}

.asset-progress-faint{
  background:#cfe9db;
}

.hidden-amount{
  filter:blur(6px);
}

/* ===============================
   BOTTOM NAV
================================ */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -4px 16px rgba(0,0,0,.05);
}

.bottom-nav a{
  text-decoration:none;
  font-size:12px;
  color:#666;
}

.bottom-nav a.active{
  color:#0f7a3d;
  font-weight:700;
}

</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <img src="file_000000007bb062439b275f4bcf52e264.png" class="main-logo">
  </div>

  <div class="menu-icon" onclick="location.href='settings.html'">
    <div></div>
    <div></div>
    <div></div>
  </div>
</header>

<section class="stats">
  <div class="stat-card">
    <span>Total Staking</span>
    <strong id="homeStake">0.00 Pi</strong>
  </div>
  <div class="stat-card">
    <span>Total Rewards</span>
    <strong id="homeReward">0.00 Pi</strong>
  </div>
</section>

<div class="popular-section">
  <div class="popular-title">🔥 Popular Projects</div>
  <div class="popular-scroll" id="popularProjects"></div>
</div>

<section class="section">
  <div class="assets-header">
    <h3>Assets</h3>
    <span id="toggleAssets" style="cursor:pointer;">👁</span>
  </div>
  <div id="assetsContainer"></div>
</section>

<nav class="bottom-nav">
  <a href="index.html" class="active">🏠 Home</a>
  <a href="wallet.html">💼 Wallet</a>
  <a href="services.html">🛠 Services</a>
  <a href="news.html">📰 News</a>
</nav>

<script src="staking.js"></script>

<script>

/* ===============================
   CONFIG
================================ */

const ALL_PROJECTS = [
  "Raheem","Hauwal","Barsh","Khairat",
  "Azman","Urban","Labbaika",
  "Sadiq","Ameen","Zarah"
];

const ICONS = {
  Raheem:"💊", Hauwal:"🌽", Barsh:"🌾",
  Khairat:"♻️", Azman:"🧪", Urban:"🚍",
  Labbaika:"🍞", Sadiq:"🏗",
  Ameen:"🧵", Zarah:"🏭"
};

/* ===============================
   MAIN LOAD
================================ */

function loadHome(){

  if(typeof getAllStakesMerged !== "function") return;

  const stakes = getAllStakesMerged();

  let userMap = {};
  let globalMap = {};
  let totalStake = 0;
  let totalReward = 0;

  stakes.forEach(s=>{
    if(s.capitalWithdrawn) return;

    const amount = Number(s.amount)||0;
    const reward = Number(s.remainingReward ?? s.reward)||0;

    totalStake += amount;
    totalReward += reward;

    userMap[s.project] = (userMap[s.project]||0)+amount;

    if(!globalMap[s.project]){
      globalMap[s.project] = { total:0 };
    }
    globalMap[s.project].total += amount;
  });

  ALL_PROJECTS.forEach(p=>{
    if(!globalMap[p]){
      globalMap[p] = { total:0 };
    }
  });

  document.getElementById("homeStake").innerText =
    totalStake.toFixed(2)+" Pi";

  document.getElementById("homeReward").innerText =
    totalReward.toFixed(2)+" Pi";

  renderPopular(globalMap);
  renderAssets(userMap, globalMap);
}

/* ===============================
   POPULAR
================================ */

function renderPopular(globalMap){

  const container = document.getElementById("popularProjects");
  container.innerHTML = "";

  const sorted = Object.entries(globalMap)
    .sort((a,b)=> b[1].total - a[1].total)
    .slice(0,10);

  sorted.forEach(([project,data],i)=>{
    const div = document.createElement("div");
    div.className="popular-card";
    div.setAttribute("data-rank","#"+(i+1));
    div.innerHTML=`
      <div style="font-size:20px">${ICONS[project]||"📦"}</div>
      <div style="font-size:12px;font-weight:600">${project}</div>
      <div style="font-size:11px;color:#0f7a3d">
        ${data.total.toFixed(2)} Pi
      </div>
    `;
    div.onclick=()=>location.href=project.toLowerCase()+".html";
    container.appendChild(div);
  });
}

/* ===============================
   ASSETS
================================ */

function renderAssets(userMap, globalMap){

  const container = document.getElementById("assetsContainer");
  container.innerHTML="";

  const maxGlobal = Math.max(
    ...Object.values(globalMap).map(p=>p.total)
  );

  const combined = ALL_PROJECTS.map(name=>{
    return {
      name,
      user:userMap[name]||0,
      global:globalMap[name]?.total||0
    };
  });

  combined.sort((a,b)=>{
    if(b.user !== a.user) return b.user - a.user;
    return b.global - a.global;
  });

  combined.forEach(item=>{

    const div = document.createElement("div");
    div.className="asset-item";

    const percent = item.user>0
      ? (item.user/item.global)*100
      : (item.global/maxGlobal)*100;

    div.innerHTML=`
      <div class="asset-name">${item.name}</div>
      <div class="asset-stake">
        ${item.user>0
          ? item.user.toFixed(2)+" Pi Staked"
          : "Not Staked"}
      </div>
      <div class="asset-progress">
        <div class="asset-progress-fill 
          ${item.user===0?"asset-progress-faint":""}"
          style="width:${percent||0}%">
        </div>
      </div>
    `;

    div.onclick=()=>location.href=item.name.toLowerCase()+".html";
    container.appendChild(div);
  });
}

/* ===============================
   VISIBILITY
================================ */

const VISIBILITY_KEY="albukhr_assets_visibility";

function toggleVisibility(){
  const hidden =
    localStorage.getItem(VISIBILITY_KEY)==="hidden";
  localStorage.setItem(
    VISIBILITY_KEY,
    hidden?"visible":"hidden"
  );
  applyVisibility();
}

function applyVisibility(){
  const hidden =
    localStorage.getItem(VISIBILITY_KEY)==="hidden";

  document.querySelectorAll(
    "#homeStake,#homeReward,.asset-stake"
  ).forEach(el=>{
    el.classList.toggle("hidden-amount",hidden);
  });

  document.getElementById("toggleAssets")
    .textContent=hidden?"🙈":"👁";
}

document.getElementById("toggleAssets")
  .addEventListener("click",toggleVisibility);

window.addEventListener("DOMContentLoaded",()=>{
  applyVisibility();
  loadHome();
});

</script>

</body>
</html>
