<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Projects</title>
<link rel="stylesheet" href="style.css">

<style>
/* ===============================
   GLOBAL BACKGROUND POLISH
================================ */
body{
  background: linear-gradient(135deg,#f4fff8,#ffffff);
  font-family: system-ui,-apple-system,sans-serif;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  background: radial-gradient(circle,#0f7a3d22,transparent 70%);
  top:-120px;
  right:-120px;
  z-index:-1;
}

/* ===== PREMIUM FLAT HEADER ===== */
.header{
  background:#0f7a3d;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* left side (logo + brand) */
.header-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.main-logo{
  height:54px;
  width:auto;
}

.brand{
  font-size:15px;
  font-weight:700;
  letter-spacing:.5px;
}

/* hamburger */
.menu-icon{
  width:18px;
  height:13px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}

.menu-icon div{
  height:2px;
  background:#fff;
  border-radius:2px;
}

/* ===============================
   WELCOME BAR
================================ */
.welcome-bar{
  background:#f4fff8;
  padding:8px 16px;
  overflow:hidden;
  white-space:nowrap;
}

.welcome-track{
  display:inline-block;
  padding-left:100%;
  animation:scrollWelcome 20s linear infinite;
  font-size:13px;
  color:#0f7a3d;
}

@keyframes scrollWelcome{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* ===============================
   STATS
================================ */
.stats{
  display:flex;
  gap:12px;
  padding:16px;
}

.stat-card{
  flex:1;
  background:#ffffff;
  border-radius:12px;
  padding:10px 12px;
  box-shadow:0 6px 16px rgba(0,0,0,0.05);
  text-align:center;
}

.stat-card span{
  font-size:12px;
  color:#777;
}

.stat-card strong{
  display:block;
  font-size:14px;
  font-weight:700;
  color:#0f7a3d;
}

/* ===============================
   POPULAR PROJECTS
================================ */
.popular-section{
  padding:14px;
}

.popular-title{
  font-weight:700;
  margin-bottom:10px;
  font-size:15px;
}

.popular-scroll{
  display:flex;
  overflow-x:auto;
  gap:12px;
  scroll-snap-type:x mandatory;
  padding-bottom:6px;
}

.popular-card{
  min-width:30%;
  flex:0 0 30%;
  background: linear-gradient(145deg,#ffffff,#f2fff7);
  border-radius:14px;
  padding:10px 8px;
  box-shadow:0 6px 18px rgba(15,122,61,0.08);
  text-align:center;
  scroll-snap-align:start;
  cursor:pointer;
  transition:all .25s ease;
  position:relative;
}

.popular-card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 24px rgba(15,122,61,0.15);
}

.popular-icon{
  font-size:22px;
  margin-bottom:6px;
}

.popular-name{
  font-weight:600;
  font-size:12px;
  line-height:1.2;
}

.popular-amount{
  font-size:11px;
  color:#0f7a3d;
  margin-top:4px;
  font-weight:600;
}

.popular-card::after{
  content:attr(data-rank);
  position:absolute;
  top:6px;
  right:8px;
  font-size:9px;
  background:#0f7a3d;
  color:#fff;
  padding:2px 6px;
  border-radius:20px;
}

/* ===============================
   ASSETS – RECENT TRANSACTIONS STYLE
================================ */
.assets-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:16px;
}

.assets-search{
  font-size:18px;
  cursor:pointer;
  transition:.2s ease;
}

.assets-search:hover{
  transform:scale(1.1);
}

.asset-item{
  background:#fff;
  border-radius:12px;
  padding:12px 12px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
  position:relative;
  box-shadow:0 6px 16px rgba(0,0,0,0.05);
  cursor:pointer;
  transition:all .25s ease;
}

.asset-item:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(0,0,0,0.08);
}

.asset-left{
  flex:1;
}

.asset-name{
  font-weight:600;
  font-size:14px;
}

.asset-stake{
  font-size:12px;
  color:#0f7a3d;
  margin-top:2px;
}

.asset-icon{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#e6f6ec;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

/* ===============================
   BOTTOM NAV
================================ */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  background:#fff;
  border-top:1px solid #eee;
}

.bottom-nav a{
  flex:1;
  padding:8px 0;
  text-align:center;
  text-decoration:none;
  font-size:12px;
  color:#777;
}

.bottom-nav a.active{
  color:#0f7a3d;
  font-weight:700;
}

/* ===============================
   SIDE DRAWER
================================ */
.side-drawer{
  position: fixed;
  top:0;
  right:-280px;
  width:280px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 18px rgba(0,0,0,0.12);
  transition: right 0.3s ease;
  z-index:1001;
  display:flex;
  flex-direction:column;
}

.side-drawer.open{
  right:0;
}

.drawer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  border-bottom:1px solid #eee;
  font-weight:700;
  background:#f4fff8;
}

.drawer-body{
  display:flex;
  flex-direction:column;
  padding:12px 16px;
  gap:10px;
}

.drawer-body a{
  text-decoration:none;
  color:#0f7a3d;
  font-weight:600;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.drawer-overlay{
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.2);
  opacity:0;
  visibility:hidden;
  transition: opacity 0.3s ease;
  z-index:1000;
}

.drawer-overlay.show{
  opacity:1;
  visibility:visible;
}

.hidden-amount{
  filter: blur(6px);
  user-select:none;
}
</style>

</head>
<body data-page="home">

<header class="header">
  <div class="header-left">
    <img src="file_000000007bb062439b275f4bcf52e264.png" class="main-logo">
    <span class="brand"></span>
  </div>
  <div class="menu-icon">
    <div></div><div></div><div></div>
  </div>
</header>

<div class="welcome-bar">
  <div id="welcomeScroll" class="welcome-track">
    Welcome to Albukhr Investment Limited — Building sustainable industries & empowering communities through investment.
  </div>
</div>

<section class="stats">
  <div class="stat-card">
    <span>Total Staking</span>
    <strong id="homeStake">0.00 Pi</strong>
  </div>
  <div class="stat-card">
    <span>Total Rewards</span>
    <strong id="homeReward">0.00 Pi</strong>
  </div>
</section>

<div class="popular-section">
  <div class="popular-title">🔥 Popular Projects</div>
  <div class="popular-scroll" id="popularProjects"></div>
</div>

<section class="section">
  <div class="assets-header">
    <h3>Assets</h3>
  </div>
  <div id="assetsContainer"></div>
</section>

<nav class="bottom-nav">
  <a href="index.html" class="active"><span>🏠</span>Home</a>
  <a href="wallet.html"><span>💼</span>Wallet</a>
  <a href="services.html"><span>🛠️</span>Services</a>
  <a href="news.html"><span>📰</span>News</a>
</nav>

<!-- SIDE DRAWER -->
<div id="sideDrawer" class="side-drawer">
  <div class="drawer-header">
    <h3>Settings</h3>
    <span class="close-drawer" onclick="closeDrawer()">✖️</span>
  </div>
  <div class="drawer-body">
    <a href="profile.html">Profile</a>
    <a href="preferences.html">Preferences</a>
    <a href="security.html">Security</a>
    <a href="help.html">Help</a>
  </div>
</div>
<div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()"></div>

<script src="staking.js"></script>
<script src="wallet-core.js"></script>

<script>
const ICONS = {
  Raheem:"💊",
  Hauwal:"🌽",
  Barsh:"🌾",
  Khairat:"♻️",
  Azman:"🧪",
  Urban:"🚍",
  Labbaika:"🍞"
};

function loadHome(){
  if(typeof getAllStakesMerged !== "function") return;
  const stakes = getAllStakesMerged();
  let userMap = {}, globalMap = {};
  let totalStake=0, totalReward=0;
  
  stakes.forEach(s=>{
    if(s.capitalWithdrawn) return;
    const amount = Number(s.amount)||0;
    const reward = Number(s.remainingReward ?? s.reward)||0;
    totalStake += amount;
    totalReward += reward;

    userMap[s.project] = (userMap[s.project]||0) + amount;
    if(!globalMap[s.project]) globalMap[s.project]={total:0, investors:0};
    globalMap[s.project].total += amount;
  });

  Object.keys(globalMap).forEach(project=>{
    globalMap[project].investors = stakes.filter(s=> s.project===project && !s.capitalWithdrawn).length;
  });

  homeStake.innerText = totalStake.toFixed(2)+" Pi";
  homeReward.innerText = totalReward.toFixed(2)+" Pi";

  renderPopular(globalMap);
  renderAssets(userMap, globalMap);
}

function renderPopular(globalMap){
  const container=document.getElementById("popularProjects");
  container.innerHTML="";
  const sorted = Object.entries(globalMap).sort((a,b)=>b[1].total-a[1].total).slice(0,10);
  sorted.forEach(([project,data],index)=>{
    const div=document.createElement("div");
    div.className="popular-card";
    div.setAttribute("data-rank","#"+(index+1));
    div.onclick=()=> location.href=project.toLowerCase()+".html";
    div.innerHTML=`<div class="popular-icon">${ICONS[project]||"📦"}</div>
    <div class="popular-name">${project}</div>
    <div class="popular-amount">${data.total.toFixed(2)} Pi</div>`;
    container.appendChild(div);
  });
}

function renderAssets(userMap, globalMap){
  const container=document.getElementById("assetsContainer");
  container.innerHTML="";
  const projects=Object.keys(globalMap);
  if(projects.length===0){ container.innerHTML="<p style='font-size:12px;color:#777'>No projects</p>"; return;}
  const merged=projects.map(p=>({name:p,globalTotal:globalMap[p].total,userAmount:userMap[p]||0}));
  merged.sort((a,b)=>{
    if(a.userAmount>0 && b.userAmount===0) return -1;
    if(a.userAmount===0 && b.userAmount>0) return 1;
    if(a.userAmount!==b.userAmount) return b.userAmount-a.userAmount;
    return b.globalTotal-a.globalTotal;
  }).slice(0,10).forEach(item=>{
    const div=document.createElement("div");
    div.className="asset-item";
    div.onclick=()=> location.href=item.name.toLowerCase()+".html";
    div.innerHTML=`<div class="asset-icon">${ICONS[item.name]||"📦"}</div>
    <div class="asset-left">
      <div class="asset-name">${item.name}</div>
      <div class="asset-stake">${item.userAmount>0?item.userAmount.toFixed(2)+" Pi Staked":"Not Staked"}</div>
    </div>`;
    container.appendChild(div);
  });
}

/* ASSETS VISIBILITY */
const VISIBILITY_KEY="albukhr_assets_visibility";
function isAssetsHidden(){return localStorage.getItem(VISIBILITY_KEY)==="hidden";}
function setAssetsHidden(hidden){localStorage.setItem(VISIBILITY_KEY,hidden?"hidden":"visible");}
function applyVisibility(){
  const hidden=isAssetsHidden();
  document.getElementById("homeStake")?.classList.toggle("hidden-amount",hidden);
  document.getElementById("homeReward")?.classList.toggle("hidden-amount",hidden);
  document.querySelectorAll(".asset-stake").forEach(el=>el.classList.toggle("hidden-amount",hidden));
}
document.addEventListener("DOMContentLoaded",()=>{
  applyVisibility();
});

window.addEventListener("DOMContentLoaded", loadHome);

/* SIDE DRAWER */
function openDrawer(){
  document.getElementById("sideDrawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("show");
}
function closeDrawer(){
  document.getElementById("sideDrawer").classList.remove("open");
  document.getElementById("drawerOverlay").classList.remove("show");
}
document.querySelector(".menu-icon").addEventListener("click", openDrawer);
</script>

</body>
   </html>
