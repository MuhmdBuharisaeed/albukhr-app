<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Pi Test</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
}

.header{
  background:#0f7a3d;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:18px;
  font-weight:700;
}

.status{
  font-size:13px;
}

.center{
  height:80vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}
</style>

</head>

<body>

<div class="header">
  <div class="brand">ALBUKHR</div>
  <div id="userBox" class="status">⏳ Loading...</div>
</div>

<div class="center">
  <h2>Pi Login Test</h2>
  <p>Testing Pi SDK connection...</p>
</div>

<script>

function setStatus(text){
  document.getElementById("userBox").innerText = text;
}

function showError(msg){
  document.body.innerHTML = `
  <div style="display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;">
    <div>
      <h2>❌ ${msg}</h2>
    </div>
  </div>`;
}

async function initPi(){

  try{

    // 1. check environment
    if(typeof window.Pi === "undefined"){
      showError("Not in Pi Browser");
      return;
    }

    setStatus("🔄 Connecting...");

    // 2. init
    Pi.init({
      version:"2.0",
      sandbox:true
    });

    // 3. auth
    const auth = await Pi.authenticate(['username']);

    console.log("AUTH:", auth);

    if(!auth || !auth.user){
      throw new Error("No user");
    }

    const user = auth.user;

    // 4. success
    setStatus("👤 " + user.username + " ✓");

    document.querySelector(".center").innerHTML = `
      <h2>✅ Login Successful</h2>
      <p>Welcome ${user.username}</p>
    `;

  }catch(err){

    console.error(err);

    showError("Pi Login Failed");

  }

}

// RUN
document.addEventListener("DOMContentLoaded", initPi);

</script>

</body>
</html>
