<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALBUKHR Projects</title>

  <!-- Haɗa Pi SDK -->
  <script src="https://cdn.pi.network/pi.js"></script>

  <!-- Script na AUTH -->
  <script src="js/auth.js"></script>
  <script src="js/app-init.js"></script>

  <script>
    let CURRENT_USER = null;

    // Kafa Pi SDK
    function initPi() {
      if (typeof Pi === "undefined") {
        console.error("❌ Pi SDK yana ɓacewa");
        return;
      }
      Pi.init({
        version: "2.0",
        sandbox: false
      });
    }

    // Ajiye mai amfani cikin localStorage
    function saveUser(user) {
      localStorage.setItem("pi_user", JSON.stringify(user));
    }

    // Load mai amfani daga localStorage
    function loadUser() {
      const saved = localStorage.getItem("pi_user");
      if (!saved) return null;
      try {
        const user = JSON.parse(saved);
        if (user?.uid) {
          CURRENT_USER = user;
          return user;
        }
      } catch (e) {}
      return null;
    }

    // Tabbatar da mai amfani ta hanyar Pi SDK
    async function authenticatePi() {
      try {
        const user = await Pi.authenticate(['username', 'payments'], () => {});
        if (!user?.uid) {
          throw new Error("Mai amfani bai dace ba");
        }
        __PI_USER = user;
        saveUser(user); // Ajiye mai amfani cikin localStorage
        return user;
      } catch (e) {
        console.error("❌ Tabbatar da mai amfani ta kasa:", e);
        return null;
      }
    }

    // Tabbatar da mai amfani
    async function ensurePiAuth() {
      if (__PI_USER?.uid) return __PI_USER;

      const saved = loadUser();
      if (saved) return saved;

      const user = Pi.getUser();
      if (user?.uid) {
        __PI_USER = user;
        saveUser(user);
        return user;
      }

      return await authenticatePi();
    }

    // Sabunta UI
    function updateUserUI() {
      const user = CURRENT_USER;
      const btn = document.getElementById("userBtn");

      if (!btn) return;

      if (user) {
        btn.innerText = "👤✓";
      } else {
        btn.innerText = "👤";
      }
    }

    window.addEventListener("DOMContentLoaded", updateUserUI);
  </script>

  <!-- Haɗa CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/global-header.css">
  <link rel="stylesheet" href="global-buttons.css">
  <style>
    /* ===============================
      GLOBAL BACKGROUND POLISH
    ================================ */
    body {
      background: linear-gradient(135deg, #f4fff8, #ffffff);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #0f7a3d22, transparent 70%);
      top: -120px;
      right: -120px;
      z-index: -1;
    }

    /* Premium Header */
    .header {
      background: #0f7a3d;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-logo {
      height: 54px;
      width: auto;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .menu-icon {
      width: 18px;
      height: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-icon div {
      height: 2px;
      background: linear-gradient(90deg, #ffffff, #c8f2de);
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
      transition: .3s ease;
    }

    .menu-icon:hover div {
      background: linear-gradient(90deg, #ffffff, #8de0b6);
      transform: scaleX(1.05);
    }

    /* Welcome Bar */
    .welcome-bar {
      background: #f4fff8;
      padding: 8px 16px;
      overflow: hidden;
      white-space: nowrap;
    }

    .welcome-track {
      display: inline-block;
      padding-left: 100%;
      animation: scrollWelcome 20s linear infinite;
      font-size: 13px;
      color: #0f7a3d;
    }

    @keyframes scrollWelcome {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 12px;
      padding: 16px;
    }

    .stat-card {
      flex: 1;
      background: #ffffff;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .stat-card span {
      font-size: 12px;
      color: #777;
    }

    .stat-card strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #0f7a3d;
    }
  </style>

</head>
<body data-page="home">
  <header class="header">
    <div class="header-left">
      <img src="file_000000007c187246b1c01967ee086dc4.png" class="main-logo">
      <span class="brand">ALBUKHR</span>
    </div>
    <div class="header-right">
      <div class="header-btn" id="userBtn" onclick="handleAuth()">👤</div>
      <div class="header-btn notification-btn" onclick="openNotifications()">🔔</div>
      <div class="header-btn menu-icon">
        ☰
      </div>
    </div>
  </header>

  <div class="welcome-bar">
    <div id="welcomeScroll" class="welcome-track">
      Welcome to Albukhr Investment Limited — Building sustainable industries & empowering communities through investment.
    </div>
  </div>

  <section class="stats">
    <div class="stat-card">
      <span>Total Staking</span>
      <strong id="homeStake">0.00 Pi</strong>
    </div>
    <div class="stat-card">
      <span>Total Rewards</span>
      <strong id="homeReward">0.00 Pi</strong>
    </div>
  </section>

  <div class="popular-section">
    <div class="popular-title">📊 Popular Projects</div>
    <div class="popular-scroll" id="popularProjects"></div>
  </div>

  <section class="section">
    <div class="assets-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <h3 style="margin:0;">Assets</h3>
        <span id="toggleAssets" style="cursor:pointer;font-size:16px;">👁</span>
      </div>
      <span class="assets-search" onclick="location.href='projects.html'">🔍</span>
    </div>
    <div id="assetsContainer"></div>
  </section>

  <!-- ALBUKHR AI FLOATING BUTTON -->
  <div class="albukhr-ai-btn" id="albukhrAI" onclick="openAlbukhrAI()">
    <img src="ALBUKHR_Logo_Optimized_1024x1024.png" class="albukhr-ai-logo" />
  </div>

  <div id="aiDevNote" class="ai-dev-note">
    Albukhr AI is under development
  </div>

  <script>
    async function loadHome() {
      if (typeof getAllStakesMerged !== "function") return;

      const stakes = await getAllStakesMerged();
      let userMap = {}, globalMap = {};
      let totalStake = 0, totalReward = 0;

      stakes.forEach(s => {
        if (s.type === "withdraw") return;
        const amount = Number(s.amount) || 0;
        const total = Number(s.reward) || 0;
        const withdrawn = Number(s.withdrawnReward) || 0;
        const reward = Math.max(0, total - withdrawn);

        totalStake += amount;
        totalReward += reward;

        userMap[s.project] = (userMap[s.project] || 0) + amount;

        if (!globalMap[s.project]) {
          globalMap[s.project] = { total: 0, investors: 0 };
        }

        globalMap[s.project].total += amount;
      });

      Object.keys(globalMap).forEach(project => {
        globalMap[project].investors = 
          stakes.filter(s => s.project === project && s.type !== "withdraw").length;
      });

      homeStake.innerText = totalStake.toFixed(2) + " Pi";
      homeReward.innerText = totalReward.toFixed(2) + " Pi";

      renderPopular(globalMap);
      renderAssets(userMap, globalMap);
    }
    
    function renderPopular(globalMap) {
      const container = document.getElementById("popularProjects");
      container.innerHTML = "";

      const sorted = Object.entries(globalMap)
        .sort((a, b) => b[1].total - a[1].total)
        .slice(0, 10);

      sorted.forEach(([project, data], index) => {
        const config = PROJECT_CONFIG[project];
        if (!config) return;

        const div = document.createElement("div");
        div.className = "popular-card";
        div.setAttribute("data-rank", "#" + (index + 1));

        div.onclick = () => location.href = `project.html?project=${project}`;

        div.innerHTML = `
          <div class="popular-icon">${config.icon}</div>
          <div class="popular-name">${config.title}</div>
          <div class="popular-amount">${data.total.toFixed(2)} Pi</div>
        `;
        container.appendChild(div);
      });
    }

    function renderAssets(userMap, globalMap) {
      const container = document.getElementById("assetsContainer");
      container.innerHTML = "";

      const merged = Object.keys(PROJECT_CONFIG).map(project => ({
        name: project,
        config: PROJECT_CONFIG[project],
        globalTotal: globalMap[project]?.total || 0,
        userAmount: userMap[project] || 0
      }));

      merged.sort((a, b) => {
        if (a.userAmount > 0 && b.userAmount === 0) return -1;
        if (a.userAmount === 0 && b.userAmount > 0) return 1;
        if (a.userAmount !== b.userAmount) return b.userAmount - a.userAmount;
        return b.globalTotal - a.globalTotal;
      });

      merged.forEach(item => {
        const div = document.createElement("div");
        div.className = "asset-item";

        div.onclick = () => location.href = `project.html?project=${item.name}`;

        div.innerHTML = `
          <div class="asset-icon">
            ${item.config.icon}
          </div>

          <div class="asset-left">
            <div class="asset-name">
              ${item.config.title}
            </div>

            <div class="asset-stake">
              ${item.userAmount > 0 ? item.userAmount.toFixed(2) + " Pi Staked" : "Not Staked"}
            </div>

            <div class="asset-progress-row">
              <div class="asset-progress">
                <div class="asset-progress-bar" style="width:${Math.min(item.userAmount, 100)}%"></div>
              </div>
              <div class="asset-percent">
                ${item.userAmount > 0 ? "Active" : "0%"}
              </div>
            </div>
          </div>
        `;

        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
