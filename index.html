<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALBUKHR</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  flex-direction:column;
}

button{
  padding:12px 20px;
  font-size:16px;
}
</style>

</head>

<body>

<h2>ALBUKHR</h2>

<div id="status">Click to login</div>

<button onclick="login()">Login with Pi</button>

<script>
let initialized = false;

async function login(){

  try{

    if(!window.Pi){
      document.getElementById("status").innerText =
        "❌ Not Pi Browser";
      return;
    }

    // INIT ON CLICK (VERY IMPORTANT)
    if(!initialized){
      Pi.init({
        version:"2.0",
        sandbox:false
      });
      initialized = true;
    }

    document.getElementById("status").innerText =
      "🔐 Logging in...";

    const auth = await Pi.authenticate(['username']);

    const username =
      auth.user?.username || auth.username;

    document.getElementById("status").innerText =
      "✅ " + username;

  }catch(e){

    console.error(e);

    document.getElementById("status").innerText =
      "❌ Login Failed";

  }

}
</script>

</body>
</html>
