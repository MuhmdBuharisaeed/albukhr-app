<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Test</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  font-family:sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  flex-direction:column;
  text-align:center;
}
button{
  padding:12px 20px;
  font-size:16px;
  margin-top:20px;
}
</style>

</head>

<body>

<h2>ALBUKHR Pi Test</h2>

<div id="status">Initializing...</div>

<button onclick="login()">Login with Pi</button>

<script>

function setStatus(msg){
  document.getElementById("status").innerText = msg;
  console.log(msg);
}

async function login(){

  try{

    // 1. check Pi browser
    if(typeof window.Pi === "undefined"){
      setStatus("❌ NOT PI BROWSER");
      return;
    }

    setStatus("🔄 Initializing Pi...");

    // 2. init
    Pi.init({
      version:"2.0",
      sandbox:false
    });

    setStatus("🔐 Authenticating...");

    // 3. auth
    const auth = await Pi.authenticate(['username']);

    console.log("AUTH RESULT:", auth);

    const uid = auth.user?.uid || auth.uid;
    const username = auth.user?.username || auth.username;

    if(!uid){
      throw new Error("UID missing");
    }

    setStatus("✅ SUCCESS: " + username);

  }catch(err){

    console.error("FULL ERROR:", err);

    setStatus("❌ ERROR: " + err.message);

  }

}

</script>

</body>
</html>
