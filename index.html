<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBUKHR Projects</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/albukhr-ui.css">
<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>
.header-left{
  display:flex;
  align-items:center;
  gap:6px;
}
.brand{
  font-size:18px;
  font-weight:700;
}
</style>

<!-- ✅ PI SDK FIRST -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

<header class="header">
  <div class="header-left">
    <span class="brand">ALBUKHR</span>
  </div>

  <div class="header-right">

    <div class="header-btn notification-btn">
      🔔
      <span id="notifBadge" class="notification-badge"></span>
    </div>

    <div class="header-btn menu-icon">☰</div>

  </div>
</header>

<section class="stats">
  <div class="stat-card">
    <span>Total Staking</span>
    <strong id="homeStake">0.00 Pi</strong>
  </div>
  <div class="stat-card">
    <span>Total Rewards</span>
    <strong id="homeReward">0.00 Pi</strong>
  </div>
</section>

<div id="assetsContainer"></div>

<!-- ================= PI AUTH ================= -->

<script>
function showUser(user){
  const header = document.querySelector(".header-right");

  let el = document.getElementById("piUser");

  if(!el){
    el = document.createElement("div");
    el.id = "piUser";
    el.style.color="#fff";
    el.style.fontSize="12px";
    el.style.marginRight="8px";
    header.prepend(el);
  }

  el.innerText = "👤 "+user.username+" ✓";
}

function blockNonPi(){
  document.body.innerHTML = `
  <div style="display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;">
    <div>
      <h2>🔐 Pi Browser Only</h2>
      <p>Open this app inside Pi Browser</p>
    </div>
  </div>`;
}

async function initPi(){

  try{

    if(!window.Pi){
      blockNonPi();
      return null;
    }

    console.log("Pi detected");

    Pi.init({
      version:"2.0",
      sandbox:true   // ⚠️ IMPORTANT (test mode)
    });

    const auth = await Pi.authenticate(['username']);

    console.log("AUTH:",auth);

    const user = {
      uid: auth.user.uid,
      username: auth.user.username
    };

    localStorage.setItem("pi_user",JSON.stringify(user));

    showUser(user);

    return user;

  }catch(err){

    console.error("PI ERROR:",err);

    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;text-align:center;">
      <div>
        <h2>❌ Login Failed</h2>
        <p>Try again in Pi Browser</p>
      </div>
    </div>`;

    return null;
  }
}
</script>

<!-- ================= DATA ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://qexmnghilahsvethlxem.supabase.co",
  "sb_publishable_mSbWlhVKdmSjasKJC50QYw_5wzgRMe2"
);

async function loadHome(){

  const { data } = await supabase
    .from("stakes")
    .select("*");

  let totalStake = 0;
  let totalReward = 0;

  (data || []).forEach(s=>{
    if(!s || s.type==="withdraw") return;

    totalStake += Number(s.amount)||0;

    totalReward += Math.max(
      0,
      (Number(s.reward)||0) - (Number(s.withdrawnReward)||0)
    );
  });

  document.getElementById("homeStake").innerText =
    totalStake.toFixed(2)+" Pi";

  document.getElementById("homeReward").innerText =
    totalReward.toFixed(2)+" Pi";
}
</script>

<!-- ================= START APP ================= -->

<script>
document.addEventListener("DOMContentLoaded", async ()=>{

  const user = await initPi();

  if(!user) return;

  loadHome();

});
</script>

</body>
</html>
