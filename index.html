<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALBUKHR App</title>

  <!-- CSS (zamu gyara daga baya) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand">
      <div class="logo-placeholder">LOGO</div>
      <h1>Albukhr</h1>
    </div>
  </header>

  <!-- MOVING WELCOME TEXT -->
  <section class="welcome-marquee">
    <marquee behavior="scroll" direction="left">
      Welcome to Albukhr — Building sustainable industries and empowering communities
    </marquee>
  </section>

  <!-- STATS -->
  <section class="stats">
    <div class="stat-box">
      <p>Total Staking</p>
      <h2>0.00 π</h2>
    </div>

    <div class="stat-box">
      <p>Rewards</p>
      <h2>0.00 π</h2>
    </div>
  </section>

  <!-- PROJECTS -->
  <section class="projects">
    <h3>Core Projects</h3>

    <div class="project-item">A — Agriculture</div>
    <div class="project-item">L — Livestock</div>
    <div class="project-item">B — Bakery</div>
    <div class="project-item">U — Utilities</div>
    <div class="project-item">K — Knowledge</div>
    <div class="project-item">H — Health</div>
    <div class="project-item">R — Raheem Pharmacy</div>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <span>Home</span>
    <span>Projects</span>
    <span>Wallet</span>
    <span>Services</span>
    <span>Settings</span>
  </nav>

</body>
</html>
