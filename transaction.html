<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f7f6;padding-bottom:80px}

/* HEADER */
.header{
  background:#0f7a3d;
  color:#fff;
  padding:16px
}

/* CONTENT */
.section{padding:14px}

/* TRANSACTION CARD */
.tx{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:14px
}

/* ICON */
.tx-icon{
  width:46px;
  height:46px;
  border-radius:50%;
  background:#e6f6ec;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:#0f7a3d;
  flex-shrink:0
}

/* BODY */
.tx-body{
  flex:1
}

.tx-title{
  font-size:14px;
  font-weight:bold;
  color:#111
}

.tx-date{
  font-size:11px;
  color:#888;
  margin-top:3px
}

/* RIGHT SIDE */
.tx-right{
  text-align:right
}

.tx-amount{
  font-size:15px;
  font-weight:bold
}

.minus{color:#111}
.plus{color:#0f7a3d}

/* STATUS */
.tx-status{
  display:inline-block;
  margin-top:6px;
  font-size:11px;
  padding:4px 10px;
  border-radius:12px
}

.success{background:#e6f6ec;color:#0f7a3d}
.pending{background:#fff4d6;color:#b7791f}
.failed{background:#fde8e8;color:#c53030}

/* EMPTY */
.empty{
  background:#fff;
  padding:24px;
  border-radius:14px;
  text-align:center;
  color:#666;
  font-size:14px
}
</style></head><body><header class="header">
  <h2>📑 Transaction History</h2>
</header><section class="section" id="txList"></section><script src="js/staking.js"></script><script>
const box = document.getElementById("txList");
const stakes = getStakes().reverse();

function getIcon(project){
  if(project === "Raheem") return "💊";
  if(project === "Hauwal") return "🌾";
  return "📦";
}

if(stakes.length === 0){
  box.innerHTML = `<div class="empty">No transactions yet</div>`;
}

stakes.forEach(s=>{
  const status = s.status || "Successful";
  const statusClass =
    status === "Pending" ? "pending" :
    status === "Failed" ? "failed" :
    "success";

  const amountClass = s.amount >= 0 ? "minus" : "plus";

  const div = document.createElement("div");
  div.className = "tx";

  div.innerHTML = `
    <div class="tx-icon">${getIcon(s.project)}</div>

    <div class="tx-body">
      <div class="tx-title">${s.project} Stake</div>
      <div class="tx-date">${s.date}</div>
    </div>

    <div class="tx-right">
      <div class="tx-amount ${amountClass}">
        ${s.amount} Pi
      </div>
      <div class="tx-status ${statusClass}">
        ${status}
      </div>
    </div>
  `;

  box.appendChild(div);
});
</script></body>
</html>
