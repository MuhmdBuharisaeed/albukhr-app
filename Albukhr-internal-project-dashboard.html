<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Albukhr Project Dashboard</title>

<link rel="stylesheet" href="css/global-header.css">
<link rel="stylesheet" href="global-buttons.css">

<style>

body{
margin:0;
font-family:system-ui;
background:#f4f7f6;
padding-bottom:110px;
}

.header{
background:#0f7a3d;
height:60px;
padding:0 16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:10px;
}

.header-right{
display:flex;
align-items:center;
}

.main-logo{
height:48px;
width:auto;
}

.brand{
color:white;
font-weight:700;
font-size:18px;
letter-spacing:1px;
}

.dashboard{
padding:16px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:16px;
}

/* CARD */

.card{
background:#fff;
padding:16px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.title{
font-size:13px;
color:#666;
margin-bottom:6px;
}

.big{
font-size:22px;
font-weight:800;
color:#0f7a3d;
}

/* FULL CARD */

.card-full{
background:#fff;
padding:16px;
border-radius:14px;
margin-bottom:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

/* INPUT */

input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ddd;
margin-top:8px;
}

/* BUTTON */

button{
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
background:#0f7a3d;
color:#fff;
font-weight:600;
cursor:pointer;
width:100%;
}

/* HISTORY */

.tx{
display:flex;
justify-content:space-between;
border-top:1px dashed #eee;
padding-top:8px;
margin-top:8px;
font-size:12px;
}

</style>

</head>

<body>

<header class="header">

<div class="header-left">
<img src="file_000000007c187246b1c01967ee086dc4.png" class="main-logo">
<span class="brand">ALBUKHR</span>
</div>

</header>


<div class="dashboard">

<!-- PROJECT NAME -->

<div class="card-full">

<div class="title">Project</div>
<div class="big" id="projectName"></div>
</div>


<!-- STATS -->

<div class="grid">

<div class="card">
<div class="title">Liquidity</div>
<div class="big" id="liquidity">0 Pi</div>
</div>

<div class="card">
<div class="title">Reserve</div>
<div class="big" id="reserve">0 Pi</div>
</div>

<div class="card">
<div class="title">ROI</div>
<div class="big" id="roi">0%</div>
</div>

<div class="card">
<div class="title">Investors</div>
<div class="big" id="investors">0</div>
</div>

</div>


<!-- ADD LIQUIDITY -->

<div class="card-full">

<div class="title">Add Liquidity</div>

<input type="number" id="addAmount" placeholder="Amount">

<button onclick="addLiquidity()">
Add Liquidity
</button>

</div>


<!-- INTERNAL WITHDRAW -->

<div class="card-full">

<div class="title">Internal Withdraw</div>

<input type="number" id="withdrawAmount" placeholder="Amount">

<button onclick="withdrawLiquidity()">
Withdraw Liquidity
</button>

</div>


<!-- HISTORY -->

<div class="card-full">

<div class="title">Treasury Activity</div>

<div id="history"></div>

</div>

</div>


<script src="wallet-core.js"></script>
<script src="smart-liquidity-engine.js"></script>
<script src="capital-protection-engine.js"></script>
<script src="js/anti-rug-engine.js"></script>
<script src="staking.js"></script>
<script src="js/ownership-engine.js"></script>

<script>

/* ===============================
CORE PROJECTS
=============================== */

const CORE_PROJECTS = [

"Barsh Agro",
"Labbaika Bakery",
"Raheem Pharma",
"Urban Transport",
"Khairat Recycling",
"Azman Chemical",
"Hauwal Maize"

];

/* ===============================
CURRENT PROJECT
=============================== */

const currentProject =
localStorage.getItem("albukhr_current_project");

if(!currentProject){

alert("Project not found");
window.location.href = "marketplace.html";

}

/* ===============================
AUTH CHECK
=============================== */

(function(){

/* Allow core projects */

if(CORE_PROJECTS.includes(currentProject)){
return;
}

const email =
localStorage.getItem("albukhr_current_email");

if(!email){

alert("Login required");

window.location.href =
"submit-albukhrecosystem-form.html";

return;

}

const allowed =
localStorage.getItem(
"albukhr_project_dashboard_unlocked_" + email
);

if(!allowed){

alert("Access denied");

window.location.href =
"submit-albukhrecosystem-form.html";

}

})();

/* ===============================
VERIFY OWNER
=============================== */

function verifyOwner(){

/* Core projects bypass */

if(CORE_PROJECTS.includes(currentProject)){
return;
}

const email =
localStorage.getItem("albukhr_current_email");

let project = null;

/* marketplace */

if(typeof getMarketplaceProjects === "function"){

const projects = getMarketplaceProjects();

project =
projects.find(
p => p.name === currentProject
);

}

/* internal */

if(!project){

const internal =
JSON.parse(
localStorage.getItem(
"albukhr_internal_projects"
)
) || [];

project =
internal.find(
p => p.projectName === currentProject
);

}

/* not found */

if(!project){

alert("Project not registered");

window.location.href =
"marketplace.html";

return;

}

/* ownership */

if(project.creator !== email){

alert(
"Access denied. You are not project owner"
);

window.location.href =
"marketplace.html";

}

}

/* Run Verification */

verifyOwner();

</script>

</body>
</html>
