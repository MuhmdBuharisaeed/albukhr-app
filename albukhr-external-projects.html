<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Albukhr External Projects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>ALBUKHR • External Projects</h1>
</header>

<section style="padding:16px">
  <div id="projectList"></div>
</section>

<script src="external-project-engine.js"></script>

<script>
const container = document.getElementById("projectList");

function renderExternalProjects(){

  const list = getExternalLiveProjects();

  if(!list.length){
    container.innerHTML = "<p>No active external projects yet.</p>";
    return;
  }

  container.innerHTML = "";

  list.forEach(p=>{

    const div = document.createElement("div");
    div.style.background="#fff";
    div.style.padding="14px";
    div.style.marginBottom="12px";
    div.style.borderRadius="12px";

    div.innerHTML = `
      <h3>${p.name}</h3>
      <small>${p.category}</small><br><br>

      Owner: ${p.owner}<br>
      Duration: ${p.durationDays} days<br>
      Reward Rate: ${p.rewardRate * 100}%<br>
      Total Staked: ${p.totalStaked} Pi<br>
      Escrow: ${p.escrowLocked ? "Locked" : "Unlocked"}<br>
      Status: ${p.status}
    `;

    container.appendChild(div);
  });
}

renderExternalProjects();
</script>

</body>
</html>
